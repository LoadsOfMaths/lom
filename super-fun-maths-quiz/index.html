/* ---------- stage background ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% -12%,#6b9be0 0%,#3a67a8 32%,#1f3c6c 70%,#14284b 100%)}
#bg .rays{position:absolute;left:-50%;top:-60%;width:200%;height:200%;
  background:repeating-conic-gradient(from 0deg at 50% 30%,rgba(255,255,255,.075) 0 5deg,transparent 5deg 15deg);
  animation:sway 14s ease-in-out infinite alternate;transform-origin:50% 30%}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
#bg .floor{position:absolute;left:0;right:0;bottom:0;height:9vh;
  background:linear-gradient(0deg,#0f1f3b,rgba(15,31,59,0));}
.sym{position:absolute;bottom:-12vh;color:#fff;opacity:.13;font-weight:700;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(40deg)}}

.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  background:linear-gradient(var(--or2),var(--or));color:#fff;font-size:1.25rem;letter-spacing:.02em;
  padding:.55em 1.3em;border-radius:999px;box-shadow:0 .28em 0 var(--ord),0 .5em .9em rgba(0,0,0,.3);
  transition:transform .1s,box-shadow .1s;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(.22em);box-shadow:0 .06em 0 var(--ord),0 .2em .5em rgba(0,0,0,.3)}
.btn.blue{background:linear-gradient(var(--bl2),var(--bl));box-shadow:0 .28em 0 var(--bld),0 .5em .9em rgba(0,0,0,.3)}
.btn.blue:active{box-shadow:0 .06em 0 var(--bld),0 .2em .5em rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);text-shadow:none}
.btn.small{font-size:.95rem;padding:.4em 1em;box-shadow:0 .2em 0 var(--ord),0 .3em .6em rgba(0,0,0,.25)}
.btn.small.blue{box-shadow:0 .2em 0 var(--bld),0 .3em .6em rgba(0,0,0,.25)}
.btn.small.ghost{box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.btn.big{font-size:2.1rem;padding:.5em 1.6em}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:2.6em;height:2.6em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);color:#fff;font-size:1.05rem}
.iconbtn:hover{background:rgba(255,255,255,.28)}

/* ---------- logo plate ---------- */
.logo{display:inline-flex;background:#fff;border-radius:.8em;padding:.55em 1.1em;box-shadow:0 .2em .7em rgba(0,0,0,.3)}
.logo img{display:block;width:min(74vw,24rem);height:auto}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center;text-align:center;padding:2vh 4vw;gap:2.2vh}
.bulbs{height:.9rem;width:min(88vw,62rem);border-radius:1rem;position:relative;
  background:radial-gradient(circle,#FFD9A8 0 28%,transparent 32%) 0 0/2.2rem 100% repeat-x}
.bulbs::after{content:"";position:absolute;inset:0;border-radius:1rem;
  background:radial-gradient(circle,var(--or) 0 28%,transparent 32%) 1.1rem 0/2.2rem 100% repeat-x;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ttl{line-height:.95;font-size:clamp(2.6rem,10.5vmin,9rem)}
.ttl .l1{display:block;color:var(--or);
  text-shadow:0 .05em 0 #b8501a,0 .1em 0 #8f3d12,0 .16em .12em rgba(0,0,0,.4)}
.ttl .l2{display:block;color:#fff;font-size:.78em;
  text-shadow:0 .05em 0 var(--bld),0 .1em 0 var(--bldd),0 .16em .12em rgba(0,0,0,.4)}
.ttl span.w{display:inline-block;white-space:nowrap}
.ttl i{font-style:normal;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.07em)}}
.tag{color:#e8f0fb;font-size:1.3rem;opacity:.95}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:60rem}
.chip{background:rgba(255,255,255,.15);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);color:#fff;
  border-radius:999px;padding:.3em .9em;font-size:1.02rem;font-weight:700}
.btnrow{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;align-items:center}
.titlefoot{margin-top:.5vh}

/* ---------- quiz / review ---------- */
.qscreen{padding:1.6vh 2.2vw 2vh;gap:1.6vh}
.qhead{display:flex;align-items:center;gap:.9rem;flex:none}
.pill{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);color:#fff;
  border-radius:999px;padding:.3em .9em;font-size:1.05rem;white-space:nowrap}
.pill.or{background:var(--or);box-shadow:0 .15em 0 var(--ord);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.barwrap{flex:1;height:1.15rem;border-radius:1rem;background:rgba(0,0,0,.3);overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.4);min-width:3rem}
.bar{height:100%;width:100%;border-radius:1rem;background:linear-gradient(90deg,var(--or),#FFB27F);transform-origin:left}
.bar.low{animation:flash .5s steps(1) infinite}
@keyframes flash{50%{background:#fff}}
.timer{width:3.4rem;height:3.4rem;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:#fff;color:var(--bld);font-size:1.7rem;box-shadow:0 0 0 .22rem var(--or),0 .3em .8em rgba(0,0,0,.35)}
.timer.low{color:#fff;background:var(--or);box-shadow:0 0 0 .22rem #fff;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.14)}}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.6vh}
.qcard{flex:none;background:var(--cream);border-radius:1.1rem;padding:1.2rem 1.6rem 1.2rem 5.2rem;position:relative;
  box-shadow:0 .35rem 0 var(--bld),0 .8rem 1.4rem rgba(0,0,0,.35);border:.28rem solid #fff;
  min-height:5.4rem;display:flex;align-items:center}
.qnum{position:absolute;left:-.1rem;top:50%;transform:translateY(-50%);width:4.3rem;height:4.3rem;border-radius:50%;
  background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;
  box-shadow:0 0 0 .28rem #fff,0 .25em .6em rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.qtext{font-size:2.15rem;font-weight:700;line-height:1.25}
.qtext.m{font-size:1.8rem} .qtext.l{font-size:1.55rem}
.nomc .qtext{font-size:2.6rem} .nomc .qtext.m{font-size:2.15rem} .nomc .qtext.l{font-size:1.8rem}
.row{flex:1;min-height:0;display:flex;gap:1.6vw}
.dg{flex:1 1 0;min-width:0;background:#fff;border-radius:1.1rem;border:.28rem solid #fff;
  box-shadow:0 .35rem 0 var(--bld),0 .8rem 1.4rem rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:.5rem;min-height:0}
.dg svg{width:100%;height:100%;max-height:100%}
.dg svg text{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
.dnote{font-size:12px;font-weight:400;fill:#8793A1;font-style:italic}
.opts{flex:1.15 1 0;min-width:0;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.4vh 1.2vw}
.row.hasdg .opts{grid-template-columns:1fr}
.opt{position:relative;display:flex;align-items:center;gap:.9rem;padding:.6rem 1rem .6rem .7rem;border-radius:1rem;
  background:linear-gradient(var(--bl2),var(--bl));color:#fff;box-shadow:0 .3rem 0 var(--bld),0 .6rem 1rem rgba(0,0,0,.25);
  font-size:2rem;font-weight:700;min-height:0;text-align:left;transition:opacity .3s,transform .3s,filter .3s}
.row.hasdg .opt{font-size:1.75rem}
.row:not(.hasdg) .opt{font-size:2.5rem}
.row:not(.hasdg) .opt .let{width:3.2rem;height:3.2rem;font-size:1.7rem}
.opt .let{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;background:var(--or);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-family:'Super Bouncer','Baloo 2','Trebuchet MS',sans-serif;
  box-shadow:0 0 0 .18rem #fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.opt .ot{flex:1;min-width:0;line-height:1.15}
.opt .why{display:block;font-size:.5em;font-weight:400;opacity:.92;margin-top:.25em;line-height:1.2}
.opt.dim{filter:grayscale(.85) brightness(.9);opacity:.62;transform:scale(.985)}
.opt.dim .let{background:var(--gr)}
.opt.correct{background:linear-gradient(var(--or2),var(--or));box-shadow:0 .3rem 0 var(--ord),0 0 0 .25rem #fff,0 0 2rem rgba(255,180,120,.9);animation:pop .5s}
.opt.correct .let{background:#fff;color:var(--or)}
.opt.correct::after{content:"✓";position:absolute;right:.9rem;top:50%;transform:translateY(-50%);font-size:2.2em;color:#fff;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.opt.correct .ot{padding-right:2.4rem}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.nomcbox{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;
  background:rgba(255,255,255,.1);border-radius:1.1rem;box-shadow:inset 0 0 0 .22rem rgba(255,255,255,.35);color:#fff;font-size:2rem;padding:1rem}
.nomcbox .hint{opacity:.9}
.ansbox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border-radius:1.1rem;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 .22rem rgba(255,255,255,.35);color:#fff;padding:1rem;gap:.4em}
.ansbox .lab{font-size:1.2rem;opacity:.9}
.ansbox .big{font-size:3.4rem;font-family:'Super Bouncer','Baloo 2','Trebuchet MS',sans-serif;line-height:1.1}
.ansbox.rev{background:linear-gradient(var(--or2),var(--or));box-shadow:0 .3rem 0 var(--ord),0 0 0 .25rem #fff,0 0 2rem rgba(255,180,120,.9);animation:pop .5s}
.ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}

/* fractions & powers */
.qtext,.opt .ot,.sc .q,.sc .o,.ansbox .big,.fr{font-family:var(--math)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.08;font-size:.92em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em .03em}
.fr>span:last-child{padding:.03em .18em 0}
sup{font-size:.62em;line-height:0;vertical-align:.55em}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,22,44,.78);backdrop-filter:blur(3px)}
.overlay.on{display:flex}
#count .num{font-size:min(38vh,30vw);color:#fff;text-shadow:0 .05em 0 var(--or),0 .1em 0 var(--ord),0 .16em .2em rgba(0,0,0,.5);animation:zoom .9s ease-out}
@keyframes zoom{0%{transform:scale(.4);opacity:0}30%{opacity:1}100%{transform:scale(1.15);opacity:.9}}
#pause .box{text-align:center;color:#fff}
#pause .big{font-size:5rem}

/* interlude */
.centre{align-items:center;justify-content:center;text-align:center;gap:2.4vh;padding:4vh 5vw;color:#fff}
.centre h2{font-size:clamp(2.4rem,9vmin,6rem);color:#fff;text-shadow:0 .05em 0 var(--or),0 .1em 0 var(--ord),0 .16em .15em rgba(0,0,0,.4);line-height:1}
.centre p{font-size:1.5rem;max-width:40rem}

/* answer sheet */
.sheethead{flex:none;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1.6vh 2.2vw 0;color:#fff}
.sheethead h2{font-size:2.2rem;flex:1;text-shadow:0 .06em 0 var(--ord)}
.sheet{flex:1;min-height:0;overflow:auto;padding:1.6vh 2.2vw 3vh;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,27rem),1fr));gap:1.2rem;align-content:start;user-select:text;-webkit-user-select:text}
.sc{background:var(--cream);border-radius:1rem;border:.2rem solid #fff;box-shadow:0 .3rem 0 var(--bld),0 .6rem 1rem rgba(0,0,0,.3);padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.55rem}
.sc .top{display:flex;gap:.7rem;align-items:flex-start}
.sc .n{flex:none;width:2.3rem;height:2.3rem;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-family:'Super Bouncer','Baloo 2','Trebuchet MS',sans-serif}
.sc .q{font-size:1.12rem;font-weight:700;line-height:1.25;padding-top:.15rem}
.sc .sdg{background:#fff;border-radius:.6rem;border:2px solid var(--grl);height:9.5rem;padding:.2rem}
.sc .sdg svg{width:100%;height:100%}
.sc .sdg svg text{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
.sc .o{display:flex;gap:.55rem;align-items:flex-start;padding:.3rem .6rem;border-radius:.6rem;background:var(--grl);color:var(--gr);font-size:1rem;font-weight:700}
.sc .o .let{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:#C7CFD8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.sc .o .why{display:block;font-weight:400;font-size:.82rem;line-height:1.2;margin-top:.1rem}
.sc .o.c{background:var(--or);color:#fff;font-size:1.15rem;box-shadow:0 .15rem 0 var(--ord)}
.sc .o.c .let{background:#fff;color:var(--or)}
.sc .ansonly{background:var(--or);color:#fff;border-radius:.7rem;padding:.45rem .8rem;font-size:1.3rem;font-weight:700;box-shadow:0 .15rem 0 var(--ord)}
.sc .ansonly small{display:block;font-size:.7rem;font-weight:400;opacity:.9}

/* ---------- settings ---------- */
#settings .panel{width:min(94vw,58rem);max-height:92dvh;display:flex;flex-direction:column;background:var(--cream);border-radius:1.4rem;
  border:.3rem solid #fff;box-shadow:0 .5rem 0 var(--bld),0 1.2rem 3rem rgba(0,0,0,.5);overflow:hidden}
.panel header{flex:none;background:linear-gradient(var(--bl2),var(--bl));color:#fff;padding:.8rem 1.4rem;display:flex;align-items:center;justify-content:space-between}
.panel header h2{font-size:1.9rem;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.panel .scroll{flex:1;min-height:0;overflow:auto;padding:1rem 1.4rem}
.panel footer{flex:none;padding:.8rem 1.4rem;display:flex;justify-content:flex-end;gap:.8rem;border-top:2px solid var(--grl);background:#fff}
.set{padding:.7rem 0;border-bottom:2px dashed var(--grl)}
.set:last-child{border:0}
.set h3{font-size:1.12rem;margin-bottom:.1rem}
.set .sub{font-size:.92rem;color:var(--gr);margin-bottom:.5rem}
.seg{display:flex;flex-wrap:wrap;gap:.45rem}
.seg button{padding:.4em 1.1em;border-radius:999px;background:var(--grl);color:var(--ink);font-size:1.1rem;box-shadow:0 .15rem 0 #C7CFD8}
.seg button[aria-pressed=true]{background:var(--or);color:#fff;box-shadow:0 .15rem 0 var(--ord)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.switch{flex:none;width:4.2rem;height:2.3rem;border-radius:999px;background:#C7CFD8;position:relative;transition:background .2s;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.switch::after{content:"";position:absolute;left:.25rem;top:.25rem;width:1.8rem;height:1.8rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--or)}
.switch[aria-checked=true]::after{left:2.1rem}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.55rem;margin-top:.4rem}
.tp{display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;border-radius:.9rem;background:var(--grl);color:var(--gr);text-align:left;box-shadow:0 .15rem 0 #C7CFD8;font-weight:700;font-size:1rem;line-height:1.15}
.tp .g{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:#C7CFD8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-family:'Super Bouncer','Baloo 2','Trebuchet MS',sans-serif}
.tp small{display:block;font-weight:400;font-size:.8rem}
.tp[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 0 0 .18rem var(--bl),0 .15rem 0 .18rem var(--bld)}
.tp[aria-pressed=true] .g{background:var(--bl)}
.minibtns{display:flex;gap:.5rem;margin:.2rem 0 .1rem}
.minibtns button{font-size:.9rem;font-weight:700;color:var(--bl);text-decoration:underline;padding:.2em .4em}
.note{color:var(--or);font-weight:700;font-size:.95rem;margin-top:.4rem}

/* ---------- mobile / portrait ---------- */
@media (max-width:820px),(max-aspect-ratio:1/1){
  html{font-size:calc(12px + .9vmin)}
  .qscreen{padding:1.2vh 3vw 1.6vh}
  .qhead{flex-wrap:wrap;gap:.5rem}
  .barwrap{order:5;flex:1 0 100%}
  .qhead .grow{flex:1}
  .qcard{padding:1rem 1rem 1rem 4rem}
  .qnum{width:3.4rem;height:3.4rem;font-size:1.6rem}
  .qtext{font-size:1.35rem} .qtext.m{font-size:1.2rem} .qtext.l{font-size:1.05rem}
  .nomc .qtext{font-size:1.7rem} .nomc .qtext.m{font-size:1.4rem} .nomc .qtext.l{font-size:1.2rem}
  .row{flex-direction:column;gap:1.2vh}
  .dg{flex:0 0 32%}
  .row:not(.hasdg) .dg{display:none}
  .opts,.row.hasdg .opts{grid-template-columns:1fr;gap:.7vh;flex:1 1 0}
  .opt,.row.hasdg .opt,.row:not(.hasdg) .opt{font-size:1.25rem;padding:.35rem .7rem .35rem .5rem;gap:.6rem}
  .opt .let,.row:not(.hasdg) .opt .let{width:2.1rem;height:2.1rem;font-size:1.1rem}
  #qTopic,#rTopic{display:none}
  .opt .why{font-size:.58em}
  .nomcbox{font-size:1.3rem}
  .ansbox .big{font-size:2.4rem}
  .timer{width:2.8rem;height:2.8rem;font-size:1.4rem}
  .btn.big{font-size:1.7rem}
  .sc .sdg{height:8rem}
}
@media (max-aspect-ratio:1/1){ .ttl{font-size:clamp(2.4rem,13vw,7rem)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"><div class="rays"></div><div class="floor"></div></div>

<!-- TITLE -->
<section id="title" class="screen on">
  <div class="bulbs"></div>
  <h1 class="ttl h" aria-label="Super Fun Maths Quiz"><span class="l1" id="t1"></span><span class="l2" id="t2"></span></h1>
  <div class="bulbs"></div>
  <p class="tag">A quick-fire starter. Pens ready!</p>
  <div class="chips" id="chips"></div>
  <div class="btnrow">
    <button class="btn big" id="goBtn">▶ START</button>

 per cent!"}, {"t": "£68", "c": 0, "w": "That is a decrease! Oh, the horror."}, {"t": "£12", "c": 0, "w": "That is only the increase, not the new price."}], "t": "fdp"}, {"id": 7, "q": "What is 5% of 360?", "o": [{"t": "18", "c": 1, "w": ""}, {"t": "72", "c": 0, "w": "That is 20%, or one fifth. 5% is one twentieth."}, {"t": "1.8", "c": 0, "w": "Decimal point drift! Check the size of your answer."}, {"t": "180", "c": 0, "w": "That is 50%, which is half."}], "t": "fdp"}, {"id": 8, "q": "Which of these is a prime number?", "o": [{"t": "59", "c": 1, "w": ""}, {"t": "51", "c": 0, "w": "51 = 3 × 17. Add the digits to get 6: divisible by 3!"}, {"t": "57", "c": 0, "w": "57 = 3 × 19. Divisible by 3, you sneaky thing!"}, {"t": "91", "c": 0, "w": "91 = 7 × 13. Looks prime, isn't it?"}], "t": "number"}, {"id": 9, "q": "What is the highest common factor of 12 and 18?", "o": [{"t": "6", "c": 1, "w": ""}, {"t": "36", "c": 0, "w": "That is the lowest common multiple. HCF is the biggest number that divides both."}, {"t": "3", "c": 0, "w": "3 is a common factor, but not the highest!"}, {"t": "216", "c": 0, "w": "You multiplied them! That is far too big to divide into either."}], "t": "number"}, {"id": 10, "q": "Write 0.00045 in standard form.", "o": [{"t": "4.5 × 10^−4", "c": 1, "w": ""}, {"t": "4.5 × 10^−3", "c": 0, "w": "One place out! Count how far the decimal point moves."}, {"t": "4.5 × 10^4", "c": 0, "w": "A positive power makes it big. This number is tiny!"}, {"t": "45 × 10^−5", "c": 0, "w": "Right size, but standard form needs a number between 1 and 10."}], "t": "number"}, {"id": 11, "q": "−3 − (−5) =", "o": [{"t": "2", "c": 1, "w": ""}, {"t": "−8", "c": 0, "w": "Subtracting a negative means adding!"}, {"t": "−2", "c": 0, "w": "You went the wrong way. Subtracting a negative is adding a positive."}, {"t": "8", "c": 0, "w": "You added 3 and 5 but ignored the sign on the 3."}], "t": "number"}, {"id": 12, "q": "2^3 × 2^4 =", "o": [{"t": "2^7", "c": 1, "w": ""}, {"t": "4^7", "c": × 3b", "o": [{"t": "6ab", "c": 1, "w": ""}, {"t": "5ab", "c": 0, "w": "You added the numbers. It is multiplication!"}, {"t": "23ab", "c": 0, "w": "The digits do not stick together. Multiply 2 × 3 properly."}, {"t": "6a + 6b", "c": 0, "w": "Multiplying does not give a sum. Just 6ab."}], "t": "algebra"}, {"id": 19, "q": "Expand 3(x + 4)", "o": [{"t": "3x + 12", "c": 1, "w": ""}, {"t": "3x + 4", "c": 0, "w": "The 3 multiplies EVERYTHING inside the bracket!"}, {"t": "x + 12", "c": 0, "w": "The 3 multiplies the x as well!"}, {"t": "3x + 7", "c": 0, "w": "You added the 3 to the 4 instead of multiplying."}], "t": "algebra"}, {"id": 20, "q": "Expand (x + 3)^2", "o": [{"t": "x^2 + 6x + 9", "c": 1, "w": ""}, {"t": "x^2 + 9", "c": 0, "w": "Squaring a bracket is not squaring each term. Write it out twice!"}, {"t": "x^2 + 6", "c": 0, "w": "Where did the 9 go?"}, {"t": "x^2 + 3x + 9", "c": 0, "w": "Two lots of 3x make 6x."}], "t": "algebra"}, {"id": 21, "q": "Solve 2x + 5 = 17", "o": [{"t": "x = 6", "c": 1, "w": ""}, {"t": "x = 11", "c": 0, "w": "You added 5 instead of taking it away."}, {"t": "x = 12", "c": 0, "w": "You forgot to divide by 2."}, {"t": "x = 3.5", "c": 0, "w": "You halved the 17 but not the 5! Take away 5 first."}], "t": "algebra"}, {"id": 22, "q": "Solve 3(x − 2) = 15", "o": [{"t": "x = 7", "c": 1, "w": ""}, {"t": "x = 3", "c": 0, "w": "You divided to get 5, then took away 2. But x − 2 = 5 means x = 7!"}, {"t": "x = 5", "c": 0, "w": "You divided by 3 but forgot about the −2."}, {"t": "x = (17/3)", "c": 0, "w": "You multiplied the 3 by x only, not the −2!"}], "t": "algebra"}, {"id": 23, "q": "x = −3. What is the value of x^2?", "o": [{"t": "9", "c": 1, "w": ""}, {"t": "−9", "c": 0, "w": "A negative times a negative is positive!"}, {"t": "−6", "c": 0, "w": "You doubled it. Squaring means times itself."}, {"t": "6", "c": 0, "w": "Squaring is not doubling."}], "t": "algebra"}, {"id": 24, "q": "Find the nth term of 5, 8, 11, 14, …", "o": [{"t": "3n + 2", "c": 1, "w": : "How many sides has a regular polygon with exterior angles of 30°?", "o": [{"t": "12", "c": 1, "w": ""}, {"t": "6", "c": 0, "w": "That is 180 ÷ 30. Exterior angles total 360°."}, {"t": "150", "c": 0, "w": "That is the interior angle, not the number of sides."}, {"t": "330", "c": 0, "w": "That is 360 − 30. You need 360 ÷ 30."}], "t": "angles"}, {"id": 31, "q": "What is the interior angle of a regular pentagon?", "o": [{"t": "108°", "c": 1, "w": ""}, {"t": "72°", "c": 0, "w": "That is the exterior angle."}, {"t": "540°", "c": 0, "w": "That is the sum of all five interior angles."}, {"t": "120°", "c": 0, "w": "That is the interior angle of a hexagon."}], "t": "angles"}, {"id": 32, "q": "Angles around a point are 120°, 150° and x. Find x.", "o": [{"t": "90°", "c": 1, "w": ""}, {"t": "270°", "c": 0, "w": "That is 120° + 150°. Angles around a point total 360°."}, {"t": "60°", "c": 0, "w": "You used 180° (a straight line). Around a point it is 360°."}, {"t": "30°", "c": 0, "w": "You used 180° (a straight line). Around a point it is 360°."}], "t": "angles"}, {"id": 33, "q": "Two parallel lines are crossed by a third line. One of a pair of alternate angles is 65°. What is the other?", "o": [{"t": "65°", "c": 1, "w": ""}, {"t": "115°", "c": 0, "w": "That is what you get with co-interior angles, which add to 180°."}, {"t": "25°", "c": 0, "w": "That is 90° − 65°. Alternate angles are equal (look for the Z)."}, {"t": "295°", "c": 0, "w": "That is 360° − 65°. Not what alternate angles do."}], "t": "angles"}, {"id": 34, "q": "An isosceles triangle has a top angle of 40°. What is each base angle?", "o": [{"t": "70°", "c": 1, "w": ""}, {"t": "140°", "c": 0, "w": "That is the total of the two base angles. Share it out!"}, {"t": "40°", "c": 0, "w": "The base angles are equal to each other, not to the top one."}, {"t": "80°", "c": 0, "w": "You doubled the 40°."}], "t": "angles"}, {"id": 35, "q": "A triangle has base 8 cm and height 5 cm. What is its area?", "o": [{"t": "20 cm²", "c": 1, "w": ""}, {"t": "40 cm²", "c": 0, "w": "That is a rectangle. A triangle is half of that!"}, {"t": "13 cm²", "c": 0, "w": "You added! Area needs multiplying."}, {"t": "80 cm²", "c": 0, "w": "Too big: you multiplied 8 × 5 × 2."}], "t": "shape"}, {"id": 36, "q": "What is the area of a circle with radius 5 cm?", "o": [{"t": "25π cm²", "c": 1, "w": ""}, {"t": "10π cm²", "c": 0, "w": "That is the circumference (2πr). Area is πr²."}, {"t": "100π cm²", "c": 0, "w": "You squared the diameter."}, {"t": "50π cm²", "c": 0, "w": "You doubled the radius squared."}], "t": "shape"}, {"id": 37, "q": "A rectangle is 7 cm by 3 cm. What is its perimeter?", "o": [{"t": "20 cm", "c": 1, "w": ""}, {"t": "21 cm", "c": 0, "w": "That is the area."}, {"t": "13 cm", "c": 0, "w": "You only added one 7 and one 3."}, {"t": "10 cm", "c": 0, "w": "You found half the perimeter."}], "t": "shape"}, {"id": 38, "q": "What is the volume of a cuboid measuring 4 cm by 3 cm by 2 cm?", "o": [{"t": "24 cm³", "c": 1, "w": ""}, {"t": "52 cm³", "c": 0, "w": "That is the surface area."}, {"t": "9 cm³", "c": 0, "w": "You added instead of multiplying."}, {"t": "12 cm³", "c": 0, "w": "You only used two of the lengths."}], "t": "shape"}, {"id": 39, "q": "A right-angled triangle has short sides 6 cm and 8 cm. How long is the longest side?", "o": [{"t": "10 cm", "c": 1, "w": ""}, {"t": "14 cm", "c": 0, "w": "You added the two sides. Pythagoras: square, add, square root."}, {"t": "100 cm", "c": 0, "w": "You forgot the square root."}, {"t": "48 cm", "c": 0, "w": "You multiplied the short sides."}], "t": "shape"}, {"id": 40, "q": "A right-angled triangle has longest side 13 cm and one short side 5 cm. How long is the other short side?", "o": [{"t": "12 cm", "c": 1, "w": ""}, {"t": "18 cm", "c": 0, "w": "You added! For a short side, subtract the squares."}, {"t": "8 cm", "c": 0, "w": "You took 5 off 13 without squaring."}, {"t": "144 cm", "c": 0, "w": "That is 12 squared. You forgot the square root."}], "t": "shape"}, ": 91, "q": "Share £40 in the ratio 3 : 5. What is the smaller share?", "o": [{"t": "£15", "c": 1, "w": ""}, {"t": "£25", "c": 0, "w": "That is the larger share."}, {"t": "£13.33", "c": 0, "w": "You divided by 3 only."}, {"t": "£8", "c": 0, "w": "That is £40 ÷ 5."}], "t": "ratio"}, {"id": 92, "q": "The ratio of red to blue counters is 2 : 7. What fraction of the counters are red?", "o": [{"t": "(2/9)", "c": 1, "w": ""}, {"t": "(2/7)", "c": 0, "w": "That compares red to blue. The total goes on the bottom."}, {"t": "(7/9)", "c": 0, "w": "That is the fraction that are blue."}, {"t": "(5/7)", "c": 0, "w": "You found the difference between 2 and 7."}], "t": "ratio"}, {"id": 93, "q": "Write 15 : 20 : 25 in its simplest form.", "o": [{"t": "3 : 4 : 5", "c": 1, "w": ""}, {"t": "5 : 4 : 3", "c": 0, "w": "Order matters! Keep it the same way round."}, {"t": "0 : 5 : 10", "c": 0, "w": "You subtracted 15 from each. Ratios simplify by dividing."}, {"t": "5 : 20 : 25", "c": 0, "w": "You only divided the first number."}], "t": "ratio"}, {"id": 94, "q": "8 pens cost £6. How much do 20 pens cost?", "o": [{"t": "£15", "c": 1, "w": ""}, {"t": "£18", "c": 0, "w": "You added 12 pens, so you added £12. But it is multiplication!"}, {"t": "£12", "c": 0, "w": "You doubled it. But 20 is two and a half times 8."}, {"t": "£120", "c": 0, "w": "You multiplied £6 by 20, forgetting the 8 pens."}], "t": "ratio"}, {"id": 95, "q": "A recipe for 4 people uses 300 g of flour. How much is needed for 10 people?", "o": [{"t": "750 g", "c": 1, "w": ""}, {"t": "600 g", "c": 0, "w": "You doubled it, but 10 is not double 4."}, {"t": "306 g", "c": 0, "w": "You added 6 people, so you added 6 g."}, {"t": "1200 g", "c": 0, "w": "You multiplied by 4."}], "t": "ratio"}, {"id": 96, "q": "y is directly proportional to x. When x = 4, y = 10. What is y when x = 6?", "o": [{"t": "15", "c": 1, "w": ""}, {"t": "12", "c": 0, "w": "You added 2 to x, so you added 2 to y. But proportion means multiplying."}, {"t": "24", "c": 0, "w": "You multiplied 4 by 6."}, {"t": "2.4", "c": 0, "w": "You turned the ratio upside down."}], "t": "ratio"}, {"id": 97, "q": "Write (18/24) in its simplest form.", "o": [{"t": "(3/4)", "c": 1, "w": ""}, {"t": "(9/12)", "c": 0, "w": "Good start, but it can be simplified again."}, {"t": "(6/8)", "c": 0, "w": "Still not simplest."}, {"t": "(3/6)", "c": 0, "w": "You divided the top and bottom by different numbers."}], "t": "fdp"}, {"id": 98, "q": "Which fraction is equivalent to (2/5)?", "o": [{"t": "(6/15)", "c": 1, "w": ""}, {"t": "(4/7)", "c": 0, "w": "You added 2 to the top and bottom. Equivalent fractions are multiplied."}, {"t": "(3/6)", "c": 0, "w": "You added 1 to the top and bottom."}, {"t": "(2/10)", "c": 0, "w": "You only doubled the bottom."}], "t": "fdp"}, {"id": 99, "q": "A bag has 40 sweets. (1/4) are red and (3/8) are green. How many are neither?", "o": [{"t": "15", "c": 1, "w": ""}, {"t": "25", "c": 0, "w": "That is the number that are red or green."}, {"t": "10", "c": 0, "w": "That is just the red ones."}, {"t": "30", "c": 0, "w": "You only took off the red ones."}], "t": "fdp"}, {"id": 100, "q": "Which is the smallest of 0.6, (5/8) and 55%?", "o": [{"t": "55%", "c": 1, "w": ""}, {"t": "0.6", "c": 0, "w": "0.6 is 60%, which is bigger than 55%."}, {"t": "(5/8)", "c": 0, "w": "(5/8) = 0.625, which is the biggest."}, {"t": "They are equal", "c": 0, "w": "They are different once converted to the same form."}], "t": "fdp"}, {"id": 101, "q": "Simplify 3x + 2x", "o": [{"t": "5x", "c": 1, "w": ""}, {"t": "5x^2", "c": 0, "w": "Adding like terms does not square them."}, {"t": "6x", "c": 0, "w": "You multiplied the numbers."}, {"t": "32x", "c": 0, "w": "You joined the digits together."}], "t": "algebra"}, {"id": 102, "q": "Simplify 4a − a", "o": [{"t": "3a", "c": 1, "w": ""}, {"t": "4", "c": 0, "w": "You found 4 − 1 and lost the letter."}, {"t": "4a", "c": 0, "w": "You ignored the − a."}, {"t": "5a", "c": 0, "w": "You added instead of subtracting."}], "t": "algebra"}, {"id": 103, "q": "Simplify 2x + 3y + 4x − y", "o": [{"t": "6x + 2y", "c": 1, "w": ""}, {"t": "6x + 4y", "c": 0, "w": "You added the y terms. The second one is − y."}, {"t": "8xy", "c": 0, "w": "You treated every term as if it were the same."}, {"t": "5xy", "c": 0, "w": "You cannot combine x terms with y terms."}], "t": "algebra"}, {"id": 104, "q": "Simplify a × a × a", "o": [{"t": "a^3", "c": 1, "w": ""}, {"t": "3a", "c": 0, "w": "That is a + a + a. Multiplying gives a power."}, {"t": "3^a", "c": 0, "w": "Wrong way round! The power counts the a's."}, {"t": "a + 3", "c": 0, "w": "You added instead of multiplying."}], "t": "algebra"}, {"id": 105, "q": "Simplify 3a × 4b", "o": [{"t": "12ab", "c": 1, "w": ""}, {"t": "7ab", "c": 0, "w": "You added the numbers."}, {"t": "34ab", "c": 0, "w": "You wrote the numbers side by side."}, {"t": "12 + ab", "c": 0, "w": "Multiply the numbers, do not add them."}], "t": "algebra"}, {"id": 106, "q": "Simplify 6x ÷ 2", "o": [{"t": "3x", "c": 1, "w": ""}, {"t": "3", "c": 0, "w": "You divided the x away."}, {"t": "4x", "c": 0, "w": "You subtracted 2."}, {"t": "12x", "c": 0, "w": "You multiplied instead of dividing."}], "t": "algebra"}, {"id": 107, "q": "Expand and simplify (x + 2)(x + 5)", "o": [{"t": "x^2 + 7x + 10", "c": 1, "w": ""}, {"t": "x^2 + 10", "c": 0, "w": "You only multiplied the first terms and the last terms. Where are the middle terms?"}, {"t": "x^2 + 7x", "c": 0, "w": "You forgot 2 × 5 at the end."}, {"t": "x^2 + 10x + 7", "c": 0, "w": "You swapped them: the x term is 2x + 5x = 7x and the number is 2 × 5 = 10."}], "t": "algebra"}, {"id": 108, "q": "Expand and simplify (x − 3)(x + 4)", "o": [{"t": "x^2 + x − 12", "c": 1, "w": ""}, {"t": "x^2 − x − 12", "c": 0, "w": "The middle terms are − 3x + 4x = + x."}, {"t": "x^2 + x + 12", "c": 0, "w": "− 3 × 4 = − 12, not + 12."}, {"t": "x^2 − 12", "c": 0, "w": "The x terms do not vanish: − 3x + 4x = x."}], "t": "algebra"}, {"id": 109, "q": "Factorise x^2 + 5x + 6", "o": [{"t": "(x + 2)(x + 3)", "c": 1, "w": ""}, {"t": "(x + 1)(x + 6)", "c": 0, "w": "These multiply to 6 but add to 7."}, {"t": "(x − 2)(x − 3)", "c": 0, "w": "These give − 5x. Watch the signs!"}, {"t": "(x + 5)(x + 1)", "c": 0, "w": "These multiply to 5 and add to 6. You swapped them!"}], "t": "algebra"}, {"id": 110, "q": "Factorise 6x + 9", "o": [{"t": "3(2x + 3)", "c": 1, "w": ""}, {"t": "3(2x + 9)", "c": 0, "w": "The 3 must come out of EVERY term."}, {"t": "6(x + 3)", "c": 0, "w": "6 × 3 = 18, not 9."}, {"t": "3(x + 3)", "c": 0, "w": "6x ÷ 3 is 2x, not x."}], "t": "algebra"}, {"id": 111, "q": "Factorise x^2 − 16", "o": [{"t": "(x + 4)(x − 4)", "c": 1, "w": ""}, {"t": "(x − 4)^2", "c": 0, "w": "That expands to x^2 − 8x + 16."}, {"t": "x(x − 16)", "c": 0, "w": "You cannot take x out of 16."}, {"t": "(x + 8)(x − 2)", "c": 0, "w": "That expands to x^2 + 6x − 16."}], "t": "algebra"}, {"id": 112, "q": "Solve 5x − 3 = 12", "o": [{"t": "x = 3", "c": 1, "w": ""}, {"t": "x = 1.8", "c": 0, "w": "You subtracted 3 instead of adding it."}, {"t": "x = 15", "c": 0, "w": "You forgot to divide by 5."}, {"t": "x = 2.4", "c": 0, "w": "You divided 12 by 5 and ignored the − 3."}], "t": "algebra"}, {"id": 113, "q": "Solve (x/4) = 7", "o": [{"t": "x = 28", "c": 1, "w": ""}, {"t": "x = 3", "c": 0, "w": "You subtracted 4."}, {"t": "x = 1.75", "c": 0, "w": "You divided 7 by 4."}, {"t": "x = 11", "c": 0, "w": "You added 4."}], "t": "algebra"}, {"id": 114, "q": "Solve 3x + 2 = x + 10", "o": [{"t": "x = 4", "c": 1, "w": ""}, {"t": "x = 2", "c": 0, "w": "You added the x instead of taking it away."}, {"t": "x = 6", "c": 0, "w": "You added 2 instead of taking it away."}, {"t": "x = 8", "c": 0, "w": "You forgot to divide by 2."}], "t": "algebra"}, {"id": 115, "q": "Solve 2(x + 3) = 14", "o": [{"t": "x = 4", "c": 1, "w": ""}, {"t": "x = 5.5", "c": 0, "w": "You only multiplied the x by 2."}, {"t": "x = 11", "c": 0, "w": "You took off 3 but forgot about the 2."}, {"t": "x = 7", "c": 0, "w": "You divided by 2 and forgot the + 3."}], "t": "algebra"}, {"id": 116, "q": "Work out 3x^2 when x = 4", "o": [{"t": "48", "c": 1, "w": ""}, {"t": "144", "c": 0, "w": "You squared 3x. Only the x is squared!"}, {"t": "24", "c": 0, "w": "You did 3 × 4 × 2."}, {"t": "16", "c": 0, "w": "You forgot the 3."}], "t": "algebra"}, {"id": 117, "q": "a = 2 and b = −3. What is ab?", "o": [{"t": "−6", "c": 1, "w": ""}, {"t": "6", "c": 0, "w": "Positive times negative is negative."}, {"t": "−1", "c": 0, "w": "You added them."}, {"t": "23", "c": 0, "w": "You joined the digits."}], "t": "algebra"}, {"id": 118, "q": "Work out 5 − x^2 when x = −3", "o": [{"t": "−4", "c": 1, "w": ""}, {"t": "14", "c": 0, "w": "(−3)^2 is +9, not − 9."}, {"t": "4", "c": 0, "w": "You lost the sign: 5 − 9 is negative."}, {"t": "11", "c": 0, "w": "You doubled − 3 instead of squaring it."}], "t": "algebra"}, {"id": 119, "q": "Write an expression for 'three less than twice n'.", "o": [{"t": "2n − 3", "c": 1, "w": ""}, {"t": "3 − 2n", "c": 0, "w": "Order matters for subtraction."}, {"t": "3n − 2", "c": 0, "w": "You mixed up the numbers."}, {"t": "2(n − 3)", "c": 0, "w": "That is twice (n − 3)."}], "t": "algebra"}, {"id": 120, "q": "Find the nth term of 7, 11, 15, 19, …", "o": [{"t": "4n + 3", "c": 1, "w": ""}, {"t": "n + 4", "c": 0, "w": "The sequence goes up by 4, so the 4 goes with n."}, {"t": "4n + 7", "c": 0, "w": "Check n = 1: 4 + 7 = 11, not 7."}, {"t": "7n + 4", "c": 0, "w": "You swapped the first term and the difference."}], "t": "algebra"}, {"id": 121, "q": "Is 100 a term in the sequence 3, 7, 11, 15, …?", "o": [{"t": "No", "c": 1, "w": ""}, {"t": "Yes: n = 24", "c": 0, "w": "The 24th term is 95."}, {"t": "Yes: n = 25", "c": 0, "w": "The 25th term is 99. So close!"}, {"t": "Yes: n = 26", "c": 0, "w": "The 26th term is 103."}], "t": "algebra"}, {"id": 122, "q": "Make x the subject of y = 3x + 2", "o": [{"t": "x = (y − 2/3)", "c": 1, "w": ""}, {"t": "x = (y/3) − 2", "c": 0, "w": "Subtract 2 first, then divide EVERYTHING by 3."}, {"t": "x = 3(y − 2)", "c": 0, "w": "You multiplied instead of dividing."}, {"t": "x = (y + 2/3)", "c": 0, "w": "You added 2. The inverse of + 2 is − 2."}], "t": "algebra"}, {"id": 123, "q": "Solve x^2 = 49", "o": [{"t": "x = 7 or −7", "c": 1, "w": ""}, {"t": "x = 7", "c": 0, "w": "Do not forget the negative root: (−7)^2 = 49 too."}, {"t": "x = 24.5", "c": 0, "w": "You halved 49."}, {"t": "x = 98", "c": 0, "w": "You doubled 49."}], "t": "algebra"}, {"id": 124, "q": "Solve 2x > 10", "o": [{"t": "x > 5", "c": 1, "w": ""}, {"t": "x < 5", "c": 0, "w": "Wrong direction! Dividing by a positive does not flip the sign."}, {"t": "x > 8", "c": 0, "w": "You subtracted 2."}, {"t": "x > 20", "c": 0, "w": "You multiplied by 2."}], "t": "algebra"}, {"id": 125, "q": "Solve −2x < 6", "o": [{"t": "x > −3", "c": 1, "w": ""}, {"t": "x < −3", "c": 0, "w": "Dividing by a negative flips the inequality sign!"}, {"t": "x > 3", "c": 0, "w": "You made a sign slip when dividing."}, {"t": "x < 3", "c": 0, "w": "You divided wrongly and forgot to flip the sign."}], "t": "algebra"}, {"id": 126, "q": "What is the gradient of y = 3x + 5?", "o": [{"t": "3", "c": 1, "w": ""}, {"t": "5", "c": 0, "w": "That is the y-intercept."}, {"t": "8", "c": 0, "w": "You added them."}, {"t": "(1/3)", "c": 0, "w": "You turned it upside down."}], "t": "graphs"}, {"id": 127, "q": "Where does y = 2x − 6 cross the y-axis?", "o": [{"t": "(0, −6)", "c": 1, "w": ""}, {"t": "(−6, 0)", "c": 0, "w": "You swapped x and y."}, {"t": "(0, 6)", "c": 0, "w": "Watch the sign!"}, {"t": "(3, 0)", "c": 0, "w": "That is where it crosses the x-axis."}], "t": "graphs"}, {"id": 128, "q": "Which line is parallel to y = 4x + 1?", "o": [{"t": "y = 4x − 7", "c": 1, "w": ""}, {"t": "y = (1/4)x + 1", "c": 0, "w": "Same intercept, but parallel lines need the same GRADIENT."}, {"t": "y = −4x + 1", "c": 0, "w": "Same size gradient, but it slopes the opposite way."}, {"t": "y = x + 4", "c": 0, "w": "You moved the 4 to the wrong place."}], "t": "graphs"}, {"id": 129, "q": "Which point lies on the line y = 2x + 1?", "o": [{"t": "(3, 7)", "c": 1, "w": ""}, {"t": "(7, 3)", "c": 0, "w": "You swapped x and y."}, {"t": "(3, 6)", "c": 0, "w": "You forgot the + 1."}, {"t": "(3, 5)", "c": 0, "w": "You took away 1 instead of adding it."}], "t": "graphs"}, {"id": 130, "q": "A line passes through (1, 3) and (3, 9). What is its gradient?", "o": [{"t": "3", "c": 1, "w": ""}, {"t": "6", "c": 0, "w": "That is only the rise. Divide by the run."}, {"t": "2", "c": 0, "w": "That is only the run."}, {"t": "(1/3)", "c": 0, "w": "You did run ÷ rise."}], "t": "graphs"}, {"id": 131, "q": "Find the gradient of the line through (2, 7) and (4, 3).", "o": [{"t": "−2", "c": 1, "w": ""}, {"t": "2", "c": 0, "w": "The line goes downhill, so the gradient is negative."}, {"t": "−(1/2)", "c": 0, "w": "You did run ÷ rise."}, {"t": "4", "c": 0, "w": "That is the vertical change. Now divide by the run."}], "t": "graphs"}, {"id": 132, "q": "A line has gradient 2 and passes through (0, 5). What is its equation?", "o": [{"t": "y = 2x + 5", "c": 1, "w": ""}, {"t": "y = 5x + 2", "c": 0, "w": "You swapped the gradient and the intercept."}, {"t": "y = 2x − 5", "c": 0, "w": "Watch the sign!"}, {"t": "y = 7x", "c": 0, "w": "You added the numbers."}], "t": "graphs"}, {"id": 133, "q": "What is the equation of the x-axis?", "o": [{"t": "y = 0", "c": 1, "w": ""}, {"t": "x = 0", "c": 0, "w": "That is the y-axis."}, {"t": "y = x", "c": 0, "w": "That is a diagonal line."}, {"t": "x + y = 0", "c": 0, "w": "That is a diagonal line too."}], "t": "graphs"}, {"id": 134, "q": "Which of these is a vertical line?", "o": [{"t": "x = 3", "c": 1, "w": ""}, {"t": "y = 3", "c": 0, "w": "That is a horizontal line."}, {"t": "y = 3x", "c": 0, "w": "That is a sloping line through the origin."}, {"t": "x + y = 3", "c": 0, "w": "That is a sloping line."}], "t": "graphs"}, {"id": 135, "q": "What is the midpoint of (−2, 4) and (6, 10)?", "o": [{"t": "(2, 7)", "c": 1, "w": ""}, {"t": "(4, 14)", "c": 0, "w": "You added but forgot to halve."}, {"t": "(4, 3)", "c": 0, "w": "You halved the differences, not the totals."}, {"t": "(8, 6)", "c": 0, "w": "You found the differences."}], "t": "graphs"}, {"id": 136, "q": "Reflect the point (3, 2) in the y-axis.", "o": [{"t": "(−3, 2)", "c": 1, "w": ""}, {"t": "(3, −2)", "c": 0, "w": "That is a reflection in the x-axis."}, {"t": "(−3, −2)", "c": 0, "w": "That is a rotation by 180°."}, {"t": "(2, 3)", "c": 0, "w": "That is a reflection in y = x."}], "t": "graphs"}, {"id": 137, "q": "Reflect the point (4, −1) in the line y = x.", "o": [{"t": "(−1, 4)", "c": 1, "w": ""}, {"t": "(−4, −1)", "c": 0, "w": "That is a reflection in the y-axis."}, {"t": "(4, 1)", "c": 0, "w": "That is a reflection in the x-axis."}, {"t": "(1, −4)", "c": 0, "w": "That is a reflection in y = − x."}], "t": "graphs"}, {"id": 138, "q": "Move the point (2, 3) 4 units left and 1 unit up. Where does it end up?", "o": [{"t": "(−2, 4)", "c": 1, "w": ""}, {"t": "(6, 4)", "c": 0, "w": "That is 4 units RIGHT."}, {"t": "(−2, 2)", "c": 0, "w": "That is 1 unit DOWN."}, {"t": "(3, −1)", "c": 0, "w": "You moved 1 right and 4 down, the wrong way round."}], "t": "graphs"}, {"id": 139, "q": "Rotate (3, 1) by 90° anticlockwise about the origin.", "o": [{"t": "(−1, 3)", "c": 1, "w": ""}, {"t": "(1, −3)", "c": 0, "w": "That is 90° clockwise."}, {"t": "(−3, −1)", "c": 0, "w": "That is a rotation by 180°."}, {"t": "(−1, −3)", "c": 0, "w": "That is a reflection in y = − x."}], "t": "graphs"}, {"id": 140, "q": "A shape is enlarged by scale factor 3. A side was 4 cm. How long is it now?", "o": [{"t": "12 cm", "c": 1, "w": ""}, {"t": "7 cm", "c": 0, "w": "You added 3."}, {"t": "1.3 cm", "c": 0, "w": "You divided by 3."}, {"t": "64 cm", "c": 0, "w": "You cubed the 4."}], "t": "shape"}, {"id": 141, "q": "A shape is enlarged by scale factor 2. Its area was 5 cm². What is its new area?", "o": [{"t": "20 cm²", "c": 1, "w": ""}, {"t": "10 cm²", "c": 0, "w": "Area grows by the SQUARE of the scale factor."}, {"t": "25 cm²", "c": 0, "w": "You squared the 5."}, {"t": "7 cm²", "c": 0, "w": "You added 2."}], "t": "shape"}, {"id": 142, "q": "Which equation gives a straight line?", "o": [{"t": "y = 3 − 2x", "c": 1, "w": ""}, {"t": "y = x^2 − 2", "c": 0, "w": "An x squared makes a curve."}, {"t": "y = (2/x)", "c": 0, "w": "An x on the bottom makes a curve."}, {"t": "y = 2^x", "c": 0, "w": "An x in the power makes a curve."}], "t": "graphs"}, {"id": 143, "q": "Solve x^2 − 5x + 6 = 0", "o": [{"t": "x = 2 or 3", "c": 1, "w": ""}, {"t": "x = −2 or −3", "c": 0, "w": "Those give x^2 + 5x + 6 = 0."}, {"t": "x = 1 or 6", "c": 0, "w": "These multiply to 6 but add to 7."}, {"t": "x = 2 or −3", "c": 0, "w": "One sign is wrong."}], "t": "algebra"}, {"id": 144, "q": "The line y = 2x + 1 meets y = 7. What is x?", "o": [{"t": "x = 3", "c": 1, "w": ""}, {"t": "x = 15", "c": 0, "w": "You put 7 in for x."}, {"t": "x = 3.5", "c": 0, "w": "You forgot the + 1."}, {"t": "x = 8", "c": 0, "w": "You added 1 instead of subtracting it."}], "t": "graphs"}, {"id": 145, "q": "Solve x + y = 7 and x − y = 3", "o": [{"t": "x = 5, y = 2", "c": 1, "w": ""}, {"t": "x = 2, y = 5", "c": 0, "w": "You swapped x and y."}, {"t": "x = 4, y = 3", "c": 0, "w": "These add to 7, but their difference is 1."}, {"t": "x = 5, y = −2", "c": 0, "w": "The first equation says x + y = 7."}], "t": "algebra"}, {"id": 146, "q": "Where does y = − x + 4 cross the x-axis?", "o": [{"t": "(4, 0)", "c": 1, "w": ""}, {"t": "(0, 4)", "c": 0, "w": "That is where it crosses the y-axis."}, {"t": "(−4, 0)", "c": 0, "w": "Watch the sign!"}, {"t": "(−1, 0)", "c": 0, "w": "That is the gradient, not a crossing point."}], "t": "graphs"}, {"id": 147, "q": "Which point is in the third quadrant?", "o": [{"t": "(−2, −5)", "c": 1, "w": ""}, {"t": "(−2, 5)", "c": 0, "w": "That is the second quadrant."}, {"t": "(2, −5)", "c": 0, "w": "That is the fourth quadrant."}, {"t": "(2, 5)", "c": 0, "w": "That is the first quadrant."}], "t": "graphs"}, {"id": 148, "q": "On a distance–time graph, a horizontal line means the object is...", "o": [{"t": "Stationary", "c": 1, "w": ""}, {"t": "Moving steadily", "c": 0, "w": "A steady speed is a sloping straight line."}, {"t": "Speeding up", "c": 0, "w": "Speeding up is a curve getting steeper."}, {"t": "Slowing down", "c": 0, "w": "Slowing down is a curve getting flatter."}], "t": "graphs"}, {"id": 149, "q": "On a distance–time graph, a steeper line means the object is...", "o": [{"t": "Moving faster", "c": 1, "w": ""}, {"t": "Moving slower", "c": 0, "w": "Steeper means more distance in less time."}, {"t": "Travelling longer", "c": 0, "w": "The steepness does not tell you the total time."}, {"t": "Further away", "c": 0, "w": "Steepness shows speed, not position."}], "t": "graphs"}, {"id": 150, "q": "The point (a, 8) lies on y = 4x − 4. What is a?", "o": [{"t": "3", "c": 1, "w": ""}, {"t": "1", "c": 0, "w": "You took 4 off instead of adding it."}, {"t": "2", "c": 0, "w": "You forgot the − 4."}, {"t": "12", "c": 0, "w": "You added 4 but forgot to divide by 4."}], "t": "graphs"}, {"id": 151, "q": "Angles on a straight line are 2x and x + 60. Find x.", "o": [{"t": "40°", "c": 1, "w": ""}, {"t": "120°", "c": 0, "w": "You forgot to divide by 3."}, {"t": "60°", "c": 0, "w": "You halved 120° instead of dividing by 3."}, {"t": "80°", "c": 0, "w": "That is the angle 2x, not x."}], "t": "angles"}, {"id": 152, "q": "Angles around a point are 40°, 80° and 3x. Find x.", "o": [{"t": "80°", "c": 1, "w": ""}, {"t": "240°", "c": 0, "w": "You forgot to divide by 3."}, {"t": "20°", "c": 0, "w": "You used 180°. Angles around a point total 360°."}, {"t": "60°", "c": 0, "w": "You used 180° and forgot to divide by 3."}], "t": "angles"}, {"id": 153, "q": "The angles of a triangle are x, 2x and 3x. What is the largest angle?", "o": [{"t": "90°", "c": 1, "w": ""}, {"t": "30°", "c": 0, "w": "That is the smallest angle."}, {"t": "60°", "c": 0, "w": "That is the middle angle."}, {"t": "180°", "c": 0, "w": "That is the total of all three angles."}], "t": "angles"}, {"id": 154, "q": "What is the size of each exterior angle of a regular hexagon?", "o": [{"t": "60°", "c": 1, "w": ""}, {"t": "120°", "c": 0, "w": "That is the interior angle."}, {"t": "720°", "c": 0, "w": "That is the sum of the interior angles."}, {"t": "30°", "c": 0, "w": "You divided 360° by 12."}], "t": "angles"}, {"id": 155, "q": "What is the sum of the interior angles of a hexagon?", "o": [{"t": "720°", "c": 1, "w": ""}, {"t": "360°", "c": 0, "w": "That is the sum for a quadrilateral."}, {"t": "540°", "c": 0, "w": "That is the sum for a pentagon."}, {"t": "1080°", "c": 0, "w": "That is the sum for an octagon."}], "t": "angles"}, {"id": 156, "q": "What is the sum of the interior angles of an octagon?", "o": [{"t": "1080°", "c": 1, "w": ""}, {"t": "1440°", "c": 0, "w": "That is the sum for a decagon."}, {"t": "1260°", "c": 0, "w": "That is the sum for a nonagon."}, {"t": "720°", "c": 0, "w": "That is the sum for a hexagon."}], "t": "angles"}, {"id": 157, "q": "Each interior angle of a regular polygon is 150°. How many sides does it have?", "o": [{"t": "12", "c": 1, "w": ""}, {"t": "5", "c": 0, "w": "You divided 150 by 30. You need 360 ÷ 30."}, {"t": "6", "c": 0, "w": "You divided 180 by 30."}, {"t": "24", "c": 0, "w": "You halved the exterior angle before dividing."}], "t": "angles"}, {"id": 158, "q": "An isosceles triangle has one angle of 100°. What are the other two angles?", "o": [{"t": "40° and 40°", "c": 1, "w": ""}, {"t": "50° and 50°", "c": 0, "w": "You halved 100° instead of sharing the 80° that is left."}, {"t": "80° and 80°", "c": 0, "w": "You found 180° − 100° but did not share it."}, {"t": "40° and 100°", "c": 0, "w": "The 100° is already used. The other two angles share what is left."}], "t": "angles"}, {"id": 159, "q": "Co-interior angles between parallel lines add up to...", "o": [{"t": "180°", "c": 1, "w": ""}, {"t": "90°", "c": 0, "w": "That is complementary angles."}, {"t": "360°", "c": 0, "w": "That is the total around a point."}, {"t": "They are equal", "c": 0, "w": "That is alternate or corresponding angles."}], "t": "angles"}, {"id": 160, "q": "Two parallel lines are crossed by a third line. One angle is 110°. What is its co-interior angle?", "o": [{"t": "70°", "c": 1, "w": ""}, {"t": "110°", "c": 0, "w": "That would be alternate or corresponding."}, {"t": "250°", "c": 0, "w": "You did 360° − 110°."}, {"t": "20°", "c": 0, "w": "You did 110° − 90°."}], "t": "angles"}, {"id": 161, "q": "Corresponding angles on parallel lines are...", "o": [{"t": "Equal", "c": 1, "w": ""}, {"t": "Add up to 180°", "c": 0, "w": "That is co-interior angles."}, {"t": "Add up to 90°", "c": 0, "w": "That is complementary angles."}, {"t": "Add up to 360°", "c": 0, "w": "That is all the angles around a point."}], "t": "angles"}, {"id": 162, "q": "Two straight lines cross. One angle is 125°. What is the angle vertically opposite it?", "o": [{"t": "125°", "c": 1, "w": ""}, {"t": "55°", "c": 0, "w": "That is the angle next to it, on the straight line."}, {"t": "235°", "c": 0, "w": "You did 360° − 125°."}, {"t": "35°", "c": 0, "w": "You did 125° − 90°."}], "t": "angles"}, {"id": 163, "q": "Angles on a straight line are 50°, 75° and x. Find x.", "o": [{"t": "55°", "c": 1, "w": ""}, {"t": "125°", "c": 0, "w": "That is 50° + 75°. Subtract it from 180°."}, {"t": "235°", "c": 0, "w": "You used 360° instead of 180°."}, {"t": "130°", "c": 0, "w": "You forgot the 75°."}], "t": "angles"}, {"id": 164, "q": "A triangle has angles of 40° and 65°. The side at the third corner is extended to make an exterior angle. How big is it?", "o": [{"t": "105°", "c": 1, "w": ""}, {"t": "75°", "c": 0, "w": "That is the third interior angle."}, {"t": "25°", "c": 0, "w": "You subtracted 40° from 65°."}, {"t": "285°", "c": 0, "w": "You did 360° − 75°."}], "t": "angles"}, {"id": 165, "q": "Three angles of a quadrilateral are 90°, 100° and 80°. What is the fourth angle?", "o": [{"t": "90°", "c": 1, "w": ""}, {"t": "270°", "c": 0, "w": "That is the total of the other three."}, {"t": "10°", "c": 0, "w": "You used 180°. A quadrilateral totals 360°."}, {"t": "180°", "c": 0, "w": "That is half the total."}], "t": "angles"}, {"id": 166, "q": "What is the size of each exterior angle of a regular pentagon?", "o": [{"t": "72°", "c": 1, "w": ""}, {"t": "108°", "c": 0, "w": "That is the interior angle."}, {"t": "36°", "c": 0, "w": "You halved it."}, {"t": "540°", "c": 0, "w": "That is the sum of the interior angles."}], "t": "angles"}, {"id": 167, "q": "A right angle is split into two angles, 2x and x + 15. Find x.", "o": [{"t": "25°", "c": 1, "w": ""}, {"t": "30°", "c": 0, "w": "You ignored the 15."}, {"t": "75°", "c": 0, "w": "You forgot to divide by 3."}, {"t": "50°", "c": 0, "w": "That is 2x, not x."}], "t": "angles"}, {"id": 168, "q": "The angles of a triangle are in the ratio 1 : 2 : 3. What is the smallest angle?", "o": [{"t": "30°", "c": 1, "w": ""}, {"t": "60°", "c": 0, "w": "That is the middle angle."}, {"t": "20°", "c": 0, "w": "You divided 180° by 9. There are only 6 parts."}, {"t": "90°", "c": 0, "w": "That is the largest angle."}], "t": "angles"}, {"id": 169, "q": "Two angles on a straight line are in the ratio 2 : 3. What is the larger angle?", "o": [{"t": "108°", "c": 1, "w": ""}, {"t": "72°", "c": 0, "w": "That is the smaller angle."}, {"t": "90°", "c": 0, "w": "You halved 180°."}, {"t": "60°", "c": 0, "w": "You divided 180° by 3."}], "t": "angles"}, {"id": 170, "q": "It is 4 o'clock. What is the smaller angle between the hands of the clock?", "o": [{"t": "120°", "c": 1, "w": ""}, {"t": "30°", "c": 0, "w": "That is the angle for one hour."}, {"t": "60°", "c": 0, "w": "That is the angle for two hours."}, {"t": "90°", "c": 0, "w": "That is the angle for 3 o'clock."}], "t": "angles"}, {"id": 171, "q": "A bearing of 090° points in which direction?", "o": [{"t": "East", "c": 1, "w": ""}, {"t": "North", "c": 0, "w": "North is c": 0, "w": "You forgot to multiply by the height."}], "t": "shape"}, {"id": 178, "q": "A triangle has area 24 cm² and base 8 cm. What is its height?", "o": [{"t": "6 cm", "c": 1, "w": ""}, {"t": "3 cm", "c": 0, "w": "You forgot to double: area = half × base × height."}, {"t": "12 cm", "c": 0, "w": "You just halved the area."}, {"t": "192 cm", "c": 0, "w": "You multiplied instead of dividing."}], "t": "shape"}, {"id": 179, "q": "A circle has diameter 10 cm. What is its circumference?", "o": [{"t": "10π cm", "c": 1, "w": ""}, {"t": "5π cm", "c": 0, "w": "You used the radius."}, {"t": "20π cm", "c": 0, "w": "You doubled the diameter."}, {"t": "25π cm", "c": 0, "w": "That is an area, not a circumference."}], "t": "shape"}, {"id": 180, "q": "A circle has diameter 8 cm. What is its area?", "o": [{"t": "16π cm²", "c": 1, "w": ""}, {"t": "64π cm²", "c": 0, "w": "You squared the diameter."}, {"t": "8π cm²", "c": 0, "w": "That is the circumference."}, {"t": "32π cm²", "c": 0, "w": "You doubled it."}], "t": "shape"}, {"id": 181, "q": "A circle has circumference 12π cm. What is its radius?", "o": [{"t": "6 cm", "c": 1, "w": ""}, {"t": "12 cm", "c": 0, "w": "That is the diameter."}, {"t": "3 cm", "c": 0, "w": "You halved it twice."}, {"t": "24 cm", "c": 0, "w": "You doubled it."}], "t": "shape"}, {"id": 182, "q": "Which has the greater area: a square of side 6 cm, or a circle of radius 3 cm?", "o": [{"t": "The square", "c": 1, "w": ""}, {"t": "The circle", "c": 0, "w": "The circle's area is 9π, about 28 cm². The square is 36 cm²."}, {"t": "They are equal", "c": 0, "w": "A square of side 6 and a circle of diameter 6 are not the same area."}, {"t": "Cannot tell", "c": 0, "w": "Work them out: 36 cm² and about 28 cm²."}], "t": "shape"}, {"id": 183, "q": "What is the volume of a cube with side 5 cm?", "o": [{"t": "125 cm³", "c": 1, "w": ""}, {"t": "15 cm³", "c": 0, "w": "You did 5 × 3."}, {"t": "25 cm³", "c": 0, "w": "That is 5 squared."}, {"t": "150 cm³", "c": 0, "w": "That is the surface area."}], "t": "shape"}, {"id": 184, "q": "A cylinder has radius 2 cm and height 5 cm. What is its volume?", "o": [{"t": "20π cm³", "c": 1, "w": ""}, {"t": "10π cm³", "c": 0, "w": "You did not square the radius."}, {"t": "100π cm³", "c": 0, "w": "You squared the height instead of the radius."}, {"t": "40π cm³", "c": 0, "w": "You doubled the answer."}], "t": "shape"}, {"id": 185, "q": "A cuboid has volume 60 cm³ and base area 12 cm². What is its height?", "o": [{"t": "5 cm", "c": 1, "w": ""}, {"t": "720 cm", "c": 0, "w": "You multiplied instead of dividing."}, {"t": "48 cm", "c": 0, "w": "You subtracted."}, {"t": "0.2 cm", "c": 0, "w": "You divided the wrong way round."}], "t": "shape"}, {"id": 186, "q": "Convert 2.5 m² into cm².", "o": [{"t": "25000 cm²", "c": 1, "w": ""}, {"t": "250 cm²", "c": 0, "w": "You used 100. For areas you need 100 × 100."}, {"t": "2500 cm²", "c": 0, "w": "You used 1000."}, {"t": "250000 cm²", "c": 0, "w": "You used 100 × 100 × 10."}], "t": "shape"}, {"id": 187, "q": "Convert 3 cm³ into mm³.", "o": [{"t": "3000 mm³", "c": 1, "w": ""}, {"t": "30 mm³", "c": 0, "w": "You used 10. For volumes you need 10 × 10 × 10."}, {"t": "300 mm³", "c": 0, "w": "You used 100."}, {"t": "30000 mm³", "c": 0, "w": "You used 10 four times."}], "t": "shape"}, {"id": 188, "q": "A right-angled triangle has short sides 5 cm and 12 cm. How long is the longest side?", "o": [{"t": "13 cm", "c": 1, "w": ""}, {"t": "17 cm", "c": 0, "w": "You added the two sides."}, {"t": "7 cm", "c": 0, "w": "You subtracted them."}, {"t": "60 cm", "c": 0, "w": "You multiplied them."}], "t": "shape"}, {"id": 189, "q": "A right-angled triangle has longest side 10 cm and one short side 6 cm. How long is the other short side?", "o": [{"t": "8 cm", "c": 1, "w": ""}, {"t": "4 cm", "c": 0, "w": "You subtracted 6 from 10 without squaring."}, {"t": "64 cm", "c": 0, "w": "You forgot the square root."}, {"t": "11.7 cm", "c": 0, "w": "You added the squares. For a short side, subtract."}], "t": "shape"}, {"id": 190, "q": "Which set of sides makes a right-angled triangle?", "o": [{"t": "6, 8, 10", "c": 1, "w": ""}, {"t": "5, 6, 7", "c": 0, "w": "25 + 36 = 61, not 49."}, {"t": "4, 5, 6", "c": 0, "w": "16 + 25 = 41, not 36."}, {"t": "7, 8, 9", "c": 0, "w": "49 + 64 = 113, not 81."}], "t": "shape"}, {"id": 191, "q": "A 5 m ladder leans against a wall with its foot 3 m from the wall. How high up the wall does it reach?", "o": [{"t": "4 m", "c": 1, "w": ""}, {"t": "8 m", "c": 0, "w": "You added 5 and 3."}, {"t": "5.8 m", "c": 0, "w": "You added the squares. The ladder is the longest side!"}, {"t": "2 m", "c": 0, "w": "You subtracted 3 from 5."}], "t": "shape"}, {"id": 192, "q": "In a right-angled triangle, tan of an angle is...", "o": [{"t": "opp ÷ adj", "c": 1, "w": ""}, {"t": "opp ÷ hyp", "c": 0, "w": "That is sin."}, {"t": "adj ÷ hyp", "c": 0, "w": "That is cos."}, {"t": "hyp ÷ adj", "c": 0, "w": "That is 1 ÷ cos."}], "t": "shape"}, {"id": 193, "q": "What is the longest side of a right-angled triangle called?", "o": [{"t": "Hypotenuse", "c": 1, "w": ""}, {"t": "Adjacent", "c": 0, "w": "The adjacent side is next to the angle."}, {"t": "Opposite", "c": 0, "w": "The opposite side faces the angle."}, {"t": "Diagonal", "c": 0, "w": "A diagonal is a line across a shape, not the name for this side."}], "t": "shape"}, {"id": 194, "q": "A semicircle has diameter 10 cm. What is its perimeter?", "o": [{"t": "5π + 10 cm", "c": 1, "w": ""}, {"t": "5π cm", "c": 0, "w": "That is only the curved edge. Add the straight edge too."}, {"t": "10π cm", "c": 0, "w": "That is the whole circle."}, {"t": "25π cm", "c": 0, "w": "That is an area, not a perimeter."}], "t": "shape"}, {"id": 195, "q": "The perimeter of a square is 36 cm. What is its area?", "o": [{"t": "81 cm²", "c": 1, "w": ""}, {"t": "36 cm²", "c": 0, "w": "That is the perimeter."}, {"t": "324 cm²", "c": 0, "w": "You multiplied the perimeter by the side."}, {"t": "9 cm²", "c": 0, "w": "That is the side length."}], "t": "shape"}, {"id": 196, "q": "A rectangle has area 48 cm² and one side of 6 cm. What is its perimeter?", "o": [{"t": "28 cm", "c": 1, "w": ""}, {"t": "8 cm", "c": 0, "w": "That is the other side."}, {"t": "14 cm", "c": 0, "w": "That is half the perimeter."}, {"t": "54 cm", "c": 0, "w": "You added 48 and 6."}], "t": "shape"}, {"id": 197, "q": "A 10 cm by 6 cm rectangle has a 4 cm by 3 cm corner cut out. What is the area left?", "o": [{"t": "48 cm²", "c": 1, "w": ""}, {"t": "72 cm²", "c": 0, "w": "You added the cut-out instead of taking it away."}, {"t": "60 cm²", "c": 0, "w": "You forgot to take away the corner."}, {"t": "12 cm²", "c": 0, "w": "That is just the corner that was cut out."}], "t": "shape"}, {"id": 198, "q": "Convert 4500 cm into metres.", "o": [{"t": "45 m", "c": 1, "w": ""}, {"t": "450 m", "c": 0, "w": "You divided by 10."}, {"t": "4.5 m", "c": 0, "w": "You divided by 1000."}, {"t": "450000 m", "c": 0, "w": "You multiplied by 100."}], "t": "shape"}, {"id": 199, "q": "A 3D shape has 6 faces, 12 edges and 8 vertices. What is it?", "o": [{"t": "Cuboid", "c": 1, "w": ""}, {"t": "Triangular prism", "c": 0, "w": "A triangular prism has 5 faces, 9 edges and 6 vertices."}, {"t": "Square pyramid", "c": 0, "w": "A square-based pyramid has 5 faces, 8 edges and 5 vertices."}, {"t": "Cone", "c": 0, "w": "A cone has only 2 faces and 1 vertex."}], "t": "shape"}, {"id": 200, "q": "How many lines of symmetry does a rectangle (that is not a square) have?", "o": [{"t": "2", "c": 1, "w": ""}, {"t": "4", "c": 0, "w": "The diagonals are not lines of symmetry in a rectangle."}, {"t": "1", "c": 0, "w": "There is a second one across the other way."}, {"t": "0", "c": 0, "w": "It has two lines of symmetry."}], "t": "shape"}, {"id": 201, "q": "A spinner has 5 equal sections numbered 1 to 5. What is the probability of an even number?", "o": [{"t": "(2/5)", "c": 1, "w": ""}, {"t": "(1/2)", "c": 0, "w": "It is not 50:50. There are 2 even and 3 odd sections."}, {"t": "(2/3)", "c": 0, "w": "That compares even to odd. Use the total on the bottom."}, {"t": "(3/5)", "c": 0, "w": "That is the probability of an odd number."}], "t": "prob"}, {"id": 202, "q": "A fair die is rolled. What is the probability of a number greater than 4?", "o": [{"t": "(1/3)", "c": 1, "w": ""}, {"t": "(1/6)", "c": 0, "w": "Both 5 and 6 are greater than 4."}, {"t": "(1/2)", "c": 0, "w": "There are six equally likely outcomes, not two."}, {"t": "(5/6)", "c": 0, "w": "You put the 5 on the top."}], "t": "prob"}, {"id": 203, "q": "A fair die is rolled twice. What is the probability of two sixes?", "o": [{"t": "(1/36)", "c": 1, "w": ""}, {"t": "(1/12)", "c": 0, "w": "You added the denominators."}, {"t": "(1/6)", "c": 0, "w": "That is the chance of one six."}, {"t": "(1/3)", "c": 0, "w": "You added the probabilities. 'And' means multiply."}], "t": "prob"}, {"id": 204, "q": "P(A) = 0.3 and P(B) = 0.5, and the events are independent. What is P(A and B)?", "o": [{"t": "0.15", "c": 1, "w": ""}, {"t": "0.8", "c": 0, "w": "You added. 'And' means multiply."}, {"t": "0.2", "c": 0, "w": "You subtracted."}, {"t": "0.6", "c": 0, "w": "You divided."}], "t": "prob"}, {"id": 205, "q": "A bag has 4 red and 6 blue counters. One blue counter is taken out and not replaced. What is the probability the next counter is red?", "o": [{"t": "(4/9)", "c": 1, "w": ""}, {"t": "(4/10)", "c": 0, "w": "There are only 9 counters left."}, {"t": "(3/9)", "c": 0, "w": "You took out a red counter."}, {"t": "(6/9)", "c": 0, "w": "That is the probability of blue."}], "t": "prob"}, {"id": 206, "q": "Two fair coins are flipped. What is the probability of one head and one tail?", "o": [{"t": "(1/2)", "c": 1, "w": ""}, {"t": "(1/3)", "c": 0, "w": "The results 0, 1 and 2 heads are not equally likely. List HH, HT, TH, TT."}, {"t": "(1/4)", "c": 0, "w": "That is the chance of two heads."}, {"t": "(3/4)", "c": 0, "w": "That is the chance of at least one head."}], "t": "prob"}, {"id": 207, "q": "A fair die is thrown 60 times. How many 4s would you expect?", "o": [{"t": "10", "c": 1, "w": ""}, {"t": "6", "c": 0, "w": "You used 1 in 10."}, {"t": "15", "c": 0, "w": "You used (1/4)."}, {"t": "360", "c": 0, "w": "You multiplied by 6."}], "t": "prob"}, {"id": 208, "q": "A fair coin lands heads 5 times in a row. What is the probability it lands heads next time?", "o": [{"t": "(1/2)", "c": 1, "w": ""}, {"t": "More than (1/2)", "c": 0, "w": "Coins have no memory."}, {"t": "Less than (1/2)", "c": 0, "w": "Tails is not 'due'."}, {"t": "(1/64)", "c": 0, "w": "That is the chance of 6 heads in a row, but 5 have already happened."}], "t": "prob"}, {"id": 209, "q": "What is the mean of 4, 7, 7, 10 and 12?", "o": [{"t": "8", "c": 1, "w": ""}, {"t": "7", "c": 0, "w": "That is the median (and the mode)."}, {"t": "40", "c": 0, "w": "That is the total. Divide by 5."}, {"t": "12", "c": 0, "w": "That is the largest number."}], "t": "stats"}, {"id": 210, "q": "What is the median of 3, 9, 4 and 6?", "o": [{"t": "5", "c": 1, "w": ""}, {"t": "6.5", "c": 0, "w": "You did not put them in order first."}, {"t": "4", "c": 0, "w": "You picked one of the two middle numbers. Find the number halfway between them."}, {"t": "5.5", "c": 0, "w": "That is the mean."}], "t": "stats"}, {"id": 211, "q": "What is the mode of 2, 5, 5, 8, 9, 9, 9?", "o": [{"t": "9", "c": 1, "w": ""}, {"t": "5", "c": 0, "w": "5 appears twice, but 9 appears three times."}, {"t": "8", "c": 0, "w": "That is the median."}, {"t": "6.7", "c": 0, "w": "That is the mean."}], "t": "stats"}, {"id": 212, "q": "What is the range of 12, 5, 19 and 8?", "o": [{"t": "14", "c": 1, "w": ""}, {"t": "19", "c": 0, "w": "That is the largest number."}, {"t": "24", "c": 0, "w": "You added the biggest and smallest."}, {"t": "11", "c": 0, "w": "That is the mean."}], "t": "stats"}, {"id": 213, "q": "The mean of five numbers is 8. Four of them are 3, 6, 9 and 10. What is the fifth?", "o": [{"t": "12", "c": 1, "w": ""}, {"t": "8", "c": 0, "w": "That is the mean, not the missing number."}, {"t": "28", "c": 0, "w": "That is the total of the four you know."}, {"t": "40", "c": 0, "w": "That is the total of all five."}], "t": "stats"}, {"id": 214, "q": "10 people have a mean height of 150 cm. 20 other people have a mean height of 165 cm. What is the mean of all 30 people?", "o": [{"t": "160 cm", "c": 1, "w": ""}, {"t": "157.5 cm", "c": 0, "w": "You found the mean of the two means. The groups are different sizes."}, {"t": "315 cm", "c": 0, "w": "You added them."}, {"t": "165 cm", "c": 0, "w": "That is the mean of the bigger group."}], "t": "stats"}, {"id": 215, "q": "A sector on a pie chart is 90°. There are 40 people in total. How many people are in the sector?", "o": [{"t": "10", "c": 1, "w": ""}, {"t": "90", "c": 0, "w": "That is the angle, not the number of people."}, {"t": "25", "c": 0, "w": "That is the percentage."}, {"t": "4", "c": 0, "w": "You divided 40 by 10."}], "t": "stats"}, {"id": 216, "q": "Scores 1, 2 and 3 have frequencies 2, 3 and 5. How many scores are there altogether?", "o": [{"t": "10", "c": 1, "w": ""}, {"t": "6", "c": 0, "w": "You added the scores 1 + 2 + 3."}, {"t": "23", "c": 0, "w": "That is the total of all the scores."}, {"t": "3", "c": 0, "w": "That is how many different scores there are."}], "t": "stats"}, {"id": 217, "q": "Scores 1, 2 and 3 have frequencies 2, 3 and 5. What is the mean score?", "o": [{"t": "2.3", "c": 1, "w": ""}, {"t": "2", "c": 0, "w": "That is the middle score, not the mean."}, {"t": "7.7", "c": 0, "w": "You divided by 3, the number of different scores."}, {"t": "10", "c": 0, "w": "That is the number of scores."}], "t": "stats"}, {"id": 218, "q": "To estimate the mean from grouped data, which value do you use from each group?", "o": [{"t": "The midpoint", "c": 1, "w": ""}, {"t": "The lower bound", "c": 0, "w": "That would underestimate the mean."}, {"t": "The upper bound", "c": 0, "w": "That would overestimate the mean."}, {"t": "The class width", "c": 0, "w": "That is the size of the group, not its centre."}], "t": "stats"}, {"id": 219, "q": "Which of these is least affected by an extreme value?", "o": [{"t": "Median", "c": 1, "w": ""}, {"t": "Mean", "c": 0, "w": "One huge value can drag the mean a long way."}, {"t": "Range", "c": 0, "w": "One extreme value changes the range completely."}, {"t": "Sum", "c": 0, "w": "One extreme value changes the sum completely."}], "t": "stats"}, {"id": 220, "q": "The points on a scatter graph slope upwards from left to right. What type of correlation is this?", "o": [{"t": "Positive", "c": 1, "w": ""}, {"t": "Negative", "c": 0, "w": "Negative correlation slopes downwards."}, {"t": "None", "c": 0, "w": "The points follow a pattern, so there is correlation."}, {"t": "Causation", "c": 0, "w": "Correlation does not mean one thing causes the other."}], "t": "stats"}, {"id": 221, "q": "Ice cream sales and sunburn cases are positively correlated. What is the most sensible explanation?", "o": [{"t": "Hot weather", "c": 1, "w": ""}, {"t": "Ice cream", "c": 0, "w": "Ice cream does not cause sunburn. Correlation is not causation."}, {"t": "Sunburn", "c": 0, "w": "Sunburn does not make people buy ice cream. Correlation is not causation."}, {"t": "Pure chance", "c": 0, "w": "The pattern is strong. A third factor, hot weather, explains both."}], "t": "stats"}, {"id": 222, "q": "A bar chart's vertical axis starts at 50 instead of 0. What effect does this have?", "o": [{"t": "Bigger gaps", "c": 1, "w": ""}, {"t": "Smaller gaps", "c": 0, "w": "The bars look more different, not less."}, {"t": "Wrong data", "c": 0, "w": "The data is fine, but the chart is misleading."}, {"t": "No change", "c": 0, "w": "The bars look very different in height."}], "t": "stats"}, {"id": 223, "q": "What do the values 2 | 3 5 8 mean in a stem and leaf diagram with the key 2 | 3 = 23?", "o": [{"t": "23, 25, 28", "c": 1, "w": ""}, {"t": "2, 3, 5, 8", "c": 0, "w": "The stem is the tens digit of every value."}, {"t": "23, 5, 8", "c": 0, "w": "The stem goes with every leaf."}, {"t": "235", "c": 0, "w": "Each leaf is a separate value."}], "t": "stats"}, {"id": 224, "q": "There are 50 values in a cumulative frequency graph. The median is read at which value?", "o": [{"t": "25th", "c": 1, "w": ""}, {"t": "50th", "c": 0, "w": "That is the end of the data."}, {"t": "12.5th", "c": 0, "w": "That is the lower quartile."}, {"t": "37.5th", "c": 0, "w": "That is the upper quartile."}], "t": "stats"}, {"id": 225, "q": "The lower quartile is 12 and the upper quartile is 30. What is the interquartile range?", "o": [{"t": "18", "c": 1, "w": ""}, {"t": "42", "c": 0, "w": "You added them."}, {"t": "21", "c": 0, "w": "That is the midpoint of the quartiles."}, {"t": "30", "c": 0, "w": "That is the upper quartile."}], "t": "stats"}, {"id": 226, "q": "Write 4.2 × 10^3 as an ordinary number.", "o": [{"t": "4200", "c": 1, "w": ""}, {"t": "420", "c": 0, "w": "One place short! The power 3 moves the point 3 places."}, {"t": "42000", "c": 0, "w": "One place too far."}, {"t": "4203", "c": 0, "w": "You added the power on the end."}], "t": "number"}, {"id": 227, "q": "Write 560000 in standard form.", "o": [{"t": "5.6 × 10^5", "c": 1, "w": ""}, {"t": "56 × 10^4", "c": 0, "w": "Standard form needs a number between 1 and 10."}, {"t": "5.6 × 10^6", "c": 0, "w": "The point moves 5 places, not 6."}, {"t": "5.6 × 10^4", "c": 0, "w": "The point moves 5 places, not 4."}], "t": "number"}, {"id": 228, "q": "Work out (3 × 10^4) × (2 × 10^3)", "o": [{"t": "6 × 10^7", "c": 1, "w": ""}, {"t": "6 × 10^12", "c": 0, "w": "You multiplied the powers. Add them!"}, {"t": "5 × 10^7", "c": 0, "w": "You added 3 and 2. Multiply the numbers."}, {"t": "6 × 10^1", "c": 0, "w": "You subtracted the powers."}], "t": "number"}, {"id": 229, "q": "Work out (8 × 10^6) ÷ (2 × 10^2)", "o": [{"t": "4 × 10^4", "c": 1, "w": ""}, {"t": "4 × 10^3", "c": 0, "w": "You did 6 ÷ 2 for the powers. Subtract: 6 − 2 = 4."}, {"t": "4 × 10^8", "c": 0, "w": "You added the powers."}, {"t": "6 × 10^4", "c": 0, " const D={ink:'#2B5390',fill:'#DCE8F7',fill2:'#EAF1FB',fill3:'#BFD3EE',or:'#F47B3F',orF:'rgba(244,123,63,.30)',blF:'rgba(63,115,184,.22)',tx:'#22304A',gy:'#8793A1'};

function svg(inner,note){return `<svg viewBox="0 0 400 300" role="img" aria-label="Diagram" preserveAspectRatio="xMidYMid meet">${inner}${note?`<text x="394" y="291" text-anchor="end" class="dnote" font-size="12">${note}</text>`:''}</svg>`}
const NA='Not drawn accurately';
function poly(pts,fill=D.fill){return `<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" stroke="${D.ink}" stroke-width="3.5" stroke-linejoin="round"/>`}
function ln(a,b,o={}){return `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${o.c||D.ink}" stroke-width="${o.w||3.5}" stroke-linecap="round"${o.dash?` stroke-dasharray="${o.dash}"`:''}/>`}
function tx(x,y,s,o={}){return `<text x="${f1(x)}" y="${f1(y)}" text-anchor="${o.a||'middle'}" dominant-baseline="central" font-size="${o.s||22}" font-weight="700" fill="${o.c||D.tx}">${s}</text>`}
function unk(x,y,s='?',o={}){return tx(x,y,s,{c:D.or,s:o.s||30,a:o.a})}
function dot(p,r=4.5,c=D.ink){return `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${c}"/>`}
function arc(c,r,a1,a2,label,o={}){
  while(a2<=a1)a2+=360;
  const p1=pol(c,r,a1),p2=pol(c,r,a2),large=(a2-a1>180)?1:0;
  let s=`<path d="M${pt(c)} L${pt(p1)} A${r},${r} 0 ${large} 0 ${pt(p2)} Z" fill="${o.fill||D.orF}" stroke="${D.or}" stroke-width="3"/>`;
  if(label!==undefined&&label!==''){const m=pol(c,o.lr||r*0.7,(a1+a2)/2);
    s+=(label==='?'||o.unk)?unk(m[0],m[1],label,{s:o.s}):tx(m[0],m[1],label,{s:o.s||21,c:o.lc})}
  return s}
function ang(P,Q,R,r,label,o={}){
  let d1=dir(P,Q),d2=dir(P,R);const diff=((d2-d1)%360+360)%360;

  return arc(P,r,d1,d2,label,o)}
function rt(c,d,s=18){
  const u=pol([0,0],s,d),v=pol([0,0],s,d+90);
  const a=[c[0]+u[0],c[1]+u[1]],b=[c[0]+u[0]+v[0],c[1]+u[1]+v[1]],e=[c[0]+v[0],c[1]+v[1]];
  return `<polyline points="${pt(a)} ${pt(b)} ${pt(e)}" fill="none" stroke="${D.or}" stroke-width="3"/>`}

function chev(x,y){return `<polyline points="${x-7},${y-8} ${x+3},${y} ${x-7},${y+8}" fill="none" stroke="${D.ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`}
function cuboid(x0,y0,w,h,dx,dy,topFill){
  const F=[[x0,y0],[x0+w,y0],[x0+w,y0+h],[x0,y0+h]],T=[[x0,y0],[x0+dx,y0+dy],[x0+w+dx,y0+dy],[x0+w,y0]],R=[[x0+w,y0],[x0+w+dx,y0+dy],[x0+w+dx,y0+h+dy],[x0+w,y0+h]];

function rtri(w,h,s,lb,ll,lh){ // right angle bottom-left
