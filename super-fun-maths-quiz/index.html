DG[183]=()=>svg(cuboid(80,110,130,130,75,-55)+tx(145,264,'5 cm')+tx(62,175,'5 cm',{a:'end'})+tx(282,226,'5 cm',{a:'start'}));
DG[184]=()=>svg(`<path d="M130,70 L130,230 A70,22 0 0 0 270,230 L270,70 Z" fill="${D.fill}" stroke="${D.ink}" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="200" cy="70" rx="70" ry="22" fill="${D.fill2}" stroke="${D.ink}" stroke-width="3.5"/>`+ln([200,70],[270,70],{c:D.or,w:4})+dot([200,70],4.5,D.or)+tx(262,36,'2 cm')+tx(290,150,'5 cm',{a:'start'}));
DG[185]=()=>svg(cuboid(30,110,170,130,60,-45)+tx(115,168,'Volume',{s:21})+tx(115,194,'= 60 cm³',{s:21})+unk(22,175,'?',{a:'end'})
  +ln([300,90],[190,89],{c:D.or,w:3})+dot([190,89],4.5,D.or)+tx(335,70,'Base area',{s:18,c:D.or})+tx(335,94,'= 12 cm²',{s:18,c:D.or}));
DG[191]=()=>{const F=[165,250],T=[300,70];return svg(`<rect x="300" y="40" width="36" height="210" fill="${D.fill3}" stroke="${D.ink}" stroke-width="3"/>`+ln([30,250],[300,250],{c:D.ink,w:4})+ln(F,T,{c:D.or,w:7})+rt([300,250],90,20)+ln([165,276],[300,276],{c:D.gy,w:2.5})+tx(232,289,'3 m',{s:20})+tx(214,150,'5 m',{a:'end'})+unk(284,205,'?',{a:'end'}))};
DG[194]=()=>svg(`<path d="M70,205 A130,130 0 0 1 330,205 Z" fill="${D.fill}" stroke="${D.ink}" stroke-width="3.5" stroke-linejoin="round"/>`+tx(200,232,'10 cm')+dot([200,205],4,D.ink));
DG[196]=()=>svg(poly([[90,60],[330,60],[330,240],[90,240]])+tx(76,150,'6 cm',{a:'end'})+unk(210,266,'?')+tx(210,150,'Area = 48 cm²',{s:21,c:D.or}));
DG[197]=()=>svg(poly([[70,60],[226,60],[226,150],[330,150],[330,240],[70,240]])+`<polyline points="226,60 330,60 330,150" fill="none" stroke="${D.gy}" stroke-width="3" stroke-dasharray="7 6"/>`+tx(200,266,'10 cm')+tx(58,150,'6 cm',{a:'end'})+tx(278,38,'4 cm')+tx(342,105,'3 cm',{a:'start'}));

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(s){
  s=esc(s);
  s=s.replace(/\(([^()\/]+)\/([^()\/]+)\)/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  s=s.replace(/\^(−?[A-Za-z0-9]+(?:\.\d+)?)/g,'<sup>$1</sup>');
  return s}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ALL=TOPICS.map(t=>t.id);
const DEF={n:10,time:15,topics:ALL,mc:true,reveal:'one',why:true,sound:false};
let S=Object.assign({},DEF,LS.get('lom_sfmq_v1',{}));
if(!Array.isArray(S.topics)||!S.topics.length)S.topics=ALL;
S.topics=S.topics.filter(t=>ALL.includes(t));if(!S.topics.length)S.topics=ALL;
const save=()=>LS.set('lom_sfmq_v1',S);
const countFor=t=>Q.filter(q=>q.t===t).length;
const poolSize=()=>Q.filter(q=>S.topics.includes(q.t)).length;

let ac;function beep(fr,d,v){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=fr;g.gain.value=v||.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));cur=id}
let cur='title';

/* ===================== TITLE ===================== */
function buildTitle(){
  const mk=(txt)=>txt.split(' ').map((w,wi)=>`<span class="w">${[...w].map((c,i)=>`<i style="animation-delay:${(wi*5+i)*.09}s">${c}</i>`).join('')}</span>`).join(' ');
  $('#t1').innerHTML=mk('SUPER FUN');$('#t2').innerHTML=mk('MATHS QUIZ');
  const b=$('#bg');for(let i=0;i<16;i++){const s=document.createElement('span');s.className='sym';s.textContent=['+','−','×','÷','π','√','%','=','∠','²','½','£'][i%12];
    s.style.left=(Math.random()*96)+'%';s.style.fontSize=(2+Math.random()*4)+'rem';s.style.animationDuration=(18+Math.random()*22)+'s';s.style.animationDelay=(-Math.random()*30)+'s';b.appendChild(s)}
}
function chips(){
  const nt=S.topics.length;
  const c=[`${S.n} questions`,S.time?`${S.time} seconds each`:'Manual advance',nt===ALL.length?'All topics':nt===1?TNAME[S.topics[0]]:`${nt} topics`,
    S.mc?'Multiple choice':'No options shown',S.reveal==='one'?'Answers one by one':'Answers all at once'];
  $('#chips').innerHTML=c.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}

/* ===================== SETTINGS ===================== */
function seg(key,opts){return `<div class="seg" data-k="${key}">${opts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${String(S[key])===String(v)}">${l}</button>`).join('')}</div>`}
function sw(key,title,sub){return `<div class="set"><div class="sw"><div><h3>${title}</h3><div class="sub" style="margin:0">${sub}</div></div><button class="switch" role="switch" data-sw="${key}" aria-checked="${S[key]}" aria-label="${title}"></button></div></div>`}
function renderSettings(){
  const keepScroll=$('#setBody').scrollTop;
  const avail=poolSize();
  $('#setBody').innerHTML=
   `<div class="set"><h3>Number of questions</h3>${seg('n',[[10,'10'],[20,'20']])}${avail<S.n?`<div class="note">Only ${avail} question${avail===1?'':'s'} in the chosen topics, so that's how many you'll get.</div>`:''}</div>`+
   `<div class="set"><h3>Time per question</h3><div class="sub">The quiz moves on by itself when the time is up.</div>${seg('time',[[10,'10 s'],[15,'15 s'],[20,'20 s'],[30,'30 s'],[45,'45 s'],[60,'60 s'],[0,'Manual']])}</div>`+
   sw('mc','Multiple choice answers','On shows options A to D. Off shows the question only.')+
   `<div class="set"><h3>Reveal the answers</h3><div class="sub">After the last question.</div>${seg('reveal',[['one','One by one'],['all','All at once']])}</div>`+
   sw('why','Show common mistakes','When answers are revealed, explain why the wrong options are tempting (needs multiple choice).')+
   sw('sound','Sound','A gentle tick for the last three seconds.')+
   `<div class="set"><h3>Topics</h3><div class="minibtns"><button data-all="1">Select all</button><button data-all="0">Clear</button></div>
     <div class="topics">${TOPICS.map(t=>`<button class="tp" data-t="${t.id}" aria-pressed="${S.topics.includes(t.id)}"><span class="g">${esc(t.g)}</span><span>${esc(t.name)}<small>${countFor(t.id)} questions</small></span></button>`).join('')}</div></div>`;
  $('#setBody').scrollTop=keepScroll}
function openSettings(){renderSettings();$('#settings').classList.add('on')}
function closeSettings(){$('#settings').classList.remove('on');save();chips()}
$('#setBody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const sg=b.closest('.seg');
  if(sg){const k=sg.dataset.k;const v=b.dataset.v;S[k]=(k==='reveal')?v:Number(v)}
  else if(b.dataset.sw){S[b.dataset.sw]=!S[b.dataset.sw]}
  else if(b.dataset.t){const t=b.dataset.t;const i=S.topics.indexOf(t);if(i>=0){if(S.topics.length>1)S.topics.splice(i,1)}else S.topics.push(t)}
  else if(b.dataset.all!==undefined){S.topics=b.dataset.all==='1'?ALL.slice():[S.topics[0]||ALL[0]]}
  else return;
  save();renderSettings()});
$('#setBtn').onclick=openSettings;$('#enSet').onclick=openSettings;
$('#setDone').onclick=closeSettings;$('#setClose').onclick=closeSettings;

/* ===================== BUILD A ROUND ===================== */
let run={list:[],i:0};
function buildList(){
  let seen=new Set(LS.get('lom_sfmq_seen',[]));
  const pool=Q.filter(q=>S.topics.includes(q.t));
  if(pool.every(q=>seen.has(q.id)))pool.forEach(q=>seen.delete(q.id));
  const buckets=shuffle(S.topics).map(t=>{const p=Q.filter(q=>q.t===t);return shuffle(p.filter(q=>!seen.has(q.id))).concat(shuffle(p.filter(q=>seen.has(q.id))))});
  const picked=[];let k=0;
  const want=Math.min(S.n,pool.length);
  while(picked.length<want){const b=buckets[k%buckets.length];if(b.length)picked.push(b.shift());k++;if(k>5000)break}
  picked.forEach(q=>seen.add(q.id));LS.set('lom_sfmq_seen',[...seen].slice(-400));
  return shuffle(picked).map(q=>({q,opts:shuffle(q.o)}))}

/* ===================== RENDER A QUESTION ===================== */
function sizeCls(t){return t.length>105?'l':t.length>62?'m':''}
function qMarkup(it,n,o){ // o:{reveal,showAns}
  const q=it.q,dg=DG[q.id]?DG[q.id]():'';
  const mc=S.mc;
  let right='';
  if(mc){
    right=`<div class="opts">${it.opts.map((op,i)=>{
      let cls='opt';if(o.reveal)cls+=op.c?' correct':' dim';
      const why=(o.reveal&&!op.c&&S.why&&op.w)?`<span class="why">${fmt(op.w)}</span>`:'';
      return `<div class="${cls}"><span class="let">${'ABCD'[i]}</span><span class="ot">${fmt(op.t)}${why}</span></div>`}).join('')}</div>`;
  }else if(o.review){
    const c=it.opts.find(x=>x.c);
    right=`<div class="ansbox${o.reveal?' rev':''}"><span class="lab">${o.reveal?'The answer is':'Answer'}</span><span class="big">${o.reveal?fmt(c.t):'?'}</span></div>`;
  }else{
    right=dg?'':`<div class="nomcbox"><span class="hint">Work it out and write your answer down ✏️</span></div>`;
  }
  const hasdg=!!dg;
  const showRow=mc||o.review||hasdg||true;
  return `<div class="qcard"><div class="qnum">${n}</div><div class="qtext ${sizeCls(q.q)}">${fmt(q.q)}</div></div>
   <div class="row${hasdg?' hasdg':''}">${hasdg?`<div class="dg">${dg}</div>`:''}${(!mc&&!o.review&&hasdg)?'':right}</div>`}

/* ===================== QUIZ RUN ===================== */
let T={left:0,active:false,paused:false,last:0,lastShown:-1};
function startRound(){
  closeSettings&&0;
  run.list=buildList();run.i=0;
  if(!run.list.length)return;
  show('quiz');$('#qbody').innerHTML='';$('#qbody').className='qbody'+(S.mc?'':' nomc');
  doCountdown(()=>showQ(0))}
function doCountdown(cb){
  const ov=$('#count'),num=$('#countNum');ov.classList.add('on');let n=3;
  const step=()=>{if(!ov.classList.contains('on'))return;num.textContent=n>0?n:'GO!';num.style.animation='none';void num.offsetWidth;num.style.animation='';beep(n>0?520:880,.18,.07);
    if(n<0){ov.classList.remove('on');cb();return}n--;setTimeout(step,n<0?650:900)};
  step()}
function showQ(i){
  run.i=i;const it=run.list[i];
  $('#qCount').textContent=`Question ${i+1} of ${run.list.length}`;$('#qTopic').textContent=TNAME[it.q.t];
  $('#qbody').className='qbody'+(S.mc?'':' nomc');
  $('#qbody').innerHTML=qMarkup(it,i+1,{reveal:false});
  $('#skipBtn').textContent=i===run.list.length-1?'Finish ➜':'Next question ➜';
  const timed=S.time>0;
  $('#barWrap').style.visibility=timed?'visible':'hidden';$('#timer').style.display=timed?'flex':'none';$('#pauseBtn').style.display=timed?'inline-flex':'none';
  if(timed){T.left=S.time;T.paused=false;T.active=true;T.last=performance.now();T.lastShown=-1;paint();requestAnimationFrame(frame)}else T.active=false}
function paint(){
  const s=Math.max(0,Math.ceil(T.left-1e-6));
  $('#timer').textContent=s;
  $('#bar').style.transform=`scaleX(${Math.max(0,T.left/S.time)})`;
  const low=T.left<=5&&S.time>=10||T.left<=3;
  $('#timer').classList.toggle('low',low);$('#bar').classList.toggle('low',low&&T.left<=3);
  if(s!==T.lastShown){if(T.lastShown!==-1&&s<=3&&s>0)beep(880,.08,.05);T.lastShown=s}}
function frame(now){
  if(!T.active||cur!=='quiz')return;
  if(!T.paused){T.left-=Math.min(.25,(now-T.last)/1000);}
  T.last=now;paint();
  if(T.left<=0){T.active=false;beep(520,.25,.07);advance();return}
  requestAnimationFrame(frame)}
function advance(){
  T.active=false;
  if(run.i<run.list.length-1)showQ(run.i+1);else{show('interlude');beep(660,.4,.07)}}
function setPause(p){if(!T.active)return;T.paused=p;$('#pause').classList.toggle('on',p);$('#pauseBtn').textContent=p?'▶':'❚❚'}
$('#pauseBtn').onclick=()=>setPause(!T.paused);
$('#pause').onclick=()=>setPause(false);
$('#skipBtn').onclick=advance;
function toHome(){T.active=false;$('#pause').classList.remove('on');$('#count').classList.remove('on');chips();show('title')}
$('#homeBtn').onclick=toHome;$('#rHome').onclick=toHome;$('#shHome').onclick=toHome;$('#enHome').onclick=toHome;
$('#goBtn').onclick=startRound;$('#enAgain').onclick=startRound;$('#shAgain').onclick=startRound;

/* ===================== REVIEW ===================== */
let rv={i:0,shown:false};
$('#revealGo').onclick=()=>{S.reveal==='all'?openSheet():openReview()};
function openReview(){rv.i=0;rv.shown=false;show('review');drawReview()}
function drawReview(){
  const it=run.list[rv.i];
  $('#rCount').textContent=`Answer ${rv.i+1} of ${run.list.length}`;$('#rTopic').textContent=TNAME[it.q.t];
  $('#rbody').className='qbody'+(S.mc?'':' nomc');
  $('#rbody').innerHTML=qMarkup(it,rv.i+1,{reveal:rv.shown,review:true});
  const last=rv.i===run.list.length-1;
  $('#rMain').textContent=rv.shown?(last?'Finish ✓':'Next question ➜'):'Reveal answer';
  $('#rBack').style.visibility=(rv.i>0||rv.shown)?'visible':'hidden'}
function rMain(){if(!rv.shown){rv.shown=true;drawReview();return}
  if(rv.i<run.list.length-1){rv.i++;rv.shown=false;drawReview()}else show('end')}
function rBack(){if(rv.shown){rv.shown=false;drawReview()}else if(rv.i>0){rv.i--;rv.shown=true;drawReview()}}
$('#rMain').onclick=rMain;$('#rBack').onclick=rBack;

/* ===================== SHEET ===================== */
function openSheet(){
  $('#sheetGrid').innerHTML=run.list.map((it,i)=>{
    const dg=DG[it.q.id]?DG[it.q.id]():'';
    let body='';
    if(S.mc)body=it.opts.map((op,k)=>`<div class="o${op.c?' c':''}"><span class="let">${'ABCD'[k]}</span><span>${fmt(op.t)}${(!op.c&&S.why&&op.w)?`<span class="why">${fmt(op.w)}</span>`:''}</span></div>`).join('');
    else body=`<div class="ansonly"><small>Answer</small>${fmt(it.opts.find(x=>x.c).t)}</div>`;
    return `<div class="sc"><div class="top"><div class="n">${i+1}</div><div class="q">${fmt(it.q.q)}</div></div>${dg?`<div class="sdg">${dg}</div>`:''}${body}</div>`}).join('');
  show('sheet');$('#sheetGrid').scrollTop=0}

/* ===================== KEYS ===================== */
document.addEventListener('keydown',e=>{
  if($('#settings').classList.contains('on')){if(e.key==='Escape')closeSettings();return}
  if(cur==='title'&&(e.key==='Enter')){startRound();return}
  if(cur==='quiz'){
    if(e.key===' '){e.preventDefault();if(T.active)setPause(!T.paused)}
    else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if(!T.paused)advance()}
    else if(e.key==='Escape')toHome()}
  else if(cur==='review'){
    if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();rMain()}
    else if(e.key==='ArrowLeft'){e.preventDefault();rBack()}}
  else if(cur==='interlude'&&(e.key===' '||e.key==='Enter')){e.preventDefault();$('#revealGo').click()}
});

buildTitle();chips();
</script>
</body>
