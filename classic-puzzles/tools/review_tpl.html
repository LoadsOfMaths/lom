<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchstick puzzles: candidates to review</title>
<style>
:root{--bg:#f6f3ec;--ink:#1f2a37;--mut:#6b7280;--acc:#1b6ca8;--ok:#2e9e5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1.05rem;margin:0 8px 0 0}
button{font:inherit;padding:7px 12px;border:1px solid #b8c2cc;border-radius:8px;background:#fff;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#count{margin-left:auto;font-weight:600}
.tg{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}.sw.sm{width:42px;height:24px;flex:none}.sw.sm span:before{width:18px;height:18px;left:3px;top:3px}.sw.sm input:checked+span:before{transform:translateX(18px)}
.filters{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.filters button.on{background:#e8f1f8;border-color:var(--acc)}
.legend{font-size:.85rem;color:var(--mut);padding:8px 14px}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;vertical-align:middle;margin:0 4px 0 8px}
main{padding:8px 10px 60px;max-width:1150px;margin:auto}
.row{display:grid;grid-template-columns:62px 1fr 1.1fr 1fr 70px;gap:10px;align-items:center;background:#fff;border:1px solid #e1dccf;border-radius:12px;padding:8px 10px;margin:8px 0}
.row.sel{border-color:var(--ok);box-shadow:0 0 0 2px #2e9e5b33}
.id{font-weight:700;color:var(--acc)}.id small{display:block;color:var(--mut);font-weight:400;font-size:.75rem}
.pic{display:flex;justify-content:center}.pic svg{max-width:100%;height:auto}
.txt p{margin:0 0 4px}.meta{color:var(--mut);font-size:.85rem}
.sw{justify-self:end;position:relative;width:54px;height:30px}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw span{position:absolute;inset:0;background:#c9d1d9;border-radius:30px;transition:.15s}
.sw span:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px #0004}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{transform:translateX(24px)}
@media(max-width:760px){.row{grid-template-columns:1fr 1fr;grid-template-areas:"id sw" "a a" "t t" "b b"}
 .row .id{grid-area:id}.row .sw{grid-area:sw}.row .pic:nth-of-type(1){grid-area:a}.row .txt{grid-area:t}.row .pic.sol{grid-area:b}}
</style></head><body>
<header><h1>Candidates (%%N%%)</h1>
<button id="all">Select all</button><button id="none">Select none</button>
<button class="pri" id="copy">Copy chosen IDs</button><button id="dl">Download chosen (JSON)</button>
<label class="tg"><span class="sw sm"><input type="checkbox" id="notilt"><span></span></span> Hide puzzles that start with a tilted square</label>
<span id="count"></span>
<div class="filters" id="filters"></div></header>
<div class="legend">Left: the starting picture. Middle: the instructions. Right: one answer — <i style="background:#2e9e5b"></i>new match, <i style="background:repeating-linear-gradient(90deg,#c0392b 0 4px,transparent 4px 8px)"></i>match taken away.</div>
<main id="rows">
%%ROWS%%
</main>
<script>
(function(){
var rows=[].slice.call(document.querySelectorAll('.row'));
var KEY='matchCandidatesChosen';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function chosen(){return rows.filter(function(r){return r.querySelector('input').checked}).map(function(r){return r.dataset.id})}
function refresh(){var c=chosen();rows.forEach(function(r){r.classList.toggle('sel',r.querySelector('input').checked)});
 var vis=rows.filter(function(r){return r.style.display!=='none'}).length;document.getElementById('count').textContent=c.length+' chosen · showing '+vis+' of '+rows.length;save(c)}
var saved=load();rows.forEach(function(r){r.querySelector('input').checked=saved.indexOf(r.dataset.id)>=0;r.querySelector('input').addEventListener('change',refresh)});
document.getElementById('all').onclick=function(){rows.forEach(function(r){if(r.style.display!=='none')r.querySelector('input').checked=true});refresh()};
document.getElementById('none').onclick=function(){rows.forEach(function(r){if(r.style.display!=='none')r.querySelector('input').checked=false});refresh()};
document.getElementById('copy').onclick=function(){var t=chosen().join(', ');var b=this;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy chosen IDs'},1500)})};
document.getElementById('dl').onclick=function(){var blob=new Blob([JSON.stringify({chosen:chosen()},null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chosen-puzzles.json';a.click()};
var types={};rows.forEach(function(r){var s=r.querySelector('.id small').textContent;types[s]=1});
var f=document.getElementById('filters');var cur='';var nt=document.getElementById('notilt');
function apply(){var shown=0;rows.forEach(function(r){var ok=(!cur||r.querySelector('.id small').textContent===cur)&&!(nt.checked&&r.dataset.tilt==='1');r.style.display=ok?'':'none';if(ok)shown++});
 document.getElementById('count').dataset.shown=shown;refresh()}
nt.addEventListener('change',apply);
['All'].concat(Object.keys(types)).forEach(function(n){var b=document.createElement('button');b.textContent=n==='All'?'All lattices':({R22:'Square 2×2',R32:'Square 3×2',R33:'Square 3×3',T2:'Triangle 2',T3:'Triangle 3'}[n]||n);if(n==='All')b.className='on';
 b.onclick=function(){cur=n==='All'?'':n;[].forEach.call(f.children,function(x){x.classList.remove('on')});b.classList.add('on');apply()};f.appendChild(b)});
refresh();
})();
</script></body></html>
