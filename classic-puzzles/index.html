<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classic Puzzles and Investigations – LoadsOfMaths</title>
<style>
:root{
  --bg:#0e2339; --card:#1b3d61; --line:#2f628f; --ink:#f3f7fb; --mute:#a9bdd3;
  --accent:#ffb84d; --good:#46d08a; --bad:#ff7a7a; --water:#2f7fb8; --tea:#c47a2c;
  --grass:#2b6a45; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:clamp(16px,0.9vw + 11px,22px);-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:1.7rem;margin:.2em 0 .1em}
h2{font-size:1.15rem;margin:1.4em 0 .5em;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
p{line-height:1.45}
.tag{color:var(--mute);margin:0 0 .6em}
.foot{margin-top:2.5em;color:var(--mute);font-size:.8rem;text-align:center}

/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:var(--r);
  background:var(--card);border:2px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;min-height:112px}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card .ic{font-size:2rem;line-height:1}
.card .tt{font-weight:700;font-size:1.05rem}
.card .bl{color:var(--mute);font-size:.85rem;line-height:1.3}
.card.soon{opacity:.5;border-style:dashed;cursor:default}
.card.soon:hover{border-color:var(--line)}
.card .soonTag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}

/* shell */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{margin:0;flex:1 1 auto}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#2a1a00}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:transparent;
  color:var(--ink);font:inherit;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#2a1a00;font-weight:700}
.brief{margin:.6em 0;color:#dbe7f3}
.stage{background:rgba(255,255,255,.04);border-radius:var(--r);padding:10px;margin:8px 0}
.msg{min-height:3.1em;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;align-items:center}
.msg.good{background:rgba(70,208,138,.18);color:#bff3d8}
.msg.bad{background:rgba(255,122,122,.18);color:#ffd0d0}
.msg.info{background:rgba(255,184,77,.14);color:#ffe4b8}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.score{margin-left:auto;font-weight:700;font-size:1.1rem;color:var(--accent)}
details.maths{margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 16px}
details.maths summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
details.maths[hidden]{display:none}

/* jugs */
.jugs{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,4vw,52px);padding:14px 6px;min-height:340px}
.jugcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.jugcap{font-weight:700}
.jug{position:relative;width:clamp(78px,19vw,128px);border:4px solid #dfe9f3;border-radius:6px 6px 20px 20px;
  background:rgba(255,255,255,.07);overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
  transition:box-shadow .15s,transform .15s}
.jug.sel{box-shadow:0 0 0 4px var(--accent);transform:translateY(-6px)}
.jug.lift{transform:translateY(-10px) scale(1.03)}
.jug.hint-from{box-shadow:0 0 0 4px var(--good)}
.jug.hint-to{box-shadow:0 0 0 4px #7ab7ff}
.liquid{position:absolute;left:0;right:0;bottom:0;background:var(--tea);transition:height .55s ease}
.ticks{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--u) - 2px),rgba(255,255,255,.35) calc(var(--u) - 2px),rgba(255,255,255,.35) var(--u))}
.amt{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:800;font-size:1.2rem;z-index:3;text-shadow:0 1px 3px #000}
.jugbtns{display:flex;gap:6px}
.mini{min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.mini.hint{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}

/* crossing */
.cross{display:grid;grid-template-columns:1fr minmax(210px,34%) 1fr;gap:10px;align-items:stretch}
.bank{background:var(--grass);border-radius:var(--r);padding:10px;min-height:190px}
.bank h3{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#cfe9d8;text-align:center}
.bank .items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.river{position:relative;background:var(--water);border-radius:var(--r);overflow:hidden;height:210px}
.river::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(255,255,255,.08) 22px 26px)}
.boat{position:absolute;top:50px;left:6px;width:132px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:left .65s ease,top .65s ease;cursor:pointer;touch-action:manipulation}
.boat[data-side="1"]{left:calc(100% - 138px)}
.boat .deck{display:flex;gap:2px;min-height:48px;align-items:flex-end;justify-content:center;flex-wrap:nowrap}
.boat .hull{width:100%;height:26px;background:#8b5a2b;border-radius:4px 4px 28px 28px;border:2px solid #5a3612}
.boat .go{font-size:.78rem;font-weight:700;background:rgba(0,0,0,.35);border-radius:8px;padding:2px 8px;margin-top:2px}
.boat.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:0;min-width:64px;padding:6px 8px;border-radius:12px;
  border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation}
.tile .emo{font-size:2rem;line-height:1.1}
.tile .nm{font-size:.72rem}
.tile .tm{font-size:.78rem;font-weight:800;color:var(--accent)}
.tile.small{min-width:0;padding:2px 3px;border-color:transparent;background:rgba(0,0,0,.2)}
.tile.small .emo{font-size:1.6rem}
.tile.fixed{cursor:default}
.tile.hint,.boat.hint .hull{box-shadow:0 0 0 3px var(--good)}
.scene-bridge .river{background:linear-gradient(#26384a,#0c1722)}
.scene-bridge .river::before{background:none}
.scene-bridge .boat .hull{height:8px;border-radius:2px;background:#a8814a;border:0}
.scene-bridge .bank{background:#4a3f33}
.scene-bridge .bank h3{color:#e6d6bf}
@media (max-width:700px){
  .cross{grid-template-columns:1fr;grid-template-rows:auto 150px auto}
  .river{height:150px}
  .boat,.boat[data-side="1"]{left:calc(50% - 66px)}
  .boat{top:6px}
  .boat[data-side="1"]{top:calc(100% - 104px)}
  }

/* picker + new puzzles */
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.pick[hidden]{display:none}
.pickLbl{font-weight:700;min-width:7.5em;text-align:center}
table.mt{border-collapse:collapse;margin:8px 0}
table.mt th,table.mt td{border:1px solid var(--line);padding:4px 12px;text-align:center}
.swapleg{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;max-width:760px;margin:4px auto}
.swaprow{position:relative;max-width:760px;margin:6px auto 10px}
.swaprow .cells{display:flex}
.scell{flex:1 1 0;aspect-ratio:1/1;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.scoin{position:absolute;top:0;width:var(--w);aspect-ratio:1/1;padding:0;border:0;background:none;cursor:pointer;
  transition:left .4s ease;font:inherit;font-weight:800;font-size:clamp(.6rem,2.2vw,1.05rem);border-radius:50%}
.scoin::after{content:"";position:absolute;inset:8%;border-radius:50%;z-index:-1}
.scoin{z-index:1;color:#1a1208}
.scoin.cu::after{background:radial-gradient(circle at 35% 30%,#f0a672,#b4622c 70%);border:3px solid #7a3d14}
.scoin.ag::after{background:radial-gradient(circle at 35% 30%,#fafcff,#aab4c0 70%);border:3px solid #6d7783}
.scoin.hint::after{box-shadow:0 0 0 4px var(--good)}
.scoin:focus-visible::after{box-shadow:0 0 0 4px var(--accent)}

.balance{position:relative;height:210px;max-width:760px;margin:6px auto}
.balance .post{position:absolute;left:calc(50% - 5px);top:44px;width:10px;bottom:0;background:#6b5a46;border-radius:5px 5px 0 0}
.balance .beam{position:absolute;left:8%;right:8%;top:36px;height:10px;background:#a8814a;border-radius:5px;transition:transform .8s ease}
.balance[data-tilt="-1"] .beam{transform:rotate(-5deg)}
.balance[data-tilt="1"] .beam{transform:rotate(5deg)}
.pan{position:absolute;top:70px;width:40%;min-height:112px;border:3px solid #a8814a;border-top-width:0;border-radius:0 0 40px 40px;
  background:rgba(255,255,255,.05);padding:6px 8px 12px;transition:transform .8s ease}
.balance .pl{left:2%}
.balance .pr{right:2%}
.balance[data-tilt="-1"] .pl{transform:translateY(16px)}
.balance[data-tilt="-1"] .pr{transform:translateY(-16px)}
.balance[data-tilt="1"] .pl{transform:translateY(-16px)}
.balance[data-tilt="1"] .pr{transform:translateY(16px)}
.panLabel{text-align:center;font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.items,.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tray{min-height:58px;padding:8px;background:rgba(255,255,255,.05);border-radius:var(--r);margin-bottom:8px}
.trayLabel{font-size:.8rem;color:var(--mute);margin:4px 2px}
.coin{width:46px;height:46px;border-radius:50%;border:3px solid #8a6a1c;background:radial-gradient(circle at 35% 30%,#ffe18a,#d9a21f 70%);
  color:#3a2a00;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}
.coin.hintc{box-shadow:0 0 0 4px var(--good)}
.coin.pick{box-shadow:0 0 0 4px var(--accent)}
.coin.fake{box-shadow:0 0 0 5px var(--bad)}
.guessRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.guessRow[hidden]{display:none}
.wlog{margin:4px 0 0;padding-left:1.4em;line-height:1.7}
.logBox{margin-top:6px}

svg.matches{display:block;width:100%;max-width:820px;margin:10px auto}
.matches .ghost{stroke:rgba(255,255,255,.12);stroke-width:6;stroke-dasharray:3 8;stroke-linecap:round;fill:none}
.matches .wood{stroke:#e3b778;stroke-width:8;stroke-linecap:round;display:none}
.matches .head{fill:#c0392b;stroke:#5c1a12;stroke-width:1.5;display:none}
.matches .hit{stroke:transparent;stroke-width:26;stroke-linecap:round;cursor:pointer}
.matches .slot.on .wood,.matches .slot.on .head{display:block}
.matches .slot.on .ghost{display:none}
.matches .slot.lift .wood{stroke:#fff0b8;filter:drop-shadow(0 0 6px #ffcf5a)}
.matches .carrying .slot.empty .ghost{stroke:rgba(255,255,255,.6)}
.matches .slot.hintFrom .wood{stroke:var(--good)}
.matches .slot.hintTo .ghost{stroke:var(--good);stroke-width:8;stroke-dasharray:none}

.tabs{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.tab{min-height:48px;padding:0 26px;border:2px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#2a1a00}
.shWrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
.shBoard{flex:1 1 300px;min-width:0}
.shCount{text-align:center;min-height:1.6em;margin:2px 0 0;color:#dbe7f3}
.shCount .warn{color:var(--bad);font-weight:600}
svg.matches.shape{margin:4px auto}
.matches.shape .ghost{stroke:rgba(255,255,255,.07);stroke-width:3}
.matches.shape.carrying .slot.empty .ghost{stroke:rgba(255,255,255,.55);stroke-width:5}
.matches .node{fill:rgba(255,255,255,.16)}
.goalBox{flex:0 0 auto;text-align:center;background:rgba(255,255,255,.05);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.goalLbl{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:#9fb3c8;margin-bottom:4px}
svg.goalSvg{display:block;margin:0 auto}
.goalSvg .gw{stroke:#e3b778;stroke-width:5;stroke-linecap:round}
.goalSvg .gh{fill:#c0392b}
svg.kt{display:block;width:100%;max-width:520px;margin:0 auto;touch-action:manipulation;user-select:none}
.kt .sq{cursor:pointer}.kt .lt{fill:#e8d9b5}.kt .dk{fill:#9a6b3f}
.kt .vis{fill:rgba(70,208,138,.35);pointer-events:none}
.kt .num{font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#0b2a1a;pointer-events:none}
.kt .path{fill:none;stroke:#1b8a55;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:.8}
.kt .closing{fill:none;stroke:#1b8a55;stroke-width:4;stroke-dasharray:3 9;stroke-linecap:round;pointer-events:none}
.kt .dot{fill:rgba(255,184,77,.95);stroke:#7a4a00;stroke-width:2;pointer-events:none}
.kt .knight{font-size:46px;text-anchor:middle;dominant-baseline:central;fill:#101820;stroke:#fff;stroke-width:1.2px;paint-order:stroke;pointer-events:none;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.kt .ring{fill:none;stroke:var(--good);stroke-width:5;pointer-events:none}
.kt .lab{font-size:13px;fill:var(--mute);pointer-events:none}
.ktWrap{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:center}
.ktBoard{flex:1 1 360px;max-width:540px}
.ktSide{flex:1 1 170px;max-width:260px;min-width:150px}
.ktSide h3{margin:0 0 6px;font-size:.9rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.ktList{display:flex;flex-wrap:wrap;gap:4px 6px;max-height:430px;overflow:auto;font-size:.95rem;line-height:1.25}
.ktList span{background:rgba(255,255,255,.07);border-radius:6px;padding:2px 6px}
.ktList span.now{background:var(--accent);color:#1a1200;font-weight:700}
.ktList small{color:var(--mute);margin-right:3px}.ktList span.now small{color:#4a3500}
svg.cs{display:block;width:100%;margin:8px auto;touch-action:manipulation;user-select:none}
.cs .bg{fill:rgba(255,255,255,.05)}
.cs .out{fill:none;stroke:#b8c4d0;stroke-width:3.5;stroke-linecap:round}
.cs .tube{cursor:pointer;transition:transform .12s}
.cs .tube.sel .out{stroke:#fff}
.cs .tube.fin .out{stroke:var(--good)}
.cs .tube.hA .out{stroke:var(--good);stroke-width:6}
.cs .tube.hB .out{stroke:var(--accent);stroke-width:6}
.cs .tn{font-size:13px;fill:var(--mute);pointer-events:none}
.cs .stream{stroke-width:8;stroke-linecap:round;pointer-events:none}
.cs .seg{stroke:none}
svg.mc{display:block;width:100%;max-width:520px;margin:8px auto;touch-action:manipulation;user-select:none}
.mc .sq{cursor:pointer}.mc .lt{fill:#e8d9b5}.mc .dk{fill:#9a6b3f}.mc .hole{fill:#0e2339;cursor:default}
.mc .db{fill:rgba(255,255,255,.28);stroke:#12263b;stroke-width:3.5;cursor:pointer}
.mc .dl{stroke:#12263b;stroke-width:3;stroke-linecap:round;pointer-events:none}
.mc .dom{cursor:pointer}
.mc .selr{fill:none;stroke:var(--accent);stroke-width:5;pointer-events:none}
.mc .hintr{fill:none;stroke:var(--good);stroke-width:5;pointer-events:none}
.mc .leftr{fill:rgba(255,80,80,.25);stroke:#ff5252;stroke-width:5;pointer-events:none}
.mc .lab{font-size:13px;fill:var(--mute);pointer-events:none}
.ct{display:block;width:100%;margin:8px auto;touch-action:manipulation;user-select:none}
.ct .stick{fill:#f6f3ec;stroke:#cfc8b8;stroke-width:1}
.ct .cl{font-size:20px;fill:var(--mute);font-weight:700}
.ct .fo{fill:#ff8a00}.ct .fi{fill:#ffe45c}
.ct .flame path{transform-box:fill-box;transform-origin:50% 100%;animation:ctf .35s ease-in-out infinite alternate}
@keyframes ctf{from{transform:scale(1,1)}to{transform:scale(.86,1.1)}}
.ct .ehit{cursor:pointer}
.ct .hold{font-size:18px;fill:var(--accent)}
.ctBar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.ctStatus{text-align:center;color:var(--mute);font-size:.9rem;margin-bottom:4px}
.hn{display:flex;justify-content:center;gap:clamp(8px,3vw,36px);padding:14px 6px 6px;max-width:760px;margin:0 auto}
.hcol{position:relative;flex:1;height:var(--hp);display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:16px;cursor:pointer;border-radius:12px 12px 0 0}
.hcol::before{content:"";position:absolute;bottom:16px;left:50%;width:14px;height:calc(100% - 20px);transform:translateX(-50%);background:linear-gradient(90deg,#8a5a2b,#b07a3d,#8a5a2b);border-radius:7px 7px 0 0}
.hcol::after{content:"";position:absolute;bottom:0;left:0;right:0;height:16px;background:linear-gradient(#b9833f,#7a4e22);border-radius:8px;box-shadow:0 5px 8px rgba(0,0,0,.4)}
.hcol.goal{background:linear-gradient(rgba(70,208,138,0),rgba(70,208,138,.18));outline:3px dashed var(--good);outline-offset:-3px}
.hcol.sel{background:rgba(255,184,77,.14)}
.hcol.hint-from{box-shadow:inset 0 0 0 4px var(--good)}
.hcol.hint-to{box-shadow:inset 0 0 0 4px #7ab7ff}
.hcol.shake{animation:hshake .3s}
@keyframes hshake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.hflag{position:absolute;top:-4px;left:50%;transform:translateX(-50%);background:var(--good);color:#06301a;font-weight:700;padding:2px 12px;border-radius:12px;font-size:.8rem;z-index:5;display:none}
.hcol.goal .hflag{display:block}
.hdisk{position:relative;z-index:2;height:var(--dh);border-radius:calc(var(--dh)/2);margin-top:2px;display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(0,0,0,.65);font-size:calc(var(--dh)*.55);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.3),0 3px 5px rgba(0,0,0,.35);transition:transform .15s}
.hdisk.lift{transform:translateY(calc(var(--dh)*-.7));box-shadow:0 0 0 4px #fff,0 0 20px 5px var(--accent)}
.pg{max-width:560px;margin:0 auto;padding:6px}
.pgcount{text-align:center;color:var(--muted,#9fb3c8);margin-bottom:4px;font-size:1.05rem}
.pgcount strong{color:var(--accent);font-size:1.3rem}
svg.pgs{width:100%;max-height:62vh;display:block;touch-action:manipulation}
.pgbd{fill:#6b4423}
.pgh{fill:#2c1a0c;stroke:#1a0e05;stroke-width:2}
.pgp{fill:#e9a63a;stroke:#9a5f10;stroke-width:2}
.pgsh{fill:rgba(255,255,255,.55)}
.pgz{fill:transparent;cursor:pointer}
.pgc.sel .pgp{fill:#ffd36b;stroke:#fff;stroke-width:4}
.pgc.tg .pgh{stroke:var(--good);stroke-width:5;stroke-dasharray:7 5}
.pgc.hf .pgp{stroke:var(--good);stroke-width:5}
.pgc.ht .pgh{stroke:#7ab7ff;stroke-width:5}
.pgfl{fill:#ffd36b;opacity:.7;font-size:22px;text-anchor:middle}
svg.chess{display:block;width:100%;max-width:520px;margin:8px auto;touch-action:manipulation;user-select:none}
.chess .sq{cursor:pointer}
.chess .lt{fill:#e8d9b5}.chess .dk{fill:#9a6b3f}
.chess .att{fill:rgba(220,70,70,.38);pointer-events:none}
.chess .pc{font-size:46px;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#101820;stroke:#fff;stroke-width:1.2px;paint-order:stroke;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.chess .pc.bad{fill:#b3201a}
.chess .cl{stroke:#d22a2a;stroke-width:5;stroke-linecap:round;opacity:.85;pointer-events:none}
.chess .ring{fill:none;stroke:var(--good);stroke-width:5;pointer-events:none}
.chess .lab{font-size:13px;fill:var(--mute);opacity:1;pointer-events:none}
.chessOpt{display:flex;justify-content:center;margin:2px 0 6px}
svg.plus{display:block;width:100%;margin:6px auto;touch-action:none}
.plus .stick{fill:#e3b778;stroke:#a87b3a;stroke-width:1.5}
.plus .ph{fill:#c0392b;stroke:#5c1a12;stroke-width:1.5}
.plus .pm{cursor:grab}
.plus .pm.grab{cursor:grabbing}
.plus .pm.grab .stick{fill:#fff0b8}
.plus .sline{stroke:#e3b778;stroke-width:11;stroke-linecap:round}
.plus .sline.back{stroke:#9a7a48;stroke-dasharray:2 14;stroke-width:9}
.cherry .stick{fill:#ffc04d;stroke:#2a1a00;stroke-width:1.5}
.cherry .phead{fill:#111;stroke:none}
.cherry .cball{fill:#d22a2a;stroke:#2a0a0a;stroke-width:4}
.cherry .cshine{fill:rgba(255,255,255,.55)}
.cherry .cstalk{fill:none;stroke:#4a8a3a;stroke-width:5;stroke-linecap:round}
.plus .hole{fill:rgba(70,208,138,.45);stroke:var(--good);stroke-width:2}

svg.carpark{display:block;width:100%;margin:8px auto;touch-action:none}
.carpark .cpFloor{fill:#2c3541}
.carpark .cpBay{stroke:rgba(255,255,255,.08);stroke-width:2;stroke-dasharray:10 8}
.carpark .cpWall{stroke:#9fb3c8;stroke-width:6;stroke-linecap:round}
.carpark .cpExit{fill:var(--good);font-weight:700;font-size:15px}
.carpark .veh{cursor:grab}
.carpark .veh.grab{cursor:grabbing}
.carpark .vwin{fill:rgba(20,30,45,.55)}
.carpark .vgloss{fill:none;stroke:rgba(0,0,0,.35);stroke-width:2}
.carpark .veh.hint .vgloss{stroke:var(--good);stroke-width:5}
.carpark .veh.target .vgloss{stroke:#fff;stroke-width:3}
.carpark .cpGhost{fill:rgba(70,208,138,.22);stroke:var(--good);stroke-width:3;stroke-dasharray:8 6;pointer-events:none}
/* ===CSS:stamps=== */
.stPick{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin:4px 0 8px}
.stStep{display:flex;align-items:center;gap:6px}
.stStep b{min-width:2.4em;text-align:center;font-size:1.3rem}
.stStamps{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:6px 0}
/* perforated edge: a dotted border in the stamp colour, with the background stopping at the padding box */
.stamp{position:relative;width:98px;height:114px;border:8px dotted var(--sc);padding:0;background:var(--sc);background-clip:padding-box;color:#1b1206;font:inherit;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.35);touch-action:manipulation}
.stamp::before{content:"";position:absolute;inset:4px;border:3px solid rgba(255,255,255,.75);pointer-events:none}
.stamp .sv{position:absolute;left:0;right:0;top:28px;font-size:1.8rem;line-height:1}
.stamp .ss{position:absolute;left:0;right:0;top:10px;font-size:.9rem;opacity:.7}
.stamp .sa{position:absolute;left:0;right:0;bottom:8px;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase}
.stamp:active{transform:translateY(2px)}
.stamp:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.stEnv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#efe7d3;color:#2b2112;border-radius:12px;padding:8px 12px;margin:8px auto;max-width:760px;min-height:64px;border-bottom:6px solid #d6c9a6}
.stEnv .ev{font-size:1.6rem}
.stEnv .row{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 200px;min-height:36px;align-items:center}
.stMini{display:inline-flex;align-items:center;justify-content:center;width:36px;height:42px;background:var(--sc);font-weight:800;font-size:.8rem;color:#1b1206;box-shadow:0 1px 0 rgba(0,0,0,.35);outline:2px dotted rgba(255,255,255,.7);outline-offset:-4px}
.stTot{font-weight:800;font-size:1.25rem;white-space:nowrap}
.stGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;margin:8px 0}
.stCell{min-height:58px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;cursor:pointer;touch-action:manipulation}
.stCell b{font-size:1.1rem}
.stCell small{font-size:.62rem;color:var(--mute);line-height:1.1;text-align:center}
.stCell.yes{background:rgba(70,208,138,.28);border-color:var(--good)}
.stCell.yes2{background:rgba(70,208,138,.1);border-color:rgba(70,208,138,.5)}
.stCell.no{background:rgba(255,122,122,.2);border-color:var(--bad)}
.stCell.top{box-shadow:0 0 0 4px var(--accent)}
.stCell.hint{box-shadow:0 0 0 4px var(--good)}
.stCell.now{animation:stpop .5s}
@keyframes stpop{40%{transform:scale(1.18)}}
.stAns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:8px 0}
.stAns .lbl{font-weight:700}
/* ===/CSS:stamps=== */
/* ===CSS:consec=== */
.cnBuild{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin:6px 0}
.cnRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:56px;margin:6px 0}
.cnBlk{min-width:46px;height:46px;border-radius:8px;background:var(--accent);color:#2a1a00;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.15rem;padding:0 6px}
.cnPlus{color:var(--mute);font-weight:700}
.cnSum{font-weight:800;font-size:1.3rem;color:var(--ink);padding-left:6px}
.stCell.flag{border-style:dashed;border-color:var(--bad);background:rgba(255,122,122,.16)}
.stCell.w1{background:rgba(70,208,138,.25);border-color:var(--good)}
.stCell.w2{background:rgba(70,208,138,.4);border-color:var(--good)}
.stCell.w3{background:rgba(70,208,138,.6);border-color:var(--good)}
/* ===/CSS:consec=== */
/* ===CSS:hail=== */
.hsBtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.hsBtns .btn{min-width:130px;font-size:1.2rem;min-height:56px}
.hsBtns .btn.hint{box-shadow:0 0 0 4px var(--good)}
.hsNow{text-align:center;font-size:2.6rem;font-weight:800;color:var(--accent);margin:2px 0}
.hsSeq{display:flex;flex-wrap:wrap;gap:4px 6px;justify-content:center;align-items:center;max-height:210px;overflow:auto;padding:4px}
.hsSeq span{background:rgba(255,255,255,.08);border-radius:8px;padding:2px 8px;font-weight:700}
.hsSeq span.ev{background:rgba(111,181,255,.22)}
.hsSeq span.od{background:rgba(255,184,77,.28)}
.hsSeq i{color:var(--mute);font-style:normal}
svg.hsChart{display:block;width:100%;max-width:760px;margin:6px auto}
.hsChart .ax{stroke:var(--line);stroke-width:1}
.hsChart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.hsChart .lb{font-size:12px;fill:var(--mute)}
.hsInfo{text-align:center;color:#dbe7f3;min-height:1.6em}
.stCell.sel{box-shadow:0 0 0 4px var(--accent)}
/* ===/CSS:hail=== */
/* ===CSS:phi=== */
.stCell.pick{background:rgba(255,184,77,.3);border-color:var(--accent)}
.stCell.bad{background:rgba(255,122,122,.3);border-color:var(--bad)}
/* ===/CSS:phi=== */
/* ===CSS:tiles=== */
svg.tsWall{display:block;width:100%;max-width:640px;margin:6px auto;touch-action:manipulation;user-select:none}
.tsWall .tl{fill:#d9d2c0;stroke:#a89f88;stroke-width:1}
.tsWall .jn{fill:rgba(14,35,57,.35);stroke:rgba(14,35,57,.55);stroke-width:1.5;cursor:pointer}
.tsWall .jn.on{display:none}
.tsWall .sp{stroke-linecap:butt;pointer-events:none}
.tsWall .sc{stroke:#d1432e}
.tsWall .se{stroke:#1d6fa8}
.tsWall .hit{fill:transparent;cursor:pointer}
.tsWall .hint{fill:none;stroke:var(--good);stroke-width:4;pointer-events:none}
.tsCount{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-weight:700;margin:4px 0}
.tsCount .c1{color:#ff8f7d}.tsCount .c2{color:#7cc4f2}
.tsCmp{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:8px 0}
.tsCmp .stStep b{min-width:2.2em}
/* ===/CSS:tiles=== */
/* ===CSS:box=== */
.mbWrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.mbWrap svg{flex:1 1 300px;max-width:440px;min-width:240px;display:block}
.mbSl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:8px 0}
.mbSl input[type=range]{flex:1 1 260px;max-width:520px;height:34px;accent-color:var(--accent)}
.mbSl .rd{font-weight:800;font-size:1.2rem;min-width:7.5em;text-align:center}
.mbRead{text-align:center;min-height:1.7em;color:#dbe7f3}
.mbRead b{color:var(--accent)}
.mbG .ax{stroke:var(--line);stroke-width:1}
.mbG .tk{font-size:11px;fill:var(--mute)}
.mbG .pt{fill:var(--accent);stroke:#2a1a00;stroke-width:1}
.mbG .cv{fill:none;stroke:var(--good);stroke-width:2.5}
.mbG .pl{fill:none;stroke:rgba(255,184,77,.45);stroke-width:1.5}
.mbG .cur{fill:none;stroke:#fff;stroke-width:2}
.mbS .sh{fill:#d9c79a;stroke:#8a7440;stroke-width:1.5}
.mbS .cut{fill:#0e2339;stroke:#ff7a7a;stroke-width:1.5;stroke-dasharray:4 3}
.mbS .fd{fill:none;stroke:#8a7440;stroke-width:1;stroke-dasharray:3 3}
.mbS .f1{fill:#e8b86a;stroke:#6b4f1d;stroke-width:1.5}
.mbS .f2{fill:#c4934a;stroke:#6b4f1d;stroke-width:1.5}
.mbS .f3{fill:#8a6a2e;stroke:#6b4f1d;stroke-width:1.5}
.mbS .f4{fill:#a47d3a;stroke:#6b4f1d;stroke-width:1.5}
.mbS .tx{font-size:12px;fill:var(--ink)}
/* ===/CSS:box=== */
/* ===CSS:pick=== */
svg.pkG{display:block;width:100%;max-width:440px;margin:6px auto;touch-action:manipulation;user-select:none}
.pkWrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start}
.pkSide{flex:1 1 260px;max-width:440px}
.pkG .dot{fill:rgba(255,255,255,.55)}
.pkG .hit{fill:transparent;cursor:pointer}
.pkG .poly{fill:rgba(255,184,77,.22);stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.pkG .open{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pkG .bd{fill:var(--accent);stroke:#2a1a00;stroke-width:1.5}
.pkG .in{fill:var(--good);stroke:#06301a;stroke-width:1.5}
.pkG .st{fill:#fff;stroke:var(--accent);stroke-width:3}
.pkRead{text-align:center;font-size:1.05rem;min-height:3.2em;line-height:1.6}
.pkRead .b{color:var(--accent);font-weight:800}.pkRead .i{color:var(--good);font-weight:800}
.pkKey{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
/* ===/CSS:pick=== */
/* ===CSS:gold=== */
.gbSlots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font-size:1.5rem;font-weight:800;margin:6px 0}
.gbSlot{min-width:70px;min-height:56px;border-radius:12px;border:3px dashed var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-weight:800;font-size:1.5rem;cursor:pointer}
.gbSlot.full{border-style:solid;border-color:var(--accent)}
.gbSlot.good{border-color:var(--good);background:rgba(70,208,138,.25)}
.gbFound{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0;min-height:2.2em}
.gbFound span{background:rgba(70,208,138,.22);border:2px solid var(--good);border-radius:999px;padding:2px 12px;font-weight:700}
.gbC1{background:rgba(70,208,138,.14)}.gbC2{background:rgba(70,208,138,.28)}.gbC3{background:rgba(70,208,138,.45)}.gbC4{background:rgba(70,208,138,.65)}
/* ===/CSS:gold=== */
/* ===CSS:ctiles=== */
.ctWrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
.ctBoard{flex:0 1 330px;min-width:240px}
.ctColl{flex:1 1 300px;min-width:240px}
.ctPal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.ctSw{width:54px;height:54px;border-radius:12px;border:4px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.ctSw.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.ctGrid{display:grid;gap:3px;background:#0a1a2b;padding:3px;border-radius:10px;width:100%;max-width:300px;margin:6px auto;aspect-ratio:1/1}
.ctCell{border:0;border-radius:4px;cursor:pointer;padding:0;background:#3a4a5c;min-height:0}
.ctBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.ctBox{display:flex;flex-wrap:wrap;gap:8px;max-height:430px;overflow:auto;padding:6px;background:rgba(255,255,255,.04);border-radius:12px;min-height:80px}
.ctTh{position:relative;display:grid;gap:1px;background:#0a1a2b;padding:2px;border-radius:5px;width:var(--tw);height:var(--tw);cursor:pointer;border:2px solid transparent}
.ctTh i{display:block}
.ctTh.dup{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.ctTh.sel{border-color:#fff}
.ctTh b{position:absolute;right:-2px;bottom:-6px;font-size:.55rem;background:#0a1a2b;color:var(--mute);padding:0 3px;border-radius:5px;font-weight:600}
.ctOri{margin-top:8px;padding:8px;background:rgba(255,255,255,.05);border-radius:10px;color:var(--mute);font-size:.85rem}
.ctOri .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ctRule{color:var(--mute);font-size:.85rem;text-align:center;margin:2px 0}
/* ===/CSS:ctiles=== */
/* ===CSS:golomb=== */
svg.rlSvg{display:block;width:100%;margin:8px auto;touch-action:manipulation;user-select:none}
.rlSvg .body{fill:#e3c27a;stroke:#8a6a2e;stroke-width:2}
.rlSvg .tk{stroke:#6b4f1d;stroke-width:2}
.rlSvg .tk.on{stroke:#b3261e;stroke-width:5}
.rlSvg .nm{font-size:13px;fill:#3b2a0a;text-anchor:middle;font-weight:700;pointer-events:none}
.rlSvg .nm.on{fill:#b3261e;font-size:15px}
.rlSvg .hit{fill:transparent;cursor:pointer}
.rlSvg .hint{fill:none;stroke:var(--good);stroke-width:4;pointer-events:none}
.rlSvg .ar,.rlSvg .arl{pointer-events:none}
.rlSvg .ar{stroke:var(--accent);stroke-width:3}
.rlSvg .arl{font-size:13px;fill:var(--accent);text-anchor:middle;font-weight:700}
.rlLens{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.rlLens button{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;padding:0 6px}
.rlLens button.yes{background:rgba(70,208,138,.3);border-color:var(--good)}
.rlLens button.no{opacity:.75}
.rlLens button.dup{background:rgba(255,122,122,.3);border-color:var(--bad)}
.rlLens button.hint{box-shadow:0 0 0 4px var(--good)}
/* ===/CSS:golomb=== */
/* ===CSS:pcubes=== */
.pcWrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start}
.pcWrap>div{flex:1 1 280px;max-width:480px;text-align:center}
svg.pcSvg{display:block;width:100%;margin:4px auto;max-height:340px}
.pcSvg .fc{stroke:#0e2339;stroke-width:1.5}
.pcLay{display:grid;gap:3px;justify-content:center;margin:6px auto}
.pcLay i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#1b1206;border-radius:4px;background:#cdd9e6;width:var(--cs);height:var(--cs);font-size:calc(var(--cs)*.45)}
.pcLay i.c0{background:#dfe8f1;color:#4b5a6b}.pcLay i.c1{background:#f2d95c}.pcLay i.c2{background:#f2a24a}.pcLay i.c3{background:#e8604f}.pcLay i.c4{background:#b583e0}
.pcLay.plain i{background:#8fb8e0;color:transparent}
.pcKey{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:4px 0}
.pcKey span::before{content:"";display:inline-block;width:.9em;height:.9em;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--k)}
.pcInputs{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin:8px 0}
.pcInputs .stStep span{min-width:7em;text-align:right}
/* ===/CSS:pcubes=== */
/* ===CSS:pyth=== */
svg.pySvg{display:block;width:100%;margin:4px auto;max-height:340px}
.pySvg text{font-weight:800;fill:#0e2339;text-anchor:middle;dominant-baseline:middle}
.pyFound{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.pyFound span{background:#1b3a5c;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:800}
.pyCards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pyCard{flex:1 1 200px;max-width:260px;border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:center;cursor:pointer;background:#16283f;color:inherit;font:inherit}
.pyCard.on{border-color:#ffb84a;background:#2a3a52}
.pyCard.ok{border-color:#5ed08a}.pyCard.no{border-color:#e8604f}
.pyCard .dg{font-size:.85rem;color:var(--mute);min-height:2.4em}
/* ===/CSS:pyth=== */
/* ===CSS:happy=== */
.hpChain{margin:6px 0;line-height:1.7;font-size:1.05rem;text-align:left;display:inline-block}
.hpChain .hs{display:block}
.hpChain b{font-size:1.15em}
.hpChain .ok{color:#5ed08a;font-weight:800}
.hpChain .lp{color:#e8a05a;font-weight:800}
.hpBig{font-size:2.4rem;font-weight:800;text-align:center}
.hpRes{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:.95rem;margin-top:10px}
.hpRes div{background:#16283f;border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.hpNums{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.hpNums button{min-width:4.2em;font:inherit;font-size:1.5rem;font-weight:800;padding:12px 10px;border-radius:14px;border:2px solid var(--line);background:#16283f;color:inherit;cursor:pointer}
.hpNums button.on{border-color:#ffb84a;background:#2a3a52}
.hpNums button.ok{border-color:#5ed08a}.hpNums button.no{border-color:#e8604f}
/* ===/CSS:happy=== */
/* ===CSS:magic=== */
.msBoard{display:grid;gap:3px;justify-content:center;margin:8px auto;--cs:48px}
.msBoard>*{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:800;font-size:calc(var(--cs)*.42);width:var(--cs);height:var(--cs);box-sizing:border-box;user-select:none}
.msBoard .c{background:#cdd9e6;color:#12263c;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:800;font-size:calc(var(--cs)*.42)}
.msBoard .c.g{background:#a9bfd6}
.msBoard .c.sel{border-color:#ffb84a}
.msBoard .c.hl{background:#ffe08a}
.msBoard .c.fl{background:#f2a24a}
.msBoard .c.last{box-shadow:0 0 0 3px #5ed08a inset}
.msBoard .c.q0{background:#cfe3f7}.msBoard .c.q1{background:#f7e3c2}.msBoard .c.q2{background:#d9f0d2}.msBoard .c.q3{background:#f3d0d0}
.msBoard .sm{background:#1b3a5c;color:#cdd9e6;font-size:calc(var(--cs)*.36)}
.msBoard .sm.ok{background:#1f6b44;color:#fff}.msBoard .sm.no{background:#8a2f2f;color:#fff}
.msBoard .d{background:#f6f1e4;color:#12263c;border:2px solid #0e2339;cursor:pointer;gap:0;padding:0;overflow:hidden}
.msBoard .d.sel{border-color:#ffb84a;box-shadow:0 0 0 2px #ffb84a}
.msBoard .d span{flex:1;display:flex;align-items:center;justify-content:center;height:100%;font-size:calc(var(--cs)*.45)}
.msBoard .d.h span+span{border-left:2px solid #0e2339}
.msBoard .d.v{flex-direction:column}.msBoard .d.v span+span{border-top:2px solid #0e2339}
.msBoard .d.empty span{color:#b7b2a2}
.msBoard>.d{width:auto;height:auto}
.msChips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.msChips span{background:#1b3a5c;border-radius:10px;padding:3px 10px;font-weight:700}

<body>
<div class="app" id="app"></div>
<noscript>This app needs JavaScript.</noscript>
<script>
(function(){
'use strict';
const $=(s,e=document)=>e.querySelector(s);
function el(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){
    const v=props[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k==='dataset')Object.assign(e.dataset,v);
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null)continue;e.append(c&&c.nodeType?c:document.createTextNode(c));}
  return e;
}
const gcd=(a,b)=>b?gcd(b,a%b):a;

/* ---------- generic shortest-path solver ---------- */
function rebuild(prev,k0,k){
  const path=[];
  while(k!==k0){const p=prev.get(k);path.push(p.move);k=p.from;}
  return path.reverse();
}
function bfs(def,start){
  const key=def.key,k0=key(start),prev=new Map(),seen=new Map([[k0,start]]);
  if(def.isGoal(start))return {path:[],cost:0,states:[start]};
  let frontier=[start];
  while(frontier.length){
    const next=[];
    for(const s of frontier){
      const ks=key(s);
      for(const m of def.moves(s)){
        const k=key(m.to);
        if(seen.has(k))continue;
        seen.set(k,m.to);prev.set(k,{from:ks,move:m});
        if(def.isGoal(m.to)){const path=rebuild(prev,k0,k);return {path,cost:path.length,states:[...seen.values()]};}
        next.push(m.to);
      }
    }
    frontier=next;
  }
  return {path:null,cost:null,states:[...seen.values()]};
}
function solve(def,start){
  if(def.solver)return def.solver(start);
  if(def.uniform)return bfs(def,start);
  const key=def.key,k0=key(start);
  const dist=new Map([[k0,0]]),prev=new Map(),seen=new Map();
  let open=[{s:start,k:k0,d:0}],best=null;
  while(open.length){
    open.sort((a,b)=>a.d-b.d);
    const cur=open.shift();
    if(seen.has(cur.k))continue;
    seen.set(cur.k,cur.s);
    if(def.isGoal(cur.s)){best=cur;break;}
    for(const m of def.moves(cur.s)){
      const k=key(m.to),nd=cur.d+(m.cost||1);
      if(!dist.has(k)||nd<dist.get(k)){dist.set(k,nd);prev.set(k,{from:cur.k,move:m});open.push({s:m.to,k,d:nd});}
    }
  }
  if(!best)return {path:null,cost:null,states:[...seen.values()]};
  return {path:rebuild(prev,k0,best.k),cost:best.d,states:[...seen.values()]};
}

/* ---------- JUGS ---------- */
function jugsLevel(L){
  const caps=L.caps,n=caps.length;
  const name=i=>caps[i]+' L jug';
  const def={
    scoreLabel:'Moves',unit:'moves',uniform:true,
    start:L.start.slice(),
    key:s=>s.join(','),
    isGoal:s=>L.goal.exact?s.every((v,i)=>v===L.goal.exact[i]):s.some(v=>v===L.goal.any),
    moves(s){
      const out=[];
      for(let i=0;i<n;i++){
        if(L.tap&&s[i]<caps[i]){const t=s.slice();t[i]=caps[i];out.push({kind:'fill',i,to:t,label:`Fill the ${name(i)} from the tap`});}
        if(L.drain&&s[i]>0){const t=s.slice();t[i]=0;out.push({kind:'empty',i,to:t,label:`Empty the ${name(i)}`});}
        for(let j=0;j<n;j++){
          if(i===j||s[i]===0||s[j]>=caps[j])continue;
          const a=Math.min(s[i],caps[j]-s[j]),t=s.slice();t[i]-=a;t[j]+=a;
          out.push({kind:'pour',i,j,to:t,label:`Pour the ${name(i)} into the ${name(j)}`});
        }
      }
      return out;
    },
    impossible(states){
      const amts=[...new Set(states.flatMap(s=>s))].sort((a,b)=>a-b);
      const g=caps.reduce(gcd);
      return `No solution exists! Every amount that can ever appear in a jug is: ${amts.join(', ')} L. They are all multiples of ${g} (the highest common factor of ${caps.join(' and ')}), so ${L.goal.any} L can never be made.`;
    },
    maths:L.maths,
    brief:L.brief,
    mount(stage,S){
      const maxCap=Math.max(...caps),unit=Math.min(30,Math.floor(300/maxCap));
      let sel=null,downIdx=null;
      const wrap=el('div',{class:'jugs'});
      const jugs=[],liquids=[],amts=[],fills=[],empties=[];
      for(let i=0;i<n;i++){
        const liquid=el('div',{class:'liquid'}),amt=el('div',{class:'amt'});
        const jug=el('div',{class:'jug',dataset:{jug:i},style:`height:${caps[i]*unit}px;--u:${unit}px`,role:'button',tabindex:'0','aria-label':name(i)},
          el('div',{class:'ticks'}),liquid,amt);
        jug.addEventListener('pointerdown',e=>{if(S.busy)return;downIdx=i;jug.classList.add('lift');});
        jug.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapJug(i);}});
        const btns=el('div',{class:'jugbtns'});
        if(L.tap){const b=el('button',{class:'mini',onclick:()=>single('fill',i)},'Fill');fills[i]=b;btns.append(b);}
        if(L.drain){const b=el('button',{class:'mini',onclick:()=>single('empty',i)},'Empty');empties[i]=b;btns.append(b);}
        jugs[i]=jug;liquids[i]=liquid;amts[i]=amt;
        wrap.append(el('div',{class:'jugcol'},el('div',{class:'jugcap'},caps[i]+' L'),jug,btns));
      }
      stage.append(wrap);
      function release(){jugs.forEach(j=>j.classList.remove('lift'));downIdx=null;}
      function tapJug(jj){
        if(S.busy)return;
        if(sel===null){sel=jj;}
        else if(sel===jj){sel=null;}
        else{const a=sel;sel=null;pour(a,jj);}
        paintSel();
      }
      function paintSel(){jugs.forEach((j,i)=>j.classList.toggle('sel',i===sel));}
      wrap.addEventListener('pointerup',e=>{
        if(downIdx===null)return;
        const i=downIdx;release();
        const t=document.elementFromPoint(e.clientX,e.clientY),jx=t&&t.closest&&t.closest('[data-jug]');
        if(!jx)return;
        const jj=+jx.dataset.jug;
        if(jj!==i){sel=null;paintSel();pour(i,jj);}
        else tapJug(jj);
      });
      document.addEventListener('pointerup',release);
      wrap.addEventListener('pointercancel',release);
      function find(kind,i,j){return S.moves().find(m=>m.kind===kind&&m.i===i&&(j===undefined||m.j===j));}
      function pour(i,j){
        const s=S.state,m=find('pour',i,j);
        if(m)return S.play(m);
        if(s[i]===0)S.say(`The ${name(i)} is empty — there is nothing to pour.`,'bad');
        else S.say(`The ${name(j)} is already full.`,'bad');
      }
      function single(kind,i){
        const m=find(kind,i);
        if(m)return S.play(m);
        S.say(kind==='fill'?`The ${name(i)} is already full.`:`The ${name(i)} is already empty.`,'bad');
      }
      return {
        update(s){
          s.forEach((v,i)=>{liquids[i].style.height=(v*unit)+'px';amts[i].textContent=v?v+' L':'';});
          sel=null;paintSel();this.clear();
        },
        highlight(m){
          this.clear();
          if(m.kind==='pour'){jugs[m.i].classList.add('hint-from');jugs[m.j].classList.add('hint-to');}
          else{const b=(m.kind==='fill'?fills:empties)[m.i];b&&b.classList.add('hint');}
        },
        clear(){jugs.forEach(j=>j.classList.remove('hint-from','hint-to'));fills.concat(empties).forEach(b=>b&&b.classList.remove('hint'));}
      };
    }
  };
  return def;
}
const JUG_MATHS_TAP=`<p>Each jug's contents is a coordinate, so a two-jug puzzle is a single point moving around a rectangle. Filling and emptying slide the point along the edges; pouring slides it along a diagonal until it hits an edge — just like a snooker ball bouncing round a table.</p>
<p>With a tap and a drain, jugs of <em>a</em> and <em>b</em> litres can measure exactly the multiples of their highest common factor. 3 and 5 have HCF 1, so <strong>every</strong> whole number of litres up to 5 can be made. 4 and 6 have HCF 2, so only even amounts are possible.</p>
<p>Notice that every move leaves a jug either full or empty — you can never stop part-way through a pour.</p>`;
const JUG_MATHS_SPLIT=`<p>With no tap and no drain the <strong>total never changes</strong>, so every state is a way of splitting that total between the jugs. Searching all the possible states (there are only a few dozen) quickly finds the shortest route.</p>
<p>The trick that makes these work is the same as for two jugs: each pour ends with one jug full or one jug empty, creating a new "known" amount you can build on.</p>`;
const JUG_MATHS_IMP=`<p>This one can't be done — and proving it is the whole point. Each jug holds an even number of litres and you can only ever fill, empty, or pour until one jug is full or empty, so every amount that appears is a combination of 4s and 6s. That's always a multiple of 2 (their highest common factor), so an odd amount like 3 L is out of reach.</p>
<p>In general, jugs of <em>a</em> and <em>b</em> litres can measure <em>n</em> litres (n ≤ the larger jug) exactly when HCF(a, b) divides <em>n</em>.</p>`;

const JUGS={id:'jugs',icon:'🫖',title:'Jugs',blurb:'Measure exactly the right amount using jugs that have no markings.',
  levels:[
    {name:'3 L and 5 L',make:()=>jugsLevel({caps:[3,5],start:[0,0],tap:true,drain:true,goal:{any:4},
      brief:'You have a 3 L jug and a 5 L jug, a tap and a drain. Neither jug has markings. Measure exactly <strong>4 L</strong> in either jug.',maths:JUG_MATHS_TAP})},
    {name:'4 L and 7 L',make:()=>jugsLevel({caps:[4,7],start:[0,0],tap:true,drain:true,goal:{any:5},
      brief:'A 4 L jug and a 7 L jug, with a tap and a drain. Measure exactly <strong>5 L</strong>.',maths:JUG_MATHS_TAP})},
    {name:'Medieval 8-5-3',make:()=>jugsLevel({caps:[8,5,3],start:[8,0,0],tap:false,drain:false,goal:{exact:[4,4,0]},
      brief:'A puzzle that has been passed down for centuries. Jugs of 8 L, 5 L and 3 L, none with markings. The 8 L jug is full and the others are empty. There is no tap and no drain. Share the 8 L equally so that the 8 L jug and the 5 L jug each hold <strong>4 L</strong>.',maths:JUG_MATHS_SPLIT})},
    {name:'Share 12 L',make:()=>jugsLevel({caps:[12,8,5],start:[12,0,0],tap:false,drain:false,goal:{exact:[6,6,0]},
      brief:'The 12 L jug is full. No tap, no drain. Share it so that the 12 L jug and the 8 L jug each hold <strong>6 L</strong>.',maths:JUG_MATHS_SPLIT})},
    {name:'Can it be done?',make:()=>jugsLevel({caps:[4,6],start:[0,0],tap:true,drain:true,goal:{any:3},
      brief:'A 4 L jug and a 6 L jug, with a tap and a drain. Can you measure exactly <strong>3 L</strong>? <em>(Be ready to explain your answer.)</em>',maths:JUG_MATHS_IMP})}
  ]};

/* ---------- CROSSINGS (boat and bridge share one engine) ---------- */
function crossingLevel(C){
  const ents=C.ents,n=ents.length,pilot=C.pilot==null?-1:C.pilot;
  const names=i=>ents[i].name;
  function banksOf(p){const b=[[],[]];p.forEach((v,i)=>b[v].push(i));return b;}
  const def={
    scoreLabel:C.scoreLabel||'Crossings',unit:C.unit||'crossings',uniform:!C.cost,
    ents,
    start:{p:Array(n).fill(0),b:0},
    key:s=>s.p.join('')+s.b,
    isGoal:s=>s.p.every(v=>v===1),
    check(p){return C.unsafe?C.unsafe(banksOf(p)):null;},
    moves(s){
      const out=[],cand=[];
      for(let i=0;i<n;i++)if(i!==pilot&&s.p[i]===s.b)cand.push(i);
      const min=pilot>=0?0:1;
      const rec=(start,cur)=>{
        if(cur.length>=min&&cur.length<=C.cap){
          const np=s.p.slice();cur.forEach(i=>np[i]=1-s.b);if(pilot>=0)np[pilot]=1-s.b;
          if(!def.check(np)){
            const who=cur.map(names);
            const label=cur.length===0?`${names(pilot)} crosses alone`:C.verb?C.verb(who,pilot>=0?names(pilot):null):`Cross with ${who.join(' and ')}`;
            out.push({kind:'cross',set:cur.slice(),to:{p:np,b:1-s.b},cost:C.cost?C.cost(cur.map(i=>ents[i])):1,label});
          }
        }
        if(cur.length>=C.cap)return;
        for(let k=start;k<cand.length;k++){cur.push(cand[k]);rec(k+1,cur);cur.pop();}
      };
      rec(0,[]);
      return out;
    },
    impossible:()=>'No solution found.',
    maths:C.maths,brief:C.brief,
    mount(stage,S){
      let load=[],hintSet=null,hintBoat=false;
      const wrap=el('div',{class:'cross scene-'+C.scene});
      const bankL=el('div',{class:'bank'}),bankR=el('div',{class:'bank'});
      const boat=el('div',{class:'boat',dataset:{side:'0'},role:'button',tabindex:'0','aria-label':C.goLabel||'Cross the river'});
      const river=el('div',{class:'river'},boat);
      wrap.append(bankL,river,bankR);stage.append(wrap);
      boat.addEventListener('click',go);
      boat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
      function tile(i,inBoat,fixed){
        const e=ents[i];
        const t=el('button',{class:'tile'+(inBoat?' small':'')+(fixed?' fixed':'')+((hintSet&&hintSet.includes(i))?' hint':''),'aria-label':e.name},
          el('span',{class:'emo'},e.emoji),
          inBoat?null:el('span',{class:'nm'},e.name),
          e.time!=null?el('span',{class:'tm'},e.time+(inBoat?'':' min')):null);
        if(!fixed)t.addEventListener('click',ev=>{ev.stopPropagation();tap(i);});
        else t.addEventListener('click',ev=>{ev.stopPropagation();go();});
        return t;
      }
      function draw(){
        const s=S.state;
        [bankL,bankR].forEach((bk,side)=>{
          const items=el('div',{class:'items'});
          for(let i=0;i<n;i++)if(s.p[i]===side&&!load.includes(i)&&i!==pilot)items.append(tile(i,false));
          bk.replaceChildren(el('h3',null,C.banks[side]),items);
        });
        const deck=el('div',{class:'deck'});
        if(pilot>=0)deck.append(tile(pilot,true,true));
        load.forEach(i=>deck.append(tile(i,true)));
        if(C.scene==='bridge')deck.append(el('span',{class:'emo',style:'font-size:1.5rem'},'🔦'));
        boat.replaceChildren(deck,el('div',{class:'hull'}),el('div',{class:'go'},load.length||pilot>=0?(C.goText||'Go ➜'):(C.loadText||'Load up')));
        boat.dataset.side=String(s.b);
        boat.classList.toggle('hint',hintBoat);
      }
      function tap(i){
        if(S.busy)return;
        const s=S.state;
        if(s.p[i]!==s.b){S.say(C.wrongSide,'bad');return;}
        if(load.includes(i))load=load.filter(x=>x!==i);
        else if(load.length>=C.cap){S.say(C.fullMsg,'bad');return;}
        else load.push(i);
        hintSet=null;hintBoat=false;draw();S.say('');
      }
      function go(){
        if(S.busy)return;
        const s=S.state;
        if(pilot<0&&load.length===0){S.say(C.emptyMsg,'bad');shake();return;}
        const np=s.p.slice();load.forEach(i=>np[i]=1-s.b);if(pilot>=0)np[pilot]=1-s.b;
        const msg=def.check(np);
        if(msg){S.say(msg,'bad');shake();return;}
        const m=S.moves().find(m=>m.set.length===load.length&&m.set.every(x=>load.includes(x)));
        if(m)S.play(m,true);
      }
      function shake(){boat.classList.remove('shake');void boat.offsetWidth;boat.classList.add('shake');}
      return {
        update(){load=[];hintSet=null;hintBoat=false;draw();},
        highlight(m){hintSet=m.set;hintBoat=true;draw();},
        clear(){hintSet=null;hintBoat=false;},
        animate(m,done,preloaded){
          const from=S.state.b;
          const slide=()=>{boat.dataset.side=String(1-from);setTimeout(done,750);};
          if(!preloaded){load=m.set.slice();hintSet=null;draw();setTimeout(slide,650);}
          else slide();
        }
      };
    }
  };
  return def;
}

const WGC_MATHS=`<p>Write down where each of the four is — left or right bank — and you get 2 × 2 × 2 × 2 = 16 possible arrangements. Some are forbidden (the farmer's away from a wolf and goat, or goat and cabbage). Joining each safe arrangement to the ones one crossing away gives a <strong>graph</strong>, and a solution is just a path from "all on the left" to "all on the right".</p>
<p>The key idea is that the farmer must sometimes bring something <em>back</em> — a step backwards that makes progress. Many people get stuck because they think every crossing has to carry something forwards.</p>
<p>There are exactly two shortest solutions, each with 7 crossings.</p>`;
const WGC={id:'wgc',icon:'🐺',title:'Wolf, Goat and Cabbage',blurb:'Get everything across the river without anything being eaten.',
  levels:[{name:'Classic',make:()=>crossingLevel({
    scene:'boat',pilot:0,cap:1,
    ents:[{name:'Farmer',emoji:'🧑‍🌾'},{name:'Wolf',emoji:'🐺'},{name:'Goat',emoji:'🐐'},{name:'Cabbage',emoji:'🥬'}],
    banks:['Left bank','Right bank'],
    brief:'A farmer must take a wolf, a goat and a cabbage across the river. The boat holds the farmer and <strong>one</strong> other. Left alone together, the wolf eats the goat and the goat eats the cabbage. Tap something to load it, then tap the boat.',
    wrongSide:'The boat is on the other bank.',fullMsg:'The boat only has room for the farmer and one other.',
    verb:(who)=>`Take the ${who[0].toLowerCase()} across`,
    unsafe(b){
      for(let side=0;side<2;side++){
        const bk=b[side];if(bk.includes(0))continue;
        if(bk.includes(1)&&bk.includes(2))return `Oh no! The wolf would eat the goat on the ${side?'right':'left'} bank.`;
        if(bk.includes(2)&&bk.includes(3))return `Oh no! The goat would eat the cabbage on the ${side?'right':'left'} bank.`;
      }
      return null;
    },

function swapLevel(n){
  const len=2*n+1;
  const start=[];for(let i=0;i<n;i++)start.push('R');start.push(null);for(let i=0;i<n;i++)start.push('B');
  const goal=[];for(let i=0;i<n;i++)goal.push('B');goal.push(null);for(let i=0;i<n;i++)goal.push('R');
  const goalKey=goal.map(c=>c||'_').join('');

  const def={
    scoreLabel:'Moves',unit:'moves',uniform:true,
    start,
    key:s=>s.map(c=>c||'_').join(''),
    isGoal:s=>s.map(c=>c||'_').join('')===goalKey,
    moves(s){
      const out=[];
      for(let i=0;i<len;i++){
        const c=s[i];if(!c)continue;
        const d=c==='R'?1:-1,a=i+d,b=i+2*d;
        if(a>=0&&a<len&&s[a]===null){const t=s.slice();t[a]=c;t[i]=null;out.push({kind:'slide',i,to:t,label:`Slide the ${nm(c)} coin in place ${i+1} into the space`});}
        else if(a>=0&&b>=0&&a<len&&b<len&&s[a]&&s[a]!==c&&s[b]===null){const t=s.slice();t[b]=c;t[i]=null;out.push({kind:'jump',i,to:t,label:`Jump the ${nm(c)} coin in place ${i+1} over the ${nm(s[a])} coin`});}
      }
      return out;
    },
    brief:`Swap the ${n} copper coin${n>1?'s':''} and the ${n} silver coin${n>1?'s':''} so that they end up on opposite sides. Copper coins only move <strong>right</strong>, silver coins only move <strong>left</strong>. A coin can slide into the empty space next to it, or jump over <em>one</em> coin of the other colour into the empty space. Tap a coin to move it.`,
    maths:`<p>The fewest possible number of moves is <strong>n² + 2n</strong>, where n is the number of coins of each colour. Check it against the levels:</p>
    <table class="mt"><tr><th>n</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>fewest moves</th><td>3</td><td>8</td><td>15</td><td>24</td><td>35</td></tr></table>
    <p>Why? Each coin has to travel n + 1 places in total, so all 2n coins together travel 2n(n + 1) = 2n² + 2n places. Each copper–silver pair must swap order exactly once, and only a <em>jump</em> can do that, so there are n × n = n² jumps. Each jump moves a coin 2 places, covering 2n² of the places. The remaining 2n places are covered by slides, one place each: 2n slides.</p>
    <p>Notice too that n² + 2n = (n + 1)² − 1: one less than a square number. The sequence 3, 8, 15, 24, 35 is the square numbers 4, 9, 16, 25, 36 each reduced by 1 — can you see why?</p>`,

function coinOut(L,R,h){
  const inL=L.includes(h.i),inR=R.includes(h.i);
  if(!inL&&!inR)return 'B';
  const heavySide=(inL?'L':'R');
  if(h.t==='H')return heavySide;
  return heavySide==='L'?'R':'L';
}
function coinHyps(n,unknown){const h=[];for(let i=0;i<n;i++){h.push({i,t:'H'});if(unknown)h.push({i,t:'L'});}return h;}
function coinBest(n,hyps){
  let best=null;const asg=new Array(n).fill(0);
  const rec=(i,l,r)=>{
    if(Math.abs(l-r)>n-i)return;
    if(i===n){
      if(l!==r||l===0)return;
      const L=[],R=[];asg.forEach((a,k)=>{if(a===1)L.push(k);else if(a===2)R.push(k);});
      const cnt={L:0,R:0,B:0};
      for(const h of hyps)cnt[coinOut(L,R,h)]++;
      const mx=Math.max(cnt.L,cnt.R,cnt.B),sq=cnt.L*cnt.L+cnt.R*cnt.R+cnt.B*cnt.B;
      if(!best||mx<best.mx||(mx===best.mx&&sq<best.sq))best={L,R,mx,sq};
      return;
    }
    asg[i]=1;rec(i+1,l+1,r);
    asg[i]=2;rec(i+1,l,r+1);
    asg[i]=0;rec(i+1,l,r);
  };
  rec(0,0,0);
  return best;
}

const COIN_MATHS_HEAVY=`<p>A balance gives <strong>three</strong> possible results: left heavier, right heavier, or balanced. So <em>k</em> weighings can tell apart at most 3<sup>k</sup> possibilities.</p>
<p>With one heavy coin among <em>n</em>, there are <em>n</em> possibilities, so you need 3<sup>k</sup> ≥ <em>n</em>. That is why 3 coins need 1 weighing, 9 coins need 2 weighings, and 27 coins would need only 3.</p>
<p>The winning strategy is to split the coins into <strong>three equal groups</strong> (or as equal as you can): weigh two of them. If they balance, the heavy coin is in the third group. Each weighing divides the problem by three.</p>`;
const COIN_MATHS_12=`<p>Now the fake could be heavier <em>or</em> lighter, so there are 12 × 2 = <strong>24</strong> possibilities. Three weighings give 3<sup>3</sup> = 27 outcomes, and 24 ≤ 27 — just enough room!</p>
<p>The first weighing must be four coins against four. Any other split leaves too many possibilities for the remaining weighings to separate. After that, the coins that have been on the scales and the coins that haven't tell you very different things, and you must use the coins you've proved genuine as "known good" weights.</p>
<p>With 13 coins you could still find the fake in 3 weighings in most cases, but not always know if it was heavier or lighter. In general the most coins you can handle in <em>k</em> weighings is (3<sup>k</sup> − 3) ÷ 2: for k = 3 that is 12.</p>`;

const SEG={a:[[10,6],[50,6]],b:[[54,10],[54,46]],c:[[54,54],[54,90]],d:[[10,94],[50,94]],e:[[6,54],[6,90]],f:[[6,10],[6,46]],g:[[10,50],[50,50]]};

function matchTokens(eq){
  const toks=[];let off=0;
  for(const ch of eq){
    if(ch>='0'&&ch<='9'){toks.push({t:'d',off,n:7,init:SEGS.split('').map(s=>DIG[+ch].includes(s)?1:0)});off+=7;}
    else if(ch==='+'||ch==='-'){toks.push({t:'o',off,n:2,init:ch==='+'?[1,1]:[1,0]});off+=2;}
    else if(ch==='='){toks.push({t:'e',off,n:2,init:[1,1]});off+=2;}

}
function matchText(toks,bits){

    }else if(t.t==='o'){

    }else{if(b[0]&&b[1])txt+='=';else return null;}
  }
  return txt;
}
function matchValid(txt){
  if(!txt)return false;
  let m=txt.match(/^(\d+)([+-])(\d+)=(\d+)$/);
  let a,b,c,op;
  if(m){a=m[1];op=m[2];b=m[3];c=m[4];
    const ok=s=>s.length===1||s[0]!=='0';if(!ok(a)||!ok(b)||!ok(c))return false;
    return (op==='+'?+a+ +b:+a- +b)===+c;}
  m=txt.match(/^(\d+)=(\d+)([+-])(\d+)$/);
  if(m){c=m[1];a=m[2];op=m[3];b=m[4];
    const ok=s=>s.length===1||s[0]!=='0';if(!ok(a)||!ok(b)||!ok(c))return false;
    return (op==='+'?+a+ +b:+a- +b)===+c;}
  return false;

/* ---------- SHAPES: maths notes ---------- */
const SH_M_SQ_MOVE=`<p>Squares hide in every size. A 2×2 block of small squares contains 4 small ones and 1 big one, so 5 in all; a 3×3 block contains 9 + 4 + 1 = 14. Always count the big squares too.</p>
<p>A good method is to <em>work backwards</em>. Sketch the picture you want, then see which matches of the starting shape are already in the right place. Every match that is in the wrong place needs exactly one move, so the number of moves is the number of matches that are not part of the finished picture.</p>`;
const SH_M_TRI_MOVE=`<p>Triangles come in different sizes too. Four small triangles can fit together to make one bigger triangle whose sides are two matches long, and that counts as another triangle. Count the big ones as well as the small ones.</p>
<p>Work backwards: picture the finished shape, see which matches are already in place, and move only the ones that are not. The number of moves is the number of matches that are in the wrong place.</p>`;
const SH_M_TAKE=`<p>Every match you take away destroys every square that it belongs to. A match in the middle of a grid belongs to two small squares (and possibly some bigger ones), but a match on the edge belongs to only one small square, so middle matches are usually the more useful ones to remove.</p>
<p>Mathematicians call this kind of problem a <em>hitting set</em> problem: you want to “hit” every square, by removing at least one of its matches, using as few matches as possible. To leave a particular number of squares, decide which squares you want to keep, protect their matches, and take the rest.</p>`;
const SH_M_NONE=n=>`${SH_M_TAKE}<p>Here is a useful bound. Each small square needs one of its four matches removed, and no match belongs to more than two small squares. So the small squares alone need at least ${n} removals. The bigger squares then make it harder — checking every possibility shows that the least you can manage is a little more than this bound.</p>`;
const SH_M_PIC=`<p>When you turn a picture over (a <em>reflection</em>) or turn it round (a <em>rotation</em>), the picture stays the same shape and size. Only its position changes. So the question is: how few matches do you have to move to get from the picture you have to the picture you want?</p>
<p>The finished picture can sit anywhere on the board. Slide the target around in your mind and look for the position where the most matches already overlap the matches you have. Every match that does not overlap has to move, and the matches that do overlap can stay put.</p>
<p>A reflection swaps left and right. A rotation by a quarter turn swaps up, right, down and left in turn. Both are examples of <em>transformations</em> that keep lengths and angles unchanged.</p>`;

/* ---------- SHAPES: the puzzles ---------- */
const SH_M_HALF=n=>`<p>A plus sign made from two matches, laid across the middle of a square, cuts that square into <strong>four smaller squares</strong>. Each has sides of half a match, so its area is a quarter of the original. The original square is still there too, so one cell now holds 1 + 4 = 5 squares.</p>
<p>${n===9?'Here nothing is taken away, so all 5 of the original squares (4 small and 1 big) stay. The plus sign adds 4 new half-size squares in one cell, and 5 + 4 = 9. It does not matter which cell you choose.':n===6?'To make 6, keep the big 2 × 2 square (the 8 matches round the outside), keep one cell with the plus sign in it, and take away the two inside matches that are not part of that cell. That gives 1 big + 1 medium + 4 small = 6 squares.':'To make 7, there is no big square this time. The three cells that are left make an L-shape: 8 matches round the outside of the L and 2 inside. The two spare matches (taken from the outside of the missing cell) become the plus sign. That gives 3 medium + 4 small = 7 squares.'}</p>
<p>Counting squares of <em>every</em> size is the heart of this puzzle. Think about how many different sizes of square there are, then count each size separately.</p>`;

    maths:`<p>Three triangles that share no matches need 3 × 3 = 9 matches, which is exactly how many you have. So every match must be used, and each triangle must be made from three matches of its own.</p><p>The smallest triangle has sides 1 match long. Look at each corner of the big triangle: two of its matches already form two sides of a small triangle. Each corner is just one match short of a triangle, so three moves are enough: take the three matches from the middle of the sides and use them to close the corners.</p><p>The three small triangles touch the corners of the big one and do not touch each other. This is a nice example of <em>using what is already there</em>: spotting the parts of a figure that are already in the right place before moving anything.</p>`},

/* ---------- SIX MATCHES (custom, lateral) ---------- */
function sixLevel(){
  return {
    custom:true,
    brief:'You have <strong>six matches</strong>. Arrange them to make <strong>four equilateral triangles</strong>, each side the length of one match. No breaking, and no bending. Drag a match to move it; tap it to turn it.',
    maths:`<p>Four triangles have 4 × 3 = 12 sides between them, but there are only six matches, so every match must be a side of <em>two</em> triangles at once. On a flat table that cannot be done — the matches must leave the table.</p>
<p>Lay three matches as a triangle and stand the other three up from its corners so that they meet at a point above the middle. The result is a <strong>tetrahedron</strong>: four triangular faces, six edges and four corners. It is the simplest of the five Platonic solids.</p>
<p>Euler noticed that for solids like this, corners − edges + faces is always 2. Check it: 4 − 6 + 4 = 2.</p>
<p>The lateral-thinking lesson is that the puzzle never said the matches had to stay flat.</p>`,
    mount(stage,S){
      const ns='http://www.w3.org/2000/svg';
      const mk=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);return e;};
      const L=170,VW=560,VH=380;
      const init=()=>[[110,70,0],[110,130,30],[110,190,60],[110,250,90],[110,310,120],[110,350,150]].map(([x,y,a],i)=>({x:60+((i%3)*0)+x*0+110+(i%2)*40,y:50+i*55,a:[0,20,-15,10,-25,30][i]}));
      let ms=init(),hist=[],hintN=0,shown=false,turns=0;
      const svg=mk('svg',{viewBox:`0 0 ${VW} ${VH}`,class:'plus six'});svg.style.maxWidth='560px';
      const layer=mk('g',{});svg.append(layer);
      stage.append(svg);
      const gs=ms.map((m,i)=>{
        const g=mk('g',{class:'pm'});
        g.append(mk('line',{x1:-L/2,y1:0,x2:L/2,y2:0,class:'sline'}),mk('circle',{cx:-L/2+4,cy:0,r:9,class:'ph'}));
        layer.append(g);g.addEventListener('pointerdown',ev=>down(ev,i));return g;
      });
      function place(){ms.forEach((m,i)=>gs[i].setAttribute('transform',`translate(${m.x},${m.y}) rotate(${m.a})`));}
      function pt(ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
      let drag=null;
      function down(ev,i){
        if(shown)return;ev.preventDefault();
        const p=pt(ev);drag={i,px:p.x,py:p.y,ox:ms[i].x,oy:ms[i].y,snap:ms.map(m=>({...m})),moved:false};
        gs[i].classList.add('grab');try{gs[i].setPointerCapture(ev.pointerId);}catch(e){}
        gs[i].onpointermove=move;gs[i].onpointerup=up;gs[i].onpointercancel=up;
      }
      function move(ev){
        if(!drag)return;const p=pt(ev),m=ms[drag.i];
        m.x=Math.max(20,Math.min(VW-20,drag.ox+p.x-drag.px));m.y=Math.max(20,Math.min(VH-20,drag.oy+p.y-drag.py));
        if(Math.abs(m.x-drag.ox)+Math.abs(m.y-drag.oy)>4)drag.moved=true;place();
      }
      function up(){
        if(!drag)return;const i=drag.i;gs[i].classList.remove('grab');
        gs[i].onpointermove=gs[i].onpointerup=gs[i].onpointercancel=null;
        if(!drag.moved){ms[i].x=drag.ox;ms[i].y=drag.oy;ms[i].a=(ms[i].a+30)%360;}
        hist.push(drag.snap);turns++;drag=null;place();S.refresh();
      }
      function reset(){
        shown=false;ms=init();hist=[];turns=0;hintN=0;
        layer.replaceChildren(...gs);
        [...svg.querySelectorAll('.reveal')].forEach(e=>e.remove());
        S.say('');place();S.refresh();
      }
      function undo(){if(shown||!hist.length)return;ms=hist.pop();turns=Math.max(0,turns-1);S.say('');place();S.refresh();}
      function hint(){
        const t=['💡 Count the sides: four triangles need 12 sides, but you only have 6 matches. So every match has to be the side of two triangles at once.','💡 A flat table is not the only place a match can go. Could the matches leave the table?','💡 Make one triangle from three matches. Then stand the other three matches up on its corners so that their tops meet.'];
        S.say(t[Math.min(hintN,t.length-1)],'info');hintN++;
      }
      function show(){

        const A=[110,290],B=[330,290],C=[220,340],D=[220,90];

          svg.append(g);

        S.revealMaths();S.refresh();
