        reset,undo,hint,show,
        stop(){demoTok++;demoing=false;},
        ctl:()=>({undo:!demoing&&path.length>0,reset:true,hint:!demoing&&!solved,show:true,showText:demoing?'■ Stop':'▶ Show me',score:`Squares visited: ${path.length}`})
      };
    }
  };
  return def;
}
const KNIGHT={id:'knight',icon:'♞',title:"Knight's Tour",blurb:'How many squares can the knight visit without landing on any twice?',
  levels:[
    {name:'10 squares',make:()=>knightLevel(10)},
    {name:'20 squares',make:()=>knightLevel(20)},
    {name:'30 squares',make:()=>knightLevel(30)},
    {name:'All 64 squares',make:()=>knightLevel(64)}
  ]};

const PUZZLES={};[JUGS,WGC,FOX,BRIDGE,MATCHES,COINS,SWAP,CARPARK,CHESS,KNIGHT].forEach(p=>PUZZLES[p.id]=p);

const GROUPS=[
  {title:'Pouring',items:[JUGS]},
  {title:'River and bridge crossings',items:[WGC,FOX,BRIDGE]},
  {title:'Matches and coins',items:[MATCHES,COINS,SWAP]},
  {title:'Chess board',items:[
    CHESS,
    KNIGHT,
    {soon:1,icon:'🀱',title:'Mutilated Chessboard',blurb:'Cover 62 squares with 31 dominoes. Or can you?'}]},
  {title:'Movement',items:[CARPARK,{soon:1,icon:'📍',title:'Peg Solitaire',blurb:'Jump pegs to leave just one.'}]},
  {title:'Investigations',items:[
    {soon:1,icon:'✉️',title:'Stamps',blurb:'Which postage can you make with just two stamps?'},
    {soon:1,icon:'➕',title:'Consecutives',blurb:'Which numbers are sums of consecutive integers?'},
    {soon:1,icon:'🌨️',title:'Hailstones',blurb:'Halve it or triple it and add one — where does it end?'}]}
];

/* ---------- home ---------- */
let teardown=null;
function showHome(){
  if(teardown){teardown();teardown=null;}
  const app=$('#app');app.replaceChildren();
  app.append(el('h1',null,'Classic Puzzles'),el('p',{class:'tag'},'Famous puzzles to explore, solve and discuss. Pick one to start.'));
  GROUPS.forEach(g=>{
    const grid=el('div',{class:'grid'});
    g.items.forEach(p=>{
      if(p.soon)grid.append(el('div',{class:'card soon','aria-disabled':'true'},el('span',{class:'ic'},p.icon),el('span',{class:'tt'},p.title),el('span',{class:'bl'},p.blurb),el('span',{class:'soonTag'},'Coming soon')));
      else grid.append(el('button',{class:'card',onclick:()=>{location.hash=p.id;}},el('span',{class:'ic'},p.icon),el('span',{class:'tt'},p.title),el('span',{class:'bl'},p.blurb)));
    });
    app.append(el('h2',null,g.title),grid);
  });
  app.append(el('div',{class:'foot'},'LoadsOfMaths'));
  window.scrollTo(0,0);
}

/* ---------- puzzle shell ---------- */
function showPuzzle(P){
  if(teardown){teardown();teardown=null;}
  const app=$('#app');app.replaceChildren();
  let def,ui,state,hist,cost,moves,solved,shown,busy=false,demoing=false,token=0,best,levelIdx=0,pIdx=0;

  const tabs=el('div',{class:'tabs'});
  const chips=el('div',{class:'chips'});
  const bPrev=el('button',{class:'mini',onclick:()=>step(-1),'aria-label':'Previous puzzle'},'◀');
  const bNext=el('button',{class:'mini',onclick:()=>step(1),'aria-label':'Next puzzle'},'▶');
  const pickLbl=el('span',{class:'pickLbl'});
  const bNew=el('button',{class:'mini',onclick:()=>load(levelIdx,0)},'🎲 New puzzle');
  const pick=el('div',{class:'pick',hidden:''},bPrev,pickLbl,bNext,bNew);
  const brief=el('p',{class:'brief'});
  const stage=el('div',{class:'stage'});
  const msg=el('div',{class:'msg',role:'status','aria-live':'polite'});
  const bUndo=el('button',{class:'btn',onclick:undo},'↶ Undo');
  const bReset=el('button',{class:'btn',onclick:()=>{if(def.custom){ui.reset();}else if(!busy)fresh();}},'⟲ Reset');
  const bHint=el('button',{class:'btn',onclick:hint},'💡 Hint');
  const bShow=el('button',{class:'btn primary',onclick:show},'▶ Show me');
  const score=el('span',{class:'score'});
  const mathsBody=el('div');
  const maths=el('details',{class:'maths',hidden:''},el('summary',null,"What's the maths?"),mathsBody);

  app.append(
    el('div',{class:'head'},el('button',{class:'btn',onclick:()=>{location.hash='';}},'← All puzzles'),el('h1',null,P.icon+' '+P.title)),
    tabs,chips,pick,brief,stage,msg,
    el('div',{class:'bar'},bUndo,bReset,bHint,bShow,score),
    maths
  );
  if(P.tabs)P.tabs.forEach(t=>tabs.append(el('button',{class:'tab','data-id':t.id,onclick:()=>load(P.levels.findIndex(l=>l.tab===t.id),0)},t.name)));
  else tabs.style.display='none';
  if(P.levels.length>1)P.levels.forEach((L,i)=>chips.append(el('button',{class:'chip',onclick:()=>load(i,0)},L.name)));
  else chips.style.display='none';

  const S={
    get state(){return state;},
    get busy(){return busy;},
    moves:()=>def.moves(state),
    say,
    refresh:()=>updateUI(),
    revealMaths:()=>showMaths(),
    win(text){say(text,'good');showMaths();},
    play(move,preloaded){
      if(busy)return;
      if(ui.animate){busy=true;updateUI();ui.animate(move,()=>{busy=false;apply(move);},preloaded);}
      else apply(move);
    }
  };

  function say(t,kind){msg.className='msg'+(kind?' '+kind:'');msg.textContent=t||'';}
  function updateUI(){
    if(def.custom){
      const c=ui.ctl();
      bUndo.disabled=!c.undo;bReset.disabled=!c.reset;bHint.disabled=!c.hint;bShow.disabled=!c.show;
      bShow.textContent=c.showText||'▶ Show me';score.textContent=c.score||'';
      return;
    }
    bUndo.disabled=busy||!hist.length;
    bReset.disabled=busy;
    bHint.disabled=busy||solved;
    bShow.disabled=busy&&!demoing;
    bShow.textContent=demoing?'■ Stop':'▶ Show me';
    score.textContent=`${def.scoreLabel}: ${cost}${def.unit==='minutes'?' min':''}`;
  }
  function render(){ui.update(state);updateUI();}
  function showMaths(){mathsBody.innerHTML=def.maths||'';maths.hidden=false;}
  function apply(move,quiet){
    hist.push({state,cost,moves});
    state=move.to;cost+=move.cost||1;moves++;
    if(!quiet)say('');
    render();
    if(!quiet&&def.isGoal(state))win();
  }
  function win(){
    solved=true;updateUI();
    const u=def.unit;
    const un=n=>n===1?u.replace(/^\w+/,w=>w==='matches'?'match':w.replace(/s$/,'')):u;
    if(cost===best.cost)say(`🎉 Solved in ${cost} ${un(cost)} — that's the fewest possible!`,'good');
    else say(`✅ Solved in ${cost} ${un(cost)}. The fewest possible is ${best.cost} — can you beat it? (Press Reset to try again.)`,'good');
    showMaths();
  }
  function undo(){
    if(def.custom){ui.undo&&ui.undo();return;}
    if(busy||!hist.length)return;
    const h=hist.pop();state=h.state;cost=h.cost;moves=h.moves;solved=false;say('');render();
  }
  function fresh(){
    token++;busy=false;demoing=false;
    if(def.custom){solved=false;say('');ui.reset();return;}
    state=def.start;hist=[];cost=0;moves=0;solved=false;shown=false;
    say('');render();
  }
  function hint(){
    if(def.custom){ui.hint();return;}
    if(busy||solved)return;
    const r=solve(def,state);
    if(!r.path&&def.noHint){say(def.noHint,'info');return;}
    if(!r.path){say('💡 This one might be impossible from here. Try listing every amount you can make — what do they have in common?','info');return;}
    if(!r.path.length)return;
    say('💡 Hint: '+r.path[0].label+'.','info');
    ui.highlight&&ui.highlight(r.path[0]);
  }
  function show(){
    if(def.custom){ui.show();return;}
    if(demoing){fresh();say('Demo stopped. Press Reset or Show me to go again.','info');return;}
    if(busy)return;
    if(!best.path){fresh();say(def.impossible(best.states),'info');showMaths();return;}
    fresh();
    const my=++token;busy=true;demoing=true;updateUI();
    const path=best.path;let k=0;
    const next=()=>{
      if(my!==token)return;
      if(k>=path.length){
        busy=false;demoing=false;shown=true;updateUI();
        say(`That's one shortest route: ${best.cost} ${best.cost===1?def.unit.replace(/^\w+/,w=>w==='matches'?'match':w.replace(/s$/,'')):def.unit}. Press Reset to try it yourself!`,'info');showMaths();return;
      }
      const m=path[k++];
      say(`Step ${k}: ${m.label}.`,'info');
      ui.highlight&&ui.highlight(m);
      const done=()=>{if(my!==token)return;apply(m,true);setTimeout(next,1000);};
      if(ui.animate)ui.animate(m,done,false);else setTimeout(done,700);
    };
    setTimeout(next,500);
  }
  function step(d){
    const L=P.levels[levelIdx];
    load(levelIdx,(pIdx+d+L.count)%L.count);
  }
  function load(i,p){
    token++;busy=false;demoing=false;
    levelIdx=i;pIdx=p||0;
    const L=P.levels[i];
    [...chips.children].forEach((c,j)=>c.classList.toggle('on',j===i));
    if(P.tabs){
      [...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===L.tab));
      [...chips.children].forEach((c,j)=>{c.style.display=P.levels[j].tab===L.tab?'':'none';});
      chips.style.display=P.levels.filter(l=>l.tab===L.tab).length>1?'':'none';
    }
    def=L.make(pIdx);
    pick.hidden=!(L.count>1||L.random);
    bPrev.style.display=bNext.style.display=pickLbl.style.display=L.count>1?'':'none';
    bNew.style.display=L.random?'':'none';
    pickLbl.textContent=L.count>1?`Puzzle ${pIdx+1} of ${L.count}`:'';
    stage.replaceChildren();
    brief.innerHTML=def.brief;
    ui=def.mount(stage,S);
    best=def.custom?null:solve(def,def.start);
    maths.hidden=true;maths.open=false;
    fresh();
  }
  teardown=()=>{token++;if(ui&&ui.stop)ui.stop();};
  load(0,0);
  window.scrollTo(0,0);
}

function route(){
  const id=location.hash.replace('#','');
  if(PUZZLES[id])showPuzzle(PUZZLES[id]);else showHome();
}
window.addEventListener('hashchange',route);
window.CP={knightLevel,ktClosed,ktExtend,ktNb,KNIGHT,chessLevel,chSolve,CHESS,SH_GEN_SETS,SH_CUT,SH_TRI,shGrid,solve,carLevel,CAR_DATA,cherryLevel,shapeLevel,plusLevel,SH_SQUARES,SH_TAKE,SH_PICS,jugsLevel,crossingLevel,matchLevel,matchTokens,matchText,matchValid,coinsLevel,coinBest,coinOut,coinHyps,swapLevel,PUZZLES};
route();
})();
</script>
