.h,.btn,.seg button,.ttl,.cp span,.stepper output,.card h2,.tile .nm,.tile .big,.pos{font-family:'Super Bouncer','Baloo 2','Fredoka One','Chalkboard SE','Comic Sans MS','Trebuchet MS',sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.screen{display:none;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.screen.on{display:block}

/* title + logo */
.ttl{text-align:center;margin:6px 0 4px;font-size:clamp(2.6rem,13vw,4rem);line-height:1;color:var(--or);font-weight:400;
  text-shadow:0 .05em 0 #b8501a,0 .1em 0 #8f3d12,0 .16em .12em rgba(0,0,0,.4)}
.ttl.sm{font-size:2.2rem;margin-bottom:6px}
.sub{text-align:center;color:#dbe6fb;font-size:1.05rem;margin:10px 4px 16px}
.logowrap{text-align:center;margin:18px 0 4px}
.logo{display:inline-flex;background:#fff;border-radius:.8em;padding:.55em 1.1em;box-shadow:0 .2em .7em rgba(0,0,0,.3)}
.logo img{display:block;width:min(74vw,22rem);height:auto}

/* cards + forms */
.card{background:var(--cream);color:var(--ink);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.25)}
.card h2{margin:0 0 10px;font-size:1.05rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--bl)}
label{display:block;font-size:1rem;color:var(--gr);margin:0 0 4px}
.row{display:flex;gap:10px;margin-bottom:10px}
.row>div{flex:1;min-width:0}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:1.15rem;padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
input:focus{border-color:var(--bl);outline:none}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:50%;background:linear-gradient(var(--bl2),var(--bl));color:#fff;font-size:1.7rem;line-height:1;box-shadow:0 .2em 0 var(--bld);flex:none}
.stepper button:active{transform:translateY(.15em);box-shadow:0 .05em 0 var(--bld)}
.stepper output{flex:1;text-align:center;font-size:1.9rem;color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.names .nm{display:flex;align-items:center;gap:6px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.35);font-family:'Super Bouncer',sans-serif}
.seg{display:flex;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);background:#fff}
.seg button{flex:1;padding:10px 4px;color:var(--gr);font-size:.95rem}
.seg button.on{background:linear-gradient(var(--or2),var(--or));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.hint{color:var(--gr);font-size:.95rem;margin-top:6px}
.warn{color:#ffd0c4;font-size:1rem;margin:6px 0 10px;min-height:1.2em;text-align:center}

/* buttons */
.btn{display:block;width:100%;background:linear-gradient(var(--or2),var(--or));color:#fff;font-size:1.3rem;letter-spacing:.02em;padding:.6em 1em;border-radius:999px;
  box-shadow:0 .28em 0 var(--ord),0 .5em .9em rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center}
.btn:active{transform:translateY(.22em);box-shadow:0 .06em 0 var(--ord),0 .2em .5em rgba(0,0,0,.3)}
.btn.blue{background:linear-gradient(var(--bl2),var(--bl));box-shadow:0 .28em 0 var(--bld),0 .5em .9em rgba(0,0,0,.3)}
.btn.blue:active{box-shadow:0 .06em 0 var(--bld),0 .2em .5em rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);text-shadow:none;font-size:1.05rem}
.btn.red{background:linear-gradient(#ee6a55,var(--red));box-shadow:0 .28em 0 #8f2a1a,0 .5em .9em rgba(0,0,0,.3);font-size:1.05rem}
.btn.start{background:linear-gradient(var(--green2),var(--green));box-shadow:0 .2em 0 var(--greenD),0 .5em 1em rgba(0,0,0,.35);font-size:2.6rem;padding:.55em 0;letter-spacing:.06em;color:#fff}
.btn.start:active{box-shadow:0 .05em 0 var(--greenD)}

/* timer panel */
.timer{border-radius:18px;text-align:center;padding:12px 8px 8px;margin-bottom:10px;--fs:clamp(40px,16vw,76px);position:relative}
.timer .host{font-size:var(--fs);display:flex;justify-content:center;align-items:center;min-height:1.25em}
.timer .l{font-size:.85rem;text-transform:uppercase;letter-spacing:.18em;margin-top:2px;opacity:.75}
.timer.done{box-shadow:0 0 0 4px #4ade80,0 0 22px rgba(74,222,128,.6)}
.timer[data-style=classic]{background:#000;border:3px solid #2c4468;color:var(--gold)}
.timer[data-style=classic] .l{color:#a9bddb}
.classic{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:800;font-size:.9em;line-height:1.1;font-variant-numeric:tabular-nums}
.timer[data-style=lcd]{background:linear-gradient(#f1e8cb,#e0d6b0);border:6px solid #8d9094;box-shadow:inset 0 0 14px rgba(90,80,40,.35),0 4px 0 #5d6064;color:#3a3f38;--on:#3a3f38;--off:rgba(58,63,56,.09)}
.timer[data-style=lcd] .seg7{transform:skewX(-6deg)}
.timer[data-style=ledr]{background:#150606;border:5px solid #2a1212;color:#ff7a6a;--on:#ff3322;--off:rgba(255,51,34,.1)}
.timer[data-style=ledg]{background:#041208;border:5px solid #10261a;color:#8affa8;--on:#46ff74;--off:rgba(70,255,116,.1)}
.timer[data-style=ledr] .seg7,.timer[data-style=ledg] .seg7{filter:drop-shadow(0 0 .07em var(--on))}
.timer[data-style=odo]{background:linear-gradient(#444b59,#1d212a);border:5px solid #8a93a3;color:#cfd6e4}
.timer[data-style=analogue]{background:transparent;padding:0 0 4px}
.timer[data-style=analogue] .l{color:#dbe6fb}
.seg7{display:flex;align-items:center;gap:.06em;height:1em}
.seg7 svg{height:1em;display:block;flex:none;overflow:visible}
.seg7 polygon{fill:var(--off)}
.seg7 polygon.on,.seg7 rect.on{fill:var(--on)}
.seg7 rect{fill:var(--on)}
.odo{display:flex;align-items:center;font-size:.86em;gap:.05em}
.wheel{width:.66em;height:1.2em;overflow:hidden;border-radius:.1em;background:#0e1014;color:#fff;box-shadow:inset 0 .35em .3em -.15em rgba(0,0,0,.9),inset 0 -.35em .3em -.15em rgba(0,0,0,.9),0 0 0 .03em #555d6e;font-family:var(--math);font-weight:800}
.strip{will-change:transform}
.strip span{display:block;height:1.2em;line-height:1.2em;text-align:center}
.osep{color:var(--or2);font-weight:800;font-family:var(--math);padding:0 .02em}
.ana{width:min(66vw,250px);height:auto;display:block}
.timer.mini{--fs:20px;padding:6px 4px 6px;border-radius:10px;margin:0}
.timer.mini[data-style=lcd],.timer.mini[data-style=ledr],.timer.mini[data-style=ledg],.timer.mini[data-style=odo]{border-width:3px}
.timer.mini .host{min-height:1.2em}
.timer.mini .ana{width:92px}
.timer.mini[data-style=analogue]{padding:0}

/* clock picker */
.clockpick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cp{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);color:var(--ink);text-align:center}
.cp .timer{pointer-events:none;flex:1;display:flex;align-items:center;justify-content:center}
.cp[data-style=analogue] .timer{background:#2b5390;border-radius:10px}
.cp span{font-size:.9rem;color:var(--gr)}
.cp.sel{box-shadow:inset 0 0 0 3px var(--or);background:#fff1e6}
.cp.sel span{color:var(--ord)}

/* race */
.info{display:flex;justify-content:space-between;color:#dbe6fb;font-size:1rem;margin:0 4px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.one{grid-template-columns:1fr}
.tile{position:relative;border-radius:18px;color:#fff;min-height:112px;border:3px solid rgba(255,255,255,.55);overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.tiles.one .tile{min-height:96px}
.tile .tap{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color:inherit;text-align:left;padding:10px 12px}
.tile .nm{font-size:1.3rem;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.4);padding-right:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ln{font-size:.8rem;opacity:.9;text-transform:uppercase;letter-spacing:.1em}
.tile .st{font-size:.95rem;margin-top:6px;font-family:var(--math);font-variant-numeric:tabular-nums}
.tile .big{font-size:1.7rem}
.tile .undo{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:1.05rem;z-index:2}
.tile.off .tap{opacity:.55}
.tile.done{filter:saturate(.55) brightness(.82)}
.tile.flash{animation:fl .35s}
@keyframes fl{0%{box-shadow:0 0 0 0 #fff;transform:scale(.97)}100%{box-shadow:0 0 0 14px transparent;transform:scale(1)}}
.bar{display:flex;gap:10px;margin-top:14px}
.bar .btn{flex:1}

/* results */
.rank{width:100%;border-collapse:collapse;font-family:var(--math);font-variant-numeric:tabular-nums;color:var(--ink)}
.rank td,.rank th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
.rank th{color:var(--gr);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.rank td.r,.rank th.r{text-align:right}
.rcard .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rcard .head b{font-size:1.25rem;flex:1;font-family:'Super Bouncer',sans-serif;font-weight:400}
.pos{color:var(--ord)}
table.laps{width:100%;border-collapse:collapse;font-family:var(--math);font-variant-numeric:tabular-nums;color:var(--ink)}
table.laps td,table.laps th{padding:6px 4px;text-align:right;font-size:.95rem;border-bottom:1px solid var(--line)}
table.laps th{color:var(--gr);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
table.laps td:first-child,table.laps th:first-child{text-align:left}
table.laps tr.best td{background:#ffe6d3;color:var(--ord);font-weight:800}
table.laps tr.tot td{font-weight:800;border-top:2px solid var(--bl)}
.stats{margin-top:8px;font-size:.9rem;color:var(--gr)}
.stats b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:1rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>

<script>
(function(){
'use strict';
const COLS=['#dc2626','#2563eb','#ca8a04','#16a34a','#9333ea','#ea580c'];
const $=id=>document.getElementById(id);
const KEY='lom-sportsday-v1';
const STYLES=[['classic','Classic'],['lcd','LCD watch'],['ledr','Red LED'],['ledg','Green LED'],['odo','Odometer'],['analogue','Stopwatch']];

let cfg={n:6,names:['','','','','',''],laps:1,lapDist:400,totDist:100,totTouched:false,timeFmt:'s',speedFmt:'mps',clock:'classic'};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)cfg=Object.assign(cfg,s)}catch(e){}
if(!STYLES.some(s=>s[0]===cfg.clock))cfg.clock='classic';
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}

let race=null; // {t0, running, ended, endT, runners:[{name,splits:[]}]}
let raf=0;
let clock=null;

/* ---------- formatting ---------- */
function fmtTime(ms,mode){
  mode=mode||cfg.timeFmt;
  const cs=Math.round(ms/10);
  if(mode==='s'){return (cs/100).toFixed(2)}
  const m=Math.floor(cs/6000), r=cs-m*6000;
  const s=Math.floor(r/100), c=r%100;
  return m+':'+(s<10?'0':'')+s+'.'+(c<10?'0':'')+c;
}
function speed(d,ms){
  if(!(ms>0)||!(d>0))return null;
  const mps=d/(ms/1000);
  if(cfg.speedFmt==='mph')return mps*2.2369363;
  if(cfg.speedFmt==='kph')return mps*3.6;
  return mps;
}
function fmtSpeed(d,ms){const v=speed(d,ms);return v==null?'–':v.toFixed(2)}
function speedUnit(){return cfg.speedFmt==='mph'?'mph':cfg.speedFmt==='kph'?'km/h':'m/s'}
function timeUnit(){return cfg.timeFmt==='s'?'s':'m:ss.ss'}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function fmtDist(d){return (Math.round(d*100)/100).toString()}

/* ---------- timer styles ---------- */
const NS='http://www.w3.org/2000/svg';
const SEG={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
const SEGP={a:'10,4 14,0 42,0 46,4 42,8 14,8',b:'48,6 52,10 52,42 48,46 44,42 44,10',c:'48,50 52,54 52,86 48,90 44,86 44,54',
  d:'10,92 14,88 42,88 46,92 42,96 14,96',e:'8,50 12,54 12,86 8,90 4,86 4,54',f:'8,6 12,10 12,42 8,46 4,42 4,10',g:'10,48 14,44 42,44 46,48 42,52 14,52'};

function digitChars(ms){
  const cs=Math.round(ms/10),f=cs%100,f1=Math.floor(f/10),f2=f%10;
  if(cfg.timeFmt==='s'){
    const i=String(Math.floor(cs/100));
    return i.padStart(Math.max(3,i.length),' ').split('').concat(['.',f1,f2].map(String));
  }
  const m=String(Math.floor(cs/6000)),s=Math.floor((cs%6000)/100);
  return m.padStart(Math.max(2,m.length),' ').split('').concat([':',Math.floor(s/10),s%10,'.',f1,f2].map(String));
}

function createClassic(host){
  const d=document.createElement('div');d.className='classic';host.appendChild(d);
  return {update(ms){d.textContent=fmtTime(ms)}};
}

function createSeg(host){
  const wrap=document.createElement('div');wrap.className='seg7';host.appendChild(wrap);
  let cells=[],cur=[];
  function build(arr){
    wrap.innerHTML='';cells=[];cur=[];
    arr.forEach(ch=>{
      const svg=document.createElementNS(NS,'svg');
      if(ch===':'||ch==='.'){
        svg.setAttribute('viewBox','0 0 16 96');svg.style.width=(16/96)+'em';
        (ch===':'?[[4,26],[4,62]]:[[4,88]]).forEach(p=>{
          const r=document.createElementNS(NS,'rect');
          r.setAttribute('x',p[0]);r.setAttribute('y',p[1]);r.setAttribute('width',8);r.setAttribute('height',8);r.setAttribute('class','on');
          svg.appendChild(r);
        });
        cells.push(null);
      }else{
        svg.setAttribute('viewBox','0 0 56 96');svg.style.width=(56/96)+'em';
        const o={};
        for(const k in SEGP){const p=document.createElementNS(NS,'polygon');p.setAttribute('points',SEGP[k]);svg.appendChild(p);o[k]=p}
        cells.push(o);
      }
      cur.push(null);wrap.appendChild(svg);
    });
  }
  return {update(ms){
    const ch=digitChars(ms);
    if(ch.length!==cells.length)build(ch);
    ch.forEach((c,i)=>{
      const o=cells[i];if(!o||cur[i]===c)return;
      cur[i]=c;const on=SEG[c]||'';
      for(const k in o)o[k].setAttribute('class',on.indexOf(k)>=0?'on':'');
    });
  }};
}

function odoSpecs(ms){
  if(cfg.timeFmt==='s'){
    const w=Math.max(3,String(Math.floor(Math.round(ms/10)/100)).length),sp=[];
    for(let k=w-1;k>=0;k--)sp.push({u:1000*Math.pow(10,k),m:10});
    sp.push({sep:'.'},{u:100,m:10},{u:10,m:10});
    return sp;
  }
  return [{u:600000,m:10},{u:60000,m:10},{sep:':'},{u:10000,m:6},{u:1000,m:10},{sep:'.'},{u:100,m:10},{u:10,m:10}];
}
function createOdo(host){
  const wrap=document.createElement('div');wrap.className='odo';host.appendChild(wrap);
  let specs=[],els=[];
  function build(sp){
    wrap.innerHTML='';els=[];specs=sp;
    sp.forEach(s=>{
      if(s.sep){const d=document.createElement('span');d.className='osep';d.textContent=s.sep;wrap.appendChild(d);els.push(null);return}
      const w=document.createElement('div');w.className='wheel';
      const st=document.createElement('div');st.className='strip';
      for(let r=0;r<=s.m;r++){const x=document.createElement('span');x.textContent=r%s.m;st.appendChild(x)}
      w.appendChild(st);wrap.appendChild(w);els.push(st);
    });
  }
  return {update(ms,exact){
    const sp=odoSpecs(ms);
    if(sp.length!==specs.length)build(sp);
    const v=exact?Math.round(ms/10)*10:ms;
    specs.forEach((s,i)=>{
      const st=els[i];if(!st)return;
      const x=v/s.u,fl=Math.floor(x);
      let pos=fl%s.m;
      if(!exact){const f=x-fl;if(f>.85)pos+=(f-.85)/.15}
      st.style.transform='translateY('+(-pos*1.2)+'em)';
    });
  }};
}

function createAna(host){
  let t='';
  for(let i=0;i<60;i++){
    const big=i%5===0;
    t+='<line x1="150" y1="'+(170-(big?106:114))+'" x2="150" y2="48" stroke="#22304A" stroke-width="'+(big?3.5:1.6)+'" transform="rotate('+(i*6)+' 150 170)"/>';
  }
  for(let n=10;n<=60;n+=10){
    const a=n*6*Math.PI/180;
    t+='<text x="'+(150+90*Math.sin(a)).toFixed(1)+'" y="'+(170-90*Math.cos(a)+7).toFixed(1)+'" text-anchor="middle" font-size="21" fill="#22304A" font-family="Super Bouncer,Trebuchet MS,sans-serif">'+n+'</text>';
  }
  let sub='<circle cx="150" cy="228" r="34" fill="#fff" stroke="#3F73B8" stroke-width="2.5"/>';
  for(let i=0;i<30;i++)sub+='<line x1="150" y1="'+(228-34)+'" x2="150" y2="'+(228-(i%5===0?26:30))+'" stroke="#3F73B8" stroke-width="'+(i%5===0?2.2:1.2)+'" transform="rotate('+(i*12)+' 150 228)"/>';
  host.innerHTML='<svg class="ana" viewBox="0 0 300 316" xmlns="'+NS+'">'+
    '<rect x="134" y="0" width="32" height="22" rx="5" fill="#6B7580"/><rect x="141" y="18" width="18" height="12" fill="#9aa6b2"/>'+
    '<circle cx="150" cy="170" r="140" fill="#2B5390" stroke="#18305A" stroke-width="4"/>'+
    '<circle cx="150" cy="170" r="129" fill="#FFFAF4"/>'+t+
    '<text x="150" y="100" text-anchor="middle" font-size="13" letter-spacing="2" fill="#F47B3F" font-family="Super Bouncer,Trebuchet MS,sans-serif">SPORTS DAY</text>'+
    '<rect x="102" y="118" width="96" height="28" rx="7" fill="#E9EDF2"/>'+
    '<text class="rd" x="150" y="139" text-anchor="middle" font-size="20" font-weight="800" fill="#22304A" font-family="Trebuchet MS,Segoe UI,sans-serif">0.00</text>'+
    sub+
    '<g class="mh" transform="rotate(0 150 228)"><line x1="150" y1="236" x2="150" y2="202" stroke="#3F73B8" stroke-width="3.5" stroke-linecap="round"/></g>'+
    '<circle cx="150" cy="228" r="4" fill="#3F73B8"/>'+
    '<g class="sh" transform="rotate(0 150 170)"><line x1="150" y1="196" x2="150" y2="54" stroke="#F47B3F" stroke-width="3.5" stroke-linecap="round"/><circle cx="150" cy="186" r="5" fill="#F47B3F"/></g>'+
    '<circle cx="150" cy="170" r="8" fill="#F47B3F" stroke="#22304A" stroke-width="2"/></svg>';
  const sh=host.querySelector('.sh'),mh=host.querySelector('.mh'),rd=host.querySelector('.rd');
  return {update(ms,exact){
    const v=exact?Math.round(ms/10)*10:ms;
    sh.setAttribute('transform','rotate('+(((v/1000)%60)*6).toFixed(2)+' 150 170)');
    mh.setAttribute('transform','rotate('+(((v/60000)%30)*12).toFixed(2)+' 150 228)');
    rd.textContent=fmtTime(v);
  }};
}

function createClock(style,host){
  host.innerHTML='';
  const c=style==='lcd'||style==='ledr'||style==='ledg'?createSeg(host):style==='odo'?createOdo(host):style==='analogue'?createAna(host):createClassic(host);
  return c;
}
function mountClock(){
  const panel=$('timerPanel');
  panel.dataset.style=cfg.clock;
  clock=createClock(cfg.clock,$('clockHost'));
  if(race&&race.ended)clock.update(race.endT,true);
  else clock.update(race&&race.running?performance.now()-race.t0:0,!(race&&race.running));
}
function renderClockPicks(){
  const box=$('clockPick');box.innerHTML='';
  STYLES.forEach(s=>{
    const b=document.createElement('button');b.className='cp'+(cfg.clock===s[0]?' sel':'');b.dataset.style=s[0];b.dataset.k=s[0];
    b.innerHTML='<div class="timer mini" data-style="'+s[0]+'"><div class="host"></div></div><span>'+s[1]+'</span>';
    box.appendChild(b);
    createClock(s[0],b.querySelector('.host')).update(83450,true);
  });
}
$('clockPick').addEventListener('click',e=>{
  const b=e.target.closest('.cp');if(!b)return;
  cfg.clock=b.dataset.k;save();
  document.querySelectorAll('.cp').forEach(x=>x.classList.toggle('sel',x===b));
});

/* ---------- derived race geometry ---------- */
function lapLens(){
  const L=[];
  if(cfg.laps===1){L.push(cfg.totDist);return L}
  for(let i=0;i<cfg.laps-1;i++)L.push(cfg.lapDist);
  L.push(cfg.totDist-cfg.lapDist*(cfg.laps-1));
  return L;
}
function rname(i,src){const n=(src||cfg.names)[i];return (n&&n.trim())||('Lane '+(i+1))}

/* ---------- setup screen ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

function renderNames(){
  const box=$('names');box.innerHTML='';
  for(let i=0;i<cfg.n;i++){
    const d=document.createElement('div');d.className='nm';
    d.innerHTML='<span class="dot" style="background:'+COLS[i]+'">'+(i+1)+'</span>';
    const inp=document.createElement('input');inp.type='text';inp.maxLength=18;inp.placeholder='Lane '+(i+1);inp.value=cfg.names[i]||'';
    inp.addEventListener('input',()=>{cfg.names[i]=inp.value;save()});
    d.appendChild(inp);box.appendChild(d);
  }
}
function syncSetup(){
  $('rCount').textContent=cfg.n;
  $('lCount').textContent=cfg.laps;
  const straight=cfg.laps===1;
  $('lapDistWrap').style.display=straight?'none':'';
  $('totLabel').textContent=straight?'Race distance (m)':'Total distance (m)';
  $('lapDist').value=cfg.lapDist;
  $('totDist').value=cfg.totDist;
  document.querySelectorAll('#segTime button,#segTime2 button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.timeFmt));
  document.querySelectorAll('#segSpeed button,#segSpeed2 button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.speedFmt));
  syncNote();
  $('warn').textContent='';
}
function setLaps(v){
  cfg.laps=Math.max(1,Math.min(20,v));
  if(!cfg.totTouched) cfg.totDist=cfg.laps===1?cfg.lapDist:cfg.lapDist*cfg.laps;
  save();syncSetup();
}
$('rMinus').onclick=()=>{cfg.n=Math.max(1,cfg.n-1);save();renderNames();syncSetup()};
$('rPlus').onclick=()=>{cfg.n=Math.min(6,cfg.n+1);save();renderNames();syncSetup()};
$('lMinus').onclick=()=>setLaps(cfg.laps-1);
$('lPlus').onclick=()=>setLaps(cfg.laps+1);
$('lapDist').addEventListener('input',e=>{
  const v=parseFloat(e.target.value);if(!(v>0))return;
  cfg.lapDist=v;if(!cfg.totTouched){cfg.totDist=v*cfg.laps;$('totDist').value=cfg.totDist}
  save();syncNote();
});
$('totDist').addEventListener('input',e=>{
  const v=parseFloat(e.target.value);if(!(v>0))return;
  cfg.totDist=v;cfg.totTouched=true;
  if(cfg.laps===1)cfg.lapDist=v;
  save();syncNote();
});
function syncNote(){
  let note='';
  if(cfg.laps>1&&cfg.lapDist>0&&cfg.totDist>0){
    const last=lapLens().slice(-1)[0];
    if(last<=0)note='Total distance is too short for this many laps.';
    else if(Math.abs(last-cfg.lapDist)>1e-9)note='Final lap is '+fmtDist(last)+' m.';
    else note=cfg.laps+' × '+fmtDist(cfg.lapDist)+' m';
  }
  $('lapNote').textContent=note;
}
function bindSeg(id,key,after){
  $(id).addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    cfg[key]=b.dataset.v;save();syncSetup();if(after)after();
  });
}
bindSeg('segTime','timeFmt',renderClockPicks);bindSeg('segSpeed','speedFmt');
bindSeg('segTime2','timeFmt',()=>{renderClockPicks();renderResults()});bindSeg('segSpeed2','speedFmt',renderResults);

$('toRace').onclick=()=>{
  if(!(cfg.totDist>0)){$('warn').textContent='Enter the race distance.';return}
  if(cfg.laps>1){
    if(!(cfg.lapDist>0)){$('warn').textContent='Enter the lap distance.';return}
    if(lapLens().slice(-1)[0]<=0){$('warn').textContent='Total distance is too short for '+cfg.laps+' laps of '+fmtDist(cfg.lapDist)+' m.';return}
  }
  prepRace();show('race');
};

/* ---------- race screen ---------- */
function prepRace(){
  cancelAnimationFrame(raf);
  race={t0:0,running:false,ended:false,endT:0,
    runners:Array.from({length:cfg.n},(_,i)=>({name:rname(i),splits:[]}))};
  const straight=cfg.laps===1;
  $('timerPanel').classList.remove('done');
  mountClock();
  $('clockLabel').textContent='Elapsed time ('+timeUnit()+')';
  $('raceInfo').textContent=straight?fmtDist(cfg.totDist)+' m straight':cfg.laps+' laps · '+fmtDist(cfg.totDist)+' m';
  $('raceCount').textContent='';
  $('startBtn').style.display='';
  $('tiles').style.display='none';
  $('endBtn').style.display='none';
  $('backBtn').style.display='';
  buildTiles();
}
function buildTiles(){
  const box=$('tiles');box.innerHTML='';
  box.className='tiles'+(cfg.n===1?' one':'');
  race.runners.forEach((r,i)=>{
    const t=document.createElement('div');t.className='tile off';t.id='tile'+i;t.style.background=COLS[i];
    t.innerHTML='<button class="tap" data-i="'+i+'"><div class="ln">Lane '+(i+1)+'</div><div class="nm"></div><div class="st"></div></button><button class="undo" data-u="'+i+'" title="Undo last tap">↶</button>';
    box.appendChild(t);
  });
  race.runners.forEach((_,i)=>updateTile(i));
}
function updateTile(i){
  const r=race.runners[i],t=$('tile'+i),laps=cfg.laps,k=r.splits.length;
  t.querySelector('.nm').textContent=r.name;
  const st=t.querySelector('.st');
  const done=k>=laps;
  t.classList.toggle('done',done);
  t.querySelector('.undo').style.display=k>0?'':'none';
  if(done){
    const pos=race.runners.filter(x=>x.splits.length>=laps&&x.splits[laps-1]<=r.splits[laps-1]).length;
    st.innerHTML='<div class="big">'+ord(pos)+'</div>'+fmtTime(r.splits[laps-1])+' '+(cfg.timeFmt==='s'?'s':'');
  }else if(laps===1){
    st.innerHTML='<div class="big">TAP</div>at the line';
  }else{
    const last=k>0?r.splits[k-1]-(k>1?r.splits[k-2]:0):null;
    st.innerHTML='<div class="big">Lap '+(k+1)+'<span style="font-size:.9rem"> / '+laps+'</span></div>'+(last!=null?'Last: '+fmtTime(last):'Tap each lap');
  }
}
function finishedCount(){return race.runners.filter(r=>r.splits.length>=cfg.laps).length}
function updateCount(){$('raceCount').textContent=finishedCount()+' / '+cfg.n+' finished'}

function tick(){
  if(!race||!race.running)return;
  clock.update(performance.now()-race.t0);
  raf=requestAnimationFrame(tick);
}
$('startBtn').addEventListener('pointerdown',e=>{
  e.preventDefault();
  race.t0=performance.now();race.running=true;
  $('startBtn').style.display='none';
  $('tiles').style.display='';
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('off'));
  $('endBtn').style.display='';$('backBtn').style.display='none';
  updateCount();
  raf=requestAnimationFrame(tick);
  if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}
});
$('tiles').addEventListener('pointerdown',e=>{
  const now=performance.now();
  if(!race||!race.running)return;
  const u=e.target.closest('[data-u]');
  if(u){
    e.preventDefault();
    const i=+u.dataset.u,r=race.runners[i];
    if(r.splits.length){r.splits.pop();updateTile(i);updateCount();toast('Undid last tap for '+r.name);}
    return;
  }
  const b=e.target.closest('[data-i]');if(!b)return;
  e.preventDefault();
  const i=+b.dataset.i,r=race.runners[i];
  if(r.splits.length>=cfg.laps)return;
  r.splits.push(now-race.t0);
  const t=$('tile'+i);t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');
  if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){}
  updateTile(i);updateCount();
  if(finishedCount()===cfg.n){
    endRace(Math.max(...race.runners.map(x=>x.splits[cfg.laps-1])));
  }
});
function endRace(endT){
  race.running=false;race.ended=true;race.endT=endT;
  cancelAnimationFrame(raf);
  clock.update(endT,true);
  $('timerPanel').classList.add('done');
  setTimeout(()=>{renderResults();show('results')},900);
}
$('endBtn').onclick=()=>{
  if(!race.running)return;
  if(!confirm('End the race now? Anyone not finished will be marked DNF.'))return;
  endRace(performance.now()-race.t0);
};
$('backBtn').onclick=()=>show('setup');

/* ---------- results ---------- */
function renderResults(){
  if(!race)return;
  const laps=cfg.laps,lens=lapLens(),straight=laps===1;
  $('resInfo').textContent=(straight?fmtDist(cfg.totDist)+' m straight':laps+' laps · '+fmtDist(cfg.totDist)+' m')+' · times in '+timeUnit()+', speeds in '+speedUnit();
  const info=race.runners.map((r,i)=>{
    const fin=r.splits.length>=laps;
    return {i,r,fin,total:fin?r.splits[laps-1]:null};
  });
  const order=info.filter(x=>x.fin).sort((a,b)=>a.total-b.total);
  order.forEach((x,k)=>{x.pos=k+1;if(k&&Math.abs(x.total-order[k-1].total)<1e-9)x.pos=order[k-1].pos});
  let h='<h2>Finishing order</h2><table class="rank"><tr><th>Pos</th><th>Runner</th><th class="r">Time</th><th class="r">Avg '+speedUnit()+'</th>'+(straight?'':'<th class="r">Best lap</th>')+'</tr>';
  const lapTimes=x=>x.r.splits.map((s,k)=>s-(k?x.r.splits[k-1]:0));
  const bestOf=x=>{const lt=lapTimes(x);let b=-1;lt.forEach((t,k)=>{if(b<0||t/lens[k]<lt[b]/lens[b])b=k});return b};
  order.forEach(x=>{
    let bl='';
    if(!straight){const lt=lapTimes(x),b=bestOf(x);bl=fmtTime(lt[b])}
    h+='<tr><td class="pos">'+ord(x.pos)+'</td><td><span class="dot" style="display:inline-grid;vertical-align:middle;margin-right:6px;background:'+COLS[x.i]+'">'+(x.i+1)+'</span>'+esc(x.r.name)+'</td><td class="r">'+fmtTime(x.total)+'</td><td class="r">'+fmtSpeed(cfg.totDist,x.total)+'</td>'+(straight?'':'<td class="r">'+bl+'</td>')+'</tr>';
  });
  info.filter(x=>!x.fin).forEach(x=>{
    h+='<tr><td>DNF</td><td><span class="dot" style="display:inline-grid;vertical-align:middle;margin-right:6px;background:'+COLS[x.i]+'">'+(x.i+1)+'</span>'+esc(x.r.name)+'</td><td class="r" colspan="'+(straight?2:3)+'">'+(x.r.splits.length?x.r.splits.length+' of '+laps+' laps':'–')+'</td></tr>';
  });
  h+='</table>';
  $('rankCard').innerHTML=h;

  let c='';
  const ordered=order.concat(info.filter(x=>!x.fin));
  ordered.forEach(x=>{
    const lt=lapTimes(x);
    c+='<div class="card rcard"><div class="head"><span class="dot" style="background:'+COLS[x.i]+'">'+(x.i+1)+'</span><b>'+esc(x.r.name)+'</b>'+(x.fin?'<span class="pos">'+ord(x.pos)+'</span>':'<span style="color:#c0392b">DNF</span>')+'</div>';
    if(straight){
      c+='<table class="laps"><tr><th>Distance</th><th>Time</th><th>Speed '+speedUnit()+'</th></tr>';
      c+=x.fin?'<tr class="tot"><td>'+fmtDist(cfg.totDist)+' m</td><td>'+fmtTime(x.total)+'</td><td>'+fmtSpeed(cfg.totDist,x.total)+'</td></tr>':'<tr><td colspan="3" style="text-align:left">No time recorded</td></tr>';
      c+='</table>';
    }else{
      const b=lt.length?bestOf(x):-1;
      c+='<table class="laps"><tr><th>Lap</th><th>Lap time</th><th>'+speedUnit()+'</th><th>Elapsed</th></tr>';
      lt.forEach((t,k)=>{
        c+='<tr'+(k===b&&lt.length>1?' class="best"':'')+'><td>'+(k+1)+(k===b&&lt.length>1?' ★':'')+'</td><td>'+fmtTime(t)+'</td><td>'+fmtSpeed(lens[k],t)+'</td><td>'+fmtTime(x.r.splits[k])+'</td></tr>';
      });
      if(x.fin)c+='<tr class="tot"><td>Total</td><td>'+fmtTime(x.total)+'</td><td>'+fmtSpeed(cfg.totDist,x.total)+'</td><td></td></tr>';
      c+='</table>';
      if(lt.length>1)c+='<div class="stats">★ Best lap: <b>'+(b+1)+'</b> ('+fmtTime(lt[b])+', '+fmtSpeed(lens[b],lt[b])+' '+speedUnit()+')</div>';
    }
    c+='</div>';
  });
  $('runnerCards').innerHTML=c;
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

$('copyBtn').onclick=()=>{
  const laps=cfg.laps,lens=lapLens(),straight=laps===1;
  let out='SPORTS DAY\n'+(straight?fmtDist(cfg.totDist)+' m':laps+' laps, '+fmtDist(cfg.totDist)+' m')+'\nTimes in '+timeUnit()+', speeds in '+speedUnit()+'\n\n';
  const fin=race.runners.map((r,i)=>({r,i,f:r.splits.length>=laps})).sort((a,b)=>(b.f-a.f)||((a.r.splits[laps-1]||0)-(b.r.splits[laps-1]||0)));
  let p=0;
  fin.forEach(x=>{
    out+=(x.f?ord(++p):'DNF')+'  '+x.r.name+(x.f?'  '+fmtTime(x.r.splits[laps-1])+'  ('+fmtSpeed(cfg.totDist,x.r.splits[laps-1])+' '+speedUnit()+')':'')+'\n';
    if(!straight){
      let best=-1,bt=0;
      x.r.splits.forEach((s,k)=>{const t=s-(k?x.r.splits[k-1]:0);if(best<0||t/lens[k]<bt/lens[best]){best=k;bt=t}});
      x.r.splits.forEach((s,k)=>{const t=s-(k?x.r.splits[k-1]:0);out+='   Lap '+(k+1)+': '+fmtTime(t)+'  '+fmtSpeed(lens[k],t)+' '+speedUnit()+(k===best&&x.r.splits.length>1?'  *best':'')+'\n'});
    }
  });
  const done=()=>toast('Results copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out).then(done,()=>fallback(out))}else fallback(out);
  function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Copy not available')}a.remove()}
};
$('newBtn').onclick=()=>{prepRace();show('race')};
$('setupBtn').onclick=()=>show('setup');

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}

window.addEventListener('beforeunload',e=>{if(race&&race.running){e.preventDefault();e.returnValue=''}});

renderNames();syncSetup();renderClockPicks();
})();
</script>
</body>
