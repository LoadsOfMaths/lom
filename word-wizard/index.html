<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F47B3F">
<title>Word Wizard | LoadsOfMaths</title>
<style>
:root{--bg:#f4efe4;--card:#fffdf7;--ink:#1c2a39;--muted:#5d6b7a;--accent:#0e6b6e;--accent-d:#0a4f52;--warm:#c2410c;--good:#157347;--bad:#b42318;--line:#d8ccb4;--tile:#e5f0ef;--gold:#f2c14e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;min-height:100vh}
button,select,input{font:inherit;color:inherit}
#app{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:clamp(2rem,5vw,3.2rem);margin:.2em 0 .1em;letter-spacing:-.5px}
h2{font-size:1.15rem;margin:0 0 .6em;color:var(--accent-d)}
.hero{text-align:center;padding:18px 0 8px}
.hero p{margin:0;color:var(--muted);font-size:1.15rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}
.tile-game{--c:var(--accent);text-align:left;background:var(--card);border:2px solid var(--line);border-left:12px solid var(--c);border-radius:16px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.tile-game:hover,.tile-game:focus-visible{transform:translateY(-2px);border-color:var(--c);outline:none}
.tg-name{font-size:1.5rem;font-weight:700;color:var(--c)}
.tg-blurb{color:var(--muted);font-size:1rem}
.foot-note{text-align:center;color:var(--muted);margin-top:26px;font-size:.95rem}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:14px}
.bar .bt{font-weight:700;font-size:1.2rem;flex:1;min-width:140px}
.bar .stat{color:var(--muted);font-weight:600}
.bar .score{background:var(--gold);color:#3d2c00;border-radius:999px;padding:2px 14px;font-weight:700}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:.55em 1.1em;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--accent-d)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.btn.alt{background:#fff;color:var(--accent-d);border:2px solid var(--accent);box-shadow:none}
.btn.warn{background:var(--warm);box-shadow:0 3px 0 #8a2d08}
.btn.big{font-size:1.3rem;padding:.7em 1.8em}
.btn.small{font-size:.9rem;padding:.35em .8em}
.btn:disabled{opacity:.4;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.opt:last-child{border-bottom:0}
.opt select{padding:.3em .5em;border:2px solid var(--line);border-radius:8px;background:#fff}
.opt input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.3em .9em;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{font-weight:400;opacity:.85}
.count{font-size:1.1rem;font-weight:700;margin:10px 0}
.count.zero{color:var(--bad)}
.desc{color:var(--muted);margin:0 0 10px}
.stage{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;min-height:300px}
.foot{margin-top:14px}
.banner{border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.banner.good{background:#e1f3e8;border:2px solid var(--good)}
.banner.bad{background:#fbe9e5;border:2px solid var(--warm)}
.banner .ans{font-size:1.6rem;font-weight:800;letter-spacing:1px}
.banner .meaning{flex-basis:100%;color:var(--muted);font-size:1rem}
.clues{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.clue{background:var(--tile);border-radius:10px;padding:8px 14px;font-size:1.15rem}
.clue.vague{font-style:italic;color:#2f4d4d}
.clue.big{font-size:1.5rem;font-weight:600}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 0;margin:10px 0 14px;align-items:flex-end}
.wgroup{display:inline-flex;gap:6px}
.sep{display:inline-block;min-width:22px;text-align:center;font-size:2rem;font-weight:700;line-height:1.5}
.sep.sp{min-width:34px}
.box{width:clamp(30px,5.2vw,54px);height:clamp(42px,6.5vw,66px);border-bottom:5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:800;background:#fff;border-radius:6px 6px 0 0}
.box.missed{color:var(--bad)}
.kb{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.kbrow{display:flex;gap:6px;justify-content:center}
.key{min-width:clamp(28px,5.4vw,52px);height:clamp(38px,6vw,54px);border:2px solid var(--line);background:#fff;border-radius:8px;font-weight:700;cursor:pointer;padding:0 4px}
.key.wide{min-width:clamp(50px,9vw,90px)}
.key.hit{background:#cdeed8;border-color:var(--good)}
.key.miss{background:#f6d4cf;border-color:var(--bad);color:var(--bad)}
.key.used{background:#cfe3e2;border-color:var(--accent)}
.key:disabled{cursor:default}
.hm{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:18px;align-items:start}
@media(max-width:640px){.hm{grid-template-columns:1fr}}
.gallows svg{width:100%;max-height:300px}
.lives{font-weight:700;margin:6px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--bad);margin-right:4px;vertical-align:-1px}
.dot.gone{background:#ddd}
.wrongline{color:var(--bad);font-weight:700;min-height:1.5em}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.msg{min-height:1.6em;text-align:center;color:var(--warm);font-weight:700;margin-top:8px}
.rowlabel{font-weight:700;color:var(--muted);margin:14px 0 4px;text-align:center}
.slots,.tilerow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.slot{width:clamp(36px,6vw,60px);height:clamp(46px,7vw,70px);border:3px dashed var(--line);border-radius:10px;background:#fff;font-size:clamp(1.5rem,3.6vw,2.4rem);font-weight:800;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--tile)}
.slot.locked{border-color:var(--gold);background:#fff6d6;cursor:default}
.slot.good{border-color:var(--good);background:#cdeed8}
.slot.bad{border-color:var(--bad);background:#f6d4cf;animation:shake .35s}
.tilec{width:clamp(36px,6vw,60px);height:clamp(46px,7vw,70px);border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:clamp(1.5rem,3.6vw,2.4rem);font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--accent-d)}
.tilec.used{visibility:hidden}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cbox{width:clamp(32px,5.4vw,56px);height:clamp(44px,6.8vw,68px);border:3px solid var(--ink);border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:clamp(1.5rem,3.4vw,2.4rem);font-weight:800;cursor:pointer}
.cbox.cur{border-color:var(--accent);box-shadow:0 0 0 4px #9fd3d1}
.cbox.lock{background:#fff6d6;border-color:#b08a00}
.cbox.bad{background:#f6d4cf;border-color:var(--bad);animation:shake .35s}
.cbox.good{background:#cdeed8;border-color:var(--good)}
.symcol{display:inline-flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px;border-radius:12px;border:3px solid transparent}
.symcol.sel{border-color:var(--accent);background:#e5f0ef}
.symcol svg{width:clamp(34px,6vw,54px);height:clamp(34px,6vw,54px)}
.symbox{width:clamp(30px,5.2vw,48px);height:clamp(36px,5.8vw,52px);border-bottom:4px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(1.4rem,3.2vw,2.2rem);font-weight:800}
.symbox.lock{background:#fff6d6}
.symbox.bad{color:var(--bad);background:#f6d4cf}
.symbox.good{color:var(--good);background:#cdeed8}
.symword{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 4px;margin:10px 0}
.symsep{align-self:center;min-width:28px;text-align:center;font-size:2rem;font-weight:700}
.riddle{font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.7;max-width:760px;margin:0 auto}
.riddle .rl{padding:2px 0}
.riddle .rl b{color:var(--accent-d);letter-spacing:.5px}
.riddle .rl.new{animation:fadein .5s}
.riddle .whole{margin-top:8px;font-weight:700;color:var(--warm)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.guessrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.guessrow input{font-size:1.3rem;padding:.4em .7em;border:3px solid var(--line);border-radius:10px;min-width:min(340px,90%);text-transform:uppercase}
.guessrow input.bad{border-color:var(--bad);animation:shake .35s}
table.res{width:100%;border-collapse:collapse;margin:8px 0 16px}
.res th,.res td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.res td.n{text-align:right}
.tick{color:var(--good);font-weight:800}.cross{color:var(--bad);font-weight:800}
.bigscore{font-size:2.4rem;font-weight:800;color:var(--accent-d)}

  --font:'Anak Orang','Segoe Print','Bradley Hand','Comic Sans MS',cursive;--heading:'Super Bouncer','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif}
html{background:#1d1650}
body{font-family:var(--font);font-size:20px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;

h1,h2,.tg-name,.bt,.bigscore,.score,.chip,.btn,.count,.rowlabel,.banner .ans{font-family:var(--heading)}
.box,.key,.slot,.tilec,.cbox,.symbox,.sep{font-family:var(--heading);font-weight:400}
.btn,.chip{letter-spacing:.3px}

const ORD=['first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth','seventeenth','eighteenth','nineteenth','twentieth','twenty-first','twenty-second','twenty-third','twenty-fourth','twenty-fifth'];
function riddleParts(letter,answer,amb){
  const range=amb==='easy'?[1,2]:amb==='hard'?[3,5]:[2,3];
  const withL=[],without=[];
  RW.forEach((w,i)=>{if(w===answer)return;(RSET[i].has(letter)?withL:without).push(i);});
  const style=Math.random()<0.5?'also':'not';
  let best=null,bs=1e9;
  for(let t=0;t<800;t++){
    const x=pick(withL);let y,c=0;
    if(style==='also'){y=pick(withL);if(y===x)continue;for(const ch of RSET[x])if(RSET[y].has(ch))c++;}
    else{y=pick(without);for(const ch of RSET[x])if(!RSET[y].has(ch))c++;}
    const d=c<range[0]?range[0]-c:c>range[1]?c-range[1]:0;
    if(d<bs){bs=d;best={x,y,style,c};if(d===0)break;}
  }
  return best;
}
function riddleLines(entry,amb){
  const ans=lettersOf(entry.t);const out=[];
  [...ans].forEach((ch,i)=>{
    const p=riddleParts(ch,ans,amb);const X=RW[p.x].toUpperCase(),Y=RW[p.y].toUpperCase(),o=ORD[i];
    let txt;
    if(p.style==='also')txt=[`My ${o} is in `,X,' and also in ',Y];
    else txt=Math.random()<0.5?[`My ${o}'s in `,X,', but not in ',Y]:[`My ${o} is in `,X,', but not in ',Y];
    out.push({parts:txt,x:p.x,y:p.y,style:p.style,letter:ch,end:(i%2===0&&i<ans.length-1)?',':';'});
  });
  return out;
}

  app.append(el('div',{class:'panel'},el('div',{class:'bigscore'},S.score+' points'),el('p',null,solved+' of '+S.results.length+' words solved'),

/* ---------- Hangman ---------- */
const GALLOWS=[
 '<line x1="20" y1="225" x2="120" y2="225"/>','<line x1="60" y1="225" x2="60" y2="25"/>','<line x1="58" y1="25" x2="150" y2="25"/>','<line x1="60" y1="60" x2="95" y2="25"/>',
 '<line x1="140" y1="25" x2="140" y2="55"/>','<circle cx="140" cy="75" r="20"/>','<line x1="140" y1="95" x2="140" y2="150"/>','<line x1="140" y1="108" x2="112" y2="135"/>',
 '<line x1="140" y1="108" x2="168" y2="135"/>','<line x1="140" y1="150" x2="118" y2="190"/>','<line x1="140" y1="150" x2="162" y2="190"/>',
 '<circle cx="133" cy="71" r="2" fill="#1c2a39"/><circle cx="147" cy="71" r="2" fill="#1c2a39"/><path d="M132 83 Q140 77 148 83"/>'];
function Hangman(entry,ctx){
  const o=ctx.opts,lives=+o.lives,show=!!o.showGuessed;
  const L=new Set(lettersOf(entry.t));const guessed=new Set();let wrong=0,over=false;
  const lay=layoutWord(entry.t,(n,ch)=>({el:el('span',{class:'box'}),ch}));
  const svg=el('div',{class:'gallows'});const livesEl=el('div',{class:'lives'});const wrongEl=el('div',{class:'wrongline'});
  const kb=keyboard(guess,null);
  function draw(){const k=Math.ceil(wrong*GALLOWS.length/lives);svg.innerHTML='<svg viewBox="0 0 200 240" fill="none" stroke="#1c2a39" stroke-width="5" stroke-linecap="round">'+GALLOWS.slice(0,k).join('')+'</svg>';}
  function update(reveal){
    lay.cells.forEach(c=>{const g=guessed.has(c.ch);if(g||reveal){c.el.textContent=c.ch.toUpperCase();if(reveal&&!g)c.el.classList.add('missed');}});
    livesEl.innerHTML='';livesEl.append('Lives left: '+(lives-wrong)+'  ');
    if(lives<=12)for(let i=0;i<lives;i++)livesEl.append(el('span',{class:'dot'+(i>=lives-wrong?' gone':'')}));
    wrongEl.textContent=show&&wrong?'Not in the word: '+[...guessed].filter(c=>!L.has(c)).join(' ').toUpperCase():'';
    if(show)for(const c of guessed){const b=kb.keys[c];b.classList.add(L.has(c)?'hit':'miss');b.disabled=true;}
    draw();
  }
  function guess(ch){
    if(over||guessed.has(ch))return;
    guessed.add(ch);if(!L.has(ch))wrong++;
    if([...L].every(c=>guessed.has(c))){over=true;update();ctx.done(true,Math.max(1,Math.round(10*(lives-wrong)/lives)));}
    else if(wrong>=lives){over=true;update(true);ctx.done(false,0);}
    else update();
  }
  const clue=clueBlock(entry,o.clue);
  const giveUp=el('button',{class:'btn alt small',type:'button',onclick:()=>{if(over)return;over=true;update(true);ctx.done(false,0);}},'Show answer');
  ctx.stage.append(el('div',{class:'hm'},el('div',null,svg,livesEl),el('div',null,clue,lay.el,wrongEl,kb.el,el('div',{class:'ctrls'},giveUp))));
  update();
  return{key(e){if(/^[a-z]$/i.test(e.key))guess(e.key.toLowerCase());}};
}

/* ---------- Anagram (with optional dummy letters) ---------- */
function Anagram(entry,ctx,dummies){
  const o=ctx.opts;const D=dummies?+o.dummies:0;
  const alpha='etaoinsrhldcumfpgwybvk';
  const{words}=parse(entry.t);
  let hints=0,bad=0,over=false;
  const rows=words.map((w,wi)=>{
    const tiles=[...w].map((ch,i)=>({ch,placed:false,id:wi+'_'+i}));
    for(let k=0;k<D;k++)tiles.push({ch:alpha[Math.floor(Math.random()*alpha.length)],placed:false,id:wi+'_d'+k});
    let t=tiles;
    for(let n=0;n<60;n++){t=shuffle(tiles);if(w.length<2||new Set(w).size<2)break;if(t.slice(0,w.length).map(x=>x.ch).join('')!==w||D>0)break;}
    return{w,tiles:t,slots:new Array(w.length).fill(null),locked:new Array(w.length).fill(false)};
  });
  const box=el('div');const msg=el('div',{class:'msg'});
  function draw(state){
    box.innerHTML='';
    rows.forEach((r,ri)=>{
      if(rows.length>1)box.append(el('div',{class:'rowlabel'},'Word '+(ri+1)+' ('+r.w.length+' letters'+(D?' + '+D+' extra':'')+')'));
      else if(D)box.append(el('div',{class:'rowlabel'},r.w.length+' letters + '+D+' extra'));
      box.append(el('div',{class:'slots'},r.slots.map((t,si)=>el('button',{type:'button',class:'slot'+(t?' filled':'')+(r.locked[si]?' locked':'')+(state==='good'?' good':'')+(state==='bad'&&t&&!r.locked[si]?' bad':''),onclick:()=>unplace(ri,si)},t?t.ch.toUpperCase():''))));
      box.append(el('div',{class:'tilerow'},r.tiles.map(t=>el('button',{type:'button',class:'tilec'+(t.placed?' used':''),disabled:t.placed,onclick:()=>place(ri,t)},t.ch.toUpperCase()))));
    });
  }
  function place(ri,t){
    if(over||t.placed)return;const r=rows[ri];const si=r.slots.indexOf(null);if(si<0)return;
    r.slots[si]=t;t.placed=true;msg.textContent='';draw();checkFull();
  }
  function unplace(ri,si){const r=rows[ri];if(over||r.locked[si]||!r.slots[si])return;r.slots[si].placed=false;r.slots[si]=null;msg.textContent='';draw();}
  function checkFull(){
    if(!rows.every(r=>r.slots.every(Boolean)))return;
    if(rows.every(r=>r.slots.map(t=>t.ch).join('')===r.w)){over=true;draw('good');ctx.done(true,Math.max(1,10-2*hints-bad));}
    else{bad++;draw('bad');msg.textContent='Not quite. Tap a letter to take it back out.';}
  }
  function curRow(){return rows.findIndex(r=>r.slots.includes(null));}
  function typeLetter(ch){
    const ri=curRow();if(ri<0||over)return;const t=rows[ri].tiles.find(x=>!x.placed&&x.ch===ch);if(t)place(ri,t);
  }
  function back(){
    if(over)return;
    for(let ri=rows.length-1;ri>=0;ri--){const r=rows[ri];for(let si=r.slots.length-1;si>=0;si--)if(r.slots[si]&&!r.locked[si]){unplace(ri,si);return;}}
  }
  function hint(){
    if(over)return;
    let ri=rows.findIndex(r=>r.slots.some((t,i)=>!t||t.ch!==r.w[i]));if(ri<0)return;
    const r=rows[ri];const p=r.slots.findIndex((t,i)=>!t||t.ch!==r.w[i]);
    for(let q=p;q<r.slots.length;q++)if(r.slots[q]&&!r.locked[q]){r.slots[q].placed=false;r.slots[q]=null;}
    const t=r.tiles.find(x=>!x.placed&&x.ch===r.w[p]);if(!t)return;
    r.slots[p]=t;t.placed=true;r.locked[p]=true;hints++;msg.textContent='';draw();checkFull();
  }
  function reshuffle(){if(over)return;rows.forEach(r=>{r.tiles=shuffle(r.tiles);});draw();}
  function giveUp(){if(over)return;over=true;rows.forEach(r=>{r.tiles.forEach(t=>t.placed=false);});ctx.done(false,0);}
  const clue=clueBlock(entry,o.clue);
  ctx.stage.append(clue||'',box,msg,el('div',{class:'ctrls'},
    el('button',{class:'btn alt small',type:'button',onclick:reshuffle},'Shuffle'),
    el('button',{class:'btn alt small',type:'button',onclick:hint},'Hint (-2 points)'),
    el('button',{class:'btn alt small',type:'button',onclick:giveUp},'Show answer')));
  draw();
  return{key(e){if(/^[a-z]$/i.test(e.key))typeLetter(e.key.toLowerCase());else if(e.key==='Backspace')back();}};
}

/* ---------- Crossword Clue ---------- */
function Crossword(entry,ctx){
  const o=ctx.opts;const ans=lettersOf(entry.t);const n=ans.length;
  const arr=new Array(n).fill('');const lock=new Array(n).fill(false);
  let cur=0,hints=0,wrongChecks=0,topicUsed=false,over=false,showTopic=o.topic==='always';
  if(o.first){arr[0]=ans[0];lock[0]=true;cur=n>1?1:0;}
  const lay=layoutWord(entry.t,(i,ch)=>{const b=el('button',{type:'button',class:'cbox',onclick:()=>{if(!over){cur=i;draw();}}});return{el:b,i};});
  const msg=el('div',{class:'msg'});const topicEl=el('div',{class:'clue vague'},entry.v);
  const topicBtn=el('button',{class:'btn alt small',type:'button',onclick:()=>{if(over)return;if(!showTopic){showTopic=true;if(o.topic==='request')topicUsed=true;}draw();}},'Topic hint (-1 point)');
  function draw(state){
    lay.cells.forEach(c=>{const b=c.el;b.textContent=arr[c.i].toUpperCase();b.className='cbox'+(c.i===cur&&!over?' cur':'')+(lock[c.i]?' lock':'')+(state==='good'?' good':'')+(state==='bad'&&arr[c.i]!==ans[c.i]&&!lock[c.i]?' bad':'');});
    topicEl.style.display=showTopic?'':'none';topicBtn.style.display=(o.topic==='request'&&!showTopic)?'':'none';
  }
  function nextFree(from,dir){let i=from+dir;while(i>=0&&i<n&&lock[i])i+=dir;return i>=0&&i<n?i:from;}
  function setLetter(ch){
    if(over)return;if(lock[cur]){cur=nextFree(cur,1);}
    if(lock[cur])return;
    arr[cur]=ch;msg.textContent='';
    const nx=nextFree(cur,1);if(nx!==cur)cur=nx;draw();
  }
  function back(){
    if(over)return;
    if(arr[cur]&&!lock[cur]){arr[cur]='';}
    else{const p=nextFree(cur,-1);if(p!==cur){cur=p;if(!lock[cur])arr[cur]='';}}
    msg.textContent='';draw();
  }
  function check(){
    if(over)return;
    if(arr.some(x=>!x)){msg.textContent='Fill every box first.';return;}
    if(arr.join('')===ans){over=true;draw('good');ctx.done(true,Math.max(1,10-2*hints-wrongChecks-(topicUsed?1:0)));}
    else{wrongChecks++;draw('bad');msg.textContent='Not quite. The red boxes are wrong.';}
  }
  function reveal(){
    if(over)return;
    let i=(!lock[cur]&&arr[cur]!==ans[cur])?cur:arr.findIndex((x,k)=>x!==ans[k]);
    if(i<0)return;arr[i]=ans[i];lock[i]=true;hints++;
    const w=arr.findIndex((x,k)=>x!==ans[k]);if(w>=0)cur=w;
    draw();if(arr.join('')===ans)check();
  }
  function giveUp(){if(over)return;over=true;ctx.done(false,0);}
  const kb=keyboard(setLetter,back);
  ctx.stage.append(
    el('div',{class:'clue big'},maskClue(entry)+' '+patternOf(entry.t)),topicEl,lay.el,msg,kb.el,
    el('div',{class:'ctrls'},el('button',{class:'btn small',type:'button',onclick:check},'Check'),el('button',{class:'btn alt small',type:'button',onclick:reveal},'Reveal a letter (-2 points)'),topicBtn,el('button',{class:'btn alt small',type:'button',onclick:giveUp},'Show answer')));
  draw();
  return{key(e){
    if(/^[a-z]$/i.test(e.key))setLetter(e.key.toLowerCase());
    else if(e.key==='Backspace')back();
    else if(e.key==='Enter')check();
    else if(e.key==='ArrowLeft'){cur=Math.max(0,cur-1);draw();}
    else if(e.key==='ArrowRight'){cur=Math.min(n-1,cur+1);draw();}
  }};
}

/* ---------- Symbols ---------- */
function starPts(){const p=[];for(let i=0;i<10;i++){const r=i%2?7.5:18,a=-Math.PI/2+i*Math.PI/5;p.push((20+r*Math.cos(a)).toFixed(1)+','+(21+r*Math.sin(a)).toFixed(1));}return'<polygon points="'+p.join(' ')+'"/>';}
const SHAPES=[['circle','<circle cx="20" cy="20" r="15"/>'],['square','<rect x="6" y="6" width="28" height="28" rx="2"/>'],['triangle','<polygon points="20,5 36,34 4,34"/>'],['diamond','<polygon points="20,3 37,20 20,37 3,20"/>'],['star',starPts()],['hexagon','<polygon points="20,4 34,12 34,28 20,36 6,28 6,12"/>'],['cross','<polygon points="15,4 25,4 25,15 36,15 36,25 25,25 25,36 15,36 15,25 4,25 4,15 15,15"/>']];
const COLS=['#d62828','#1d4ed8','#15803d','#eab308','#7e22ce','#ea580c'];
function symbolSvg(sym){return'<svg viewBox="0 0 40 40" fill="'+sym.col+'" stroke="#1c2a39" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">'+sym.path+'</svg>';}
function Symbols(entry,ctx){
  const o=ctx.opts;const ans=lettersOf(entry.t);const distinct=[...new Set(ans)];
  const shapes=shuffle(SHAPES);const byShape={};
  const symOf={};
  distinct.forEach((ch,i)=>{const sh=shapes[i%shapes.length];const used=byShape[sh[0]]=byShape[sh[0]]||[];
    const free=shuffle(COLS.filter(c=>!used.includes(c)));const col=free[0];used.push(col);symOf[ch]={path:sh[1],col};});
  const guess={},lock={};let sel=null,hints=0,checks=0,over=false,state=null;
  const free=Math.min(+o.free,distinct.length-1);
  shuffle(distinct).slice(0,free).forEach(ch=>{guess[ch]=ch;lock[ch]=true;});
  const order=[];for(const ch of ans)if(!order.includes(ch))order.push(ch);
  const msg=el('div',{class:'msg'});
  const wrap=el('div',{class:'symword'});
  const cols=[];
  const{words,seps}=parse(entry.t);
  words.forEach((w,wi)=>{
    for(const ch of w){
      const sv=el('div',{html:symbolSvg(symOf[ch])});const bx=el('div',{class:'symbox'});
      const c=el('div',{class:'symcol',role:'button',tabindex:'0','aria-label':'Symbol',onclick:()=>{if(!over){sel=ch;draw();}}},sv,bx);
      cols.push({ch,c,bx});wrap.append(c);
    }
    if(wi<seps.length)wrap.append(el('span',{class:'symsep'},seps[wi]==='-'?'-':'  '));
  });
  const kb=keyboard(setLetter,clearSel);
  function draw(){
    cols.forEach(({ch,c,bx})=>{
      c.classList.toggle('sel',!over&&sel===ch);
      bx.textContent=(guess[ch]||'').toUpperCase();
      let cls='symbox'+(lock[ch]?' lock':'');
      if(state==='good')cls+=' good';else if(state==='check'&&guess[ch]&&guess[ch]!==ch)cls+=' bad';
      bx.className=cls;
    });
    const usedL=new Set(Object.values(guess).filter(Boolean));
    for(const k in kb.keys)kb.keys[k].classList.toggle('used',usedL.has(k));
  }
  function setLetter(l){
    if(over||!sel||lock[sel])return;
    for(const k in lock)if(guess[k]===l)return;
    for(const k in guess)if(guess[k]===l)delete guess[k];
    guess[sel]=l;state=null;msg.textContent='';
    sel=order.find(ch=>!guess[ch])||sel;
    draw();checkWin();
  }
  function clearSel(){if(over||!sel||lock[sel])return;delete guess[sel];state=null;draw();}
  function checkWin(){if(order.every(ch=>guess[ch]===ch)){over=true;state='good';draw();ctx.done(true,Math.max(1,10-2*hints-checks));}}
  function check(){
    if(over)return;
    const wrongs=order.filter(ch=>guess[ch]&&guess[ch]!==ch);
    if(!wrongs.length){msg.textContent=order.some(ch=>!guess[ch])?'No mistakes so far.':'';return;}
    checks++;state='check';msg.textContent=wrongs.length+(wrongs.length===1?' letter is':' letters are')+' wrong.';draw();
  }
  function hint(){
    if(over)return;
    let ch=(sel&&!lock[sel]&&guess[sel]!==sel)?sel:order.find(c=>guess[c]!==c);if(!ch)return;
    for(const k in guess)if(guess[k]===ch&&k!==ch)delete guess[k];
    guess[ch]=ch;lock[ch]=true;hints++;state=null;sel=order.find(c=>guess[c]!==c)||ch;draw();checkWin();
  }
  function giveUp(){if(over)return;over=true;order.forEach(ch=>{guess[ch]=ch;});draw();ctx.done(false,0);}
  sel=order.find(ch=>!guess[ch])||null;
  const clue=clueBlock(entry,o.clue);
  ctx.stage.append(clue||'',el('div',{class:'desc',style:'text-align:center'},'Tap a symbol, then type or tap the letter you think it is. The same symbol is always the same letter.'),wrap,msg,kb.el,
    el('div',{class:'ctrls'},el('button',{class:'btn small',type:'button',onclick:check},'Check my letters (-1 point if wrong)'),el('button',{class:'btn alt small',type:'button',onclick:hint},'Reveal a letter (-2 points)'),el('button',{class:'btn alt small',type:'button',onclick:giveUp},'Show answer')));
  draw();
  return{key(e){
    if(/^[a-z]$/i.test(e.key))setLetter(e.key.toLowerCase());
    else if(e.key==='Backspace'||e.key==='Delete')clearSel();
    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const i=order.indexOf(sel);sel=order[(i+(e.key==='ArrowRight'?1:-1)+order.length)%order.length];draw();}
  }};
}

/* ---------- Riddle ---------- */
function Riddle(entry,ctx){
  const o=ctx.opts;const ans=lettersOf(entry.t);
  const lines=riddleLines(entry,o.amb);
  const wholeText='My whole is: '+maskClue(entry).replace(/^./,m=>/^[A-Z][a-z]/.test(maskClue(entry))?m.toLowerCase():m)+' '+patternOf(entry.t);
  const total=lines.length+1;let shown=1,over=false;
  const box=el('div',{class:'riddle'});const msg=el('div',{class:'msg'});
  const input=el('input',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Your answer',placeholder:'Type the word',onkeydown:ev=>{if(ev.key==='Enter')guessIt();}});
  const nextBtn=el('button',{class:'btn small',type:'button',onclick:()=>{if(!over&&shown<total){shown++;draw(true);}}},'Next line');
  function draw(fresh){
    box.innerHTML='';
    lines.slice(0,Math.min(shown,lines.length)).forEach((l,i)=>{
      const d=el('div',{class:'rl'+(fresh&&i===shown-1?' new':'')});
      d.append(l.parts[0],el('b',null,l.parts[1]),l.parts[2],el('b',null,l.parts[3]),l.end);box.append(d);});
    if(shown>=total)box.append(el('div',{class:'whole rl new'},wholeText));
    nextBtn.disabled=over||shown>=total;
  }
  function guessIt(){
    if(over)return;
    const g=input.value.toLowerCase().replace(/[^a-z]/g,'');if(!g)return;
    if(g===ans){over=true;ctx.done(true,Math.max(1,Math.round(10*(total-shown+1)/total)));}
    else{input.classList.remove('bad');void input.offsetWidth;input.classList.add('bad');msg.textContent='Not quite. Have another look at the clues.';}
  }
  function revealAll(){if(over)return;shown=total;draw();}
  function giveUp(){if(over)return;over=true;shown=total;draw();ctx.done(false,0);}
  ctx.stage.append(el('div',{class:'desc',style:'text-align:center'},'Each line tells you about one letter of the word. Reveal them one at a time.'),box,msg,
    el('div',{class:'guessrow'},input,el('button',{class:'btn',type:'button',onclick:guessIt},'Guess')),
    el('div',{class:'ctrls'},nextBtn,el('button',{class:'btn alt small',type:'button',onclick:revealAll},'Show all lines'),el('button',{class:'btn alt small',type:'button',onclick:giveUp},'Show answer')));
  draw(true);
  return{key(e){if(e.key==='Enter'&&!over){if(shown<total){shown++;draw(true);}}else if(e.key===' '&&!over){e.preventDefault();if(shown<total){shown++;draw(true);}}}};
}

home();
