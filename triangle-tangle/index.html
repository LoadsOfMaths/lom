:root{
  /* LoadsOfMaths colours (kept even when the logo is hidden) */
  --orange:#f47b3c; --orange-d:#d9611f; --blue:#3f72b7; --blue-d:#2d5a96; --grey:#7f7f7f;
  --ink:#2b2f38; --paper:#f6f3ee; --card:#ffffff; --line:#e3ddd2;
  --good:#2e9e5b; --bad:#d64545; --tint:#fff4ea;
  --title:"SuperBouncer","Trebuchet MS",system-ui,sans-serif;
  --body:"AnakOrang","Segoe Print","Comic Sans MS",system-ui,sans-serif;
  --math:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:clamp(17px,1.35vw + 9px,26px);line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

/* header */
header{background:#fff;border-bottom:5px solid var(--orange);padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo{height:auto;width:min(340px,100%);display:block}
header h1{margin:0;font-family:var(--title);font-weight:normal;font-size:1.7em;color:var(--blue);line-height:1;letter-spacing:.5px}
header h1 span{color:var(--orange)}
header .sp{flex:1}
.hbtn{background:var(--tint);border:2px solid var(--orange);border-radius:999px;padding:.2em .9em;font-size:.8em}
.hbtn:hover{background:var(--orange);color:#fff}

main{max-width:1280px;margin:0 auto;padding:16px}

/* home */
.intro{margin:.2em 0 1em;color:#555}
.group{margin:0 0 1.2em}
.group h2{margin:0 0 .4em;font-family:var(--title);font-weight:normal;font-size:1.15em;color:var(--c)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:10px}
.lvl{display:flex;align-items:center;gap:.6em;text-align:left;background:var(--card);border:3px solid var(--c);border-radius:16px;padding:.45em .7em;min-height:3em}
.lvl:hover:not(:disabled){background:var(--c);color:#fff}
.lvl:hover:not(:disabled) .num{background:#fff;color:var(--c)}
.lvl .num{flex:none;display:grid;place-items:center;width:2em;height:2em;border-radius:50%;background:var(--c);color:#fff;font-family:var(--title);font-size:.95em}
.lvl:disabled{opacity:.45;cursor:default;border-style:dashed}
.lvl .soon{margin-left:auto;font-size:.65em;color:var(--grey)}

/* play */
.crumbs{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;margin-bottom:10px}
.crumbs .tag{font-family:var(--title);background:var(--c);color:#fff;border-radius:999px;padding:.1em .8em;font-size:.95em}
.crumbs .nm{font-size:1.05em}
.crumbs .sp{flex:1}
.stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px}
.prompt{font-size:1.25em;margin:0 0 .4em;text-align:center}
.prompt b{color:var(--orange-d);font-family:var(--math)}
.diagram{width:100%;height:auto;display:block;max-height:68vh}
.tri{fill:#fff7ec;stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.tick{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.arc{fill:none;stroke:var(--blue);stroke-width:3}
.arc.u{stroke:var(--orange);stroke-width:4}
.rt{fill:none;stroke:var(--ink);stroke-width:3}
.lbl{font-family:var(--title);font-size:25px;fill:var(--blue-d);paint-order:stroke;stroke:#fff7ec;stroke-width:7px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.lbl.u{fill:var(--orange-d)}
.lbl.s{fill:var(--ink)}
.lbl.s.u{fill:var(--orange-d)}
.vtx{font-family:var(--title);font-size:30px;fill:var(--grey);text-anchor:middle;dominant-baseline:central}
.side{display:flex;flex-direction:column;gap:12px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:3px solid var(--blue);background:var(--blue);color:#fff;border-radius:14px;padding:.35em .9em;font-size:1em}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.o{background:var(--orange);border-color:var(--orange)}
.btn.o:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn.ghost{background:#fff;color:var(--blue-d)}
.btn.ghost:hover{background:var(--tint)}
.btn:disabled{opacity:.4;cursor:default}
.ans{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ans label{font-family:var(--math);font-weight:bold;font-size:1.1em;color:var(--orange-d)}
.ans input{width:7em;font:inherit;font-family:var(--math);font-size:1.1em;padding:.25em .5em;border:3px solid var(--line);border-radius:12px;text-align:right}
.ans input:focus{outline:none;border-color:var(--blue)}
.unit{font-family:var(--math);font-size:1.1em}
.fb{min-height:1.6em;font-size:1.1em;font-family:var(--body)}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.answerpill{display:inline-block;background:var(--tint);border:3px solid var(--orange);border-radius:14px;padding:.2em .8em;font-family:var(--math);font-weight:bold;font-size:1.25em}
.score{font-size:.85em;color:#666}
.work{counter-reset:s;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.work li{counter-increment:s;border-left:6px solid var(--blue);background:#f3f7fc;border-radius:0 12px 12px 0;padding:.3em .7em .3em .8em;animation:pop .25s ease}
.work li::before{content:counter(s) ".";font-family:var(--title);color:var(--blue);margin-right:.4em}
.work li.final{border-left-color:var(--orange);background:var(--tint)}
.work .eq{font-family:var(--math);font-size:1.08em;margin-top:.15em;line-height:1.7}
.work .eq div{margin:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.note{font-size:.8em;color:#666}
.al{display:inline-grid;grid-template-columns:repeat(5,auto);gap:.05em .7em;text-align:center;align-items:baseline;margin:.1em 0}
.al .k{color:var(--grey);font-style:italic}
.role{font-family:var(--body);font-size:19px;fill:var(--grey);paint-order:stroke;stroke:#fff7ec;stroke-width:6px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.deg{text-align:center;margin:0 0 .3em}

/* settings dialog */
dialog{border:4px solid var(--orange);border-radius:20px;padding:18px 22px;max-width:min(92vw,28em);font-family:var(--body);font-size:1rem;color:var(--ink)}
dialog::backdrop{background:rgba(30,30,40,.45)}
dialog h2{margin:0 0 .5em;font-family:var(--title);font-weight:normal;color:var(--blue)}
dialog fieldset{border:2px solid var(--line);border-radius:12px;margin:0 0 .8em;padding:.4em .8em}
dialog legend{font-family:var(--title);color:var(--orange-d);padding:0 .4em;font-size:.9em}
dialog label{display:block;padding:.15em 0;cursor:pointer}
/* 3-D solids (Levels 19-20) */
.e3{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none}
.e3.hid{stroke-dasharray:9 8;stroke-width:3;opacity:.75}
.aux3{stroke:var(--grey);stroke-width:3;stroke-dasharray:3 8;stroke-linecap:round;fill:none}
.unk3{stroke:var(--orange);stroke-width:5;stroke-linecap:round;fill:none}
.hl1{fill:rgba(63,114,183,.24);stroke:var(--blue);stroke-width:3;stroke-linejoin:round}
.hl2{fill:rgba(244,123,60,.34);stroke:var(--orange-d);stroke-width:3;stroke-linejoin:round}
.mdot{fill:var(--ink)}
.legend3{display:flex;gap:1.2em;justify-content:center;font-size:.8em;color:#555;margin:.2em 0 0}
.legend3 i{display:inline-block;width:1em;height:1em;border-radius:4px;vertical-align:-.15em;margin-right:.3em}

/* scrollable working: a frame about 3 steps tall, chunky scrollbar for the IWB */
.workbox{max-height:17.5em;overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.workbox::-webkit-scrollbar{width:16px}
.workbox::-webkit-scrollbar-track{background:#e6edf6;border-radius:8px}
.workbox::-webkit-scrollbar-thumb{background:var(--blue);border-radius:8px;border:3px solid #e6edf6}
.workbox{scrollbar-width:auto;scrollbar-color:var(--blue) #e6edf6}
</style>
</head>

<script>
'use strict';
/* ============================ CONFIG ============================ */
const GROUPS={
  ang :{name:'Angles in triangles',        col:'#3f72b7'},
  pyth:{name:'Pythagoras',                 col:'#f47b3c'},
  trig:{name:'Sin, Cos and Tan',           col:'#2f9e86'},
  gen :{name:'Sine rule and Cosine rule',  col:'#7b5ea7'},
  d3  :{name:'3-D triangles',              col:'#6b6b6b'}
};
/* Level registry. gen === null means "coming soon" (later build stages).
   Every generator returns a question object (see ENGINE: finalise). */
const LEVELS=[
 {n:1, g:'ang', name:'Two angles given',            gen:()=>genL1()},
 {n:2, g:'ang', name:'One angle and a right angle',  gen:()=>genL2()},
 {n:3, g:'ang', name:'Isosceles triangles',          gen:()=>genL3()},
 {n:4, g:'ang', name:'Equilateral triangles',        gen:()=>genL4()},
 {n:5, g:'pyth',name:'Find the hypotenuse',          gen:()=>genL5()},
 {n:6, g:'pyth',name:'Find a shorter side',          gen:()=>genL6()},
 {n:7, g:'trig',name:'Sin: find an angle',           gen:()=>genTrig('sin','angle')},
 {n:8, g:'trig',name:'Sin: find a side',             gen:()=>genTrig('sin','side')},
 {n:9, g:'trig',name:'Cos: find an angle',           gen:()=>genTrig('cos','angle')},
 {n:10,g:'trig',name:'Cos: find a side',             gen:()=>genTrig('cos','side')},
 {n:11,g:'trig',name:'Tan: find an angle',           gen:()=>genTrig('tan','angle')},
 {n:12,g:'trig',name:'Tan: find a side',             gen:()=>genTrig('tan','side')},
 {n:13,g:'trig',name:'Mixed SOHCAHTOA',              gen:()=>genTrig(pick(['sin','cos','tan']),pick(['angle','side']))},
 {n:14,g:'gen', name:'Sine rule: find a side',       gen:()=>genSineSide()},
 {n:15,g:'gen', name:'Sine rule: find an angle',     gen:()=>genSineAngle()},
 {n:16,g:'gen', name:'Cosine rule: find a side',     gen:()=>genCosSide()},
 {n:17,g:'gen', name:'Cosine rule: find an angle',   gen:()=>genCosAngle()},
 {n:18,g:'gen', name:'Mixed scalene triangles: choose the method', gen:()=>genMixedRules()},
 {n:19,g:'d3',  name:'3-D: find a length',           gen:()=>gen3DLength()},
 {n:20,g:'d3',  name:'3-D: find an angle',           gen:()=>gen3DAngle()}
];

/* ============================ UTIL ============================ */
const D2R=Math.PI/180, R2D=180/Math.PI;
const V=['A','B','C'];
const EDGE={a:['B','C'],b:['C','A'],c:['A','B']};   // side letter -> its two end vertices
const lc=v=>v.toLowerCase();
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const n=x=>String(+(+x).toFixed(6));                  // tidy number to string
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
const len=v=>Math.hypot(v[0],v[1]);
const unit=v=>{const l=len(v)||1;return [v[0]/l,v[1]/l]};
const frac=(t,b)=>`<span class="frac"><span>${t}</span><span>${b}</span></span>`;

let S={mode:'class',rounding:'dp1',logo:true,roles:true,degNote:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('lom_tt_settings')||'{}'))}catch(e){}
function saveS(){try{localStorage.setItem('lom_tt_settings',JSON.stringify(S))}catch(e){}}

/* Round an exact answer according to Settings. */
function roundAns(x){
  if(Math.abs(x-Math.round(x))<1e-9) return {val:Math.round(x),dp:0,str:String(Math.round(x)),label:null,exact:true};
  if(S.rounding==='sf3'){
    const v=Number(x.toPrecision(3)),mag=Math.floor(Math.log10(Math.abs(v))),dp=Math.max(0,2-mag);
    return {val:v,dp,str:v.toFixed(dp),label:'3 s.f.',exact:false};
  }
  const v=Math.round(x*10)/10;
  return {val:v,dp:1,str:v.toFixed(1),label:'1 d.p.',exact:false};
}

/* ====================== GEOMETRY & RENDERER ======================
   A triangle "geo" = {A,B,C (degrees), a,b,c (relative lengths)}.
   Vertices are labelled A,B,C ANTICLOCKWISE; side a is opposite A, etc.
   Built in a y-up frame: A=(0,0), B=(c,0), C=(b cosA, b sinA), then
   rotated (never reflected, so the anticlockwise rule always holds).   */
function geoFromAngles(A,B,C){return {A,B,C,a:Math.sin(A*D2R),b:Math.sin(B*D2R),c:Math.sin(C*D2R)}}
function geoFromSides(a,b,c){
  const A=Math.acos((b*b+c*c-a*a)/(2*b*c))*R2D, B=Math.acos((a*a+c*c-b*b)/(2*a*c))*R2D;
  return {A,B,C:180-A-B,a,b,c};
}
function geoPoints(g){const r=g.A*D2R;return {A:[0,0],B:[g.c,0],C:[g.b*Math.cos(r),g.b*Math.sin(r)]}}
function rotPts(P,t){const co=Math.cos(t),si=Math.sin(t),R={};for(const k in P){const[x,y]=P[k];R[k]=[x*co-y*si,x*si+y*co]}return R}
/* Rotation that puts the legs of a right angle at vertex rv along the axes. */
function rotAligned(g,rv){
  const P=geoPoints(g),o=V.find(v=>v!==rv),d=sub(P[o],P[rv]);
  return -Math.atan2(d[1],d[0])+Math.PI/2*rnd(0,3);
}
const randRot=()=>Math.random()*2*Math.PI;

const VBW=640,VBH=440;
function layout(spec){
  const P=rotPts(geoPoints(spec.geo),spec.rot||0);
  const xs=V.map(v=>P[v][0]),ys=V.map(v=>P[v][1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const padX=95,padY=75;
  const s=Math.min((VBW-2*padX)/((maxx-minx)||1),(VBH-2*padY)/((maxy-miny)||1));
  const cx=(minx+maxx)/2,cy=(miny+maxy)/2,O={};
  for(const v of V)O[v]=[VBW/2+(P[v][0]-cx)*s, VBH/2-(P[v][1]-cy)*s];   // y flipped for screen
  return O;
}

/* spec = {geo, rot, ang:{A:{t,u}}, side:{a:{t,u}}, ticks:{a:1..}, right:'A'|null}
   t = label text, u = true if this is the unknown (drawn in orange).    */
function drawTriangle(spec){
  const P=layout(spec),pts=V.map(v=>P[v]);
  const cen=[(pts[0][0]+pts[1][0]+pts[2][0])/3,(pts[0][1]+pts[1][1]+pts[2][1])/3];
  const f=x=>x.toFixed(1);
  let s=`<polygon class="tri" points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}"/>`;

  // tick marks for equal sides
  for(const sd in (spec.ticks||{})){
    const [p,q]=EDGE[sd].map(v=>P[v]),m=[(p[0]+q[0])/2,(p[1]+q[1])/2],d=unit(sub(q,p)),nn=[-d[1],d[0]],k=spec.ticks[sd];
    for(let i=0;i<k;i++){
      const off=(i-(k-1)/2)*9,c=[m[0]+d[0]*off,m[1]+d[1]*off];
      s+=`<line class="tick" x1="${f(c[0]-nn[0]*10)}" y1="${f(c[1]-nn[1]*10)}" x2="${f(c[0]+nn[0]*10)}" y2="${f(c[1]+nn[1]*10)}"/>`;
    }
  }
  // angles
  for(const v of V){
    const [o1,o2]=V.filter(x=>x!==v),p=P[v];
    const d1=sub(P[o1],p),d2=sub(P[o2],p),u1=unit(d1),u2=unit(d2),minL=Math.min(len(d1),len(d2));
    const bis=unit([u1[0]+u2[0],u1[1]+u2[1]]);
    const th=spec.geo[v]*D2R;
    if(spec.right===v){
      const k=Math.min(20,minL*.3);
      const a=[p[0]+u1[0]*k,p[1]+u1[1]*k],b=[a[0]+u2[0]*k,a[1]+u2[1]*k],c=[p[0]+u2[0]*k,p[1]+u2[1]*k];
      s+=`<polyline class="rt" points="${f(a[0])},${f(a[1])} ${f(b[0])},${f(b[1])} ${f(c[0])},${f(c[1])}"/>`;
    }
    const lab=(spec.ang||{})[v];
    if(lab){
      const r=Math.min(34,minL*.28),cross=u1[0]*u2[1]-u1[1]*u2[0];
      s+=`<path class="arc${lab.u?' u':''}" d="M${f(p[0]+u1[0]*r)},${f(p[1]+u1[1]*r)} A${f(r)},${f(r)} 0 0 ${cross>0?1:0} ${f(p[0]+u2[0]*r)},${f(p[1]+u2[1]*r)}"/>`;
      const tw=lab.t.length*14+8;
      const t=Math.max(r+22,Math.min((tw/2+4)/Math.tan(th/2),minL*.62));
      s+=`<text class="lbl${lab.u?' u':''}" x="${f(p[0]+bis[0]*t)}" y="${f(p[1]+bis[1]*t)}">${lab.t}</text>`;
    }
    s+=`<text class="vtx" x="${f(p[0]-bis[0]*24)}" y="${f(p[1]-bis[1]*24)}">${(spec.names||{})[v]||v}</text>`;
  }
  // side labels
  for(const sd in (spec.side||{})){
    const lab=spec.side[sd],[p,q]=EDGE[sd].map(v=>P[v]),m=[(p[0]+q[0])/2,(p[1]+q[1])/2],d=unit(sub(q,p));
    let nn=[-d[1],d[0]];
    if(nn[0]*(m[0]-cen[0])+nn[1]*(m[1]-cen[1])<0)nn=[-nn[0],-nn[1]];
    const hw=lab.t.length*7.5,off=16+Math.abs(nn[0])*hw+Math.abs(nn[1])*13;
    s+=`<text class="lbl s${lab.u?' u':''}" x="${f(m[0]+nn[0]*off)}" y="${f(m[1]+nn[1]*off)}">${lab.t}</text>`;
  }
  // Hyp / Opp / Adj tags, inside the triangle (switchable in Settings)
  if(S.roles&&spec.roles){
    for(const sd in spec.roles){
      const [p,q]=EDGE[sd].map(v=>P[v]),m=[(p[0]+q[0])/2,(p[1]+q[1])/2],d=unit(sub(q,p));
      let nn=[-d[1],d[0]];
      if(nn[0]*(m[0]-cen[0])+nn[1]*(m[1]-cen[1])<0)nn=[-nn[0],-nn[1]];
      const off=12+Math.abs(nn[0])*22+Math.abs(nn[1])*8;
      s+=`<text class="role" x="${f(m[0]-nn[0]*off)}" y="${f(m[1]-nn[1]*off)}">${spec.roles[sd]}</text>`;
    }
  }
  return `<svg class="diagram" viewBox="0 0 ${VBW} ${VBH}" role="img" aria-label="Triangle diagram">${s}</svg>`;
}

/* ============================ GENERATORS ============================
   Each returns {prompt, spec, answer:{exact,unit,integer?}, steps:[{t,m}]}
   t = instruction text, m = maths (HTML, may contain several lines
   separated by <br>). The LAST step is the final answer.            */
const DEG=x=>x+'°';
const xAng={t:'x°',u:true};

function genL1(){
  let a,b,c;
  do{a=rnd(20,100);b=rnd(20,100);c=180-a-b}while(c<20||c>110);
  const vals=shuffle([a,b,c]),u=pick(V);
  const ang={},known=[];
  V.forEach((v,i)=>{if(v===u)ang[v]=xAng;else{ang[v]={t:DEG(vals[i])};known.push(vals[i])}});
  const ans=vals[V.indexOf(u)],sum=known[0]+known[1];
  return {
    prompt:'Find the size of angle <b>x</b>.',
    spec:{geo:geoFromAngles(...vals),rot:randRot(),ang},
    answer:{exact:ans,unit:'°',integer:true},
    steps:[
      {t:'The angles in a triangle add up to 180°.',m:'A + B + C = 180°'},
      {t:'Write in the two known angles and x.',m:`x + ${known[0]}° + ${known[1]}° = 180°`},
      {t:'Add the two known angles together.',m:`x + ${sum}° = 180°`},
      {t:'Subtract to find x.',m:`x = 180° − ${sum}° = <b>${ans}°</b>`}
    ]};
}

function genL2(){
  const g=rnd(15,75),ans=90-g,R=pick(V),rest=shuffle(V.filter(v=>v!==R)),G=rest[0],U=rest[1];

          ang:{[G]:{t:DEG(g)},[U]:xAng},right:R},

      {t:'Add the two known angles together.',m:`x + ${g+90}° = 180°`},

function genL3(){
  const ap=pick(V),base=V.filter(v=>v!==ap);          // apex vertex; equal sides meet at the apex
  const eqSides=base.map(lc),[s1,s2]=eqSides,[b1,b2]=base;
  const kind=pick(['apex','baseOther','baseApex']);
  let apexA,baseA;
  if(kind==='apex'){apexA=2*rnd(10,70);baseA=(180-apexA)/2}
  else{baseA=rnd(25,80);apexA=180-2*baseA}

  const geo=geoFromAngles(vals.A,vals.B,vals.C);

  let ang={},ans,steps;
  const s0={t:`The tick marks show that sides ${s1} and ${s2} are equal, so the triangle is isosceles.`,m:`${s1} = ${s2}`};
  const s1b={t:'The angles opposite equal sides are equal, so the two base angles match.',m:`${b1} = ${b2}`};
  if(kind==='apex'){
    const u=pick(base);ang[ap]={t:DEG(apexA)};ang[u]=xAng;ans=baseA;
    steps=[s0,{...s1b,t:'The angles opposite the equal sides are equal. These are the two base angles, both equal to x.'},
      {t:'The angles in a triangle add up to 180°.',m:`${apexA}° + x + x = 180°`},
      {t:'Take the apex angle away. The rest is shared between the two equal angles.',m:`2x = 180° − ${apexA}° = ${180-apexA}°`},
      {t:'Divide by 2.',m:`x = ${180-apexA}° ÷ 2 = <b>${ans}°</b>`}];
  }else if(kind==='baseOther'){
    const g=pick(base),u=base.find(v=>v!==g);ang[g]={t:DEG(baseA)};ang[u]=xAng;ans=baseA;
    steps=[s0,s1b,{t:`${g} is ${baseA}°, so ${u} must be the same.`,m:`x = ${g} = <b>${baseA}°</b>`}];
  }else{
    const g=pick(base);ang[g]={t:DEG(baseA)};ang[ap]=xAng;ans=apexA;
    steps=[s0,s1b,
      {t:`Both base angles are ${baseA}°. The angles in a triangle add up to 180°.`,m:`x + ${baseA}° + ${baseA}° = 180°`},
      {t:'Add the two base angles together.',m:`x + ${2*baseA}° = 180°`},
      {t:'Subtract to find x.',m:`x = 180° − ${2*baseA}° = <b>${ans}°</b>`}];

  return {prompt:'Find the size of angle <b>x</b>.<br><span class="note">Tick marks show sides of equal length.</span>',

/* ---- Pythagoras helpers ---- */
const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[6,8,10],[9,12,15],[12,16,20]];
function pythNums(){
  // returns {p,q,h}: two legs and hypotenuse (h exact), mode-dependent
  const mode=pick(['triple','int','int','dec']);
  if(mode==='triple'){const t=pick(TRIPLES),k=t[2]*2<=30?pick([1,1,2]):1,r=shuffle([t[0]*k,t[1]*k]);return {p:r[0],q:r[1],h:t[2]*k}}
  for(;;){
    let p,q;
    if(mode==='dec'){p=rnd(25,120)/10;q=rnd(25,120)/10}else{p=rnd(3,20);q=rnd(3,20)}
    const r=p/q;if(r<.35||r>2.9)continue;
    return {p,q,h:Math.sqrt(p*p+q*q)};
  }
}
const cm=x=>n(x)+' cm';

/* Pythagoras levels use vertex names other than ABC (so a, b, c stay free for
   the learned formula a² + b² = c²). Slots A,B,C are still anticlockwise. */
const NAMESETS=[['D','E','F'],['P','Q','R'],['R','S','T'],['X','Y','Z'],['L','M','N'],['G','H','J']];
const alRow=(cells,cls)=>cells.map(c=>`<span class="${cls||''}">${c}</span>`).join('');
const pythGrid=(l,m,r)=>`<span class="al">${alRow(['a²','+','b²','=','c²'],'k')}${alRow([l,'+',m,'=',r])}</span>`;
const formulaStep={t:'Start with Pythagoras’ theorem. a and b are the two shorter sides. c is the hypotenuse: the longest side, opposite the right angle.',m:'a² + b² = c²'};

function pythSetup(R){
  const nm=NAMESETS[rnd(0,NAMESETS.length-1)],names={A:nm[0],B:nm[1],C:nm[2]};
  const sideName=sd=>EDGE[sd].map(v=>names[v]).join('');       // e.g. "PR"
  return {names,sideName,legs:V.filter(v=>v!==R).map(lc),h:lc(R)};
}
function genL5(){
  const {p,q}=pythNums(),R=pick(V),{names,sideName,legs,h}=pythSetup(R);
  const hyp=Math.sqrt(p*p+q*q),r=roundAns(hyp),sum=p*p+q*q;
  const geo=geoFromSides(...['a','b','c'].map(s=>s===h?hyp:(s===legs[0]?p:q)));
  const side={[legs[0]]:{t:cm(p)},[legs[1]]:{t:cm(q)},[h]:{t:'x cm',u:true}};
  const unr=r.exact?n(hyp):hyp.toFixed(4)+'…';
  return {
    prompt:'Find the length of side <b>x</b>.',
    spec:{geo,rot:rotAligned(geo,R),side,right:R,names},
    answer:{exact:hyp,unit:'cm'},
    steps:[
      formulaStep,
      {t:`The right angle is at ${names[R]}, so the hypotenuse is ${sideName(h)}. That is the side we want, x. Write the known lengths under the formula.`,m:pythGrid(n(p)+'²',n(q)+'²','x²')},
      {t:'Square each number, then add.',m:`${n(p*p)} + ${n(q*q)} = x²<br>x² = ${n(sum)}`},
      {t:'Square root both sides.',m:`x = √${n(sum)} = ${unr}`},
      {t:r.exact?'This is exact.':`Round to ${r.label}`,m:`x = <b>${r.str} cm</b>`}
    ]};
}

function genL6(){
  const R=pick(V),{names,sideName,legs,h}=pythSetup(R);
  let hypV,known,unk;
  const mode=pick(['triple','int','int','dec']);
  if(mode==='triple'){const t=pick(TRIPLES),k=t[2]*2<=30?pick([1,1,2]):1,r=shuffle([t[0]*k,t[1]*k]);hypV=t[2]*k;known=r[0];unk=r[1]}
  else for(;;){
    if(mode==='dec'){known=rnd(25,120)/10;hypV=known+rnd(8,60)/10}else{known=rnd(3,18);hypV=known+rnd(2,12)}
    unk=Math.sqrt(hypV*hypV-known*known);
    const q=unk/known;if(q>=.35&&q<=2.9)break;
  }
  const exact=mode==='triple'?unk:Math.sqrt(hypV*hypV-known*known),r=roundAns(exact);
  const ui=Math.random()<.5?0:1,uLeg=legs[ui],kLeg=legs[1-ui];
  const lens={};lens[h]=hypV;lens[kLeg]=known;lens[uLeg]=exact;
  const geo=geoFromSides(lens.a,lens.b,lens.c);
  const side={[kLeg]:{t:cm(known)},[h]:{t:cm(hypV)},[uLeg]:{t:'x cm',u:true}};
  const grid=ui===0?pythGrid('x²',n(known)+'²',n(hypV)+'²'):pythGrid(n(known)+'²','x²',n(hypV)+'²');
  const d=hypV*hypV-known*known,unr=r.exact?n(exact):exact.toFixed(4)+'…';
  return {
    prompt:'Find the length of side <b>x</b>.',
    spec:{geo,rot:rotAligned(geo,R),side,right:R,names},
    answer:{exact,unit:'cm'},
    steps:[
      formulaStep,
      {t:`The right angle is at ${names[R]}, so the hypotenuse is ${sideName(h)} = ${cm(hypV)}. We want a shorter side, x. Write the known lengths under the formula.`,m:grid},
      {t:`Get x² on its own by subtracting ${n(known)}² from both sides.`,m:`x² = ${n(hypV)}² − ${n(known)}²`},
      {t:'Square each number, then subtract.',m:`x² = ${n(hypV*hypV)} − ${n(known*known)} = ${n(d)}`},
      {t:'Square root both sides.',m:`x = √${n(d)} = ${unr}`},
      {t:r.exact?'This is exact.':`Round to ${r.label}`,m:`x = <b>${r.str} cm</b>`}
    ]};
}

/* ---- SOHCAHTOA (Levels 7-13) ----
   Right angle at R. T = vertex of the reference angle (the unknown angle in
   "find an angle" levels, the given angle in "find a side" levels).
   Opp = side opposite T, Hyp = side opposite R, Adj = the other leg.
   Vertex names come from NAMESETS (not ABC). Answers come from the DISPLAYED givens. */
const TRIG={
  sin:{n:'Opp',d:'Hyp',m:'SOH',w:'Sin',f:x=>Math.sin(x*D2R),inv:v=>Math.asin(v)*R2D},
  cos:{n:'Adj',d:'Hyp',m:'CAH',w:'Cos',f:x=>Math.cos(x*D2R),inv:v=>Math.acos(v)*R2D},
  tan:{n:'Opp',d:'Adj',m:'TOA',w:'Tan',f:x=>Math.tan(x*D2R),inv:v=>Math.atan(v)*R2D}
};
function trigSetup(){
  const R=pick(V),rest=shuffle(V.filter(v=>v!==R)),T=rest[0],K=rest[1];
  const nm=NAMESETS[rnd(0,NAMESETS.length-1)],names={A:nm[0],B:nm[1],C:nm[2]};
  const L={Hyp:lc(R),Opp:lc(T),Adj:lc(K)};
  return {R,T,K,names,L,roles:{[L.Hyp]:'Hyp',[L.Opp]:'Opp',[L.Adj]:'Adj'}};
}
/* Final steps: unrounded value, then rounded answer (or just the exact one). */
function calcSteps(pre,exact,r,u,t){
  if(r.exact)return [{t,m:`${pre} = <b>${r.str}${u}</b>`}];
  return [{t,m:`${pre} = ${exact.toFixed(4)}…`},{t:`Round to ${r.label}`,m:`x = <b>${r.str}${u}</b>`}];
}
function genTrig(k,mode){return mode==='angle'?trigAngle(k):trigSide(k)}

function trigAngle(k){
  const tr=TRIG[k],s=trigSetup(),fn=tr.w.toLowerCase();
  let nl=3,dl=5,ex=tr.inv(3/5),len={Opp:3,Hyp:5,Adj:4};
  for(let i=0;i<1000;i++){
    const th=rnd(18,72),dec=Math.random()<.35,d0=dec?rnd(60,240)/10:rnd(5,24);
    const n0=d0*tr.f(th),n1=dec?Math.round(n0*10)/10:Math.round(n0);
    if(n1<1||(k!=='tan'&&n1>=d0))continue;
    const a=tr.inv(n1/d0);if(a<15||a>75)continue;
    nl=n1;dl=d0;ex=a;
    len=k==='sin'?{Opp:nl,Hyp:dl,Adj:Math.sqrt(dl*dl-nl*nl)}
       :k==='cos'?{Adj:nl,Hyp:dl,Opp:Math.sqrt(dl*dl-nl*nl)}
       :{Opp:nl,Adj:dl,Hyp:Math.hypot(nl,dl)};
    break;
  }
  const by={};for(const r in len)by[s.L[r]]=len[r];
  const geo=geoFromSides(by.a,by.b,by.c);
  const side={[s.L[tr.n]]:{t:cm(nl)},[s.L[tr.d]]:{t:cm(dl)}};
  const q=frac(n(nl),n(dl));
  const steps=[
    {t:'Label the sides from the angle x. Hyp is opposite the right angle, Opp is opposite x and Adj is next to x.',m:`${tr.n} = ${cm(nl)}<br>${tr.d} = ${cm(dl)}`},
    {t:`We know ${tr.n} and ${tr.d}, so we use ${tr.w} (${tr.m}).`,m:`${fn} x = ${frac(tr.n,tr.d)}`},
    {t:'Put in the numbers.',m:`${fn} x = ${q}`},
    {t:`To find an angle, use the inverse function: shift (or 2nd) then ${fn}.`,m:`x = ${fn}⁻¹(${q})`}
  ].concat(calcSteps('x',ex,roundAns(ex),'°','Work it out on the calculator, in degrees mode.'));
  return {
    prompt:'Find the size of angle <b>x</b>.',
    spec:{geo,rot:rotAligned(geo,s.R),ang:{[s.T]:xAng},side,right:s.R,names:s.names,roles:s.roles},
    answer:{exact:ex,unit:'°'},steps};
}

function trigSide(k){
  const tr=TRIG[k],s=trigSetup(),fn=tr.w.toLowerCase();
  let th=35,known=10,unkNum=true,x=known*tr.f(th);
  for(let i=0;i<1000;i++){
    th=rnd(20,70);const dec=Math.random()<.35;
    known=dec?rnd(50,250)/10:rnd(5,25);unkNum=Math.random()<.5;
    x=unkNum?known*tr.f(th):known/tr.f(th);
    if(x>=2&&x<=45)break;
  }
  const kr=unkNum?tr.d:tr.n,ur=unkNum?tr.n:tr.d;      // known role, unknown role
  const vals={};vals[s.R]=90;vals[s.T]=th;vals[s.K]=90-th;
  const geo=geoFromAngles(vals.A,vals.B,vals.C);
  const side={[s.L[kr]]:{t:cm(known)},[s.L[ur]]:{t:'x cm',u:true}};
  const kn=n(known);
  const steps=[
    {t:`Label the sides from the ${th}° angle. Hyp is opposite the right angle, Opp is opposite the ${th}° angle and Adj is next to it.`,m:`${kr} = ${cm(known)}<br>${ur} = x`},
    {t:`We know ${kr} and want ${ur}, so we use ${tr.w} (${tr.m}).`,m:`${fn} ${th}° = ${frac(tr.n,tr.d)}`},
    {t:'Put in the numbers.',m:`${fn} ${th}° = ${unkNum?frac('x',kn):frac(kn,'x')}`}
  ];
  if(unkNum)steps.push({t:`Multiply both sides by ${kn} to get x on its own.`,m:`x = ${kn} × ${fn} ${th}°`});
  else{
    steps.push({t:'Multiply both sides by x.',m:`x × ${fn} ${th}° = ${kn}`});
    steps.push({t:`Divide both sides by ${fn} ${th}°.`,m:`x = ${frac(kn,fn+' '+th+'°')}`});
  }
  const r=roundAns(x);
  return {
    prompt:'Find the length of side <b>x</b>.',
    spec:{geo,rot:rotAligned(geo,s.R),ang:{[s.T]:{t:th+'°'}},side,right:s.R,names:s.names,roles:s.roles},
    answer:{exact:x,unit:'cm'},
    steps:steps.concat(calcSteps('x',x,r,' cm','Work it out on the calculator, in degrees mode.'))};
}

/* ---- Sine rule and Cosine rule (Levels 14-18) ----
   General triangles on vertices A, B, C (anticlockwise); side a is opposite A, etc.
   Every answer is worked out from the DISPLAYED givens, and the picture is drawn
   to match, so the answer always agrees with the diagram. */
const sinD=x=>Math.sin(x*D2R), cosD=x=>Math.cos(x*D2R);
const dg=x=>n(x)+'°';
const r1=x=>Math.round(x*10)/10;
const sd=(a,dec)=>dec?r1(a):Math.round(a);          // round a length to the question's precision
const geoFromAng=v=>geoFromAngles(v.A,v.B,v.C);
const geoFromLen=v=>geoFromSides(v.a,v.b,v.c);
const calcNote='Work it out on the calculator, in degrees mode.';

function genSineSide(){
  for(let i=0;i<2000;i++){
    const [P,Q,T]=shuffle(V),aP=rnd(25,100),aQ=rnd(25,100),aT=180-aP-aQ;
    if(aT<20||aT>120)continue;
    const dec=Math.random()<.35,kv=dec?rnd(50,250)/10:rnd(5,25),x=kv*sinD(aQ)/sinD(aP);
    if(x<2||x>45)continue;
    const direct=Math.random()<.6,p=lc(P),q=lc(Q);
    const ang=direct?{[P]:{t:dg(aP)},[Q]:{t:dg(aQ)}}:{[P]:{t:dg(aP)},[T]:{t:dg(aT)}};
    const steps=[];
    if(!direct)steps.push({t:`We need the angle opposite side ${q}. The angles in a triangle add up to 180°.`,m:`${Q} = 180° − ${aP}° − ${aT}° = ${aQ}°`});
    steps.push(
      {t:`The sine rule links each side to the angle opposite it. Side ${q} is opposite ${Q}, and side ${p} is opposite ${P}. We know ${p} and ${P}, so we can use this pair.`,m:`${frac(q,'sin '+Q)} = ${frac(p,'sin '+P)}`},
      {t:`Put in the numbers. Side ${q} is x.`,m:`${frac('x','sin '+aQ+'°')} = ${frac(n(kv),'sin '+aP+'°')}`},
      {t:`Multiply both sides by sin ${aQ}° to get x on its own.`,m:`x = ${frac(n(kv)+' × sin '+aQ+'°','sin '+aP+'°')}`});
    return {prompt:'Find the length of side <b>x</b>.',
      spec:{geo:geoFromAng({[P]:aP,[Q]:aQ,[T]:aT}),rot:randRot(),ang,side:{[p]:{t:cm(kv)},[q]:{t:'x cm',u:true}}},
      answer:{exact:x,unit:'cm'},
      steps:steps.concat(calcSteps('x',x,roundAns(x),' cm',calcNote)),
      method:`We know an angle and the side opposite it, and we want the side opposite another angle, so we use the <b>sine rule</b>.`};
  }
}

function genSineAngle(){
  for(let i=0;i<5000;i++){
    const [P,U,T]=shuffle(V),aK=rnd(25,115),aU=rnd(20,80);
    if(aK+aU>160)continue;
    const dec=Math.random()<.35,kv=dec?rnd(50,250)/10:rnd(5,25),uv=sd(kv*sinD(aU)/sinD(aK),dec);
    if(uv<2)continue;
    const s=uv*sinD(aK)/kv;if(s>.97)continue;
    const x=Math.asin(s)*R2D;if(x<15||x>80||aK+x>175)continue;
    const p=lc(P),u=lc(U);
    const steps=[
      {t:`The sine rule links each side to the angle opposite it. Side ${u} is opposite ${U}, and side ${p} is opposite ${P}. For an angle, put the sines on top.`,m:`${frac('sin '+U,u)} = ${frac('sin '+P,p)}`},
      {t:`Put in the numbers. Angle ${U} is x.`,m:`${frac('sin x',n(uv))} = ${frac('sin '+aK+'°',n(kv))}`},
      {t:`Multiply both sides by ${n(uv)} to get sin x on its own.`,m:`sin x = ${frac(n(uv)+' × sin '+aK+'°',n(kv))}`},
      {t:'To find the angle, use the inverse function: shift (or 2nd) then sin.',m:`x = sin⁻¹(${frac(n(uv)+' × sin '+aK+'°',n(kv))})`}
    ].concat(calcSteps('x',x,roundAns(x),'°',calcNote));
    return {prompt:'Find the size of angle <b>x</b>.<br><span class="note">Angle x is acute.</span>',
      spec:{geo:geoFromAng({[P]:aK,[U]:x,[T]:180-aK-x}),rot:randRot(),ang:{[P]:{t:dg(aK)},[U]:xAng},side:{[p]:{t:cm(kv)},[u]:{t:cm(uv)}}},
      answer:{exact:x,unit:'°'},steps,
      method:`We know an angle and the side opposite it, and another side, and we want the angle opposite that side, so we use the <b>sine rule</b>.`};
  }
}

function genCosSide(){
  for(let i=0;i<2000;i++){
    const [U,P,Q]=shuffle(V),aU=rnd(30,130),dec=Math.random()<.35;
    const pv=dec?rnd(50,250)/10:rnd(5,25),qv=dec?rnd(50,250)/10:rnd(5,25);
    const a2=pv*pv+qv*qv-2*pv*qv*cosD(aU),x=Math.sqrt(a2);
    if(x<2||x>45||pv/qv<.4||pv/qv>2.5)continue;
    const u=lc(U),p=lc(P),q=lc(Q),a2d=n(+a2.toFixed(4));
    const steps=[
      {t:`The cosine rule finds a side when we know the other two sides and the angle between them. The angle is ${U}, between sides ${p} and ${q}.`,m:`${u}² = ${p}² + ${q}² − 2${p}${q} cos ${U}`},
      {t:`Put in the numbers. Side ${u} is x.`,m:`x² = ${n(pv)}² + ${n(qv)}² − 2 × ${n(pv)} × ${n(qv)} × cos ${aU}°`},
      {t:'Work out the whole right-hand side on the calculator, in degrees mode.',m:`x² = ${a2d}`},
      {t:'Square root both sides.',m:`x = √${a2d}`}
    ].concat(calcSteps('x',x,roundAns(x),' cm','Work out the square root.'));
    return {prompt:'Find the length of side <b>x</b>.',
      spec:{geo:geoFromLen({[u]:x,[p]:pv,[q]:qv}),rot:randRot(),ang:{[U]:{t:dg(aU)}},side:{[p]:{t:cm(pv)},[q]:{t:cm(qv)},[u]:{t:'x cm',u:true}}},
      answer:{exact:x,unit:'cm'},steps,
      method:`We know two sides and the angle between them, and we want the third side, so we use the <b>cosine rule</b>.`};

}

function genCosAngle(){
  for(let i=0;i<5000;i++){
    const [U,P,Q]=shuffle(V),dec=Math.random()<.35,tp=rnd(30,110),tq=rnd(30,110),tu=rnd(25,120);
    if(tp+tq+tu>=175)continue;
    // sides in proportion to the sines of the angles, scaled and rounded
    const sc=rnd(8,25)/Math.max(sinD(tp),sinD(tq),sinD(tu)),f=t=>sd(sinD(t)*sc*(dec?1:1.1),dec);
    const uv=f(tu),pv=f(tp),qv=f(tq);
    if(Math.min(uv,pv,qv)<3||uv>=pv+qv||pv>=uv+qv||qv>=uv+pv)continue;
    const cs=(pv*pv+qv*qv-uv*uv)/(2*pv*qv),x=Math.acos(cs)*R2D;
    if(x<25||x>125)continue;
    const u=lc(U),p=lc(P),q=lc(Q);
    const N=pv*pv+qv*qv-uv*uv,Dn=2*pv*qv;
    const steps=[
      {t:`The cosine rule can be rearranged to find an angle when we know all three sides. We want ${U}, opposite side ${u}.`,m:`cos ${U} = ${frac(p+'² + '+q+'² − '+u+'²','2 × '+p+' × '+q)}`},
      {t:`Put in the numbers. Angle ${U} is x.`,m:`cos x = ${frac(n(pv)+'² + '+n(qv)+'² − '+n(uv)+'²','2 × '+n(pv)+' × '+n(qv))}`},
      {t:'Work out the top and the bottom.',m:`cos x = ${frac(n(+N.toFixed(4)),n(+Dn.toFixed(4)))} = ${cs.toFixed(4)}…`},
      {t:'To find the angle, use the inverse function: shift (or 2nd) then cos.',m:`x = cos⁻¹(${frac(n(+N.toFixed(4)),n(+Dn.toFixed(4)))})`}
    ].concat(calcSteps('x',x,roundAns(x),'°',calcNote));
    return {prompt:'Find the size of angle <b>x</b>.',
      spec:{geo:geoFromLen({[u]:uv,[p]:pv,[q]:qv}),rot:randRot(),ang:{[U]:xAng},side:{[p]:{t:cm(pv)},[q]:{t:cm(qv)},[u]:{t:cm(uv)}}},
      answer:{exact:x,unit:'°'},steps,
      method:`We know all three sides and we want an angle, so we use the <b>cosine rule</b>.`};
  }
}

/* Level 18: any of the four, with a first step that chooses the method. */
function genMixedRules(){
  const q=pick([genSineSide,genSineAngle,genCosSide,genCosAngle])();
  q.steps.unshift({t:'Choose the method.',m:q.method});
  q.prompt+='<br><span class="note">Choose the sine rule or the cosine rule.</span>';
  return q;
}

/* ---- 3-D solids (Levels 19-20) ----
   Cuboid ABCDEFGH (base ABCD, top EFGH directly above it) or pyramid VABCD
   (rectangular base ABCD, apex V directly above the centre M).
   x = width AB, y = depth BC, z = height. Oblique projection: the front face is drawn
   square-on and depth goes back up and to the right, so D (and its edges) are hidden.
   Working triangles are only coloured in once the working is revealed:
   blue = first triangle, orange = second (final) triangle.
   Every answer is worked out from the DISPLAYED values; q.chk is an independent
   recalculation from 3-D coordinates, used only by the tests. */
const CUB_E=['AB','BC','CD','DA','EF','FG','GH','HE','AE','BF','CG','DH'],CUB_H=['DA','CD','DH'];

function solid3D(kind,w,d,h){
  const P={A:[0,0,0],B:[w,0,0],C:[w,d,0],D:[0,d,0]};
  if(kind==='cuboid'){P.E=[0,0,h];P.F=[w,0,h];P.G=[w,d,h];P.H=[0,d,h]}
  else{P.V=[w/2,d/2,h];P.M=[w/2,d/2,0]}

}
function draw3D(spec,hl){
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),m0=(spec.dw+spec.dd)/2;   /* drawing only: keep every solid roomy and legible, not to scale */
  const P3=solid3D(spec.solid,cl(spec.dw,.7*m0,1.4*m0),cl(spec.dd,.7*m0,1.4*m0),cl(spec.dh,.6*m0,1.5*m0)),Q={};
  for(const k in P3)Q[k]=[P3[k][0]+.42*P3[k][1],P3[k][2]+.30*P3[k][1]];
  const ks=Object.keys(Q),xs=ks.map(k=>Q[k][0]),ys=ks.map(k=>Q[k][1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=Math.min((VBW-2*95)/(maxx-minx),(VBH-2*75)/(maxy-miny)),cx=(minx+maxx)/2,cy=(miny+maxy)/2,O={};
  for(const k of ks)O[k]=[VBW/2+(Q[k][0]-cx)*sc,VBH/2-(Q[k][1]-cy)*sc];
  const f=x=>x.toFixed(1),pt=k=>f(O[k][0])+','+f(O[k][1]);
  const cub=spec.solid==='cuboid',E=cub?CUB_E:PYR_E,H=cub?CUB_H:PYR_H;
  const cen=[0,0];let cnt=0;
  for(const k of ks)if(k!=='M'){cen[0]+=O[k][0];cen[1]+=O[k][1];cnt++}
  cen[0]/=cnt;cen[1]/=cnt;
  let s='';
  if(hl)for(const t of spec.tris)s+=`<polygon class="hl${t.c}" points="${t.v.map(pt).join(' ')}"/>`;
  for(const e of E)s+=`<line class="e3${H.includes(e)?' hid':''}" x1="${f(O[e[0]][0])}" y1="${f(O[e[0]][1])}" x2="${f(O[e[1]][0])}" y2="${f(O[e[1]][1])}"/>`;
  for(const [p,q] of spec.auxA)s+=`<line class="aux3" x1="${f(O[p][0])}" y1="${f(O[p][1])}" x2="${f(O[q][0])}" y2="${f(O[q][1])}"/>`;
  for(const [p,q] of spec.unk)s+=`<line class="unk3" x1="${f(O[p][0])}" y1="${f(O[p][1])}" x2="${f(O[q][0])}" y2="${f(O[q][1])}"/>`;
  if(hl)for(const t of spec.tris){
    const r=t.r,[o1,o2]=t.v.filter(v=>v!==r),p=O[r],u1=unit(sub(O[o1],p)),u2=unit(sub(O[o2],p));
    const k=Math.min(18,len(sub(O[o1],p))*.3,len(sub(O[o2],p))*.3);
    const a=[p[0]+u1[0]*k,p[1]+u1[1]*k],b=[a[0]+u2[0]*k,a[1]+u2[1]*k],c=[p[0]+u2[0]*k,p[1]+u2[1]*k];
    s+=`<polyline class="rt" points="${f(a[0])},${f(a[1])} ${f(b[0])},${f(b[1])} ${f(c[0])},${f(c[1])}"/>`;
  }
  if(spec.arc){
    const A=spec.arc,p=O[A.v],d1=sub(O[A.a],p),d2=sub(O[A.b],p),u1=unit(d1),u2=unit(d2);
    const r=Math.min(30,len(d1)*.4,len(d2)*.4),cross=u1[0]*u2[1]-u1[1]*u2[0];
    const bis=unit([u1[0]+u2[0],u1[1]+u2[1]]),th=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));
    s+=`<path class="arc u" d="M${f(p[0]+u1[0]*r)},${f(p[1]+u1[1]*r)} A${f(r)},${f(r)} 0 0 ${cross>0?1:0} ${f(p[0]+u2[0]*r)},${f(p[1]+u2[1]*r)}"/>`;
    const t=Math.min(95,Math.max(r+24,(22+4)/Math.max(Math.tan(th/2),.15)));
    s+=`<text class="lbl u" x="${f(p[0]+bis[0]*t)}" y="${f(p[1]+bis[1]*t)}">x°</text>`;
  }
  if(O.M)s+=`<circle class="mdot" cx="${f(O.M[0])}" cy="${f(O.M[1])}" r="5"/>`;
  for(const k of ks){
    let x,y;
    if(k==='M'){x=O.M[0]+17;y=O.M[1]+19}
    else{const d=unit(sub(O[k],cen));x=O[k][0]+d[0]*25;y=O[k][1]+d[1]*25}
    s+=`<text class="vtx" x="${f(x)}" y="${f(y)}">${k}</text>`;
  }
  for(const L of spec.labels){
    const p=O[L.p],q=O[L.q],m=[(p[0]+q[0])/2,(p[1]+q[1])/2],d=unit(sub(q,p));
    let nn=[-d[1],d[0]];
    if(nn[0]*L.pref[0]+nn[1]*L.pref[1]<0)nn=[-nn[0],-nn[1]];
    const hw=L.t.length*7.5,off=14+Math.abs(nn[0])*hw+Math.abs(nn[1])*13;
    s+=`<text class="lbl s${L.u?' u':''}" x="${f(m[0]+nn[0]*off)}" y="${f(m[1]+nn[1]*off)}">${L.t}</text>`;
  }
  return `<svg class="diagram" viewBox="0 0 ${VBW} ${VBH}" role="img" aria-label="3-D diagram">${s}</svg>`+
    (hl?`<div class="legend3"><span><i style="background:rgba(63,114,183,.4)"></i>first triangle</span><span><i style="background:rgba(244,123,60,.5)"></i>second triangle</span></div>`:'');
}

const clampR=x=>Math.min(1.6,Math.max(.6,x));
const n4=x=>x.toFixed(4)+'…';
const nr=x=>Math.abs(x-Math.round(x))<1e-9?String(Math.round(x)):n4(x);
const srt=s=>s.split('').sort().join('');
const SD=[{lo:'A',up:'G',ft:'C',t1:['A','B','C']},{lo:'C',up:'E',ft:'A',t1:['A','B','C']},{lo:'B',up:'H',ft:'D',t1:['B','A','D']}];
const PK={A:{pt:'C',t1:['A','B','C']},B:{pt:'D',t1:['B','A','D']},C:{pt:'A',t1:['A','B','C']}};
function dims3(){
  const dec=Math.random()<.3,f=()=>dec?rnd(35,150)/10:rnd(3,15);
  return {w:f(),d:f(),h:f(),dec};
}
function solidSpec(kind,w,d,h,extra){
  const av=(w+d+h)/3;
  return Object.assign({solid:kind,dw:clampR(w/av),dd:clampR(d/av),dh:clampR(h/av),tris:[],labels:[],auxA:[],unk:[],arc:null},extra);
}
const cubLabels=(w,d,h)=>[{p:'A',q:'B',t:cm(w),pref:[0,1]},{p:'B',q:'C',t:cm(d),pref:[1,.6]},{p:'A',q:'E',t:cm(h),pref:[-1,0]}];
const pyrLabels=(w,d)=>[{p:'A',q:'B',t:cm(w),pref:[0,1]},{p:'B',q:'C',t:cm(d),pref:[1,.6]}];
const dist3=(P,a,b)=>Math.hypot(P[a][0]-P[b][0],P[a][1]-P[b][1],P[a][2]-P[b][2]);
function angle3(P,v,a,b){
  const u=[0,1,2].map(i=>P[a][i]-P[v][i]),t=[0,1,2].map(i=>P[b][i]-P[v][i]);
  const dot=u[0]*t[0]+u[1]*t[1]+u[2]*t[2];
  return Math.acos(dot/(Math.hypot(...u)*Math.hypot(...t)))*R2D;
}
const SOLID_C='ABCDEFGH is a cuboid.',SOLID_P='VABCD is a pyramid. The base ABCD is a rectangle and V is directly above its centre M.';

/* the first step of most working: the blue triangle in the base, to find a base diagonal */
function baseStep(t1,w,d,root,why){
  const l1=srt(t1[0]+t1[1]),l2=srt(t1[1]+t1[2]),bd=srt(t1[0]+t1[2]),e2=w*w+d*d;
  return {t:`Start with the blue triangle ${t1.join('')}, in the base. Its right angle is at ${t1[1]}. ${why||`We need the diagonal ${bd}, its hypotenuse.`}`,
    m:`${bd}² = ${l1}² + ${l2}²<br>${bd}² = ${n(w)}² + ${n(d)}² = ${n(e2)}`+(root?`<br>${bd} = √${n(e2)} = ${nr(Math.sqrt(e2))}`:'')};
}

/* ---------- Level 19: find a length ---------- */
function gen3DLength(){return pick([lenFace,lenSpace,lenSlant,lenHeight])()}

function lenFace(){
  const {w,d,h}=dims3();
  const F=pick([{nm:'AC',t:['A','B','C'],r:'B',l:[['AB',w],['BC',d]]},
                {nm:'AF',t:['A','B','F'],r:'B',l:[['AB',w],['BF',h]]},
                {nm:'BG',t:['B','C','G'],r:'C',l:[['BC',d],['CG',h]]}]);
  const [a,b]=F.l,sum=a[1]*a[1]+b[1]*b[1],x=Math.sqrt(sum),P=solid3D('cuboid',w,d,h);
  const spec=solidSpec('cuboid',w,d,h,{tris:[{v:F.t,c:2,r:F.r}],unk:[[F.nm[0],F.nm[1]]],
    labels:cubLabels(w,d,h).concat([{p:F.nm[0],q:F.nm[1],t:'x cm',u:true,pref:[-.5,-1]}])});
  const steps=[
    {t:`Find the right-angled triangle that has ${F.nm} as its longest side. It is the orange triangle ${F.t.join('')}, with the right angle at ${F.r}. All the vertical edges are ${n(h)} cm.`,m:`${a[0]} = ${cm(a[1])}<br>${b[0]} = ${cm(b[1])}`},
    {t:'Use Pythagoras’ theorem in this triangle.',m:`x² = ${a[0]}² + ${b[0]}²<br>x² = ${n(a[1])}² + ${n(b[1])}²`},
    {t:'Square each number, then add.',m:`x² = ${n(a[1]*a[1])} + ${n(b[1]*b[1])} = ${n(sum)}`}
  ].concat(calcSteps(`x = √${n(sum)}`,x,roundAns(x),' cm','Square root both sides.'));
  return {prompt:`${SOLID_C}<br>Find the length <b>x</b>, the diagonal ${F.nm}.`,spec,answer:{exact:x,unit:'cm'},steps,chk:dist3(P,F.nm[0],F.nm[1])};
}

function lenSpace(){
  const {w,d,h}=dims3(),S=pick(SD),nm=S.lo+S.up,bd=srt(S.lo+S.ft),e2=w*w+d*d,x=Math.sqrt(e2+h*h),P=solid3D('cuboid',w,d,h);
  const spec=solidSpec('cuboid',w,d,h,{tris:[{v:S.t1,c:1,r:S.t1[1]},{v:[S.lo,S.ft,S.up],c:2,r:S.ft}],unk:[[S.lo,S.up]],
    labels:cubLabels(w,d,h).concat([{p:S.lo,q:S.up,t:'x cm',u:true,pref:[-.3,-1]}])});
  const steps=[
    baseStep(S.t1,w,d,false),
    {t:`Now use the orange triangle ${S.lo}${S.ft}${S.up}. Its right angle is at ${S.ft}, and ${S.ft}${S.up} is the height, ${n(h)} cm. The hypotenuse ${nm} is x. We can use ${bd}² from step 1, so there is no need to square root first.`,
     m:`x² = ${bd}² + ${S.ft}${S.up}²<br>x² = ${n(e2)} + ${n(h)}² = ${n(e2)} + ${n(h*h)} = ${n(e2+h*h)}`}
  ].concat(calcSteps(`x = √${n(e2+h*h)}`,x,roundAns(x),' cm','Square root both sides.'));
  return {prompt:`${SOLID_C}<br>Find the length <b>x</b>, the diagonal ${nm}.`,spec,answer:{exact:x,unit:'cm'},steps,chk:dist3(P,S.lo,S.up)};
}

function lenSlant(){
  const {w,d,h}=dims3(),K=pick(['A','B','C']),T=PK[K],bd=srt(K+T.pt),e2=w*w+d*d,am2=e2/4,x=Math.sqrt(am2+h*h),P=solid3D('pyramid',w,d,h);
  const spec=solidSpec('pyramid',w,d,h,{tris:[{v:T.t1,c:1,r:T.t1[1]},{v:[K,'M','V'],c:2,r:'M'}],unk:[['V',K]],auxA:[['M','V']],
    labels:pyrLabels(w,d).concat([{p:'M',q:'V',t:cm(h),pref:[1,0]},{p:'V',q:K,t:'x cm',u:true,pref:K==='A'?[-1,0]:[1,0]}])});
  const steps=[
    baseStep(T.t1,w,d,false),
    {t:`M is the centre of the base, so ${K}M is half of ${bd}. Square that half: dividing by 2 means dividing the square by 4.`,m:`${K}M = ${bd} ÷ 2<br>${K}M² = ${n(e2)} ÷ 4 = ${n(am2)}`},
    {t:`Now use the orange triangle V${K}M. Its right angle is at M, because V is directly above M. VM = ${n(h)} cm.`,m:`x² = ${K}M² + VM²<br>x² = ${n(am2)} + ${n(h)}² = ${n(am2)} + ${n(h*h)} = ${n(am2+h*h)}`}
  ].concat(calcSteps(`x = √${n(am2+h*h)}`,x,roundAns(x),' cm','Square root both sides.'));
  return {prompt:`${SOLID_P}<br>Find the length <b>x</b>, the sloping edge ${K}V.`,spec,answer:{exact:x,unit:'cm'},steps,chk:dist3(P,K,'V')};
}

function lenHeight(){
  for(let i=0;i<3000;i++){
    const {w,d,h,dec}=dims3(),K=pick(['A','B','C']),T=PK[K],bd=srt(K+T.pt),e2=w*w+d*d,am2=e2/4;
    const L=sd(Math.sqrt(am2+h*h),dec),v2=L*L-am2;
    if(v2<9||v2>900)continue;
    const x=Math.sqrt(v2),P=solid3D('pyramid',w,d,x);
    const spec=solidSpec('pyramid',w,d,x,{tris:[{v:T.t1,c:1,r:T.t1[1]},{v:[K,'M','V'],c:2,r:'M'}],unk:[['V','M']],auxA:[['M','V']],
      labels:pyrLabels(w,d).concat([{p:'V',q:K,t:cm(L),pref:K==='A'?[-1,0]:[1,0]},{p:'M',q:'V',t:'x cm',u:true,pref:[1,0]}])});
    const steps=[
      baseStep(T.t1,w,d,false),
      {t:`M is the centre of the base, so ${K}M is half of ${bd}. Square that half: dividing by 2 means dividing the square by 4.`,m:`${K}M = ${bd} ÷ 2<br>${K}M² = ${n(e2)} ÷ 4 = ${n(am2)}`},
      {t:`Now use the orange triangle V${K}M. Its right angle is at M. The hypotenuse is ${K}V = ${n(L)} cm, and we want the height VM = x.`,m:`${K}V² = ${K}M² + VM²<br>${n(L*L)} = ${n(am2)} + x²`},
      {t:`Subtract ${n(am2)} from both sides.`,m:`x² = ${n(L*L)} − ${n(am2)} = ${n(v2)}`}
    ].concat(calcSteps(`x = √${n(v2)}`,x,roundAns(x),' cm','Square root both sides.'));
    return {prompt:`${SOLID_P}<br>Find the height <b>x</b> of the pyramid, the length VM.`,spec,answer:{exact:x,unit:'cm'},steps,chk:dist3(P,'V','M')};
  }
}

/* ---------- Level 20: find an angle ---------- */
function gen3DAngle(){return pick([angFace,angSpace,angPyr])()}
const OA=(oName,oV,aName,aV)=>`Opp = ${oName} = ${cm(oV)}<br>Adj = ${aName} = ${typeof aV==='string'?aV:cm(aV)}`;

function angFace(){
  for(let i=0;i<3000;i++){
    const {w,d,h}=dims3();
    const F=pick([{nm:'AF',v:'A',a:'F',b:'B',o:['BF',h],j:['AB',w],t:['A','B','F'],r:'B'},
                  {nm:'BG',v:'B',a:'G',b:'C',o:['CG',h],j:['BC',d],t:['B','C','G'],r:'C'}]);
    const x=Math.atan(F.o[1]/F.j[1])*R2D;if(x<18||x>72)continue;

    const spec=solidSpec('cuboid',w,d,h,{tris:[{v:F.t,c:2,r:F.r}],unk:[[F.v,F.a]],arc:{v:F.v,a:F.a,b:F.b},labels:cubLabels(w,d,h)});
    const steps=[
      {t:`The orange triangle ${F.t.join('')} has a right angle at ${F.r} and contains angle x. Label its sides from x. All the vertical edges are ${n(h)} cm.`,m:OA(F.o[0],F.o[1],F.j[0],F.j[1])},
      {t:'We know Opp and Adj, so we use Tan (TOA).',m:`tan x = ${frac('Opp','Adj')}`},
      {t:'Put in the numbers.',m:`tan x = ${q}`},
      {t:'To find an angle, use the inverse function: shift (or 2nd) then tan.',m:`x = tan⁻¹(${q})`}
    ].concat(calcSteps('x',x,roundAns(x),'°',calcNote));
    return {prompt:`${SOLID_C}<br>Find the angle <b>x</b> between ${F.nm} and the base ABCD.`,spec,answer:{exact:x,unit:'°'},steps,chk:angle3(P,F.v,F.a,F.b)};
  }
}

function angSpace(){
  for(let i=0;i<3000;i++){
    const {w,d,h}=dims3(),S=pick(SD),nm=S.lo+S.up,bd=srt(S.lo+S.ft),e2=w*w+d*d,e=Math.sqrt(e2),x=Math.atan(h/e)*R2D;
    if(x<18||x>72)continue;
    const P=solid3D('cuboid',w,d,h),q=frac(n(h),nr(e));
    const spec=solidSpec('cuboid',w,d,h,{tris:[{v:S.t1,c:1,r:S.t1[1]},{v:[S.lo,S.ft,S.up],c:2,r:S.ft}],unk:[[S.lo,S.up]],
      auxA:[[S.lo,S.ft]],arc:{v:S.lo,a:S.up,b:S.ft},labels:cubLabels(w,d,h)});
    const steps=[
      baseStep(S.t1,w,d,true),
      {t:`The angle is in the orange triangle ${S.lo}${S.ft}${S.up}, with a right angle at ${S.ft}. Label its sides from x. Keep the full value of ${bd} on your calculator.`,m:OA(S.ft+S.up,h,bd,nr(e)+' cm')},
      {t:'We know Opp and Adj, so we use Tan (TOA).',m:`tan x = ${frac('Opp','Adj')}`},
      {t:'Put in the numbers.',m:`tan x = ${q}`},
      {t:'To find an angle, use the inverse function: shift (or 2nd) then tan.',m:`x = tan⁻¹(${q})`}
    ].concat(calcSteps('x',x,roundAns(x),'°',calcNote));
    return {prompt:`${SOLID_C}<br>Find the angle <b>x</b> between the diagonal ${nm} and the base ABCD.`,spec,answer:{exact:x,unit:'°'},steps,chk:angle3(P,S.lo,S.up,S.ft)};
  }
}

function angPyr(){
  const useCos=Math.random()<.4;
  for(let i=0;i<5000;i++){
    const {w,d,h,dec}=dims3(),K=pick(['A','B','C']),T=PK[K],bd=srt(K+T.pt),e2=w*w+d*d,e=Math.sqrt(e2),am=e/2;
    let x,L=0,hh=h;
    if(useCos){L=sd(Math.sqrt(am*am+h*h),dec);if(L<=am+.5)continue;x=Math.acos(am/L)*R2D;hh=Math.sqrt(L*L-am*am)}
    else x=Math.atan(h/am)*R2D;
    if(x<22||x>75)continue;
    const P=solid3D('pyramid',w,d,hh);
    const lab=pyrLabels(w,d).concat(useCos?[{p:'V',q:K,t:cm(L),pref:K==='A'?[-1,0]:[1,0]}]:[{p:'M',q:'V',t:cm(h),pref:[1,0]}]);
    const spec=solidSpec('pyramid',w,d,hh,{tris:[{v:T.t1,c:1,r:T.t1[1]},{v:[K,'M','V'],c:2,r:'M'}],unk:[['V',K]],auxA:[['M','V'],[K,T.pt]],arc:{v:K,a:'V',b:'M'},labels:lab});
    const steps=[
      baseStep(T.t1,w,d,true),
      {t:`M is the centre of the base, so ${K}M is half of ${bd}.`,m:`${K}M = ${nr(e)} ÷ 2 = ${nr(am)}`}
    ];
    let q;
    if(useCos){
      q=frac(nr(am),n(L));
      steps.push(
        {t:`The orange triangle V${K}M has a right angle at M and contains angle x. Label its sides from x. Keep the full value of ${K}M on your calculator.`,m:`Hyp = ${K}V = ${cm(L)}<br>Adj = ${K}M = ${nr(am)} cm`},
        {t:'We know Adj and Hyp, so we use Cos (CAH).',m:`cos x = ${frac('Adj','Hyp')}`},
        {t:'Put in the numbers.',m:`cos x = ${q}`},
        {t:'To find an angle, use the inverse function: shift (or 2nd) then cos.',m:`x = cos⁻¹(${q})`});
    }else{
      q=frac(n(h),nr(am));
      steps.push(
        {t:`The orange triangle V${K}M has a right angle at M and contains angle x. Label its sides from x. Keep the full value of ${K}M on your calculator.`,m:OA('VM',h,K+'M',nr(am)+' cm')},
        {t:'We know Opp and Adj, so we use Tan (TOA).',m:`tan x = ${frac('Opp','Adj')}`},
        {t:'Put in the numbers.',m:`tan x = ${q}`},
        {t:'To find an angle, use the inverse function: shift (or 2nd) then tan.',m:`x = tan⁻¹(${q})`});
    }
    return {prompt:`${SOLID_P}<br>Find the angle <b>x</b> between the edge ${K}V and the base ABCD.`,spec,answer:{exact:x,unit:'°'},
      steps:steps.concat(calcSteps('x',x,roundAns(x),'°',calcNote)),chk:angle3(P,K,'V','M')};
  }
}

/* ============================ ENGINE ============================ */
function finalise(q){
  const a=q.answer;
  if(a.integer){a.val=a.exact;a.dp=0;a.str=String(a.exact);a.label=null;a.isExact=true}
  else{const r=roundAns(a.exact);a.val=r.val;a.dp=r.dp;a.str=r.str;a.label=r.label;a.isExact=r.exact}
  a.text='x = '+a.str+(a.unit==='°'?'°':' cm');
  if(!a.isExact)q.prompt+=`<br><span class="note">Give your answer to ${a.label==='3 s.f.'?'3 significant figures':'1 decimal place'}.</span>`;
  return q;
}
function parseEntry(t){
  t=String(t).replace(/[°\s]|cm/gi,'').replace(',','.');
  if(!/^-?\d*\.?\d+$/.test(t))return NaN;
  return parseFloat(t);
}
function checkAnswer(q,text){
  const v=parseEntry(text);if(isNaN(v))return {parse:false,ok:false};
  const a=q.answer,tol=a.isExact?1e-6:0.5*Math.pow(10,-a.dp)+1e-9;
  return {parse:true,ok:Math.abs(v-a.exact)<=tol};
}
function newQuestion(level){return finalise(level.gen())}

/* ============================ UI ============================ */
const $=id=>document.getElementById(id);
let cur=null;      // {level,q,steps,revealed,solved,tries}
let score={tries:0,correct:0,streak:0};

function buildHome(){
  let h='<p class="intro">Choose a level. Every level makes new questions as often as you like.</p>';
  for(const gk in GROUPS){
    const G=GROUPS[gk];
    h+=`<section class="group" style="--c:${G.col}"><h2>${G.name}</h2><div class="levels">`;
    for(const L of LEVELS.filter(l=>l.g===gk))
      h+=`<button class="lvl" style="--c:${G.col}" data-n="${L.n}" ${L.gen?'':'disabled'}><span class="num">${L.n}</span><span>${L.name}</span>${L.gen?'':'<span class="soon">soon</span>'}</button>`;
    h+='</div></section>';
  }
  $('home').innerHTML=h;
  $('home').onclick=e=>{const b=e.target.closest('.lvl');if(b&&!b.disabled)openLevel(+b.dataset.n)};
}
function show(view){
  $('home').hidden=view!=='home';$('play').hidden=view!=='play';$('homeBtn').hidden=view!=='play';
}
function openLevel(nn){
  const L=LEVELS.find(l=>l.n===nn);if(!L||!L.gen)return;
  score={tries:0,correct:0,streak:0};
  cur={level:L};show('play');nextQ();
}
function nextQ(){
  cur.q=newQuestion(cur.level);cur.shown=0;cur.revealed=false;cur.solved=false;cur.tries=0;cur.fb='';cur.fbc='';cur.fresh=true;
  renderPlay();
}
function renderPlay(){
  {const w0=$('workbox');cur.wbTop=(w0&&!cur.fresh)?w0.scrollTop:0;cur.fresh=false}
  const L=cur.level,G=GROUPS[L.g],q=cur.q,practice=S.mode==='practice';
  const prev=LEVELS.find(l=>l.n===L.n-1&&l.gen),next=LEVELS.find(l=>l.n===L.n+1&&l.gen);
  let h=`<div class="crumbs" style="--c:${G.col}"><span class="tag">Level ${L.n}</span><span class="nm">${L.name}</span><span class="sp"></span>
    <button class="btn ghost" id="bPrev" ${prev?'':'disabled'}>◀ Level</button><button class="btn ghost" id="bNext" ${next?'':'disabled'}>Level ▶</button></div>
  <div class="stage"><div class="card"><p class="prompt">${q.prompt}</p>${((L.g==='trig'||L.n===20)&&S.degNote)?'<p class="note deg">Calculator: check it is in degrees mode (DEG).</p>':''}${q.spec.solid?draw3D(q.spec,cur.shown>0):drawTriangle(q.spec)}</div><div class="side">`;
  h+='<div class="card"><div class="ctl">';
  if(practice){
    h+=`<div class="ans"><label for="inp">x =</label><input id="inp" inputmode="decimal" autocomplete="off" ${cur.solved?'disabled':''}><span class="unit">${q.answer.unit==='°'?'°':'cm'}</span>
        <button class="btn o" id="bCheck" ${cur.solved?'disabled':''}>Check</button></div>`;
  }else{
    h+=`<button class="btn o" id="bAns">${cur.revealed?'Hide answer':'Show answer'}</button>`;
  }
  const allShown=cur.shown>=q.steps.length;
  h+=`<button class="btn" id="bWork">${cur.shown===0?'Show working':(allShown?'Hide working':'Next step')}</button>`;
  if(cur.shown>0&&!allShown)h+=`<button class="btn ghost" id="bAll">Show all</button>`;
  h+=`<button class="btn ghost" id="bNew">New question</button></div>`;
  h+=`<div class="fb ${cur.fbc}" id="fb">${practice?cur.fb:(cur.revealed?`<span class="answerpill">${q.answer.text}</span>`:'')}</div>`;
  if(practice)h+=`<div class="score">Correct ${score.correct} of ${score.tries} · Streak ${score.streak}</div>`;
  h+='</div>';
  if(cur.shown>0){
    h+='<div class="card"><div class="workbox" id="workbox"><ol class="work">';
    q.steps.slice(0,cur.shown).forEach((s,i)=>{h+=`<li class="${i===q.steps.length-1?'final':''}"><span>${s.t}</span><div class="eq">${s.m.split('<br>').map(x=>`<div>${x}</div>`).join('')}</div></li>`});
    h+='</ol></div></div>';
  }
  h+='</div></div>';
  $('play').innerHTML=h;
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  on('bNew',nextQ);
  on('bPrev',()=>openLevel(prev.n));on('bNext',()=>openLevel(next.n));
  on('bAns',()=>{cur.revealed=!cur.revealed;renderPlay()});
  on('bWork',()=>{cur.wbGrow=true;cur.shown=cur.shown===0?1:(allShown?0:cur.shown+1);renderPlay()});
  on('bAll',()=>{cur.wbGrow=true;cur.shown=q.steps.length;renderPlay()});
  on('bCheck',doCheck);
  const wb=$('workbox');if(wb){const keep=cur.wbTop;wb.style.scrollBehavior='auto';wb.scrollTop=(cur.wbGrow?wb.scrollHeight:(keep||0));wb.style.scrollBehavior='';cur.wbGrow=false}
  const inp=$('inp');
  if(inp){inp.onkeydown=e=>{if(e.key==='Enter')doCheck()};if(!cur.solved&&!cur.keepFocus)inp.focus();inp.value=cur.entry||''}
}
function doCheck(){
  const inp=$('inp'),q=cur.q;if(!inp||cur.solved)return;
  const r=checkAnswer(q,inp.value);
  cur.entry=inp.value;
  if(!r.parse){cur.fb='Type a number, please.';cur.fbc='bad';renderPlay();return}
  if(cur.tries===0){score.tries++}
  cur.tries++;
  if(r.ok){
    if(cur.tries===1){score.correct++;score.streak++}
    cur.solved=true;cur.fb='Correct! '+q.answer.text;cur.fbc='good';
    cur.entry='';
  }else{
    score.streak=0;cur.fb=cur.tries>1?'Not yet. Try again, or look at the working.':'Not quite. Have another go.';cur.fbc='bad';
  }
  renderPlay();
}

/* settings dialog */
function syncDialog(){
  document.querySelectorAll('input[name=mode]').forEach(r=>r.checked=r.value===S.mode);
  document.querySelectorAll('input[name=rounding]').forEach(r=>r.checked=r.value===S.rounding);
  $('optLogo').checked=S.logo;$('optRoles').checked=S.roles;$('optDeg').checked=S.degNote;
}
function applyLogo(){$('logo').hidden=!S.logo}
$('setBtn').onclick=()=>{syncDialog();$('dlg').showModal()};
$('dlgClose').onclick=()=>$('dlg').close();
$('dlg').addEventListener('change',e=>{
  const oldR=S.rounding;
  if(e.target.name==='mode')S.mode=e.target.value;
  if(e.target.name==='rounding')S.rounding=e.target.value;
  if(e.target.id==='optLogo')S.logo=e.target.checked;
  if(e.target.id==='optRoles')S.roles=e.target.checked;
  if(e.target.id==='optDeg')S.degNote=e.target.checked;
  saveS();applyLogo();
  if(cur&&!$('play').hidden){ if(oldR!==S.rounding)nextQ(); else {cur.entry='';renderPlay()} }
});
$('homeBtn').onclick=()=>{show('home');cur=null};
document.addEventListener('keydown',e=>{
  if(!cur||$('play').hidden||e.target.tagName==='INPUT'||$('dlg').open)return;
  if(e.key==='n'||e.key==='N')nextQ();
  if((e.key==='a'||e.key==='A')&&$('bAns'))$('bAns').click();
  if((e.key==='w'||e.key==='W'||e.key===' ')&&$('bWork')){e.preventDefault();$('bWork').click()}
});

/* ============================ BOOT ============================ */
applyLogo();buildHome();show('home');
window.TT={gen3DLength,gen3DAngle,draw3D,genTrig,genSineSide,genSineAngle,genCosSide,genCosAngle,genMixedRules,LEVELS,GROUPS,S,layout,drawTriangle,roundAns,checkAnswer,newQuestion,openLevel,geoFromAngles,geoFromSides};
</script>
