*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070b1f;color:#fff;font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{display:flex;flex-direction:column;align-items:center;height:100%;padding:6px}
#hud{display:flex;gap:clamp(10px,3vw,40px);align-items:center;justify-content:center;font-weight:bold;flex-wrap:wrap;padding:2px 0 6px}
.box{text-align:center;min-width:90px}
.lbl{font-size:clamp(10px,1.6vh,14px);letter-spacing:.12em;color:#8fb4ff;text-transform:uppercase}
.val{font-size:clamp(20px,4vh,40px);line-height:1.1;font-variant-numeric:tabular-nums}
#title{font:clamp(22px,4.6vh,44px) 'Super Bouncer','Trebuchet MS',Verdana,sans-serif;color:#F47B3F;letter-spacing:.04em}
.lbl,.val{font-family:'Anak Orang','Trebuchet MS',Verdana,sans-serif}
#hi{color:#ffd23f}
#gh{color:#ff5b6b}
canvas{display:block;background:#050818;border-radius:10px;box-shadow:0 0 30px #1b3cff55}
#wrap{overflow:hidden;padding-bottom:34px}
#tick{position:fixed;left:0;right:0;bottom:0;height:calc(26px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#050818;border-top:1px solid #F47B3F;overflow:hidden;z-index:5;pointer-events:none;font:bold 14px/26px "Courier New",Courier,monospace;color:#F47B3F}
#trk{display:inline-block;white-space:pre;will-change:transform}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,2.5vw,36px)}
#gear{font:bold clamp(12px,2.2vh,18px) "Trebuchet MS",Verdana,sans-serif;color:#fff;background:#1b3aa8;border:2px solid #3d7bff;border-radius:12px;padding:.6em 1.1em;cursor:pointer}
#pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);grid-template-areas:". u ." "l m r" ". d .";gap:6px;width:clamp(150px,34vmin,330px);aspect-ratio:1;padding:8px;background:#0a1440;border:2px solid #24399a;border-radius:22px;touch-action:none;flex:none;--a:clamp(10px,2.6vmin,24px)}
.pb{position:relative;background:#1b3aa8;border:2px solid #3d7bff;border-radius:14px}
.pb.on{background:#37e6a0;border-color:#b6ffe3}
.pb::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);border:solid transparent}
.pb.u{grid-area:u}.pb.d{grid-area:d}.pb.l{grid-area:l}.pb.r{grid-area:r}
.pb.u::after{border-width:0 var(--a) calc(var(--a)*1.5) var(--a);border-bottom-color:#fff}
.pb.d::after{border-width:calc(var(--a)*1.5) var(--a) 0 var(--a);border-top-color:#fff}
.pb.l::after{border-width:var(--a) calc(var(--a)*1.5) var(--a) 0;border-right-color:#fff}
.pb.r::after{border-width:var(--a) 0 var(--a) calc(var(--a)*1.5);border-left-color:#fff}
.pb.on::after{filter:brightness(.2)}
.pm{grid-area:m;background:#122a80;border-radius:50%;margin:18%}
#settings{position:fixed;inset:0;background:rgba(5,8,24,.85);display:none;align-items:center;justify-content:center;z-index:10}
#settings.show{display:flex}
.card{background:#0c1c5c;border:2px solid #3d7bff;border-radius:18px;padding:clamp(14px,3vh,30px);width:min(680px,94vw);max-height:96vh;overflow:auto}
.card h2{font-family:'Super Bouncer','Trebuchet MS',sans-serif;font-weight:normal;margin:0 0 .6em;color:#F47B3F;font-size:clamp(20px,4vh,34px)}
.srow{margin-bottom:1.2em}
.slbl{color:#8fb4ff;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(11px,2vh,15px);margin-bottom:.4em;font-weight:bold}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-width:0;white-space:nowrap;font:bold clamp(13px,2.4vh,21px) "Trebuchet MS",Verdana,sans-serif;color:#fff;background:#13297f;border:2px solid #3d7bff;border-radius:12px;padding:.7em .6em;cursor:pointer}
.seg button.sel{background:#F47B3F;color:#1a0d05;border-color:#ffc9a8}
#lvlDesc{margin-top:.6em;color:#fff1d6;font-size:clamp(13px,2.4vh,19px);min-height:2.6em}
#closeSet{font:bold clamp(16px,3vh,26px) "Trebuchet MS",Verdana,sans-serif;color:#1a0d05;background:#F47B3F;border:0;border-radius:12px;padding:.6em 1.6em;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="box"><div id="title">MAZE MUNCH MATHS</div></div>
    <div class="box"><div class="lbl">Score</div><div class="val" id="sc">0</div></div>
    <div class="box"><div class="lbl" id="hl">High score</div><div class="val" id="hi">0</div></div>
    <div class="box"><div class="lbl">&times;0 monsters</div><div class="val" id="gh">0</div></div>
    <div class="box"><button id="gear" type="button">Settings</button></div>
  </div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="pad" aria-label="Joystick">
      <div class="pb u"></div><div class="pb l"></div><div class="pm"></div><div class="pb r"></div><div class="pb d"></div>
    </div>
  </div>
</div>
<div id="tick"><span id="trk"></span></div>
<div id="settings">
  <div class="card">
    <h2>Settings</h2>
    <div class="srow"><div class="slbl">Monster skill level</div><div class="seg" id="lvlSeg"></div><div id="lvlDesc"></div></div>
    <div class="srow"><div class="slbl">Joystick</div><div class="seg" id="padSeg"></div></div>
    <div class="srow"><div class="slbl">Music (M key)</div><div class="seg" id="musSeg"></div></div>
    <button id="closeSet" type="button">Done</button>
  </div>
</div>
<script>
(function(){
"use strict";
var TOP=[
"###################",
"#........#........#",
"#.##.###.#.###.##.#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.### # ###.####",
"####.#       #.####",
"####.# ## ## #.####",
"#....   # #   ....#",
"####.# ##### #.####"];
var ROWSTR=TOP.slice();
for(var i=9;i>=0;i--)ROWSTR.push(TOP[i]);
var COLS=19,ROWS=ROWSTR.length;
var wall=[];
for(var r=0;r<ROWS;r++){wall.push([]);for(var c=0;c<COLS;c++){wall[r].push((ROWSTR[r].charAt(c)||"#")==="#");}}
function free(c,r){return c>=0&&r>=0&&c<COLS&&r<ROWS&&!wall[r][c];}
var DIRS=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var elSc=document.getElementById("sc"),elHi=document.getElementById("hi"),elGh=document.getElementById("gh"),elHl=document.getElementById("hl");
var elMain=document.getElementById("main"),elPad=document.getElementById("pad");
var cs=20,dpr=1,mz=null;

var PLAYER_SPEED=6.0; /* monsters are always slightly slower than the hero */
/* Monster skill levels. speed = fraction of hero speed; wild = chance of a random turn at a junction;
   attn = chance of re-checking where the hero is at a junction; mode 0 = chase the hero's current spot,
   1 = every other monster ambushes ahead of the hero, 2 = all monsters plan interceptions. */
var LEVELS=[
 {name:"Apprentice",speed:0.55,wild:[0.50,0.60],attn:0.30,mode:0,depth:[0],desc:"Slow and easily distracted. Wanders about and often loses track of where you are."},
 {name:"Newb",speed:0.70,wild:[0.30,0.40],attn:0.60,mode:0,depth:[0],desc:"A bit slow. Heads for where you were, but forgets to look now and then."},
 {name:"Junior",speed:0.85,wild:[0.12,0.24],attn:1,mode:1,depth:[3],desc:"The standard game. Steady chasers, and some try to ambush you."},
 {name:"Senior",speed:0.92,wild:[0.05,0.10],attn:1,mode:1,depth:[4],desc:"Fast and focused. Hardly ever wander, and cut you off at corners."},
 {name:"Pro",speed:0.97,wild:[0,0.03],attn:1,mode:2,depth:[0.25,0.45,0.35,0.55],desc:"Nearly as fast as you. They plan interceptions and close in from different sides."}];
var level=2,padPos="right",settingsOpen=false;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var sl=parseInt(lsGet("mazemunchmaths_level"),10);if(sl>=0&&sl<LEVELS.length)level=sl;
var sp=lsGet("mazemunchmaths_pad");if(sp==="left"||sp==="right"||sp==="off")padPos=sp;
var state="title",gt=0,score=0,high=0,newHigh=false,dots,dotsLeft,items,ghosts,popups,player,want,multT,dyT,preScore,overAt=0,lastT=0,clock=0;
function loadHigh(){high=parseInt(lsGet("mazemunchmaths_high_"+level),10)||0;}
loadHigh();

function mkEnt(c,r,sp){return{c:c,r:r,tc:c,tr:r,t:1,dx:0,dy:0,speed:sp};}
function pos(e){var t=Math.min(e.t,1);return{x:e.c+(e.tc-e.c)*t,y:e.r+(e.tr-e.r)*t};}

function resize(){
  dpr=window.devicePixelRatio||1;
  var hud=document.getElementById("hud").offsetHeight;
  var landscape=window.innerWidth>window.innerHeight*1.1,padOn=padPos!=="off";
  elPad.style.display=padOn?"grid":"none";
  elMain.style.flexDirection=landscape?"row":"column";
  elPad.style.order=(landscape&&padPos==="left")?"-1":"1";
  var padW=padOn?elPad.offsetWidth:0;
  var aw=window.innerWidth-16-(landscape&&padOn?padW+40:0);
  var ah=window.innerHeight-hud-56-(!landscape&&padOn?padW+16:0);
  cs=Math.max(10,Math.floor(Math.min(aw/COLS,ah/ROWS)));
  cv.style.width=cs*COLS+"px";cv.style.height=cs*ROWS+"px";
  cv.width=Math.round(cs*COLS*dpr);cv.height=Math.round(cs*ROWS*dpr);
  renderMaze();
  buildTicker();
}
function buildTicker(){
  var tr=document.getElementById("trk");if(!tr)return;
  var unit="www.loadsofmaths.org.uk   ";
  var m=document.createElement("canvas").getContext("2d");m.font='bold 14px "Courier New",Courier,monospace';
  var cw=m.measureText("M").width||8.4;
  var n=Math.max(1,Math.ceil(window.innerWidth/(unit.length*cw))+1),half=new Array(n+1).join(unit);
  tr.textContent=half+half;
  tr.style.animation="tick "+((half.length*cw)/70).toFixed(2)+"s linear infinite";
}
function renderMaze(){
  mz=document.createElement("canvas");mz.width=cv.width;mz.height=cv.height;
  var g=mz.getContext("2d");g.scale(dpr,dpr);
  g.fillStyle="#0c1c5c";
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(wall[r][c])g.fillRect(c*cs,r*cs,cs,cs);
  g.strokeStyle="#3d7bff";g.lineWidth=Math.max(2,cs*0.09);g.lineCap="round";
  g.beginPath();
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(!wall[r][c])continue;
    var x=c*cs,y=r*cs;
    if(r>0&&!wall[r-1][c]){g.moveTo(x,y);g.lineTo(x+cs,y);}
    if(r<ROWS-1&&!wall[r+1][c]){g.moveTo(x,y+cs);g.lineTo(x+cs,y+cs);}
    if(c>0&&!wall[r][c-1]){g.moveTo(x,y);g.lineTo(x,y+cs);}
    if(c<COLS-1&&!wall[r][c+1]){g.moveTo(x+cs,y);g.lineTo(x+cs,y+cs);}
  }
  g.stroke();
}

function fmt(n){return Math.round(n).toLocaleString("en-GB");}
function hud(v){elHl.textContent="High score · "+LEVELS[level].name;elSc.textContent=fmt(v===undefined?score:v);elHi.textContent=fmt(Math.max(high,score));elGh.textContent=ghosts?ghosts.length:0;}

function refill(){
  dots=new Uint8Array(COLS*ROWS);dotsLeft=0;
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(!wall[r][c]){dots[r*COLS+c]=1;dotsLeft++;}
  items=new Map();
  if(player){var k=player.tr*COLS+player.tc;if(dots[k]){dots[k]=0;dotsLeft--;}}
}
function reset(){
  score=0;gt=0;newHigh=false;ghosts=[];popups=[];multT=4;player=null;
  player=mkEnt(9,3,PLAYER_SPEED);
  refill();
  var k=3*COLS+9;if(dots[k]){dots[k]=0;dotsLeft--;}
  want={dx:1,dy:0};player.dx=1;
  hud();
}
function start(){reset();state="play";}

function pop(c,r,text,col){popups.push({x:c,y:r,text:text,life:1.3,col:col});}

function eatAt(c,r){
  var k=r*COLS+c;
  if(items.has(k)){
    var it=items.get(k);items.delete(k);dots[k]=0;dotsLeft--;
    score*=it.k;
    pop(c,r,"\u00d7"+it.k+"!",it.k===2?"#ffd23f":it.k===5?"#ff4fd8":"#7dffea");
  }else if(dots[k]){dots[k]=0;dotsLeft--;score+=2;}
  if(score>high){high=score;newHigh=true;}
  if(dotsLeft<=0)refill();
  hud();
}

function setWant(d){
  want=d;
  var p=player;
  if(state==="play"&&p.t<1&&(p.dx||p.dy)&&d.dx===-p.dx&&d.dy===-p.dy){
    var c=p.c,r=p.r;p.c=p.tc;p.r=p.tr;p.tc=c;p.tr=r;p.t=1-p.t;p.dx=d.dx;p.dy=d.dy;
  }
}

function updPlayer(dt){
  var p=player,move=p.speed*dt;
  while(move>0){
    if(p.t>=1){
      p.c=p.tc;p.r=p.tr;
      eatAt(p.c,p.r);
      var d=null;
      if(want&&free(p.c+want.dx,p.r+want.dy))d=want;
      else if((p.dx||p.dy)&&free(p.c+p.dx,p.r+p.dy))d={dx:p.dx,dy:p.dy};
      if(!d){p.t=1;break;}
      p.dx=d.dx;p.dy=d.dy;p.tc=p.c+d.dx;p.tr=p.r+d.dy;p.t=0;
    }
    var step=Math.min(1-p.t,move);p.t+=step;move-=step;
  }
}

function ghostTarget(t){
  if(t<12)return 0;
  if(t<28)return 1;
  if(t<48)return 2;
  return Math.min(8,3+Math.floor((t-48)/30));
}
var GCOL=["#ff3b4e","#ff7b00","#e23bff","#ff3b9a","#ff5a36","#c8326b","#ff9a3b","#d62b2b"];
function spawnGhost(){
  var pp=pos(player);
  var spots=[{c:9,r:7},{c:9,r:13}];
  var best=spots[0],bd=-1;
  spots.forEach(function(s){var d=Math.hypot(s.c-pp.x,s.r-pp.y);if(d>bd){bd=d;best=s;}});
  var g=mkEnt(best.c,best.r,0);
  g.warm=1.6;g.col=GCOL[ghosts.length%GCOL.length];
  g.idx=ghosts.length;
  g.wildR=Math.random();
  g.tx=Math.round(pp.x);g.ty=Math.round(pp.y); /* where it last saw the hero */
  ghosts.push(g);hud();
}
/* the cell n steps ahead of the hero along its direction of travel (stopping at walls) */
function aheadCell(n){
  var c=player.tc,r=player.tr;
  if(!player.dx&&!player.dy)return{c:c,r:r};
  for(var i=0;i<n;i++){
    if(free(c+player.dx,r+player.dy)){c+=player.dx;r+=player.dy;}else break;
  }
  return{c:c,r:r};
}
function lookAtHero(g,L){
  var pc=player.t>0.5?player.tc:player.c,pr=player.t>0.5?player.tr:player.r;
  var ambush=false,n=0;
  if(L.mode===1&&g.idx%2===1){ambush=true;n=L.depth[0];}
  else if(L.mode===2){
    ambush=true;
    var dist=Math.abs(g.c-pc)+Math.abs(g.r-pr);
    n=Math.min(7,Math.round(dist*L.depth[g.idx%L.depth.length]));
  }
  if(ambush&&n>0){var a=aheadCell(n);pc=a.c;pr=a.r;}
  g.tx=pc;g.ty=pr;
}
function updGhost(g,dt){
  if(g.warm>0){g.warm-=dt;return;}
  var L=LEVELS[level];
  var move=PLAYER_SPEED*L.speed*dt;
  while(move>0){
    if(g.t>=1){
      g.c=g.tc;g.r=g.tr;
      var opts=DIRS.filter(function(d){return free(g.c+d.dx,g.r+d.dy)&&!(d.dx===-g.dx&&d.dy===-g.dy);});
      if(!opts.length)opts=DIRS.filter(function(d){return free(g.c+d.dx,g.r+d.dy);});
      var pick;
      var wild=L.wild[0]+g.wildR*(L.wild[1]-L.wild[0]);
      if(Math.random()<wild){pick=opts[Math.floor(Math.random()*opts.length)];}
      else{
        if(Math.random()<L.attn)lookAtHero(g,L);
        var bd=1e9;pick=opts[0];
        opts.forEach(function(d){
          var dist=Math.hypot(g.c+d.dx-g.tx,g.r+d.dy-g.ty)+Math.random()*0.01;
          if(dist<bd){bd=dist;pick=d;}
        });
      }
      g.dx=pick.dx;g.dy=pick.dy;g.tc=g.c+pick.dx;g.tr=g.r+pick.dy;g.t=0;
    }
    var step=Math.min(1-g.t,move);g.t+=step;move-=step;
  }
}

function spawnItem(){
  var cand=[],pp=pos(player);
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var k=r*COLS+c;
    if(dots[k]&&!items.has(k)&&Math.hypot(c-pp.x,r-pp.y)>4)cand.push(k);
  }
  if(!cand.length)return;
  var k=cand[Math.floor(Math.random()*cand.length)];
  var q=Math.random(),m=q<0.04?10:q<0.2?5:2;
  items.set(k,{k:m,exp:gt+(m===10?7:10),born:gt});
}

function die(){
  state="dying";dyT=0;preScore=score;
  lsSet("mazemunchmaths_high_"+level,high);
  playDoom();
}

function update(dt){
  if(state==="play"){
    gt+=dt;
    updPlayer(dt);
    var tg=ghostTarget(gt);
    while(ghosts.length<tg)spawnGhost();
    ghosts.forEach(function(g){updGhost(g,dt);});
    multT-=dt;
    if(multT<=0){
      multT=3+Math.random()*3;
      if(score>=10&&items.size<3)spawnItem();
    }
    items.forEach(function(it,k){if(gt>it.exp)items.delete(k);});
    var pp=pos(player);
    for(var i=0;i<ghosts.length;i++){
      var g=ghosts[i];if(g.warm>0)continue;
      var gp=pos(g);
      if(Math.hypot(gp.x-pp.x,gp.y-pp.y)<0.62){die();break;}
    }
  }else if(state==="dying"){
    dyT+=dt;
    hud(preScore*Math.max(0,1-dyT/1.1));
    if(dyT>=1.1){score=0;hud(0);}
    if(dyT>2.0){state="over";overAt=clock;}
  }
  for(var j=popups.length-1;j>=0;j--){popups[j].life-=dt;if(popups[j].life<=0)popups.splice(j,1);}
}

/* ---------- drawing ---------- */
function drawMuncher(x,y,t){
  var px=x*cs+cs/2,py=y*cs+cs/2,s=cs*0.8,h=s/2;
  var dx=player.dx,dy=player.dy;if(!dx&&!dy)dx=1;
  ctx.save();
  if(state==="dying"&&Math.floor(dyT*10)%2===0)ctx.globalAlpha=0.35;
  ctx.shadowColor="#37e6a0";ctx.shadowBlur=cs*0.4;
  ctx.fillStyle="#37e6a0";
  rr(px-h,py-h,s,s,cs*0.22);ctx.fill();
  ctx.shadowBlur=0;
  /* jaw */
  var open=0.12+0.2*Math.abs(Math.sin(t*14))*(state==="play"&&(player.t<1)?1:0.3);
  var mw=cs*open*1.4,ml=cs*0.45;
  ctx.fillStyle="#050818";
  if(dx===1)ctx.fillRect(px+cs*0.04,py-mw/2,ml,mw);
  else if(dx===-1)ctx.fillRect(px-cs*0.04-ml,py-mw/2,ml,mw);
  else if(dy===1)ctx.fillRect(px-mw/2,py+cs*0.04,mw,ml);
  else ctx.fillRect(px-mw/2,py-cs*0.04-ml,mw,ml);
  /* eyes */
  var ey=py-cs*0.14,ex=cs*0.2;
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(px-ex,ey,cs*0.1,0,6.3);ctx.arc(px+ex,ey,cs*0.1,0,6.3);ctx.fill();
  ctx.fillStyle="#0a1a3a";
  ctx.beginPath();ctx.arc(px-ex+dx*cs*0.04,ey+dy*cs*0.04,cs*0.05,0,6.3);ctx.arc(px+ex+dx*cs*0.04,ey+dy*cs*0.04,cs*0.05,0,6.3);ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawGhost(g,t){
  var p=pos(g),px=p.x*cs+cs/2,py=p.y*cs+cs/2;
  ctx.save();
  if(g.warm>0){
    ctx.globalAlpha=0.25+0.2*Math.sin(t*20);
    ctx.strokeStyle=g.col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px,py,cs*(0.9-0.4*(g.warm/1.6)),0,6.3);ctx.stroke();
  }
  var R=cs*0.36,spikes=9,rot=t*1.5;
  ctx.shadowColor=g.col;ctx.shadowBlur=cs*0.35;
  ctx.fillStyle=g.col;
  ctx.beginPath();
  for(var i=0;i<spikes*2;i++){
    var a=rot+i*Math.PI/spikes,rad=(i%2===0)?R*1.28:R*0.92;
    var X=px+Math.cos(a)*rad,Y=py+Math.sin(a)*rad;
    if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
  }
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#2a0610";
  ctx.beginPath();ctx.arc(px,py,R*0.8,0,6.3);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold "+Math.round(cs*0.42)+"px 'Trebuchet MS',Verdana,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("\u00d70",px,py+cs*0.02);
  ctx.restore();
}
function drawItem(k,it,t){
  var c=k%COLS,r=Math.floor(k/COLS),px=c*cs+cs/2,py=r*cs+cs/2;
  var col=it.k===2?"#ffd23f":it.k===5?"#ff4fd8":"hsl("+((t*240)%360)+",100%,65%)";
  var pulse=0.85+0.15*Math.sin(t*8+k);
  var left=it.exp-gt;if(left<2&&Math.floor(t*8)%2===0)return;
  ctx.save();
  ctx.shadowColor=col;ctx.shadowBlur=cs*0.7;
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(px,py,cs*0.4*pulse,0,6.3);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#1a1030";
  ctx.font="bold "+Math.round(cs*(it.k===10?0.34:0.4))+"px 'Trebuchet MS',Verdana,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("\u00d7"+it.k,px,py+cs*0.02);
  ctx.restore();
}
var FAM="'Trebuchet MS',Verdana,sans-serif",TITLEFAM="'Super Bouncer','Trebuchet MS',Verdana,sans-serif";
function text(s,x,y,size,col,weight,fam,maxW){
  ctx.fillStyle=col||"#fff";
  var f=fam||FAM,wt=weight||"bold";
  ctx.font=wt+" "+Math.round(size)+"px "+f;
  if(maxW){var w=ctx.measureText(s).width;if(w>maxW){size=size*maxW/w;ctx.font=wt+" "+Math.round(size)+"px "+f;}}
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(s,x,y);
}
function panel(lines){
  var W=COLS*cs,H=ROWS*cs;
  ctx.fillStyle="rgba(5,8,24,0.82)";ctx.fillRect(0,0,W,H);
  var y=H*0.2;
  lines.forEach(function(l){
    text(l.t,W/2,y,cs*l.s,l.c,l.w,l.f?TITLEFAM:null,W*0.94);y+=cs*l.s*1.55;
  });
}

function draw(){
  var t=clock;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,COLS*cs,ROWS*cs);
  ctx.drawImage(mz,0,0,COLS*cs,ROWS*cs);
  if(dots){
    ctx.fillStyle="#fff1d6";
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
      var k=r*COLS+c;
      if(dots[k]&&!(items&&items.has(k))){ctx.beginPath();ctx.arc(c*cs+cs/2,r*cs+cs/2,cs*0.09,0,6.3);ctx.fill();}
    }
    items.forEach(function(it,k){drawItem(k,it,t);});
  }
  if(player){var p=pos(player);drawMuncher(p.x,p.y,t);}
  if(ghosts)ghosts.forEach(function(g){drawGhost(g,t);});
  if(popups)popups.forEach(function(o){
    ctx.save();ctx.globalAlpha=Math.min(1,o.life);
    text(o.text,o.x*cs+cs/2,(o.y-(1.3-o.life)*1.2)*cs,cs*0.8,o.col);
    ctx.restore();
  });
  if(state==="dying"&&dyT>0.25){
    var pp=pos(player);
    ctx.save();ctx.shadowColor="#ff3b4e";ctx.shadowBlur=cs;
    text("\u00d7 0",COLS*cs/2,Math.max(cs*2,pp.y*cs-cs*1.5),cs*2.2,"#ff3b4e");
    ctx.restore();
  }
  if(state==="title"){
    panel([
      {t:"MAZE MUNCH MATHS",s:1.7,c:"#F47B3F",w:"normal",f:1},
      {t:"Munch every dot: +2 points each",s:0.8,c:"#fff1d6",w:"normal"},
      {t:"\u00d72   \u00d75   \u00d710  dots multiply your score!",s:0.8,c:"#ffd23f"},
      {t:"But watch out for the \u00d70 monsters \u2013",s:0.8,c:"#ff7b8a",w:"normal"},
      {t:"touch one and your score is multiplied by zero.",s:0.8,c:"#ff7b8a",w:"normal"},
      {t:"They get more numerous the longer you last.",s:0.7,c:"#9bb4ff",w:"normal"},
      {t:"Arrow keys, numpad 8 4 6 2, swipe or joystick",s:0.7,c:"#9bb4ff",w:"normal"},
      {t:"Monster level: "+LEVELS[level].name+" (see Settings)",s:0.7,c:"#ffd23f",w:"normal"},
      {t:"Tap or press Space to start",s:1.0,c:"#fff"}
    ]);
  }else if(state==="paused"){
    panel([{t:"PAUSED",s:2,c:"#59f0b0"},{t:"Press P or tap to carry on",s:0.9,c:"#fff",w:"normal"}]);
  }else if(state==="over"){
    var lines=[
      {t:"REDUCED TO NOTHING!",s:1.5,c:"#ff3b4e",w:"normal",f:1},
      {t:"Your score before the \u00d70 got you:",s:0.8,c:"#fff1d6",w:"normal"},
      {t:fmt(preScore),s:2.2,c:"#ffd23f"}
    ];
    if(newHigh)lines.push({t:"\u2605 NEW HIGH SCORE! \u2605",s:1.0,c:"#7dffea"});
    else lines.push({t:"High score: "+fmt(high),s:0.9,c:"#9bb4ff"});
    lines.push({t:"Tap or press Space to play again",s:0.9,c:"#fff"});
    panel(lines);
  }
}

function loop(ts){
  var dt=Math.min(0.05,(ts-lastT)/1000||0);lastT=ts;clock+=dt;
  if(state==="play"||state==="dying")update(dt);
  watchState();
  draw();
  requestAnimationFrame(loop);
}

/* ---------- 8-bit music (Web Audio, nothing to download) ---------- */
/* 16 bars of 4/4 in A minor at 150 crotchets a minute. Melody: note:length in quavers ("R" = rest). */
var MEL=[
 "C5:1 E5:1 A5:2 G5:1 E5:1 C5:2",
 "D5:1 F5:1 A5:2 G5:1 F5:1 D5:2",
 "E5:2 G#4:1 B4:1 E5:2 D5:1 B4:1",
 "A4:4 R:2 E4:1 A4:1",
 "C5:1 E5:1 A5:2 G5:1 E5:1 C5:2",
 "F5:2 A5:1 G5:1 F5:2 E5:1 C5:1",
 "D5:2 B4:1 D5:1 G#4:2 B4:1 E5:1",
 "A4:6 R:2",
 "E5:2 E5:1 G5:1 C6:2 B5:1 G5:1",
 "D6:2 B5:1 G5:1 B5:2 A5:1 G5:1",
 "A5:2 A5:1 C6:1 E6:2 D6:1 C6:1",
 "B5:2 G#5:1 B5:1 E6:4",
 "C5:1 E5:1 A5:2 G5:1 E5:1 C5:2",
 "D5:1 F5:1 A5:2 C6:2 A5:1 F5:1",
 "G#5:2 E5:1 B4:1 D5:2 B4:1 G#4:1",
 "A4:3 R:1 E4:2 G#4:1 B4:1"];
/* bass roots (MIDI) for each half-bar: Am Am | Dm Dm | E E | Am Am | Am Am | F F | G E | Am Am | C C | G G | Am Am | E E | Am Am | Dm Dm | E E | Am Am */
var BASSROOT=[45,45,50,50,52,52,45,45,45,45,41,41,43,52,45,45,48,48,43,43,45,45,52,52,45,45,50,50,52,52,45,45];
var EIGHTH=0.2,TOTAL=128;
var NOTE_SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function noteFreq(name){
  var m=/^([A-G])(#?)(\d)$/.exec(name);
  var midi=12*(parseInt(m[3],10)+1)+NOTE_SEMI[m[1]]+(m[2]?1:0);
  return 440*Math.pow(2,(midi-69)/12);
}
function midiFreq(m){return 440*Math.pow(2,(m-69)/12);}
var LEAD=new Array(TOTAL),BASS=new Array(TOTAL);
(function(){
  var pos=0;
  MEL.forEach(function(bar){
    bar.split(" ").forEach(function(tok){
      var p=tok.split(":"),len=parseInt(p[1],10);
      if(p[0]!=="R")LEAD[pos]={f:noteFreq(p[0]),d:len};
      pos+=len;
    });
  });
  for(var s=0;s<TOTAL;s++){
    var root=BASSROOT[Math.floor(s/4)];
    BASS[s]=midiFreq(s%2===0?root:root+12);
  }
})();
var musicOn=lsGet("mazemunchmaths_music")!=="off";
var actx=null,mGain=null,mTimer=null,mStep=0,mNext=0;
var silentEl=null;
function playbackMode(){try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}}
function unlockSilentSwitch(){
  try{
    if(silentEl){if(silentEl.paused)silentEl.play().catch(function(){});return;}
    var sr=8000,n=sr,buf=new ArrayBuffer(44+n),v=new DataView(buf);
    var w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);
    v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);
    for(var i=0;i<n;i++)v.setUint8(44+i,128);
    silentEl=document.createElement("audio");
    silentEl.src=URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
    silentEl.loop=true;silentEl.preload="auto";silentEl.setAttribute("playsinline","");
    silentEl.play().catch(function(){});
  }catch(e){}
}
function unlockAudio(){
  playbackMode();unlockSilentSwitch();
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!actx){try{actx=new AC();}catch(e){actx=null;return;}}
  if(actx.state==="suspended"&&actx.resume)actx.resume();
}
function tone(freq,t,dur,type,vol,dest){
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.004);
  g.gain.exponentialRampToValueAtTime(vol*0.6,t+Math.min(dur*0.6,0.12));
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.02);
}
function musicSched(){
  if(!actx||!mGain)return;
  while(mNext<actx.currentTime+0.3){
    var s=mStep%TOTAL,ld=LEAD[s];
    if(ld)tone(ld.f,mNext,ld.d*EIGHTH*0.93,"square",0.10,mGain);
    tone(BASS[s],mNext,EIGHTH*0.9,"triangle",0.22,mGain);
    mNext+=EIGHTH;mStep++;
  }
}
function musicStart(reset){
  musicStop();
  unlockAudio();
  if(!actx||!musicOn)return;
  mGain=actx.createGain();mGain.gain.value=0.6;mGain.connect(actx.destination);
  if(reset)mStep=0;
  mNext=actx.currentTime+0.08;
  mTimer=setInterval(musicSched,60);
  musicSched();
}
function musicStop(){
  if(mTimer){clearInterval(mTimer);mTimer=null;}
  if(mGain){
    var g=mGain;mGain=null;
    try{g.gain.setTargetAtTime(0,actx.currentTime,0.02);}catch(e){}
    setTimeout(function(){try{g.disconnect();}catch(e){}},400);
  }
}
/* "Doom": a chromatic descent in semiquavers; every third note (a minor third lower each time) is accented,
   then one long low note sinks away */
function playDoom(){
  unlockAudio();
  if(!actx||!musicOn)return;
  var g=actx.createGain();g.gain.value=0.7;g.connect(actx.destination);
  var semi=0.085,t=actx.currentTime+0.03,i;
  for(i=0;i<24;i++){
    var m=76-i,acc=i%3===0,f=midiFreq(m),at=t+i*semi;
    tone(f,at,semi*(acc?1.2:0.95),"square",acc?0.17:0.09,g);
    if(acc)tone(f/2,at,semi*2.6,"triangle",0.24,g);
  }
  var t2=t+24*semi,o=actx.createOscillator(),og=actx.createGain(),f0=midiFreq(52);
  o.type="square";o.frequency.setValueAtTime(f0,t2);o.frequency.exponentialRampToValueAtTime(f0*0.75,t2+1.4);
  og.gain.setValueAtTime(0.0001,t2);og.gain.linearRampToValueAtTime(0.17,t2+0.01);og.gain.exponentialRampToValueAtTime(0.0001,t2+1.5);
  o.connect(og);og.connect(g);o.start(t2);o.stop(t2+1.6);
  tone(midiFreq(40),t2,1.4,"triangle",0.28,g);
  setTimeout(function(){try{g.disconnect();}catch(e){}},t2-actx.currentTime>0?(t2-actx.currentTime+2)*1000:2500);
}
function setMusic(on){
  musicOn=on;lsSet("mazemunchmaths_music",on?"on":"off");
  if(!on)musicStop();else if(state==="play")musicStart(false);
}
var prevState="title";
function watchState(){
  if(state===prevState)return;
  if(state==="play")musicStart(prevState!=="paused");
  else if(prevState==="play")musicStop();
  prevState=state;
}
window.addEventListener("pointerdown",unlockAudio,true);
window.addEventListener("keydown",unlockAudio,true);

/* ---------- input ---------- */
var UP={dx:0,dy:-1},DOWN={dx:0,dy:1},LEFT={dx:-1,dy:0},RIGHT={dx:1,dy:0};
/* arrow keys, plus numpad 8 (up), 2 (down), 4 (left), 6 (right) */
var KEYS={ArrowUp:UP,ArrowDown:DOWN,ArrowLeft:LEFT,ArrowRight:RIGHT,"8":UP,"2":DOWN,"4":LEFT,"6":RIGHT};
function activate(){
  if(state==="title")start();
  else if(state==="over"&&clock-overAt>0.6)start();
  else if(state==="paused")state="play";
}
window.addEventListener("keydown",function(e){
  if(settingsOpen){if(e.key==="Escape")closeSettings();return;}
  if(KEYS[e.key]){e.preventDefault();if(state==="play")setWant(KEYS[e.key]);else activate();return;}
  if(e.key===" "||e.key==="Enter"){e.preventDefault();activate();return;}
  if(e.key==="m"||e.key==="M"){setMusic(!musicOn);if(popups)pop(9,10,musicOn?"Music on":"Music off","#9bb4ff");return;}
  if(e.key==="p"||e.key==="P"||e.key==="Escape"){
    if(state==="play")state="paused";else if(state==="paused")state="play";
  }
});
var sx=0,sy=0,sActive=false;
cv.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;sActive=true;
  if(state!=="play")activate();});
cv.addEventListener("pointermove",function(e){
  if(!sActive||state!=="play")return;
  var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>cs*0.9||Math.abs(dy)>cs*0.9){
    if(Math.abs(dx)>Math.abs(dy))setWant({dx:dx>0?1:-1,dy:0});else setWant({dx:0,dy:dy>0?1:-1});
    sx=e.clientX;sy=e.clientY;
  }
});
window.addEventListener("pointerup",function(){sActive=false;});

/* ---------- joystick pad: touch anywhere on it and slide; the nearest direction wins ---------- */
var padActive=false,padBtns={u:elPad.querySelector(".u"),d:elPad.querySelector(".d"),l:elPad.querySelector(".l"),r:elPad.querySelector(".r")};
function padShow(k){for(var n in padBtns)padBtns[n].classList.toggle("on",n===k);}
function padHandle(e){
  var b=elPad.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2);
  if(Math.hypot(x,y)<b.width*0.07)return;
  var k,d;
  if(Math.abs(x)>Math.abs(y)){k=x>0?"r":"l";d=x>0?RIGHT:LEFT;}else{k=y>0?"d":"u";d=y>0?DOWN:UP;}
  padShow(k);
  if(state==="play")setWant(d);else activate();
}
elPad.addEventListener("pointerdown",function(e){e.preventDefault();padActive=true;try{elPad.setPointerCapture(e.pointerId);}catch(x){}padHandle(e);});
elPad.addEventListener("pointermove",function(e){if(padActive)padHandle(e);});
function padEnd(){padActive=false;padShow("");}
elPad.addEventListener("pointerup",padEnd);elPad.addEventListener("pointercancel",padEnd);

/* ---------- settings ---------- */
var lvlSeg=document.getElementById("lvlSeg"),padSeg=document.getElementById("padSeg"),lvlDesc=document.getElementById("lvlDesc"),elSet=document.getElementById("settings");
function buildSeg(box,items,sel,onPick){
  box.innerHTML="";
  items.forEach(function(it,i){
    var b=document.createElement("button");b.type="button";b.textContent=it;
    if(i===sel)b.className="sel";
    b.addEventListener("click",function(){onPick(i);});
    box.appendChild(b);
  });
}
var PADS=["right","left","off"],PADNAMES=["Right","Left","Hidden"];
function renderSettings(){
  buildSeg(lvlSeg,LEVELS.map(function(l){return l.name;}),level,function(i){
    if(i!==level){
      level=i;lsSet("mazemunchmaths_level",level);loadHigh();
      if(state!=="title"){reset();state="title";} /* a game in progress restarts at the new level */
      hud();
    }
    renderSettings();
  });
  lvlDesc.textContent=LEVELS[level].desc;
  buildSeg(padSeg,PADNAMES,PADS.indexOf(padPos),function(i){padPos=PADS[i];lsSet("mazemunchmaths_pad",padPos);renderSettings();resize();});
  buildSeg(document.getElementById("musSeg"),["On","Off"],musicOn?0:1,function(i){setMusic(i===0);renderSettings();});
}
function openSettings(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(state==="play")state="paused";settingsOpen=true;renderSettings();elSet.classList.add("show");}
function closeSettings(){settingsOpen=false;elSet.classList.remove("show");if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
document.getElementById("gear").addEventListener("click",openSettings);
document.getElementById("closeSet").addEventListener("click",closeSettings);
elSet.addEventListener("pointerdown",function(e){if(e.target===elSet)closeSettings();});

document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="play")state="paused";});
window.addEventListener("resize",resize);

reset();hud();resize();
state="title";
requestAnimationFrame(loop);
})();
</script>
