:root{
  --orange:#F47B3F;--orange-hi:#FF9F6E;--orange-lo:#C75A22;
  --blue:#3F73B8;--blue-hi:#6C9AD9;--blue-lo:#2A5189;
  --grey:#808080;--ink:#3B3F4A;--cream:#FFF6EC;--gold:#FFC93C;
  --frame:#4B5160;--frame-lo:#353A46;
  --tile:60px;--gap:8px;--lift:5px;
  --display:'Super Bouncer','Arial Rounded MT Bold',system-ui,sans-serif;
  --hand:'Anak Orang','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;
  font-family:var(--hand);font-size:19px;line-height:1.3;color:var(--ink);
  background-color:var(--cream);
  background-image:
    linear-gradient(45deg,rgba(63,115,184,.07) 25%,transparent 25%,transparent 75%,rgba(63,115,184,.07) 75%),
    linear-gradient(45deg,rgba(244,123,63,.09) 25%,transparent 25%,transparent 75%,rgba(244,123,63,.09) 75%);
  background-size:96px 96px;background-position:0 0,48px 48px;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- header ---------- */
#top{
  position:relative;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand controls logo";
  align-items:center;gap:10px 22px;
  padding:12px 24px 16px;background:#fff;
  box-shadow:0 4px 18px rgba(60,70,100,.14);
}
#top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:linear-gradient(90deg,var(--orange) 0 50%,var(--blue) 50% 100%)}
.brand{grid-area:brand;display:flex;align-items:baseline;gap:14px}
.brand h1{margin:0 0 6px;display:flex;gap:7px}
.brand h1 span{
  width:50px;height:54px;border-radius:12px;display:grid;place-items:center;
  font:38px/1 var(--display);color:#fff;
  background:linear-gradient(160deg,var(--orange-hi),var(--orange));
  box-shadow:0 3px 0 var(--orange-lo),0 6px 0 var(--blue),inset 0 2px 0 rgba(255,255,255,.35);
}
.brand h1 span.bl{background:linear-gradient(160deg,var(--blue-hi),var(--blue));box-shadow:0 3px 0 var(--blue-lo),0 6px 0 var(--orange),inset 0 2px 0 rgba(255,255,255,.35)}
.brand h1 span.tilt{transform:perspective(420px) rotateY(-30deg) rotate(-4deg)}
.brand .tag{font-size:20px;color:var(--grey)}
.logo{grid-area:logo;width:250px;max-width:100%;height:auto;mix-blend-mode:multiply;justify-self:end}
.controls{grid-area:controls;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px}

.btn{
  font:17px var(--display);letter-spacing:.03em;
  border:0;border-radius:12px;padding:9px 18px;cursor:pointer;
  color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-lo);
  transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation;
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--blue-lo)}
.btn.primary{background:var(--orange);box-shadow:0 4px 0 var(--orange-lo)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--orange-lo)}
.btn.grey{background:#8b8b8b;box-shadow:0 4px 0 #666}
.btn.grey:active:not(:disabled){box-shadow:0 1px 0 #666}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.tok:focus-visible,.cell:focus-visible{outline:4px solid var(--gold);outline-offset:2px}

.sel{
  font:16px var(--display);letter-spacing:.02em;color:var(--blue);
  background:#fff;border:3px solid var(--blue);border-radius:12px;padding:7px 12px;cursor:pointer;
}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:18px;cursor:pointer;user-select:none}
.chk input{width:20px;height:20px;accent-color:var(--orange);cursor:pointer;margin:0}

/* ---------- layout ---------- */
#main{display:flex;justify-content:center;align-items:flex-start;gap:26px;padding:24px 16px 44px}
.side{width:290px;display:flex;flex-direction:column;gap:20px;flex:none}
.side.right{width:250px}
.boardcol{display:flex;flex-direction:column;gap:12px;align-items:stretch}

/* ---------- player cards ---------- */
.card{
  --c:var(--grey);--clo:#666;
  background:#fff;border-radius:20px;padding:14px 16px 18px;border:4px solid transparent;
  box-shadow:0 6px 0 rgba(0,0,0,.07),0 14px 30px rgba(60,70,100,.12);
  transition:border-color .25s;
}
.card.o{--c:var(--orange);--clo:var(--orange-lo)}
.card.b{--c:var(--blue);--clo:var(--blue-lo)}
.card.active{border-color:var(--c)}
.card .hd{display:flex;align-items:center;gap:10px}
.card h2{margin:0;font:28px/1 var(--display);color:var(--c);letter-spacing:.02em}
.card .sub{font-size:17px;color:var(--grey);margin-top:2px}
.turn{margin-left:auto;background:var(--c);color:#fff;font:14px var(--display);padding:5px 12px;border-radius:999px;visibility:hidden}
.card.active .turn{visibility:visible}
.tokens{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.slot{aspect-ratio:1}
.ghost{border:3px dashed #ddd6ca;border-radius:12px}
.tok{
  width:100%;aspect-ratio:1;padding:0;border:0;border-radius:12px;cursor:pointer;
  display:grid;place-items:center;color:#fff;touch-action:manipulation;
  background:linear-gradient(160deg,var(--hi),var(--base));
  box-shadow:0 4px 0 var(--lo),inset 0 2px 0 rgba(255,255,255,.3);
  transition:transform .1s,box-shadow .1s,opacity .2s;
}
.tok svg{width:62%;height:62%}
.tok.o{--base:var(--orange);--hi:var(--orange-hi);--lo:var(--orange-lo)}
.tok.b{--base:var(--blue);--hi:var(--blue-hi);--lo:var(--blue-lo)}
.tok:hover:not(:disabled){transform:translateY(-2px)}
.tok:disabled{cursor:default;opacity:.4}
.tok.selected{transform:translateY(-4px);outline:4px solid var(--gold);outline-offset:2px;opacity:1}

/* ---------- status ---------- */
#statusrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pill{
  font:24px var(--display);letter-spacing:.03em;color:#fff;background:var(--grey);
  padding:8px 28px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.2);
  transition:background .3s;
}
.pill[data-player="R"]{background:var(--orange);box-shadow:0 4px 0 var(--orange-lo)}
.pill[data-player="B"]{background:var(--blue);box-shadow:0 4px 0 var(--blue-lo)}
#moveNo{font:15px var(--display);color:var(--grey);background:#fff;border-radius:999px;padding:5px 12px;box-shadow:0 2px 6px rgba(60,70,100,.12)}
#hint{min-height:26px;text-align:center;font-size:20px;color:var(--grey)}

/* ---------- board ---------- */
#board{
  display:grid;grid-template-columns:22px repeat(7,var(--tile));grid-template-rows:22px repeat(7,var(--tile));
  gap:var(--gap);padding:14px;border-radius:24px;background:var(--frame);user-select:none;-webkit-user-select:none;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.35),0 8px 0 var(--frame-lo),0 18px 34px rgba(40,50,80,.28);
}
.lbl{display:grid;place-items:center;font:14px var(--display);color:#c7ccd8}
.cell{
  position:relative;border-radius:12px;cursor:pointer;touch-action:manipulation;
  transition:transform .12s,filter .15s;
}
.cell:hover{transform:translateY(-2px)}
/* two-sided tiles: face colour on top, the opposite colour showing in the lower half of the edge */
.cell.orange{background:linear-gradient(160deg,var(--orange-hi),var(--orange));box-shadow:0 calc(var(--lift)/2) 0 var(--orange-lo),0 var(--lift) 0 var(--blue),inset 0 2px 0 rgba(255,255,255,.35)}
.cell.blue{background:linear-gradient(160deg,var(--blue-hi),var(--blue));box-shadow:0 calc(var(--lift)/2) 0 var(--blue-lo),0 var(--lift) 0 var(--orange),inset 0 2px 0 rgba(255,255,255,.35)}
.cell.white{background:#fff;box-shadow:0 var(--lift) 0 #c7c0b3,inset 0 2px 0 #fff}
.cell.white::after{content:"";position:absolute;inset:27%;border:4px solid #e4ded2;border-radius:50%}
.cell.preview{outline:4px solid var(--gold);outline-offset:1px;filter:brightness(1.1);z-index:1}

/* ---------- score ---------- */
#scorebox{background:#fff;border-radius:18px;padding:12px 16px 14px;box-shadow:0 6px 0 rgba(0,0,0,.07),0 14px 30px rgba(60,70,100,.12)}
.chips{display:flex;justify-content:space-between;gap:8px;font:20px var(--display);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:8px}
.chip i{width:18px;height:18px;border-radius:6px;display:inline-block}
.chip.o{color:var(--orange)}.chip.o i{background:var(--orange);box-shadow:0 2px 0 var(--orange-lo)}
.chip.b{color:var(--blue)}.chip.b i{background:var(--blue);box-shadow:0 2px 0 var(--blue-lo)}
.chip.w{color:var(--grey)}.chip.w i{background:#fff;border:3px solid #cfc8bb}
.bar{position:relative;height:14px;margin-top:10px;border-radius:8px;background:var(--blue);overflow:hidden}
.bar .fill{height:100%;background:var(--orange);transition:width .4s ease}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(255,255,255,.85)}

/* ---------- history ---------- */
.panel{background:#fff;border-radius:20px;padding:14px 16px 16px;box-shadow:0 6px 0 rgba(0,0,0,.07),0 14px 30px rgba(60,70,100,.12)}
.panel h2{margin:0 0 10px;font:26px/1 var(--display);color:var(--grey);letter-spacing:.02em}
.history{height:392px;overflow:auto;border-radius:12px;background:#faf7f2;padding:8px 10px}
.history .none{color:var(--grey);padding:6px 2px}
.mv{display:flex;align-items:center;gap:9px;padding:4px 2px;border-bottom:2px dotted #e6dfd3}
.mv:last-child{border-bottom:0}
.mv .n{width:26px;text-align:right;color:var(--grey)}
.mv .d{width:14px;height:14px;border-radius:5px;flex:none}
.mv.o .d{background:var(--orange)}.mv.b .d{background:var(--blue)}
.mv svg{width:20px;height:20px;color:var(--ink);flex:none}
.mv .p{font:17px var(--display);color:var(--ink)}

/* ---------- dialogs ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(40,50,80,.55)}
.dialog{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:26px;
  padding:22px 26px 24px;border-top:10px solid var(--orange);
  box-shadow:0 10px 0 rgba(0,0,0,.12),0 30px 60px rgba(0,0,0,.3);
  animation:pop .28s cubic-bezier(.2,.9,.3,1.3);
}
.dialog h2{margin:0 0 6px;font:38px/1.05 var(--display);color:var(--orange);letter-spacing:.02em}
.dialog p{margin:8px 0;font-size:20px}
.dialog .big{font:28px var(--display);letter-spacing:.02em}
.dialog .big .o{color:var(--orange)}.dialog .big .b{color:var(--blue)}
.dialog ol{margin:8px 0 8px 22px;padding:0;font-size:20px}
.dialog li{margin:4px 0}
.leg{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;margin:8px 0;font-size:20px}
.leg .tok{width:44px;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- smaller screens ---------- */
@media (max-width:1160px){
  :root{--tile:min(66px,calc((100vw - 105px)/7))}
  #top{grid-template-columns:1fr auto;grid-template-areas:"brand logo" "controls controls"}
  .controls{justify-content:flex-start}
  #main{flex-direction:column;align-items:center}
  .side.left{display:contents}
  .side.left .card{width:min(100%,600px)}
  .side.left .card.active{order:1}
  .boardcol{order:2}
  .side.left .card:not(.active){order:3}
  .side.right{order:4;width:min(100%,600px)}
  .history{height:220px}
}
@media (max-width:640px){
  :root{--gap:5px;--lift:3px}
  #top{padding:10px 16px 14px}
  .brand h1{gap:5px}
  .brand h1 span{width:40px;height:44px;font-size:30px;border-radius:10px}
  .brand .tag{display:none}
  .logo{width:170px}
  #board{padding:10px;border-radius:18px;grid-template-columns:18px repeat(7,var(--tile));grid-template-rows:18px repeat(7,var(--tile))}
  .cell,.tok,.ghost{border-radius:9px}
  .cell.preview{outline-width:3px}
  .sel{width:100%}
  .chk{font-size:16px}
  .chips{font-size:16px;white-space:nowrap}
  .chip{gap:6px}
  .chip i{width:14px;height:14px}
  .pill{font-size:21px;padding:7px 20px}
}
@media (hover:none){.chk.pv{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const N=7,TYPES=['V','H','U','D','C'],COLS='ABCDEFG';
const NAMES={R:'Orange',B:'Blue'};
const TYPE_NAMES={V:'Vertical line',H:'Horizontal line',U:'Rising diagonal',D:'Falling diagonal',C:'Circle'};
let board,currentPlayer,selectedToken,tokens,moveHistory,undoStack,animating,aiTimer,cellEls=[];
const $=id=>document.getElementById(id);

/* ================= game logic (unchanged from v1.2) ================= */

function newGame(){
clearTimeout(aiTimer);
board=[];for(let r=0;r<N;r++){board[r]=[];for(let c=0;c<N;c++){board[r][c]=(r===3&&c===3)?'W':((r+c)%2===0?'R':'B');}}
currentPlayer='R';selectedToken=null;moveHistory=[];undoStack=[];animating=false;
tokens={R:{V:2,H:2,U:2,D:2,C:2},B:{V:2,H:2,U:2,D:2,C:2}};render(true);
}

function affected(tok,r,c){let a=[];
if(tok==='V')for(let rr=0;rr<N;rr++)a.push([rr,c]);
if(tok==='H')for(let cc=0;cc<N;cc++)a.push([r,cc]);
if(tok==='U')for(let rr=0;rr<N;rr++)a.push([rr,(c-(rr-r)%N+N)%N]);
if(tok==='D')for(let rr=0;rr<N;rr++)a.push([rr,(c+(rr-r)%N+N)%N]);
if(tok==='C')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N)a.push([nr,nc]);}
return a;}
function flipCell(b,r,c,player,direct){let v=b[r][c];if(v==='W'){if(direct&&r===3&&c===3)b[r][c]=player;}else b[r][c]=(v==='R')?'B':'R';}
function applyMoveToBoard(b,tok,r,c,player){for(const sq of affected(tok,r,c)){flipCell(b,sq[0],sq[1],player,r===3&&c===3);}}
function count(b){let R=0,B=0,W=0;b.flat().forEach(v=>{if(v==='R')R++;else if(v==='B')B++;else W++;});return {R,B,W};}
function cloneBoard(b){return b.map(row=>row.slice());}
function cloneTokens(t){return {R:{...t.R},B:{...t.B}};}
function legalMoves(side,tok){let m=[];['V','H','U','D','C'].forEach(t=>{if(tok[side][t]>0){for(let r=0;r<N;r++)for(let c=0;c<N;c++)m.push([t,r,c]);}});return m;}

/* ================= helpers ================= */

function modeVal(){return $('mode').value;}
function isComputerTurn(){return modeVal()!=='human'&&currentPlayer==='B';}
function remaining(){return [...Object.values(tokens.R),...Object.values(tokens.B)].reduce((a,b)=>a+b,0);}
function gameIsOver(){return remaining()===0;}
function posName(r,c){return COLS[c]+(r+1);}

function iconCells(t){
const s=new Set();
for(let i=0;i<5;i++){
  if(t==='V')s.add(i*5+2);
  if(t==='H')s.add(2*5+i);
  if(t==='U')s.add((4-i)*5+i);
  if(t==='D')s.add(i*5+i);
}
if(t==='C')for(let r=1;r<=3;r++)for(let c=1;c<=3;c++)s.add(r*5+c);
return s;
}
function tokenIcon(t){
const on=iconCells(t);let h='<svg viewBox="0 0 24 24" aria-hidden="true">';
for(let r=0;r<5;r++)for(let c=0;c<5;c++)h+=`<rect x="${c*5}" y="${r*5}" width="4" height="4" rx="1" fill="currentColor"${on.has(r*5+c)?'':' opacity=".25"'}/>`;
return h+'</svg>';
}

/* ================= dialogs ================= */

function showModal(title,html,buttons,color){
const t=$('mTitle');t.textContent=title;t.style.color=color||'';
$('mBody').innerHTML=html;
const bt=$('mBtns');bt.innerHTML='';
let focusEl=null;
buttons.forEach(b=>{
  const e=document.createElement('button');e.className='btn '+(b.cls||'');e.textContent=b.label;
  e.onclick=()=>{closeModal();if(b.fn)b.fn();};
  bt.appendChild(e);if(!focusEl||b.cls==='primary')focusEl=e;
});
$('modal').hidden=false;if(focusEl)focusEl.focus();
}
function closeModal(){$('modal').hidden=true;}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeModal();});

function showHelp(){
const leg=TYPES.map(t=>{
  const d={V:'Flips every tile in the column you choose.',H:'Flips every tile in the row you choose.',
    U:'Flips a diagonal running up to the right. It wraps round the edges, so it always covers 7 tiles.',
    D:'Flips a diagonal running down to the right. It wraps round the edges, so it always covers 7 tiles.',
    C:'Flips the square you choose and the 8 squares touching it.'}[t];
  return `<div class="leg"><span class="tok b">${tokenIcon(t)}</span><span><b>${TYPE_NAMES[t]}.</b> ${d}</span></div>`;
}).join('');
showModal('How to play',
`<p>Take turns to place a token on the board. Every tile it covers <b>flips</b>: orange becomes blue and blue becomes orange.</p>`+leg+
`<ol>
<li>Choose one of your tokens, then choose a square. Orange goes first.</li>
<li>You each have 10 tokens, two of each kind, so the game lasts 20 moves.</li>
<li>The white centre tile stays white unless you place a token directly on it. It then takes your colour and flips like the rest.</li>
<li>When all the tokens are used, the player with the most tiles wins.</li>
</ol>
<p>Made a mistake? <b>Undo</b> steps back through the Moves list, one move at a time, right back to the start.</p>`,
[{label:'Got it',cls:'primary'}]);
}

function askNewGame(){
if(animating)return;
if(moveHistory.length>0&&!gameIsOver()){
  showModal('Start again?','<p>The game in progress will be lost.</p>',
    [{label:'New game',cls:'primary',fn:newGame},{label:'Keep playing',cls:'grey'}]);
}else newGame();
}

function showResult(){
if(!gameIsOver())return;
const s=count(board);
let title,color;
if(s.R>s.B){title='Orange wins!';color='var(--orange)';}
else if(s.B>s.R){title='Blue wins!';color='var(--blue)';}
else{title="It's a draw!";color='var(--grey)';}
showModal(title,
`<p class="big"><span class="o">Orange ${s.R}</span> &nbsp; <span class="b">Blue ${s.B}</span></p>`+
(s.W?'<p>The white centre tile counts for nobody.</p>':''),
[{label:'Play again',cls:'primary',fn:newGame},{label:'Look at the board',cls:'grey'}],color);
}

/* ================= board & rendering ================= */

function buildBoard(){
const bd=$('board');bd.innerHTML='';cellEls=[];
const add=(cls,txt)=>{const d=document.createElement('div');d.className=cls;if(txt!==undefined)d.textContent=txt;bd.appendChild(d);return d;};
add('lbl');
for(let c=0;c<N;c++)add('lbl',COLS[c]);
for(let r=0;r<N;r++){
  add('lbl',r+1);
  for(let c=0;c<N;c++){
    const d=add('cell white');
    d.setAttribute('role','gridcell');d.tabIndex=0;
    d.onmouseenter=()=>preview(r,c);
    d.onmouseleave=()=>clearPreview();
    d.onfocus=()=>preview(r,c);
    d.onblur=()=>clearPreview();
    d.onclick=()=>play(r,c);
    d.onkeydown=e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();play(r,c);return;}
      const dir={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[e.key];
      if(dir){e.preventDefault();const nr=r+dir[0],nc=c+dir[1];if(nr>=0&&nr<N&&nc>=0&&nc<N)cellEls[nr*N+nc].focus();}
    };
    cellEls.push(d);
  }
}
}

function render(skipAnim){
const over=gameIsOver(),mode=modeVal(),comp=mode!=='human';
const s=count(board);

/* status */
const st=$('status');
if(over){
  st.textContent=s.R>s.B?'Orange wins!':s.B>s.R?'Blue wins!':"It's a draw!";
  st.dataset.player=s.R>s.B?'R':s.B>s.R?'B':'X';
}else{
  st.textContent=isComputerTurn()?'Blue is thinking…':NAMES[currentPlayer]+"'s turn";
  st.dataset.player=currentPlayer;
}
$('moveNo').textContent=over?'20 moves played':'Move '+(moveHistory.length+1)+' of 20';
$('hint').textContent=over?'Press New game to play again':isComputerTurn()?'':!selectedToken?'Choose one of your tokens':'Now choose a square';

/* cards */
$('cardR').classList.toggle('active',!over&&currentPlayer==='R');
$('cardB').classList.toggle('active',!over&&currentPlayer==='B');
$('subB').textContent=comp?'Computer ('+mode+')':'Player 2';
$('turnB').textContent=comp?'Thinking…':'Your turn';
renderTokens('R','redTokens');renderTokens('B','blueTokens');

/* board */
let changed=0;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const v=board[r][c],el=cellEls[r*N+c];
  if(el.dataset.v!==v){
    const had=el.dataset.v!==undefined;
    el.dataset.v=v;
    el.className='cell '+(v==='R'?'orange':v==='B'?'blue':'white');
    el.setAttribute('aria-label',posName(r,c)+', '+(v==='R'?'orange':v==='B'?'blue':'white'));
    if(had&&!skipAnim&&!reduce&&el.animate){
      el.animate([{transform:'perspective(420px) rotateY(88deg) scale(.9)'},{transform:'perspective(420px) rotateY(0deg) scale(1)'}],
        {duration:380,delay:changed*22,easing:'cubic-bezier(.2,.9,.3,1.35)',fill:'backwards'});
      changed++;
    }
  }
}

/* score */
$('chips').innerHTML=`<span class="chip o"><i></i>Orange ${s.R}</span>`+(s.W?`<span class="chip w"><i></i>White ${s.W}</span>`:'')+`<span class="chip b"><i></i>Blue ${s.B}</span>`;
$('fill').style.width=(100*s.R/Math.max(1,s.R+s.B))+'%';

/* history */
const hp=$('historyPanel');
hp.innerHTML=moveHistory.length?moveHistory.map((m,i)=>
  `<div class="mv ${m.p==='R'?'o':'b'}"><span class="n">${i+1}</span><span class="d"></span>${tokenIcon(m.t)}<span class="p">${m.pos}</span></div>`).join('')
  :'<div class="none">No moves yet</div>';
hp.scrollTop=hp.scrollHeight;

$('undoBtn').disabled=(animating||undoStack.length===0);
$('newBtn').disabled=animating;
}

function renderTokens(side,id){
const div=$(id);div.innerHTML='';
const active=side===currentPlayer&&!animating&&!gameIsOver()&&!(side==='B'&&modeVal()!=='human');
for(let i=0;i<2;i++)for(const t of TYPES){
  if(tokens[side][t]>i){
    const b=document.createElement('button');
    b.className='tok '+(side==='R'?'o':'b');
    b.innerHTML=tokenIcon(t);
    b.title=TYPE_NAMES[t];b.setAttribute('aria-label',NAMES[side]+' '+TYPE_NAMES[t]);
    if(side===currentPlayer&&selectedToken===t&&!gameIsOver())b.classList.add('selected');
    if(active){b.onclick=()=>{selectedToken=(selectedToken===t)?null:t;render();};}
    else b.disabled=true;
    div.appendChild(b);
  }else{
    const g=document.createElement('div');g.className='slot ghost';div.appendChild(g);
  }
}
}

function clearPreview(){cellEls.forEach(el=>el.classList.remove('preview'));}
function preview(r,c){
clearPreview();
if(animating||!selectedToken||isComputerTurn()||!$('previewToggle').checked)return;
for(const sq of affected(selectedToken,r,c))cellEls[sq[0]*N+sq[1]].classList.add('preview');
}
function nudge(){
const h=$('hint');
if(h.animate)h.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:300});
}

/* ================= playing ================= */

async function play(r,c,fromAI){
if(animating||gameIsOver())return;
if(!fromAI&&isComputerTurn())return;
if(!selectedToken||tokens[currentPlayer][selectedToken]===0){if(!fromAI)nudge();return;}
const tok=selectedToken;

// snapshot BEFORE the move is applied, for Undo
undoStack.push({
  board:cloneBoard(board),
  tokens:cloneTokens(tokens),
  currentPlayer,
  moveHistory:moveHistory.slice()
});

tokens[currentPlayer][tok]--;
moveHistory.push({p:currentPlayer,t:tok,pos:posName(r,c)});

if($('rippleToggle').checked){
  animating=true;render();
  for(const sq of affected(tok,r,c)){
    flipCell(board,sq[0],sq[1],currentPlayer,r===3&&c===3);
    render();
    await new Promise(res=>setTimeout(res,50));
  }
  animating=false;
}else{
  applyMoveToBoard(board,tok,r,c,currentPlayer);
}
selectedToken=null;
currentPlayer=currentPlayer==='R'?'B':'R';
render();
checkEnd();
aiMove();
}

function undoMove(){
if(animating||undoStack.length===0)return;
clearTimeout(aiTimer);
let snap=undoStack.pop();
board=snap.board;tokens=snap.tokens;currentPlayer=snap.currentPlayer;moveHistory=snap.moveHistory;
selectedToken=null;

// if that leaves it sitting on the computer's turn, chain back one more so
// control returns to the human player
if(modeVal()!=='human'&&currentPlayer==='B'&&undoStack.length>0){
  snap=undoStack.pop();
  board=snap.board;tokens=snap.tokens;currentPlayer=snap.currentPlayer;moveHistory=snap.moveHistory;
}
render();
aiMove();
}

function modeChanged(){render();aiMove();}

/* ================= AI (unchanged from v1.2) ================= */

function evalMoveOnePly(board,tokens,side,move){
let b=cloneBoard(board);
applyMoveToBoard(b,move[0],move[1],move[2],side);
const s=count(b);
return side==='B'?(s.B-s.R):(s.R-s.B);
}
function topMoves(board,tokens,side,n){
const moves=legalMoves(side,tokens);
const scored=moves.map(m=>({m,val:evalMoveOnePly(board,tokens,side,m)}));
scored.sort((a,b)=>b.val-a.val);
return scored.slice(0,n).map(x=>x.m);
}

function hardAIMove(){
const TOPN=12;
const candidates=topMoves(board,tokens,'B',TOPN);
let bestVal=-Infinity,bestMoves=[];

for(const c1 of candidates){
  let b1=cloneBoard(board),t1=cloneTokens(tokens);
  applyMoveToBoard(b1,c1[0],c1[1],c1[2],'B');
  t1.B[c1[0]]--;

  const redCands=topMoves(b1,t1,'R',TOPN);
  let worstForBlue;

  if(redCands.length===0){
    const s=count(b1);
    worstForBlue=s.B-s.R;
  }else{
    worstForBlue=Infinity;
    for(const c2 of redCands){
      let b2=cloneBoard(b1),t2=cloneTokens(t1);
      applyMoveToBoard(b2,c2[0],c2[1],c2[2],'R');
      t2.R[c2[0]]--;

      const blueCands=topMoves(b2,t2,'B',TOPN);
      let bestContinuation;
      if(blueCands.length===0){
        const s=count(b2);
        bestContinuation=s.B-s.R;
      }else{
        bestContinuation=-Infinity;
        for(const c3 of blueCands){
          let b3=cloneBoard(b2);
          applyMoveToBoard(b3,c3[0],c3[1],c3[2],'B');
          const s=count(b3);
          const val=s.B-s.R;
          if(val>bestContinuation)bestContinuation=val;
        }
      }
      if(bestContinuation<worstForBlue)worstForBlue=bestContinuation;
    }
  }

  if(worstForBlue>bestVal){bestVal=worstForBlue;bestMoves=[c1];}
  else if(worstForBlue===bestVal)bestMoves.push(c1);
}
return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}

function aiMove(){
clearTimeout(aiTimer);
if(!isComputerTurn()||gameIsOver())return;
aiTimer=setTimeout(()=>{
  if(!isComputerTurn()||animating||gameIsOver())return;
  const mode=modeVal();
  let moves=legalMoves('B',tokens);
  let choice=moves[0];
  if(mode==='easy'){
    choice=moves[Math.floor(Math.random()*moves.length)];
  }else if(mode==='medium'){
    let best=-9999,cands=[];
    for(const m of moves){
      let b=cloneBoard(board);
      applyMoveToBoard(b,m[0],m[1],m[2],'B');
      let s=count(b);let v=s.B-s.R;
      if(v>best){best=v;cands=[m];}else if(v===best)cands.push(m);
    }
    choice=cands[Math.floor(Math.random()*cands.length)];
  }else if(mode==='hard'){
    choice=hardAIMove();
  }
  selectedToken=choice[0];
  play(choice[1],choice[2],true);
},450);
}

function checkEnd(){
if(gameIsOver())setTimeout(showResult,700);
}

buildBoard();
newGame();
</script>
