    :root {
        --orange: #f07838;
        --orange-dark: #d9621f;
        --blue: #4070b0;
        --blue-dark: #2f5a96;
        --grey: #808080;
        --grey-dark: #5e5e5e;
        --grey-light: #d9dce1;
        --paper: #f6f7f9;
        --heading: 'Super Bouncer', 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
        --body: 'Anak Orang', 'Comic Sans MS', 'Segoe Print', cursive, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        font-family: var(--body);
        text-align: center;
        margin: 0;
        padding: 0 12px;
        min-height: 100vh;
        background-color: var(--paper);
        background-image:
            radial-gradient(rgba(240,120,56,0.10) 2px, transparent 2.5px),
            radial-gradient(rgba(64,112,176,0.10) 2px, transparent 2.5px);
        background-size: 44px 44px, 44px 44px;
        background-position: 0 0, 22px 22px;
        color: var(--grey-dark);
    }

    header {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px 10px 6px;
    }

    #logo {
        display: block;
        width: min(560px, 92%);
        height: auto;
        margin: 0 auto 6px;
    }

    h1 {
        margin: 0;
        padding: 4px 10px 12px;
        font-family: var(--heading);
        font-weight: normal;
        font-size: clamp(1.7em, 5vw, 2.4em);
        letter-spacing: 1px;
        color: var(--blue);
    }

    #controls {
        background: #fff;
        border: 3px solid var(--grey-light);
        border-radius: 14px;
        padding: 14px 16px;
        margin: 0 auto 18px;
        max-width: 820px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px 16px;
        font-size: 17px;
        color: var(--grey-dark);
    }

    #controls label.field {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }

    #controls select {
        font-family: inherit;
        font-size: 16px;
        color: var(--blue-dark);
        padding: 5px 8px;
        border-radius: 8px;
        border: 2px solid var(--blue);
        background: #fff;
    }

    button {
        font-family: inherit;
        padding: 9px 18px;
        font-size: 17px;
        font-weight: bold;
        border-radius: 10px;
        border: 2px solid var(--grey);
        background: #fff;
        color: var(--grey-dark);
        cursor: pointer;
        transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    button:hover:not(:disabled) {
        background: var(--grey);
        color: #fff;
        transform: translateY(-1px);
    }

    button:active:not(:disabled) { transform: translateY(0); }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button:focus-visible, select:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 2px;
    }

    #startBtn {
        background: var(--orange);
        border-color: var(--orange);
        color: #fff;
    }
    #startBtn:hover:not(:disabled) { background: var(--orange-dark); border-color: var(--orange-dark); }

    #pauseBtn { border-color: var(--blue); color: var(--blue); }
    #pauseBtn:hover:not(:disabled) { background: var(--blue); color: #fff; }

    #quizArea {
        background: var(--blue);
        border: 4px solid var(--blue-dark);
        border-radius: 18px;
        box-shadow: 0 6px 0 var(--blue-dark);
        margin: 0 auto 24px;
        max-width: 820px;
        min-height: 360px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        cursor: pointer;
    }

    #qNumber {
        font-size: 19px;
        color: #ffd2b8;
        text-transform: uppercase;
        letter-spacing: 1px;
        min-height: 24px;
    }

    #display {
        font-family: var(--heading);
        font-size: clamp(44px, 12vw, 96px);
        font-weight: normal;
        color: #fff;
        text-align: center;
        line-height: 1.1;
    }

    #hint {
        font-size: 15px;
        color: #cfdcef;
        min-height: 18px;
    }

    #progressWrap {
        width: min(320px, 80%);
        height: 14px;
        border: 2px solid #fff;
        border-radius: 8px;
        overflow: hidden;
        background: var(--blue-dark);
        visibility: hidden;
    }

    #progressWrap.active { visibility: visible; }

    #progressBar {
        height: 100%;
        width: 100%;
        background: var(--orange);
        transform-origin: left;
    }

    @keyframes countdown {
        from { width: 100%; }
        to { width: 0%; }
    }

    #progressBar.running {
        animation-name: countdown;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
    }

    #answers {
        display: none;
        max-width: 820px;
        margin: 0 auto 24px;
        background: #fff;
        border: 3px solid var(--grey-light);
        border-top: 6px solid var(--orange);
        border-radius: 14px;
        padding: 20px 40px;
        font-size: 24px;
        line-height: 1.6;
        text-align: left;
        color: var(--blue-dark);
    }

    .answersTitle {
        font-family: var(--heading);
        font-size: 1.4em;
        color: var(--orange);
        text-align: center;
        margin: 0 0 14px;
    }

    .answersGrid {
        column-count: 2;
        column-gap: 50px;
    }

    .answerRow { margin-bottom: 4px; break-inside: avoid-column; }

    .answerNumber {
        color: var(--grey);
        display: inline-block;
        width: 64px;
    }

    footer {
        max-width: 820px;
        margin: 0 auto;
        font-size: 14px;
        color: var(--grey);
        padding: 10px 10px 24px;
    }

    @media (max-width: 600px) {
        #controls { font-size: 16px; padding: 12px; }
        #controls label.field { white-space: normal; }
        #quizArea { min-height: 260px; padding: 14px; }
        #answers { padding: 16px 18px; font-size: 20px; }
        .answersGrid { column-count: 1; }
    }
</style>
</head>

    questions = [];
    let lastKey = null;

    for (let i = 0; i < n; i++) {
        let q, tries = 0;
        do {
            const a = set.t[Math.floor(Math.random() * set.t.length)];
            const b = Math.floor(Math.random() * set.max) + 1;
            q = { q: `${a} \u00d7 ${b}`, a: a * b, key: `${a}x${b}` };
            tries++;
        } while (q.key === lastKey && tries < 10);
        lastKey = q.key;
        questions.push(q);
    }
}

function setProgressBar(durationSeconds) {
    const bar = document.getElementById('progressBar');
    const wrap = document.getElementById('progressWrap');
    bar.classList.remove('running');
    bar.style.animation = 'none';
    bar.style.width = '100%';
    wrap.classList.toggle('active', durationSeconds > 0);
    if (durationSeconds <= 0) return;

    void bar.offsetWidth;
    bar.style.animation = '';
    bar.style.animationDuration = durationSeconds + 's';
    bar.classList.add('running');
    bar.style.animationPlayState = 'running';
}

function pauseProgressBar() {
    document.getElementById('progressBar').style.animationPlayState = 'paused';
}

function resumeProgressBar() {
    document.getElementById('progressBar').style.animationPlayState = 'running';
}

function startQuiz() {
    clearTimeout(timer);
    document.getElementById('answers').style.display = 'none';

    const level = document.getElementById('level').value;
    const totalQs = Number(document.getElementById('totalQs').value);
    const seconds = Number(document.getElementById('seconds').value);

    generateQuestions(level, totalQs);
    index = -1;
    mode = 'quiz';
    running = true;
    paused = false;

    document.getElementById('qNumber').textContent = '';
    document.getElementById('display').textContent = 'Get ready\u2026';
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('pauseBtn').textContent = 'Pause';

    scheduleNext(seconds);
}

function scheduleNext(seconds) {
    questionDurationMs = seconds * 1000;
    questionStartedAt = Date.now();
    setProgressBar(seconds);
    timer = setTimeout(nextQuestion, questionDurationMs);
}

function nextQuestion() {
    clearTimeout(timer);
    index++;

    if (index >= questions.length) {
        running = false;
        document.getElementById('qNumber').textContent = '';
        document.getElementById('display').textContent = mode === 'marking' ? 'All marked!' : 'Pens down!';
        document.getElementById('progressWrap').classList.remove('active');
        document.getElementById('pauseBtn').disabled = true;
        return;
    }

    document.getElementById('qNumber').textContent =
        `Question ${index + 1} of ${questions.length}`;
    const q = questions[index];
    document.getElementById('display').textContent = mode === 'marking' ? `${q.q} = ${q.a}` : q.q;

    scheduleNext(Number(document.getElementById('seconds').value));
}

function manualAdvance() {
    if (!running || paused) return;
    clearTimeout(timer);
    nextQuestion();
}

function togglePause() {
    if (!running) return;
    paused = !paused;
    const btn = document.getElementById('pauseBtn');

    if (paused) {
        clearTimeout(timer);
        remainingMs = questionDurationMs - (Date.now() - questionStartedAt);
        pauseProgressBar();
        btn.textContent = 'Resume';
    } else {
        questionStartedAt = Date.now();
        questionDurationMs = Math.max(0, remainingMs);
        resumeProgressBar();
        timer = setTimeout(nextQuestion, questionDurationMs);
        btn.textContent = 'Pause';
    }
}

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        manualAdvance();
    }
});

function showAllAnswers() {
    clearTimeout(timer);
    running = false;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('progressWrap').classList.remove('active');
    document.getElementById('display').textContent = 'How well did you do?';

    if (!questions.length) return;

    let rows = '';
    questions.forEach((q, i) => {
        rows += `
            <div class="answerRow">
                <span class="answerNumber">Q${i + 1}.</span>
                ${q.q} = ${q.a}
            </div>`;
    });

    const ans = document.getElementById('answers');
    ans.innerHTML = `<div class="answersTitle">Answers</div><div class="answersGrid">${rows}</div>`;
    ans.style.display = 'block';
}

function startSingleAnswers() {
    if (!questions.length) return;

    clearTimeout(timer);
    document.getElementById('answers').style.display = 'none';

    const seconds = Number(document.getElementById('seconds').value);
    index = -1;
    mode = 'marking';
    running = true;
    paused = false;

    document.getElementById('qNumber').textContent = '';
    document.getElementById('display').textContent = 'Get ready to mark\u2026';
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('pauseBtn').textContent = 'Pause';

    scheduleNext(seconds);
}

function resetQuiz() {
    clearTimeout(timer);
    running = false;
    paused = false;
    mode = 'quiz';
    document.getElementById('qNumber').textContent = '';
    document.getElementById('display').textContent = 'Ready';
    document.getElementById('answers').style.display = 'none';
    document.getElementById('progressWrap').classList.remove('active');
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('pauseBtn').textContent = 'Pause';
}
</script>
