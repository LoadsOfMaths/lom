<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Reader</title>
<style>
  :root{ --gold:#f2c14e; --cream:#fdf6e3; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Georgia,"Times New Roman",serif;
    color:var(--cream);
    background:radial-gradient(ellipse at 50% 35%,#14663f 0%,#0b4129 55%,#05231a 100%) fixed;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1000px;margin:0 auto;padding:18px 14px 28px;text-align:center}
  h1{
    margin:4px 0 2px;font-size:clamp(30px,6vw,52px);letter-spacing:.06em;
    color:var(--gold);text-shadow:0 2px 0 #7a5a10,0 4px 14px rgba(0,0,0,.5);
    font-variant:small-caps;
  }
  .sub{margin:0 0 6px;font-style:italic;opacity:.8;font-size:clamp(14px,2.2vw,18px)}
  #msg{
    min-height:3.4em;margin:10px auto 8px;max-width:720px;
    font-size:clamp(18px,3vw,26px);line-height:1.35;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .35s;
  }
  #msg.fade{opacity:0}
  #stage{position:relative;width:100%;margin:6px auto 0;--w:150px}
  .card{
    position:absolute;left:0;top:0;width:var(--w);height:calc(var(--w)*1.4);
    perspective:900px;
    transition:transform .65s cubic-bezier(.35,.1,.2,1),opacity .6s;
    will-change:transform;
  }
  .quick .card{transition-duration:.3s}
  .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s ease}
  .card.down .flip{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:calc(var(--w)*.05);
    box-shadow:0 3px 10px rgba(0,0,0,.45);
    user-select:none;-webkit-user-drag:none;
  }
  .back{transform:rotateY(180deg)}
  #btns{margin:18px 0 6px;min-height:56px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button{
    font:inherit;font-size:clamp(16px,2.4vw,21px);cursor:pointer;
    padding:12px 26px;border-radius:999px;border:2px solid #7a5a10;
    color:#2b1d00;background:linear-gradient(#ffe08a,#e8a923);
    box-shadow:0 3px 0 #7a5a10,0 6px 14px rgba(0,0,0,.35);
  }
  button:hover{filter:brightness(1.07)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a10}
  button.alt{background:linear-gradient(#f4efe0,#cfc7ae)}
  #explain{
    max-width:760px;margin:18px auto 0;padding:16px 20px;text-align:left;
    background:rgba(0,0,0,.28);border:1px solid rgba(242,193,78,.45);border-radius:14px;
    font-size:clamp(15px,2.2vw,18px);line-height:1.5;
  }
  #explain h2{margin:0 0 6px;color:var(--gold);font-size:1.15em}
  #explain .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px;align-items:center}
  #explain .row b{width:100%;font-weight:normal;font-style:italic;opacity:.85}
  #explain img{width:clamp(44px,9vw,70px);height:auto;border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
  #explain[hidden]{display:none}
  footer{margin-top:26px;font-size:12px;opacity:.55}
  footer a{color:inherit}
</style>
</head>
<body>
<main id="app">
  <h1>Mind Reader</h1>
  <p class="sub">A card trick that needs no cards, only your mind</p>
  <p id="msg"></p>
  <div id="stage"></div>
  <div id="btns"></div>
  <div id="explain" hidden></div>
  <footer>Card images: public domain set from <a href="https://www.me.uk/cards/">me.uk/cards</a></footer>
</main>

function shuffled(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- choosing the cards ---------- */
/* Six cards with at least one Jack, Queen and King (no rank more than three times,
   so the OTHER six always contain some of every rank too, which keeps the trick fair-looking). */
/* A set "looks natural" if it has every rank, a mix of red and black (at least two of each),
   and at least three different suits. Both the original six AND the five finally shown must
   pass, so there is no colour or suit tell between the two groups. */
const isRed = c => c[1] === 'D' || c[1] === 'H';
function natural(list){
  if (!RANKS.every(r => list.some(c => c[0] === r))) return false;
  const red = list.filter(isRed).length;
  if (red < 2 || list.length - red < 2) return false;
  return new Set(list.map(c => c[1])).size >= 3;
}
function pickSets(){
  const all = []; RANKS.forEach(r => SUITS.forEach(s => all.push(r+s)));
  for (let tries = 0; tries < 5000; tries++){
    const sh = shuffled(all);
    const orig = sh.slice(0,6), rest = sh.slice(6);
    if (!natural(orig) || !natural(rest)) continue;
    for (let t2 = 0; t2 < 200; t2++){
      const r = shuffled(rest);
      if (natural(r.slice(0,5))) return { orig: shuffled(orig), rest: r };   // rest[0..4] = the five shown
    }
  }
  return { orig:['JH','QC','KD','JS','QH','KS'], rest:['JD','QS','KH','JC','QD','KC'] }; // safe fallback
}

  SW = stage.clientWidth;
  COLS = SW >= 720 ? 6 : 3;
  W = Math.min(150, (SW - (COLS-1)*GAP) / COLS);
  H = W*1.4;
  const rows = COLS === 6 ? 1 : 2;
  SH = rows*H + (rows-1)*GAP + 30;
  stage.style.setProperty('--w', W+'px');
  stage.style.height = SH+'px';
}
function slot(i, n){
  const row = Math.floor(i/COLS), rowsN = Math.ceil(n/COLS);
  const inRow = Math.min(COLS, n - row*COLS), col = i - row*COLS;
  const rowW = inRow*W + (inRow-1)*GAP;
  const totalH = rowsN*H + (rowsN-1)*GAP;
  return { x:(SW-rowW)/2 + col*(W+GAP), y:(SH-totalH)/2 + row*(H+GAP) };
}
const centre = () => ({ x:(SW-W)/2, y:(SH-H)/2 });
function place(el, p){
  el.style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.r||0}deg) scale(${p.s||1})`;
}
function relayout(){
  if (busy) return;
  metrics();
  if (cards.length === 6 && cards.every(c => c.dataset.pile)) stack(cards);
  else cards.forEach((c,i) => place(c, slot(i, cards.length)));
}
addEventListener('resize', relayout);

/* ---------- card elements ---------- */
function makeCard(code){
  const el = document.createElement('div');
  el.className = 'card down';
  el.innerHTML = '<div class="flip"><img class="face front" alt="" draggable="false"><img class="face back" alt="Card back" draggable="false"></div>';
  el.querySelector('.back').src = URLS['2B'];
  setFace(el, code);
  return el;
}
function setFace(el, code){
  const f = el.querySelector('.front');
  if (code){ f.src = URLS[code]; f.alt = nameOf(code); el.dataset.code = code; }
  else { f.removeAttribute('src'); f.alt = ''; delete el.dataset.code; }
}
function stack(list){
  const c = centre();
  list.forEach((el,i) => { place(el, {x:c.x + (i-2.5)*2, y:c.y + (i-2.5)*1.5}); el.style.zIndex = i; });
}
function buildPile(){
  stage.innerHTML = '';
  metrics();
  cards = [];
  for (let i=0;i<6;i++){
    const el = makeCard(null);
    el.dataset.pile = '1';
    stage.appendChild(el);
    cards.push(el);
  }
  stack(cards);
}

/* ---------- messages and buttons ---------- */
async function say(text){
  msgEl.classList.add('fade');
  await sleep(300);
  msgEl.textContent = text;
  msgEl.classList.remove('fade');
}
function setButtons(list){
  btns.innerHTML = '';
  list.forEach(([label, fn, cls], i) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = () => { btns.innerHTML = ''; fn(); };
    btns.appendChild(b);
    if (i === 0) setTimeout(() => b.focus({preventScroll:true}), 50);
  });
}

/* ---------- the trick ---------- */
let sets = null;

function intro(){
  busy = true;
  explain.hidden = true;
  buildPile();
  busy = false;
  msgEl.textContent = 'I am going to read your mind. Ready?';
  setButtons([['Begin', deal]]);
}

async function deal(){
  busy = true;
  sets = pickSets();
  cards.forEach((el,i) => { delete el.dataset.pile; setFace(el, sets.orig[i]); });
  await say('Here are six cards. Choose ONE and remember it. Do not tell me which!');
  await sleep(200);
  cards.forEach((el,i) => { place(el, slot(i,6)); });
  await sleep(900);
  cards.forEach((el,i) => setTimeout(() => el.classList.remove('down'), i*140));
  await sleep(6*140 + 700);
  busy = false;
  setButtons([['I have chosen my card', hide]]);
}

async function hide(){
  busy = true;
  await say('Hold it firmly in your mind. I shall turn the cards over and mix them up.');
  cards.forEach((el,i) => setTimeout(() => el.classList.add('down'), i*90));
  await sleep(6*90 + 900);

  /* shuffle */
  stage.classList.add('quick');
  const c = centre();
  cards.forEach((el,i) => { place(el, {x:c.x + (i-2.5)*3, y:c.y + (i-2.5)*2}); el.style.zIndex = i; });
  await sleep(600);
  for (let round=0; round<7; round++){
    shuffled(cards).forEach(el => {
      const side = Math.random() < .5 ? -1 : 1;
      place(el, {x:c.x + side*W*rand(.5,.85), y:c.y + rand(-14,14), r:side*rand(3,12)});
      el.style.zIndex = Math.floor(Math.random()*30);
    });
    await sleep(340);
    shuffled(cards).forEach((el,i) => {
      place(el, {x:c.x + rand(-4,4), y:c.y + rand(-4,4), r:rand(-2,2)});
      el.style.zIndex = i;
    });
    await sleep(300);
  }
  stage.classList.remove('quick');
  cards = shuffled(cards);
  cards.forEach((el,i) => { place(el, slot(i,6)); el.style.zIndex = 0; });
  await sleep(900);

  /* remove one, face down */
  const gone = Math.floor(Math.random()*6);
  const el = cards[gone];
  el.style.zIndex = 10;
  place(el, {x:slot(gone,6).x, y:slot(gone,6).y - H*0.5, r:-6, s:1.1});
  await sleep(600);
  place(el, {x:slot(gone,6).x + SW*0.6, y:-H*1.4, r:35, s:1.1});
  el.style.opacity = 0;
  await sleep(750);
  el.remove();
  cards.splice(gone,1);

  /* quietly swap the five remaining (face-down) for five of the other six */
  const five = sets.rest.slice(0,5);
  cards.forEach((c2,i) => setFace(c2, five[i]));
  await Promise.all(cards.map(c2 => c2.querySelector('.front').decode().catch(()=>{})));
  cards.forEach((c2,i) => place(c2, slot(i,5)));
  await sleep(800);

  await say('I have removed one card, and I have not looked at it. Now I shall turn over the remaining five. Did I successfully remove your card?');
  busy = false;
  setButtons([['Turn them over', reveal]]);
}

async function reveal(){
  busy = true;
  cards.forEach((el,i) => setTimeout(() => el.classList.remove('down'), i*380));
  await sleep(5*380 + 800);
  await say('Did I read your mind?');
  busy = false;
  setButtons([['Yes, you did!', () => answer(true)], ['No...', () => answer(false)]]);
}

async function answer(yes){
  await say(yes
    ? 'I know. Thank you, you have been a splendid subject.'
    : 'Look again. Is your card among these five? No? Then I must have removed it. I rest my case.');
  setButtons([['Play again', again], ['How was that done?', how, 'alt']]);
}

function how(){
  const imgs = list => list.map(c => `<img src="${URLS[c]}" alt="${nameOf(c)}">`).join('');
  explain.innerHTML =
    '<h2>The secret</h2>' +
    '<p>Not one of the five cards at the end was in your original six. Whichever card you chose, it was <em>always</em> going to be missing. ' +
    'The trick works because you spent all your effort memorising your own card and none on the others, so you could not tell that the whole set had been swapped.</p>' +
    '<div class="row"><b>The six you chose from:</b>' + imgs(sets.orig) + '</div>' +
    '<div class="row"><b>The five I turned over:</b>' + imgs(sets.rest.slice(0,5)) + '</div>' +
    '<p>The ending is pure confidence: asking "Did I read your mind?" invites you to admit that your card is not there, and that feels like a hit.</p>';
  explain.hidden = false;
  explain.scrollIntoView({behavior:'smooth', block:'nearest'});
  setButtons([['Play again', again]]);
}

function again(){
  intro();
  setTimeout(deal, 350);
}

/* ---------- go ---------- */
addEventListener('load', intro);
</script>
</body>
</html>
