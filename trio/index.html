<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#2c3e4b;--muted:#5e717f;--accent:#4f7a92;--accent-soft:#dbe8ee;--on-accent:#fff;
  --sage:#5f9a7c;--gold:#d6a03a;--rose:#b8645d;
  --bg1:#e9f0ee;--bg2:#e3e9f1;--bg3:#f0eae4;
  --panel:rgba(255,255,255,.62);--panel-border:rgba(60,85,100,.16);--dlg:#fbfaf6;
  --card:#fdfbf6;--card2:#f6f2e8;--card-edge:rgba(50,70,85,.16);
  --shadow:0 8px 24px rgba(40,65,85,.12);--bar:rgba(238,243,245,.92);
}
[data-theme=dusk]{
  --ink:#e8ecf1;--muted:#a6b4c1;--accent:#8fb6cc;--accent-soft:#2c4052;--on-accent:#10202b;
  --sage:#82c0a0;--gold:#e5b655;--rose:#d98a82;
  --bg1:#16202b;--bg2:#1d2939;--bg3:#272634;
  --panel:rgba(255,255,255,.07);--panel-border:rgba(255,255,255,.14);--dlg:#233140;
  --card:#f3efe4;--card2:#ebe6d8;--card-edge:rgba(0,0,0,.25);
  --shadow:0 10px 28px rgba(0,0,0,.4);--bar:rgba(26,38,52,.94);
}
html{font-size:clamp(16px,.7vw + 11px,24px)}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));transition:background .6s,color .4s}
.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 48s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:#bcd8cf}
.ambient i:nth-child(2){width:40vmax;height:40vmax;right:-10vmax;bottom:-12vmax;background:#c9cfe8;animation-duration:62s}
.ambient i:nth-child(3){width:30vmax;height:30vmax;left:40vw;top:30vh;background:#f0dcc6;opacity:.35;animation-duration:75s}
[data-theme=dusk] .ambient i{opacity:.22}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.12)}}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem;padding-top:calc(.55rem + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:400;font-size:1.35rem;letter-spacing:.22em}
.brand svg{width:2.4rem;height:1.5rem}
.btn{border:1px solid var(--panel-border);background:var(--panel);color:var(--ink);font:inherit;padding:.6rem 1.3rem;min-height:2.7rem;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);transition:background .3s,transform .3s,box-shadow .3s}
@media(hover:hover){.btn:hover{background:var(--accent-soft)}.btn.primary:hover{filter:brightness(1.07)}.opt:hover{background:var(--accent-soft)}.sw:hover{transform:scale(1.06)}.tile:hover{background:var(--accent-soft);transform:translateY(-3px);box-shadow:var(--shadow)}}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.ibtn{width:2.7rem;height:2.7rem;padding:0;display:grid;place-items:center;font-family:Georgia,serif;font-size:1.2rem}
.ibtn svg{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible,.opt:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.moon,.sun{display:none}
[data-theme=day] .moon{display:block}[data-theme=dusk] .sun{display:block}
.snd-off{display:none}.muted .snd-off{display:block}.muted .snd-on{display:none}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0}
.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:1.6rem;padding:clamp(1rem,3vw,2rem);backdrop-filter:blur(10px);box-shadow:var(--shadow)}
#setup{overflow:auto;display:flex;padding:.6rem 1rem 1rem}
#setup .panel{margin:auto;width:min(62rem,100%)}
.hello{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:400;font-size:clamp(1.8rem,4vw,2.8rem);text-align:center;margin:0;letter-spacing:.03em}
.lede{text-align:center;color:var(--muted);margin:.5rem auto 0;max-width:40rem;line-height:1.5}
.group{margin-top:1.1rem}
.glabel{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem}
.opt{display:flex;flex-direction:column;gap:.15rem;text-align:left;padding:.65rem 1rem;border-radius:1rem;border:1.5px solid var(--panel-border);background:transparent;color:inherit;font:inherit;cursor:pointer;transition:background .3s,border-color .3s}
.opt b{font-weight:600}.opt small{color:var(--muted);font-size:.78rem;line-height:1.3}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.gnote{text-transform:none;letter-spacing:.02em;margin-left:.6rem;font-size:.8rem;opacity:.85}
.picker{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.sw{position:relative;width:2.8rem;height:2.8rem;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);box-shadow:0 0 0 1.5px var(--panel-border);transition:box-shadow .3s,transform .3s}
.sw svg{position:absolute;inset:0;margin:auto;width:55%;height:55%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--dlg),0 0 0 5.5px var(--accent)}
.sw[aria-pressed=true] svg{opacity:1}
.shp{width:3.4rem;height:3.4rem;padding:.4rem;border-radius:1rem;border:1.5px solid var(--panel-border);background:var(--card);color:#8497a5;cursor:pointer;transition:box-shadow .3s,color .3s,border-color .3s}
.shp svg{display:block;width:100%;height:100%}
.shp[aria-pressed=true]{color:#3b556a;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4.5px var(--accent)}
.sw:focus-visible,.shp:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.preview{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:.2rem;--cw:5.6rem;--ch:3.5rem}
.preview .card{box-shadow:0 4px 12px rgba(40,65,85,.12)}
.begin{display:block;margin:1.4rem auto 0;font-size:1.1rem;padding:.8rem 2.6rem}
#boardWrap{position:absolute;inset:0;padding:.4rem .8rem}
#board{width:100%;height:100%;display:grid;justify-content:center;align-content:center;gap:var(--gap,12px)}
.card{position:relative;display:block;width:var(--cw);height:var(--ch);padding:0;border-radius:calc(var(--cw)*.1);
  background:linear-gradient(180deg,var(--card),var(--card2));border:1.5px solid var(--card-edge);box-shadow:var(--shadow);
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .4s,opacity .5s}
div.card{cursor:default}
.card svg{width:100%;height:100%;display:block}
@media(hover:hover){button.card:hover{transform:translateY(-3px)}}
.card.sel{transform:translateY(-7px);box-shadow:0 0 0 3px var(--accent),0 16px 30px rgba(40,65,85,.22)}
.card.hint{transform:translateY(-6px);box-shadow:0 0 0 4px var(--gold),0 0 26px 7px rgba(214,160,58,.5)}
.card.hint:not(.enter){animation:breathe 3.6s ease-in-out infinite}
.card.hint.sel{box-shadow:0 0 0 3px var(--accent),0 0 0 7px var(--gold),0 0 26px 7px rgba(214,160,58,.4)}
.card.good{box-shadow:0 0 0 3px var(--sage),0 0 28px 4px rgba(95,154,124,.45);transform:translateY(-4px)}
.card.miss{box-shadow:0 0 0 3px var(--rose);opacity:.8}
.card.dim{opacity:.4}
.card.leaving{opacity:0;transform:translateY(-14px) scale(.94)}
.card.enter{animation:settle .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
@keyframes settle{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 4px var(--gold),0 0 14px 3px rgba(214,160,58,.35)}50%{box-shadow:0 0 0 5px var(--gold),0 0 34px 10px rgba(214,160,58,.6)}}

<script>
(() => {
'use strict';
/*LOGIC-START*/
const COLOURS=['#3f5ea8','#cf8a1b','#bd4f79'];
const COLOUR_NAMES=['indigo','ochre','rose'];
const SHAPE_NAMES=['circle','leaf','mountain'];
const SHAPE_PLURAL=['circles','leaves','mountains'];
const SHADE_NAMES=['solid','lined','open'];
const FEATURES=['Colour','Shape','Number','Shading'];
const CFG={
  9:{easy:{n:7,min:3,max:99},medium:{n:6,min:2,max:3},hard:{n:4,min:0,max:1}},
  27:{easy:{n:9,min:4,max:99},medium:{n:8,min:2,max:3},hard:{n:8,min:0,max:1}},
  81:{easy:{n:12,min:4,max:99},medium:{n:12,min:2,max:3},hard:{n:12,min:0,max:1}}
};
const DIMS={9:2,27:3,81:4};
const ST={activity:'play',deck:81,level:'easy',mode:'whole',theme:'day',sound:false,colours:[0,1,2],shapes:[0,1,2]};
let D=null,P=null;

function makeDeck(dims){
  const M=Math.pow(3,dims),digits=[];
  for(let i=0;i<M;i++){const d=[];let x=i;for(let k=0;k<dims;k++){d.push(x%3);x=(x-x%3)/3;}digits.push(d);}
  const third=new Uint8Array(M*M);
  for(let a=0;a<M;a++)for(let b=0;b<M;b++){
    let t=0,mul=1;
    for(let k=0;k<dims;k++){t+=((6-digits[a][k]-digits[b][k])%3)*mul;mul*=3;}
    third[a*M+b]=t;
  }
  return{dims,M,digits,third,posMap:new Int16Array(M).fill(-1)};
}
function setDeck(dims){D=makeDeck(dims);P=new Uint8Array(D.M).fill(1);}
const rnd=n=>Math.floor(Math.random()*n);
function sample(arr,k){
  const a=arr.slice(),out=[];
  for(let i=0;i<k&&i<a.length;i++){const j=i+rnd(a.length-i);[a[i],a[j]]=[a[j],a[i]];out.push(a[i]);}
  return out;
}
function isSet(a,b,c){return a!==b&&b!==c&&a!==c&&D.third[a*D.M+b]===c;}
function setsIn(list){
  const{third,M,posMap}=D,res=[];
  for(let i=0;i<list.length;i++)posMap[list[i]]=i;
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const k=posMap[third[list[i]*M+list[j]]];
    if(k>j)res.push([i,j,k]);
  }
  for(let i=0;i<list.length;i++)posMap[list[i]]=-1;
  return res;
}
function countSets(list){
  const{third,M,posMap}=D;let n=0;
  for(let i=0;i<list.length;i++)posMap[list[i]]=i;
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    if(posMap[third[list[i]*M+list[j]]]>j)n++;
  }
  for(let i=0;i<list.length;i++)posMap[list[i]]=-1;
  return n;
}
function poolList(){const l=[];for(let i=0;i<D.M;i++)if(P[i])l.push(i);return l;}
function poolHasSet(){
  const l=poolList(),{third,M}=D;
  for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++)if(P[third[l[i]*M+l[j]]])return true;
  return false;
}
function seededFill(keep,cand,need,allSets,all){
  const t=allSets[rnd(allSets.length)],keepSet=new Set(keep);
  const add=t.map(p=>all[p]).filter(c=>!keepSet.has(c));
  if(add.length>need)return null;
  const addSet=new Set(add);
  return add.concat(sample(cand.filter(c=>!addSet.has(c)),need-add.length));
}
function tryPick(keep,cand,n,level,cfg){
  const need=Math.min(n,keep.length+cand.length)-keep.length;
  if(need<=0)return{fill:[],count:countSets(keep),dist:0};
  if(cand.length<=need){const f=cand.slice();return{fill:f,count:countSets(keep.concat(f)),dist:0};}
  const hard=level==='hard';
  let plo=cfg.min,phi=cfg.max,slo=cfg.min,shi=cfg.max;
  if(hard){const z=Math.random()<0.4;plo=phi=z?0:1;slo=0;shi=1;}
  const all=keep.concat(cand);
  const wantSeed=plo>=1;
  const allSets=wantSeed?setsIn(all):[];
  let best=null,bestD=1e9,second=null;
  for(let t=0;t<1500;t++){
    let fill=null;
    if(wantSeed&&allSets.length&&(t&1)===0)fill=seededFill(keep,cand,need,allSets,all);
    if(!fill)fill=sample(cand,need);
    const c=countSets(keep.concat(fill));
    if(c>=plo&&c<=phi)return{fill,count:c,dist:0};
    if(!second&&c>=slo&&c<=shi)second={fill,count:c,dist:0};
    const d=c<slo?slo-c:c>shi?c-shi:0;
    if(d<bestD){bestD=d;best={fill,count:c,dist:d};}
  }
  return second||best;
}
/* old: board array with null where cards were removed (or empty array for a fresh deal).
   Returns {board, rebuild}. rebuild=true means positions changed and the board must be redrawn. */
function pickBoard(old,level){
  const cfg=CFG[ST.deck][level||ST.level],pl=poolList();
  const n=Math.min(cfg.n,pl.length);
  const keep=old.filter(x=>x!==null&&x!==undefined);
  const keepSet=new Set(keep);
  const cand=pl.filter(c=>!keepSet.has(c));
  let r1=tryPick(keep,cand,n,level||ST.level,cfg);
  if(r1.dist>0&&keep.length>0){
    const r2=tryPick([],pl,n,level||ST.level,cfg);
    if(r2.dist<r1.dist)return{board:r2.fill,rebuild:true};
  }
  if(!old.length)return{board:r1.fill,rebuild:true};
  const nb=old.slice(),vac=[];
  nb.forEach((x,i)=>{if(x===null||x===undefined)vac.push(i);});
  r1.fill.forEach((c,k)=>{nb[vac[k]]=c;});
  const compact=nb.filter(x=>x!==null&&x!==undefined);
  return{board:compact,rebuild:compact.length!==nb.length};
}
function explain(a,b,c){
  const out=[];
  for(let k=0;k<D.dims;k++){
    const x=D.digits[a][k],y=D.digits[b][k],z=D.digits[c][k];
    out.push({name:FEATURES[k],kind:(x===y&&y===z)?'same':(x!==y&&y!==z&&x!==z)?'diff':'bad'});
  }
  return out;
}
function describeSet(cards){
  const ex=explain(cards[0],cards[1],cards[2]),same=ex.filter(e=>e.kind==='same').map(e=>e.name),diff=ex.filter(e=>e.kind==='diff').map(e=>e.name),parts=[];
  if(same.length)parts.push('Same: '+same.join(', '));
  if(diff.length)parts.push('Different: '+diff.join(', '));
  return parts.join(' \u00b7 ');
}
function describeMiss(cards){
  const bad=explain(cards[0],cards[1],cards[2]).filter(e=>e.kind==='bad').map(e=>e.name);
  return bad.length?bad.join(', ')+': two match, one differs':'';
}
function makeTrial(level){
  const M=D.M,a=rnd(M);let b;do{b=rnd(M);}while(b===a);
  const c=D.third[a*M+b];
  const dist=i=>{let h=0;for(let k=0;k<D.dims;k++)if(D.digits[i][k]!==D.digits[c][k])h++;return h;};
  const others=[];for(let i=0;i<M;i++)if(i!==a&&i!==b&&i!==c)others.push(i);
  let dis;
  if(level==='easy')dis=sample(others,3);
  else{
    const maxD=level==='hard'?1:2;
    const sorted=sample(others,others.length).sort((x,y)=>dist(x)-dist(y));
    const near=sorted.filter(i=>dist(i)<=maxD);
    dis=near.length>=3?sample(near,3):sorted.slice(0,3);
  }
  return{a,b,c,opts:sample(dis.concat([c]),4)};
}

function roundedPoly(pts,r){
  const n=pts.length;let d='';
  for(let i=0;i<n;i++){
    const p0=pts[(i+n-1)%n],p1=pts[i],p2=pts[(i+1)%n];
    const v1=[p0[0]-p1[0],p0[1]-p1[1]],v2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
    const a=[p1[0]+v1[0]/l1*r,p1[1]+v1[1]/l1*r],b=[p1[0]+v2[0]/l2*r,p1[1]+v2[1]/l2*r];
    d+=(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)+'Q'+p1[0]+' '+p1[1]+' '+b[0].toFixed(1)+' '+b[1].toFixed(1);
  }
  return d+'Z';
}

/* ---------- layout ---------- */
function fitGrid(W,H,n,gap,aspect,maxCw){
  let best=null;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols);
    const cw=Math.min((W-(cols-1)*gap)/cols,((H-(rows-1)*gap)/rows)*aspect,maxCw);
    if(cw<=0)continue;
    const asp=Math.abs(Math.log((cols*cw)/(rows*cw/aspect))-Math.log(W/H));
    const score=cw*(n%cols===0?1:.86);
    if(!best||score>best.score+1||(Math.abs(score-best.score)<=1&&asp<best.asp))best={cols,rows,cw,asp,score};
  }
  if(!best)best={cols:1,rows:n,cw:60,asp:0};
  best.ch=best.cw/aspect;return best;
}
function gridFor(W,H,n,gap,cols,maxCw,aspect){
  const rows=Math.ceil(n/cols);
  const cw=Math.min((W-(cols-1)*gap)/cols,((H-(rows-1)*gap)/rows)*aspect,maxCw);
  return{cols,rows,cw,ch:cw/aspect};
}
/* Preferred shapes: 12 cards sit as 3 rows of 4 (4 rows of 3 in portrait), 9 as 3x3, and so on.
   The preferred shape is used unless it would make the cards much smaller than the best alternative. */
function chooseGrid(W,H,n,gap){
  const portrait=W<H,asp=portrait?1.3:1.6;
  const best=fitGrid(W,H,n,gap,asp,440);
  const pref=(portrait?{12:3,9:3,8:2,7:2,6:2,4:2}:{12:4,9:3,8:4,7:4,6:3,4:2})[n];
  let r=best;
  if(pref){const p=gridFor(W,H,n,gap,pref,440,asp);if(p.cw>=best.cw*.7)r=p;}
  if(portrait){ /* tall screens: let cards grow taller (up to nearly square) to use the room */
    const maxCh=(H-(r.rows-1)*gap)/r.rows;
    r=Object.assign({},r,{ch:Math.max(r.cw/1.3,Math.min(r.cw/1.1,maxCh))});
  }
  return r;
}
function layoutPlay(){
  const w=$('#boardWrap'),bd=$('#board'),n=S.board.length;

  const f=chooseGrid(W,H,n,gap);
  bd.style.setProperty('--cw',f.cw+'px');bd.style.setProperty('--ch',f.ch+'px');bd.style.setProperty('--gap',gap+'px');
  bd.style.gridTemplateColumns=`repeat(${f.cols},${f.cw}px)`;
}
function layoutTrain(){

  const opt=(maxCols,rows)=>Math.min((W-(maxCols-1)*gap)/maxCols,((H-(rows-1)*gap)/rows)*1.6,380);
  const A=opt(4,2),B=opt(3,3);
  const cols=A>=B?4:2,cw=Math.max(50,Math.max(A,B));

}

  sel.forEach(p=>{S.cells[p].classList.remove('sel');S.cells[p].classList.add('good');});
  S.found++;
  if(ST.mode==='whole')cards.forEach(c=>{P[c]=0;});
  chime([523.25,659.25,783.99]);
  say('A trio. Well found.',describeSet(cards),'good');
  later(()=>sel.forEach(p=>S.cells[p].classList.add('leaving')),800);
  later(()=>{
    const old=S.board.slice();sel.forEach(p=>{old[p]=null;});
    S.sel=[];
    applyBoard(pickBoard(old),sel);
    S.busy=false;updateUI();
    if(ST.mode==='whole'&&!poolHasSet())later(showComplete,900);
  },1350);
}
function applyBoard(res,vacated){
  S.board=res.board;
  if(res.rebuild)renderBoard();
  else vacated.forEach((p,k)=>replaceCard(p,S.board[p],k));
  paint();layoutPlay();
}
function showComplete(){
  const left=poolList().length;
  chime([523.25,659.25,783.99,1046.5]);
  openDialog('The deck is complete',
    `You found ${S.found} ${S.found===1?'trio':'trios'}. `+(left?`${left} card${left===1?'':'s'} remain, with no trio among them.`:'Every card has been found.'),
    [{label:'Play again',primary:true,fn:newPlay},{label:'Change settings',fn:toSetup}]);
}
function showSet(){
  if(S.busy)return;
  clearWrong();S.sel=[];paint();
  const sets=setsIn(S.board);
  if(!sets.length){
    clearHint();
    say('No trio hides on this board.','If you agree, press “No trio here” to deal fresh cards.');
    const nb=$('#noSetBtn');nb.hidden=false;nb.classList.remove('pulse');void nb.offsetWidth;nb.classList.add('pulse');
    return;
  }
  S.hintI=(S.hintI+1)%sets.length;
  S.cells.forEach(c=>c.classList.remove('hint','enter'));
  sets[S.hintI].forEach(p=>S.cells[p].classList.add('hint'));
  say('Here is a trio.',sets.length>1?`There are ${sets.length} on this board. Press again to see another.`:'It is the only one on this board.');
}
function claimNoSet(){
  if(S.busy)return;
  clearWrong();S.sel=[];paint();
  if(setsIn(S.board).length){
    say('There is a trio on this board.','Look again, or press “Show a trio”.','soft');return;
  }
  S.busy=true;S.noSets++;clearHint();
  say('Quite right.','No trio hides on this board. Fresh cards are on their way.','good');
  chime([587.33,783.99]);
  later(()=>S.cells.forEach(c=>c.classList.add('leaving')),900);
  later(()=>{
    const r=pickBoard([]);S.board=r.board;renderBoard();
    S.busy=false;updateUI();
    if(ST.mode==='whole'&&!poolHasSet())later(showComplete,700);
  },1500);
}

/* ---------- train ---------- */
function newTrain(){
  clearTimers();closeDialog();
  setDeck(DIMS[ST.deck]);
  T={done:0};show('train');nextTrial();
}
function nextTrial(){
  const done=T.done,t=makeTrial(ST.level);
  T=Object.assign(t,{done,answered:false,hint:0});
  const top=$('#tTop');top.innerHTML='';
  [T.a,T.b].forEach((i,k)=>{const c=makeCard(i,'div');c.classList.add('enter');c.style.setProperty('--i',k);top.appendChild(c);});
  const slot=document.createElement('div');slot.className='slot';slot.id='slot';slot.textContent='?';top.appendChild(slot);
  const o=$('#tOpts');o.innerHTML='';
  T.opts.forEach((idx,k)=>{
    const b=makeCard(idx);b.dataset.idx=idx;b.classList.add('enter');b.style.setProperty('--i',k+3);
    b.addEventListener('click',()=>pick(idx,b));o.appendChild(b);
  });
  $('#nextBtn').classList.remove('primary');$('#tHintBtn').disabled=false;
  say('Which card completes the trio?','Look at each feature in turn.');
  $('#stats').textContent=`Completed: ${T.done}`;
  layoutTrain();
}
function pick(idx,btn){
  if(T.answered)return;
  const cards=[T.a,T.b,idx];
  if(idx===T.c){
    T.answered=true;T.done++;
    const slot=$('#slot');slot.textContent='';slot.appendChild(makeCard(idx,'div'));slot.firstChild.classList.add('enter');
    [...$('#tOpts').children].forEach(c=>{c.classList.remove('hint');if(c===btn){c.classList.add('good');}else c.classList.add('dim');c.disabled=true;});
    chime([523.25,659.25,783.99]);
    say('Yes. That completes the trio.',describeSet(cards),'good');
    $('#nextBtn').classList.add('primary');$('#tHintBtn').disabled=true;
    $('#stats').textContent=`Completed: ${T.done}`;
  }else{
    btn.classList.add('miss','dim');btn.disabled=true;
    say('Not quite.',describeMiss(cards)+' — try another.','soft');
  }
}
function trainHint(){
  if(T.answered)return;
  T.hint++;
  if(T.hint===1)say('Take each feature in turn.','If the two cards match on it, the third must match too. If they differ, the third must be different from both.');
  else{
    [...$('#tOpts').children].forEach(c=>{if(+c.dataset.idx===T.c){c.classList.remove('enter');c.classList.add('hint');}});
    say('This one completes the trio.','Check why: '+describeSet([T.a,T.b,T.c]));
  }
}

/* ---------- explore ---------- */
const X={cards:[[0,0,0,0],[1,1,1,0],[2,2,2,0]],btns:[],cardBoxes:[]};
const NUM_WORDS=['one','two','three'];
const xIdx=v=>v[0]+3*v[1]+9*v[2]+27*v[3];
const xFrom=i=>[i%3,Math.floor(i/3)%3,Math.floor(i/9)%3,Math.floor(i/27)%3];
function shadeIcon(v){
  const fill=v===0?'#6b7f8e':v===1?'url(#lnN)':'none';
  return `<svg viewBox="-50 -50 100 100" aria-hidden="true"><circle r="32" fill="${fill}" stroke="#6b7f8e" stroke-width="6"/></svg>`;
}
function featureButton(f,v){
  const b=document.createElement('button');b.type='button';
  let label;
  if(f===0){b.className='sw sm';b.style.setProperty('--c',COLOURS[v]);b.innerHTML=CHECK;label=COLOUR_NAMES[v];}
  else if(f===1){
    b.className='shp sm';label=SHAPE_NAMES[v];
    b.innerHTML=`<svg viewBox="-50 -50 100 100" aria-hidden="true"><path d="${SHAPE_D[v]}" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>`;
  }
  else if(f===2){b.className='xb';b.textContent=String(v+1);label=NUM_WORDS[v];}
  else{b.className='xb';b.innerHTML=shadeIcon(v);label=SHADE_NAMES[v];}
  b.title=label;b.setAttribute('aria-label',label);
  return b;
}
function buildExplore(){
  const w=$('#xWrap');w.innerHTML='';X.btns=[];X.cardBoxes=[];
  const slots=document.createElement('div');slots.className='xslots';
  for(let s=0;s<3;s++){
    const el=document.createElement('div');el.className='xslot';
    const cb=document.createElement('div');cb.className='xcard';el.appendChild(cb);X.cardBoxes.push(cb);
    const ctr=document.createElement('div');ctr.className='xctrls';
    X.btns.push([]);
    for(let f=0;f<4;f++){
      const row=document.createElement('div');row.className='xrow';row.setAttribute('role','group');
      row.setAttribute('aria-label',`${FEATURES[f]} of card ${s+1}`);
      const lab=document.createElement('span');lab.className='xlab';lab.textContent=FEATURES[f];row.appendChild(lab);
      X.btns[s].push([]);
      for(let v=0;v<3;v++){
        const b=featureButton(f,v);
        b.addEventListener('click',()=>{X.cards[s][f]=v;renderExplore();});
        X.btns[s][f].push(b);row.appendChild(b);
      }
      ctr.appendChild(row);
    }
    el.appendChild(ctr);slots.appendChild(el);
  }
  w.appendChild(slots);
  const vd=document.createElement('div');vd.className='xverdict';
  vd.innerHTML='<div class="msg" id="xmsg" aria-live="polite"><div class="msg-main"></div><div class="msg-sub"></div></div><div class="chips" id="xchips"></div>';
  const bot=document.createElement('div');bot.className='xbottom';bot.appendChild(vd);
  const acts=document.createElement('div');acts.className='xacts';
  [['Complete the trio',xComplete],['Random trio',xRandomTrio],['Mix up',xMix]].forEach(([t,fn])=>{
    const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=t;b.addEventListener('click',fn);acts.appendChild(b);
  });
  bot.appendChild(acts);w.appendChild(bot);
}
function xSay(main,sub,tone,keep){
  const m=$('#xmsg');m.className='msg '+(tone||'')+(keep?' keep':'');$('.msg-main',m).textContent=main;$('.msg-sub',m).textContent=sub||'';
}
function renderExplore(){
  const idx=X.cards.map(xIdx);
  const feats=[0,1,2,3].map(f=>{
    const a=X.cards[0][f],b=X.cards[1][f],c=X.cards[2][f];
    return{name:FEATURES[f],kind:(a===b&&b===c)?'same':(a!==b&&b!==c&&a!==c)?'diff':'bad'};
  });
  const dup=new Set(idx).size<3,ok=!dup&&feats.every(e=>e.kind!=='bad');
  for(let s=0;s<3;s++){
    const card=makeCard(idx[s],'div');if(ok)card.classList.add('good');
    X.cardBoxes[s].innerHTML='';X.cardBoxes[s].appendChild(card);
    for(let f=0;f<4;f++)for(let v=0;v<3;v++)X.btns[s][f][v].setAttribute('aria-pressed',String(X.cards[s][f]===v));
  }
  const word=k=>k==='same'?'all the same':k==='diff'?'all different':'two match, one differs';
  $('#xchips').innerHTML=feats.map(e=>`<span class="chip ${e.kind==='bad'?'bad':'ok'}">${e.kind==='bad'?'✗':'✓'} ${e.name}: ${word(e.kind)}</span>`).join('');
  if(ok)xSay('These three cards form a trio.','Every feature is either all the same or all different.','good');
  else if(dup)xSay('Two of these cards are identical.','Every card in the pack is different, so change one of them.','soft',true);
  else xSay('Not yet a trio.','Look at: '+feats.filter(e=>e.kind==='bad').map(e=>e.name).join(', ')+'. Try “Complete the trio” to see what the third card needs.','soft');
}
function xComplete(){
  const a=xIdx(X.cards[0]),b=xIdx(X.cards[1]);
  if(a===b){xSay('Make the first two cards different.','Then the third card can be found for you.','soft',true);return;}
  X.cards[2]=xFrom(D.third[a*D.M+b]);renderExplore();chime([523.25,659.25,783.99]);
}
function xRandomTrio(){
  const a=rnd(81);let b;do{b=rnd(81);}while(b===a);
  X.cards=[xFrom(a),xFrom(b),xFrom(D.third[a*D.M+b])];renderExplore();
}
function xMix(){X.cards=sample([...Array(81).keys()],3).map(xFrom);renderExplore();}
function newExplore(){
  clearTimers();closeDialog();S.busy=false;
  setDeck(4);buildExplore();show('explore');renderExplore();
}

/* ---------- start-up ---------- */
function applyTheme(){
  document.body.dataset.theme=ST.theme;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=ST.theme==='day'?'#e9f0ee':'#16202b';
  $('#soundBtn').classList.toggle('muted',!ST.sound);
}
function init(){
  loadST();applyChoices();initDefs();applyTheme();renderHome();show('home');
  $('#beginBtn').addEventListener('click',()=>{saveST();({play:newPlay,train:newTrain,explore:newExplore})[ST.activity]();});
  $('#menuBtn').addEventListener('click',()=>{if(S.screen==='setup')goHome();else toSetup();});
  $('#helpBtn').addEventListener('click',showHelp);
  $('#themeBtn').addEventListener('click',()=>{ST.theme=ST.theme==='day'?'dusk':'day';saveST();applyTheme();});
  $('#soundBtn').addEventListener('click',()=>{ST.sound=!ST.sound;saveST();applyTheme();chime([659.25]);});
  const fs=$('#fsBtn');
  if(!document.fullscreenEnabled)fs.hidden=true;
  fs.addEventListener('click',()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}});
  $('#showBtn').addEventListener('click',showSet);
  $('#noSetBtn').addEventListener('click',claimNoSet);
  $('#tHintBtn').addEventListener('click',trainHint);
  $('#nextBtn').addEventListener('click',nextTrial);
  $('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDialog();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();});
  window.addEventListener('resize',layout);
  if(window.ResizeObserver)new ResizeObserver(layout).observe($('#main'));
}
init();
})();
</script>
