#ldesc{padding:6px 18px;color:var(--g);font-size:16px}

.card{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 6px #0001}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.chip.on{border-color:var(--b);background:#e6f1fb;font-weight:bold}
.chip.o2.on{border-color:var(--o);background:#fff0e0}
.ctxline{font-size:clamp(18px,2.2vw,26px);margin:8px 0;min-height:1.3em}

.eqbig span.f{color:var(--o)}.eqbig span.t{color:var(--b)}
.ladder{display:flex;align-items:center;overflow-x:auto;padding:6px 0}

.lu.off{opacity:.4}.lu.mid{background:#eef5fb}.lu.from{border-color:var(--o);background:#fff0e0}.lu.to{border-color:var(--b);background:#e6f1fb}

.lc.path{color:var(--ink);font-weight:bold}
.steps p{font-size:clamp(17px,2vw,24px);margin:8px 0}
#slide{position:relative;margin:10px 0;overflow:hidden}
.tile{position:absolute;text-align:center;font-weight:bold;border-radius:6px;transition:left 1.2s ease,opacity .7s}
.tile.dg{background:var(--b);color:#fff}
.tile.pad{background:#ffe3c4;color:var(--o)}
.colbg{position:absolute;border:1px solid #e5e7eb;background:#fafafa}
.hd{position:absolute;text-align:center;color:var(--g)}
.pt{position:absolute;font-weight:bold;text-align:center}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}

.av{color:var(--ok)}.wk{font-size:16px;color:var(--g);margin-top:4px}

input#tval{font:inherit;font-size:24px;width:150px;border:2px solid var(--o);border-radius:8px;padding:4px 8px}
svg text{font-family:inherit}
</style>

function qHTML(q,i){
 var shown=S.rev[i]||S.res,ctx=cfg.ctx&&q.ctxT?'<div class="ctx">'+ctxText(q)+'</div>':'',blank;
 if(S.res&&cfg.type){var ok=S.res[i];blank='<span class="mk '+(ok?'ok':'bad')+'">'+(S.typed[i]||'–')+(ok?' ✓':' ✗')+'</span>'+(ok?'':' <span class="av">'+fmtDec(q.ans)+'</span>')}
 else if(shown)blank='<span class="av">'+fmtDec(q.ans)+'</span>';
 else if(cfg.type)blank='<input class="ans" data-i="'+i+'" inputmode="decimal" autocomplete="off" value="'+(S.typed[i]||'')+'">';
 else blank='<span class="blank"></span>';
 return '<div class="q" data-act="qshow" data-i="'+i+'"><div class="n">'+(i+1)+'</div>'+ctx+'<div class="eq">'+fmtDec(q.dec)+' '+q.from.s+' = '+blank+' '+q.to.s+'</div>'+(shown&&!cfg.type?'<div class="wk">'+working(q)+'</div>':'')+'</div>'}
function practiseHTML(){
 if(!S.qs.length)return noUnits();
 var h='<div class="row"><button class="btn org" data-act="pnew">New questions</button>';
 if(cfg.type)h+='<button class="btn pri" data-act="pcheck">Check answers</button>';
 h+='<button class="btn" data-act="pall">'+(S.res||Object.keys(S.rev).length===S.qs.length?'Hide answers':'Show all answers')+'</button>';
 if(S.res&&cfg.type){var n=0;S.res.forEach(function(r){if(r)n++});h+='<b style="font-size:24px">Score: '+n+' / '+S.qs.length+'</b>'}
 h+='</div><div class="qs">';S.qs.forEach(function(q,i){h+=qHTML(q,i)});return h+'</div><p class="note">'+(cfg.type?'Type your answers, then press Check answers.':'Write your answers on paper. Tap a question to reveal its answer.')+'</p>'}
function settingsHTML(){
 var h='<div class="card"><h2>Units</h2><p class="note">Switch whole families on or off, or individual units. Levels 5 and 6 use the Length switches (and Capacity for litres).</p>';
 FAMKEYS.forEach(function(k){h+='<div class="fam"><div class="chips"><button class="chip o2 '+(cfg.fam[k]?'on':'')+'" data-act="fam" data-k="'+k+'"><b>'+(cfg.fam[k]?'☑ ':'☐ ')+KN[k]+'</b></button>';
  UNITS[k].forEach(function(x){h+='<button class="chip '+(cfg.units[k][x.s]?'on':'')+'" data-act="unit" data-k="'+k+'" data-s="'+x.s+'">'+x.s+'</button>'});h+='</div></div>'});
 h+='</div><div class="card"><h2>Options</h2>';
 [['ctx','Show real-life context sentences'],['type','Pupils type answers on screen (otherwise paper)'],['cap','Include litres and millilitres with cubic units (Level 6)']].forEach(function(o){h+='<p><button class="chip '+(cfg[o[0]]?'on':'')+'" data-act="opt" data-k="'+o[0]+'">'+(cfg[o[0]]?'☑ ':'☐ ')+o[1]+'</button></p>'});
 h+='<p>Large numbers: <select id="fmt"><option value="space">10 000 (spaces)</option><option value="comma">10,000 (commas)</option><option value="none">10000 (none)</option></select></p>';
 h+='<p class="note">Data uses 1 kB = 1000 B (SI units).</p><p><button class="btn" data-act="reset">Reset to defaults</button></p></div>';return h}
function ladderHTML(t){
 var U=UNITS[t.kind].slice().sort(function(a,b){return a.x-b.x}),ia=U.indexOf(t.from),ib=U.indexOf(t.to),lo=Math.min(ia,ib),hi=Math.max(ia,ib),h='<div class="ladder">';
 U.forEach(function(x,i){h+='<div class="lu '+(x===t.from?'from ':'')+(x===t.to?'to ':'')+(i>lo&&i<hi?'mid ':'')+(isOn(t.kind,x)?'':'off')+'">'+x.s+'</div>';
  if(i<U.length-1){var d=U[i+1].x-x.x,p=i>=lo&&i<hi;h+='<div class="lc '+(p?'path':'')+'"><span>'+(d?'÷ '+p10(d)+' →':'=')+'</span><span>'+(d?'← × '+p10(d):'=')+'</span></div>'}});
 return h+'</div>'}
function stepsHTML(t){var s=shiftOf(t),a=Math.abs(s),ans=mk(t.dec.d,t.dec.e+s),h='<div class="steps">',f=t.from,to=t.to;
 if(s>0)h+='<p><b>1.</b> '+to.n+' are <b>smaller</b> than '+f.n+', so there are <b>more</b> of them: <b>multiply</b>.</p>';
 else if(s<0)h+='<p><b>1.</b> '+to.n+' are <b>bigger</b> than '+f.n+', so there are <b>fewer</b> of them: <b>divide</b>.</p>';
 else h+='<p><b>1.</b> '+f.s+' and '+to.s+' are the same size, so the number does not change.</p>';
 if(s!==0){var big=s>0?f:to,sm=s>0?to:f;h+='<p><b>2.</b> 1 '+big.s+' = '+p10(a)+' '+sm.s;
  if(!f.cap&&!to.cap&&(t.kind==='area'||t.kind==='volume')){var k=t.kind==='area'?2:3,ls=a/k,ps=p10(ls),pr=[];for(var i=0;i<k;i++)pr.push(ps);h+='<br><span class="note">because 1 '+big.lk+' = '+ps+' '+sm.lk+', so 1 '+big.s+' = '+pr.join(' × ')+' = '+p10(a)+' '+sm.s+'</span>'}
  h+='</p><p><b>3.</b> '+fmtDec(t.dec)+' '+(s>0?'×':'÷')+' '+p10(a)+' = <b>'+fmtDec(ans)+'</b></p>'}
 if(t.kind==='volume')h+='<p class="note">Remember: 1 ml = 1 cm³, 1 l = 1000 ml = 1000 cm³, 1 m³ = 1000 l.</p>';
 return h+'</div>'}
function diagramHTML(t){var f=t.from,to=t.to;if(!(t.kind==='area'||t.kind==='volume')||f.cap||to.cap||f.x===to.x)return '';
 var s=shiftOf(t),k=t.kind==='area'?2:3,lf=Math.abs(s)/k,big=s>0?f:to,sm=s>0?to:f,n=Math.min(lf,k===2?10:5),svg='<svg viewBox="0 0 360 250" width="100%" style="max-width:420px">';
 function face(o,U,V,col){var p=[o,[o[0]+U[0],o[1]+U[1]],[o[0]+U[0]+V[0],o[1]+U[1]+V[1]],[o[0]+V[0],o[1]+V[1]]],r='<polygon points="'+p.map(function(z){return z.join(',')}).join(' ')+'" fill="'+col+'" stroke="#1c6fb8" stroke-width="2"/>';
  for(var i=1;i<n;i++){var a=i/n;r+='<line x1="'+(o[0]+U[0]*a)+'" y1="'+(o[1]+U[1]*a)+'" x2="'+(o[0]+U[0]*a+V[0])+'" y2="'+(o[1]+U[1]*a+V[1])+'" stroke="#1c6fb8" stroke-width="1"/><line x1="'+(o[0]+V[0]*a)+'" y1="'+(o[1]+V[1]*a)+'" x2="'+(o[0]+V[0]*a+U[0])+'" y2="'+(o[1]+V[1]*a+U[1])+'" stroke="#1c6fb8" stroke-width="1"/>'}return r}
 var side=p10(lf).replace(/<\/?sup>/g,'');
 if(k===2){svg+=face([80,20],[200,0],[0,200],'#e6f1fb')+'<text x="180" y="12" text-anchor="middle" font-size="15">1 '+big.lk+' = '+side+' '+sm.lk+'</text><text x="180" y="240" text-anchor="middle" font-size="15">'+side+' × '+side+' squares of 1 '+sm.s+'</text>'}
 else{svg+=face([40,80],[150,0],[0,150],'#e6f1fb')+face([40,80],[150,0],[70,-60],'#fff0e0')+face([190,80],[70,-60],[0,150],'#d8e9f7')+'<text x="115" y="248" text-anchor="middle" font-size="15">1 '+big.lk+' = '+side+' '+sm.lk+'</text><text x="300" y="200" font-size="14" text-anchor="middle">'+side+' × '+side+' × '+side+'</text><text x="300" y="218" font-size="14" text-anchor="middle">cubes of 1 '+sm.s+'</text>'}
 if(lf>n)svg+='<text x="180" y="'+(k===2?248:12)+'" text-anchor="end" font-size="11" fill="#888" x2="0"></text>';
 return '<div class="card" style="text-align:center">'+svg+'</svg>'+(lf>n?'<div class="note">(not every square is drawn)</div>':'')+'</div>'}
function teachHTML(){
 var t=S.t;if(!t)return noUnits();
 var kinds=kindsFor(cfg.level),h='<div class="card"><div class="chips">';
 if(kinds.length>1||cfg.level<5)FAMKEYS.concat([]).forEach(function(){});
 kinds.forEach(function(k){h+='<button class="chip '+(k===t.kind?'on':'')+'" data-act="tkind" data-k="'+k+'">'+KN[k]+'</button>'});
 h+='<button class="btn org" data-act="tnew">New example</button></div>';
 h+='<div class="ctxline">'+(cfg.ctx&&t.ctxT?ctxText(t):'')+'</div>';
 h+='<div class="row"><input id="tval" value="'+fmtDec(t.dec,true)+'"><span>from</span><span class="chips">';
 UNITS[t.kind].forEach(function(x,i){h+='<button class="chip '+(x===t.from?'on':'')+'" data-act="tfrom" data-i="'+i+'">'+x.s+'</button>'});
 h+='</span><span>to</span><span class="chips">';
 UNITS[t.kind].forEach(function(x,i){h+='<button class="chip o2 '+(x===t.to?'on':'')+'" data-act="tto" data-i="'+i+'">'+x.s+'</button>'});
 h+='</span></div>'+(t.err?'<div style="color:var(--bad)">'+t.err+'</div>':'');
 var ans=mk(t.dec.d,t.dec.e+shiftOf(t));
 h+='<div class="eqbig"><span class="f">'+fmtDec(t.dec)+' '+t.from.s+'</span> = <span class="t">'+fmtDec(ans)+' '+t.to.s+'</span></div></div>';
 h+='<div class="card"><b>The unit ladder</b>'+ladderHTML(t)+'</div><div class="card">'+stepsHTML(t);
 if(shiftOf(t)!==0)h+='<div class="row"><button class="btn pri" data-act="tslide" id="sbtn">▶ Slide the digits</button><b id="scap"></b></div><div id="slide"></div>';
 h+='</div>'+diagramHTML(t);return h}
function buildSlide(){
 var el=$('#slide'),t=S.t;if(!el||!t)return;
 var s=shiftOf(t),n=t.dec.d.length,lowB=t.dec.e,highB=lowB+n-1,lowA=lowB+s,highA=highB+s,cMax=Math.max(highB,highA,0),cMin=Math.min(lowB,lowA,0),nc=cMax-cMin+1;
 var W=Math.max(16,Math.min(46,Math.floor(((el.clientWidth||600)-10)/(nc+.4)))),Wp=Math.round(W*.4),hh=W>=28?Math.round(W*.6):0;
 function X(q){return(cMax-q)*W+(q<0?Wp:0)}
 var h='',q;el.style.height=(W*1.2+hh+4)+'px';
 for(q=cMin;q<=cMax;q++){h+='<div class="colbg" style="left:'+X(q)+'px;top:'+hh+'px;width:'+W+'px;height:'+W*1.2+'px"></div>';
  if(hh&&q>=-4&&q<=5)h+='<div class="hd" style="left:'+X(q)+'px;width:'+W+'px;font-size:'+Math.round(W*.3)+'px;top:0">'+(q>=0?(q===0?'1':'10'+(q>1?'<sup>'+q+'</sup>':'')):'0.'+new Array(-q).join('0')+'1')+'</div>'}
 h+='<div class="pt" style="left:'+((cMax+1)*W)+'px;width:'+Wp+'px;top:'+hh+'px;font-size:'+W+'px;line-height:'+W*1.2+'px">.</div>';
 function tile(cls,x,txt,op){return '<div class="tile '+cls+'" style="left:'+x+'px;top:'+hh+'px;width:'+W+'px;height:'+W*1.2+'px;line-height:'+W*1.2+'px;font-size:'+W*.8+'px;'+(op===undefined?'':'opacity:'+op)+'">'+txt+'</div>'}
 var i;for(i=0;i<n;i++)h+=tile('dg" data-p="'+(lowB+n-1-i),X(lowB+n-1-i),t.dec.d.charAt(i));
 for(q=Math.min(lowB,0);q<=Math.max(highB,0);q++)if(q<lowB||q>highB)h+=tile('pad b',X(q),'0',1);
 for(q=Math.min(lowA,0);q<=Math.max(highA,0);q++)if(q<lowA||q>highA)h+=tile('pad a',X(q),'0',0);
 el.innerHTML=h;el.dataset.cm=cMax;el.dataset.w=W;el.dataset.wp=Wp;S.slid=false;slideTo(false)}
function slideTo(go){
 var el=$('#slide'),t=S.t;if(!el||!t)return;var s=shiftOf(t),cMax=+el.dataset.cm,W=+el.dataset.w,Wp=+el.dataset.wp;
 function X(q){return(cMax-q)*W+(q<0?Wp:0)}
 [].forEach.call(el.querySelectorAll('.dg'),function(d){var p=+d.dataset.p;d.style.left=X(go?p+s:p)+'px'});
 [].forEach.call(el.querySelectorAll('.pad.b'),function(d){d.style.opacity=go?0:1});
 [].forEach.call(el.querySelectorAll('.pad.a'),function(d){d.style.opacity=go?1:0});
 var cap=$('#scap'),b=$('#sbtn'),ans=mk(t.dec.d,t.dec.e+s);
 if(cap)cap.textContent=go?fmtDec(ans)+' '+t.to.s:fmtDec(t.dec)+' '+t.from.s;
 if(b)b.textContent=go?'↺ Back':'▶ Slide the digits';S.slid=go}

function render(){
 var m=$('#modes');m.innerHTML=[['teach','Teach it'],['practise','Practise it'],['settings','⚙ Settings']].map(function(x){return '<button class="'+(S.mode===x[0]?'on':'')+'" data-act="mode" data-v="'+x[0]+'">'+x[1]+'</button>'}).join(' ');
 var lv=$('#levels'),lh='';for(var i=1;i<=6;i++)lh+='<button class="'+(cfg.level===i?'on':'')+'" data-act="level" data-v="'+i+'">'+LV[i].n+'</button>';
 lv.innerHTML=lh;lv.style.display=S.mode==='settings'?'none':'flex';$('#ldesc').textContent=S.mode==='settings'?'':LV[cfg.level].d;
 var v=$('#view');
 if(S.mode==='teach'){if(!S.t)newTeach();v.innerHTML=teachHTML();if($('#slide'))buildSlide()}
 else if(S.mode==='practise'){if(!S.qs.length)newSet();v.innerHTML=practiseHTML()}
 else{v.innerHTML=settingsHTML();$('#fmt').value=cfg.fmt}
}
function checkAnswers(){S.res=S.qs.map(function(q,i){var p=parseDec(S.typed[i]||'');return !!p&&p.d===q.ans.d&&p.e===q.ans.e})}
function fixAfterCfg(){S.qs=[];S.t=null;save()}
document.addEventListener('click',function(e){
 var a=e.target.closest('[data-act]');if(!a)return;var act=a.dataset.act;
 if(act==='mode'){S.mode=a.dataset.v}
 else if(act==='level'){cfg.level=+a.dataset.v;S.qs=[];S.t=null;save()}
 else if(act==='fam'){cfg.fam[a.dataset.k]=cfg.fam[a.dataset.k]?0:1;fixAfterCfg()}
 else if(act==='unit'){var o=cfg.units[a.dataset.k];o[a.dataset.s]=o[a.dataset.s]?0:1;fixAfterCfg()}
 else if(act==='opt'){cfg[a.dataset.k]=!cfg[a.dataset.k];fixAfterCfg()}
 else if(act==='reset'){var l=cfg.level;cfg.fam={length:1,mass:1,capacity:1,data:1,power:1,energy:0,freq:0};cfg.units=defUnits();cfg.ctx=true;cfg.fmt='space';cfg.type=false;cfg.cap=true;fixAfterCfg()}
 else if(act==='pnew'){newSet()}
 else if(act==='qshow'){if(e.target.tagName==='INPUT')return;if(cfg.type&&!S.res)return;var i=a.dataset.i;S.rev[i]=!S.rev[i]}
 else if(act==='pall'){if(S.res||Object.keys(S.rev).length===S.qs.length){S.rev={};if(S.res){S.res=null;S.typed={}}}else{S.qs.forEach(function(q,i){S.rev[i]=1});if(cfg.type)checkAnswers()}}
 else if(act==='pcheck'){checkAnswers()}
 else if(act==='tnew'){newTeach(S.t&&S.t.kind)}
 else if(act==='tkind'){newTeach(a.dataset.k)}
 else if(act==='tfrom'||act==='tto'){var t=S.t;t[act==='tfrom'?'from':'to']=UNITS[t.kind][+a.dataset.i];t.ctxT=null;S.slid=false}
 else if(act==='tslide'){slideTo(!S.slid);return}
 render()});
document.addEventListener('input',function(e){if(e.target.classList.contains('ans'))S.typed[e.target.dataset.i]=e.target.value});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('ans')){checkAnswers();render()}});
document.addEventListener('change',function(e){
 if(e.target.id==='fmt'){cfg.fmt=e.target.value;save();render()}
 else if(e.target.id==='tval'){var p=parseDec(e.target.value),t=S.t;
  if(!p||p.d==='0'||p.d.length>9){t.err='Please enter a positive number.'}else{t.err='';t.dec=p;t.ctxT=null}S.slid=false;render()}});
window.addEventListener('resize',function(){if(S.mode==='teach'&&$('#slide'))buildSlide()});
window.__mu={genOne:genOne,cfg:cfg,LV:LV,UNITS:UNITS,num:num,dp:dp,fmtDec:fmtDec,S:S,render:render,mk:mk};
render();
})();
