<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tracey – LoadsOfMaths</title>
<style>
:root{
  --orange:#f7941d; --blue:#1f6fd0; --navy:#1f4fa8; --grey:#6b7280; --green:#2e9d4f;
  --cream:#fff8ec; --line:#e5dcc8; --red:#d6322e;
  --font:"Super Bouncer","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --hand:"Anak Orang","Segoe Print","Chalkboard SE","Comic Sans MS",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:#222;font-family:var(--font);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:8px 12px 10px;gap:8px;
  padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:.95rem;color:var(--grey);letter-spacing:.2px;white-space:nowrap}
.logo .o{color:var(--orange)} .logo .b{color:var(--blue)}
h1{margin:0;font-size:1.9rem;color:var(--navy);line-height:1}
h1 span{color:var(--orange)}
nav{display:flex;gap:6px;margin-left:auto}
nav button{font:inherit;font-size:1.05rem;border:2px solid var(--line);background:#fff;color:var(--navy);
  padding:.45em 1em;border-radius:999px;cursor:pointer;min-height:44px}
nav button.on{background:var(--orange);border-color:var(--orange);color:#fff}
#opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:1rem;color:#444}
#opts .grp{display:flex;align-items:center;gap:6px}
#opts label.t{color:var(--grey);font-size:.9rem}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{font:inherit;border:0;background:#fff;color:var(--navy);padding:.35em .85em;min-height:40px;min-width:40px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
select{font:inherit;font-size:1rem;padding:.35em .6em;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--navy);min-height:40px;max-width:60vw}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
#stage{position:relative;flex:1;min-height:140px;background:#fff;border:3px solid var(--line);border-radius:18px;overflow:hidden;
  background-image:linear-gradient(#f3efe3 1px,transparent 1px);background-size:100% 44px}
#cv{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair}
#hint{position:absolute;left:0;right:0;top:10px;text-align:center;font-family:var(--hand);font-size:1.3rem;color:var(--grey);pointer-events:none}
#bar{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
#result{flex:1;min-width:260px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 14px;height:104px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:1px}
#result .row{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;font-size:1.05rem;color:#444}
#result b{color:var(--navy);font-size:1.35rem}
#result .big{color:var(--orange);font-size:2rem}
#result .note{font-family:var(--hand);font-size:1.15rem;line-height:1.2;color:#333}
#result .meta{font-size:.85rem;color:var(--grey)}
#btns{display:flex;gap:8px;align-items:stretch}
.btn{font:inherit;font-size:1.1rem;border:0;border-radius:14px;padding:.6em 1.2em;min-height:52px;min-width:96px;
  background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.go{background:var(--orange)} .btn.alt{background:#8b93a1}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn[hidden]{display:none}
@media (max-height:640px){h1{font-size:1.5rem}#app{gap:5px;padding-top:4px}.btn{min-height:46px}#result{height:92px;padding:3px 12px}}
@media (max-width:640px){nav{margin-left:0;width:100%}nav button{flex:1;padding:.45em .3em}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">www.<span class="o">loads</span>of<span class="b">maths</span>.co.uk</div>
    <h1>Trac<span>e</span>y</h1>
    <nav id="tabs">
      <button data-tab="num" class="on">Numbers</button>
      <button data-tab="shape">Shapes</button>
      <button data-tab="circle">Circle Maker</button>
    </nav>
  </header>
  <section id="opts"></section>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
  </main>
  <footer id="bar">
    <div id="result"></div>
    <div id="btns">
      <button class="btn alt" id="bClear">Start again</button>
      <button class="btn go" id="bDone">Done ✓</button>
      <button class="btn" id="bNext">Next →</button>
    </div>
  </footer>
</div>

<script>
(function(){
'use strict';

/* ================= TWEAKABLE CONSTANTS ================= */
var G = 2;                 // scoring grid cell size in CSS px
var PACE = 0.25;           // "par" tracing pace, in screen-minimum-dimensions per second
var STRICT = {gentle:1.4, standard:1.0, tricky:0.7};   // tolerance multipliers
var CIRCLE_SHARPNESS = 0.12;   // lower = harsher roundness marking

/* ================= HELPERS ================= */
var $ = function(s){return document.querySelector(s);};
var cv = $('#cv'), ctx = cv.getContext('2d');
var stageEl = $('#stage'), optsEl = $('#opts'), resEl = $('#result'), hintEl = $('#hint');
var bClear = $('#bClear'), bDone = $('#bDone'), bNext = $('#bNext');
var W = 600, H = 400, dpr = 1;

var S = {
  tab:'num', digits:2, font:'__guide', strict:'standard', speed:true, shape:'random', showFit:true,
  numStr:'', curShape:null, target:null, strokes:[], cur:null, state:'idle', t0:0, result:null,
  hist:{num:[],shape:[],circle:[]}
};
try{
  var saved = JSON.parse(localStorage.getItem('tracey.settings')||'{}');
  ['digits','font','strict','speed','shape','showFit'].forEach(function(k){ if(saved[k]!==undefined) S[k]=saved[k]; });
}catch(e){}
function saveSettings(){
  try{ localStorage.setItem('tracey.settings', JSON.stringify({digits:S.digits,font:S.font,strict:S.strict,speed:S.speed,shape:S.shape,showFit:S.showFit})); }catch(e){}
}
function rnd(n){ return Math.floor(Math.random()*n); }
function dist2(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

/* ================= FONTS ================= */
var FONT_CANDIDATES = [
  ['Arial','Arial'],['Verdana','Verdana'],['Trebuchet MS','Trebuchet MS'],['Tahoma','Tahoma'],['Century Gothic','Century Gothic'],
  ['Calibri','Calibri'],['Helvetica Neue','Helvetica Neue'],['Futura','Futura'],['Georgia','Georgia'],['Times New Roman','Times New Roman'],
  ['Courier New','Courier New'],['Comic Sans MS','Comic Sans MS'],['Chalkboard SE','Chalkboard SE'],['Marker Felt','Marker Felt'],
  ['Noteworthy','Noteworthy'],['Segoe Print','Segoe Print'],['Ink Free','Ink Free'],['Arial Rounded MT Bold','Arial Rounded MT Bold'],
  ['Sassoon Primary','Sassoon Primary'],['Sassoon Infant','Sassoon Infant'],['Andika','Andika'],['Lexend','Lexend'],
  ['Comic Neue','Comic Neue'],['OpenDyslexic','OpenDyslexic']
];
function hasFont(name){
  var t='mmmmmmmmmmlli0123456789', c=document.createElement('canvas').getContext('2d');
  function w(f){ c.font='72px '+f; return c.measureText(t).width; }
  return ['monospace','serif','sans-serif'].some(function(b){ return w('"'+name+'",'+b)!==w(b); });
}
var FONTS = [{id:'__guide',label:'Guide (single stroke, start dots)',css:''}];
FONT_CANDIDATES.forEach(function(f){ if(hasFont(f[1])) FONTS.push({id:f[0],label:f[0],css:'"'+f[1]+'",sans-serif'}); });
FONTS.push({id:'__sans',label:'Plain sans-serif',css:'sans-serif'});
FONTS.push({id:'__serif',label:'Plain serif',css:'serif'});
function fontById(id){ for(var i=0;i<FONTS.length;i++) if(FONTS[i].id===id) return FONTS[i]; return FONTS[0]; }
if(!fontById(S.font) || fontById(S.font).id!==S.font) S.font='__guide';

/* ================= SINGLE-STROKE DIGIT GUIDES (60 x 100 box) ================= */
var GP = {
  '0':['M30,4 C10,4 6,28 6,50 C6,72 10,96 30,96 C50,96 54,72 54,50 C54,28 50,4 30,4'],
  '1':['M14,28 L34,6 L34,94'],
  '2':['M8,30 C8,-2 52,-2 52,30 C52,52 20,72 8,94 L54,94'],
  '3':['M8,14 C20,2 50,4 50,26 C50,44 34,48 22,48 C36,48 54,54 54,72 C54,96 18,100 6,84'],
  '4':['M42,6 L6,66 L56,66','M42,6 L42,94'],
  '5':['M14,6 L10,46 C20,38 54,36 54,66 C54,96 20,100 6,84','M14,6 L52,6'],
  '6':['M46,8 C20,16 8,40 8,68 C8,100 52,100 52,68 C52,44 14,44 8,68'],
  '7':['M6,6 L54,6 L22,94'],
  '8':['M30,48 C6,40 8,6 30,6 C52,6 54,40 30,48 C4,56 4,94 30,94 C56,94 56,56 30,48'],
  '9':['M52,32 C46,56 8,56 8,32 C8,0 52,0 52,32 C52,60 40,84 14,92']
};
function parsePath(d){
  var out=[],cx=0,cy=0,re=/([MLC])([^MLC]*)/g,m;
  while((m=re.exec(d))){
    var n=m[2].trim().split(/[\s,]+/).map(Number);
    if(m[1]==='M'){cx=n[0];cy=n[1];out.push([cx,cy]);}
    else if(m[1]==='L'){cx=n[0];cy=n[1];out.push([cx,cy]);}
    else{
      for(var i=0;i<n.length;i+=6){
        for(var s=1;s<=20;s++){
          var t=s/20,u=1-t;
          var x=u*u*u*cx+3*u*u*t*n[i]+3*u*t*t*n[i+2]+t*t*t*n[i+4];
          var y=u*u*u*cy+3*u*u*t*n[i+1]+3*u*t*t*n[i+3]+t*t*t*n[i+5];
          out.push([x,y]);
        }
        cx=n[i+4];cy=n[i+5];
      }
    }
  }
  return out;
}
var GS = {};
Object.keys(GP).forEach(function(k){ GS[k]=GP[k].map(parsePath); });

/* ================= SHAPES ================= */
function regular(n,rot){ var p=[]; for(var i=0;i<n;i++){var a=(rot+360*i/n)*Math.PI/180; p.push([Math.cos(a),Math.sin(a)]);} return p; }
function star(n,r){ var p=[]; for(var i=0;i<2*n;i++){var a=(-90+i*180/n)*Math.PI/180, rad=(i%2)?r:1; p.push([rad*Math.cos(a),rad*Math.sin(a)]);} return p; }
var SHAPES = [
  {id:'tri',name:'Triangle',pts:regular(3,-90)},
  {id:'rtri',name:'Right-angled triangle',pts:[[-.8,.8],[.8,.8],[-.8,-.8]]},
  {id:'sq',name:'Square',pts:[[-.8,-.8],[.8,-.8],[.8,.8],[-.8,.8]]},
  {id:'rect',name:'Rectangle',pts:[[-1,-.6],[1,-.6],[1,.6],[-1,.6]]},
  {id:'para',name:'Parallelogram',pts:[[-.6,-.6],[1,-.6],[.6,.6],[-1,.6]]},
  {id:'trap',name:'Trapezium',pts:[[-.5,-.6],[.5,-.6],[1,.6],[-1,.6]]},
  {id:'kite',name:'Kite',pts:[[0,-1],[.6,-.2],[0,.9],[-.6,-.2]]},
  {id:'rhomb',name:'Rhombus',pts:[[0,-1],[.7,0],[0,1],[-.7,0]]},
  {id:'pent',name:'Pentagon',pts:regular(5,-90)},
  {id:'hex',name:'Hexagon',pts:regular(6,0)},
  {id:'oct',name:'Octagon',pts:regular(8,-22.5)},
  {id:'arrowhead',name:'Arrowhead',pts:[[0,-1],[.8,.8],[0,.4],[-.8,.8]]},
  {id:'arrow',name:'Arrow',pts:[[-1,-.25],[.2,-.25],[.2,-.7],[1,0],[.2,.7],[.2,.25],[-1,.25]]},
  {id:'ell',name:'L-shape',pts:[[-.7,-.9],[-.1,-.9],[-.1,.3],[.7,.3],[.7,.9],[-.7,.9]]},
  {id:'cross',name:'Cross',pts:[[-.3,-.9],[.3,-.9],[.3,-.3],[.9,-.3],[.9,.3],[.3,.3],[.3,.9],[-.3,.9],[-.3,.3],[-.9,.3],[-.9,-.3],[-.3,-.3]]},
  {id:'st4',name:'4-point star',pts:star(4,.4)},
  {id:'st5',name:'5-point star',pts:star(5,.42)},
  {id:'st6',name:'6-point star',pts:star(6,.55)},
  {id:'st8',name:'8-point star',pts:star(8,.65)}
];
function shapeById(id){ for(var i=0;i<SHAPES.length;i++) if(SHAPES[i].id===id) return SHAPES[i]; return null; }
if(S.shape!=='random' && !shapeById(S.shape)) S.shape='random';

/* ================= TARGETS ================= */
var BLUE_FILL='rgba(31,111,208,.14)', BLUE_DASH='rgba(31,79,168,.65)';

function polyPath(x,pts,close){
  x.beginPath(); x.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++) x.lineTo(pts[i].x,pts[i].y);
  if(close) x.closePath();
}
function trackTarget(paths, closed, lw, dots){
  return {
    drawMask:function(x){
      x.strokeStyle='#000'; x.lineWidth=lw; x.lineCap='round'; x.lineJoin='round';
      paths.forEach(function(p){ polyPath(x,p,closed); x.stroke(); });
    },
    drawGuide:function(x){
      x.lineCap='round'; x.lineJoin='round';
      x.strokeStyle=BLUE_FILL; x.lineWidth=lw;
      paths.forEach(function(p){ polyPath(x,p,closed); x.stroke(); });
      x.strokeStyle=BLUE_DASH; x.lineWidth=3; x.setLineDash([9,9]); x.lineCap='butt';
      paths.forEach(function(p){ polyPath(x,p,closed); x.stroke(); });
      x.setLineDash([]);
      if(dots){
        paths.forEach(function(p){
          x.beginPath(); x.arc(p[0].x,p[0].y,Math.max(8,lw*.28),0,Math.PI*2);
          x.fillStyle='#2e9d4f'; x.fill(); x.lineWidth=3; x.strokeStyle='#fff'; x.stroke();
        });
      }
    }
  };
}
function guideTarget(str){
  var n=str.length, adv=84, totalW=(n-1)*adv+60;
  var s=Math.min(W*0.84/totalW, H*0.66/100);
  var ox=W/2-totalW*s/2, oy=H/2-50*s;
  var lw=Math.max(26,Math.min(62,14*s));
  var paths=[];
  for(var i=0;i<n;i++){
    GS[str[i]].forEach(function(st){
      paths.push(st.map(function(p){ return {x:ox+(i*adv+p[0])*s, y:oy+p[1]*s}; }));
    });
  }
  return trackTarget(paths,false,lw,true);
}
function setLS(x,px){ if('letterSpacing' in x) x.letterSpacing=px+'px'; }
function fontTarget(str,fam){
  var c=document.createElement('canvas').getContext('2d'), base=200, LS=0.07;
  c.font='bold '+base+'px '+fam; setLS(c,base*LS);
  var m=c.measureText(str);
  var asc=m.actualBoundingBoxAscent, desc=m.actualBoundingBoxDescent, bl=m.actualBoundingBoxLeft, br=m.actualBoundingBoxRight;
  var bw=bl+br, bh=asc+desc;
  var k=Math.min(W*0.86/bw, H*0.72/bh), size=base*k;
  var x0=W/2-bw*k/2+bl*k, y0=H/2+(asc-desc)/2*k;
  function setup(x){ x.font='bold '+size+'px '+fam; setLS(x,size*LS); x.textAlign='left'; x.textBaseline='alphabetic'; }
  return {
    drawMask:function(x){ setup(x); x.fillStyle='#000'; x.fillText(str,x0,y0); },
    drawGuide:function(x){
      setup(x); x.fillStyle=BLUE_FILL; x.fillText(str,x0,y0);
      x.lineWidth=2.5; x.strokeStyle=BLUE_DASH; x.setLineDash([9,8]); x.lineJoin='round'; x.strokeText(str,x0,y0); x.setLineDash([]);
    }
  };
}
function numberTarget(str){
  var f=fontById(S.font);
  return f.id==='__guide' ? guideTarget(str) : fontTarget(str,f.css);
}
function shapeTarget(def){
  var P=def.pts, minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  P.forEach(function(p){ minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]); });
  var bw=maxx-minx, bh=maxy-miny, k=Math.min(W*0.76/bw, H*0.72/bh);
  var cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  var pts=P.map(function(p){ return {x:W/2+(p[0]-cx)*k, y:H/2+(p[1]-cy)*k}; });
  var lw=Math.max(26,Math.min(46,Math.min(W,H)*0.075));
  return trackTarget([pts],true,lw,true);
}
function randNum(n){
  var s, tries=0;
  do{
    s='';
    for(var i=0;i<n;i++) s+= (i===0 && n>1) ? (1+rnd(9)) : rnd(10);
    tries++;
  }while(s===S.numStr && tries<20);
  return s;
}
function pickShape(){
  if(S.shape!=='random') return shapeById(S.shape);
  var d, tries=0;
  do{ d=SHAPES[rnd(SHAPES.length)]; tries++; }while(S.curShape && d.id===S.curShape.id && tries<20);
  return d;
}

/* ================= GRID / DISTANCE MATHS ================= */
function gridDims(){ return {w:Math.ceil(W/G), h:Math.ceil(H/G)}; }
function maskFrom(drawFn,gw,gh){
  var c=document.createElement('canvas'); c.width=gw; c.height=gh;
  var x=c.getContext('2d',{willReadFrequently:true});
  x.scale(1/G,1/G); drawFn(x);
  var d=x.getImageData(0,0,gw,gh).data, m=new Uint8Array(gw*gh);
  for(var i=0;i<m.length;i++) m[i]=d[i*4+3]>100?1:0;
  return m;
}
function dist(m,want,w,h){
  var INF=1e9, d=new Float32Array(w*h), a=1, b=1.4142, i,x,y,v;
  for(i=0;i<d.length;i++) d[i]=(m[i]===want)?0:INF;
  for(y=0;y<h;y++) for(x=0;x<w;x++){
    i=y*w+x; v=d[i]; if(v===0) continue;
    if(x>0) v=Math.min(v,d[i-1]+a);
    if(y>0){ v=Math.min(v,d[i-w]+a); if(x>0) v=Math.min(v,d[i-w-1]+b); if(x<w-1) v=Math.min(v,d[i-w+1]+b); }
    d[i]=v;
  }
  for(y=h-1;y>=0;y--) for(x=w-1;x>=0;x--){
    i=y*w+x; v=d[i]; if(v===0) continue;
    if(x<w-1) v=Math.min(v,d[i+1]+a);
    if(y<h-1){ v=Math.min(v,d[i+w]+a); if(x<w-1) v=Math.min(v,d[i+w+1]+b); if(x>0) v=Math.min(v,d[i+w-1]+b); }
    d[i]=v;
  }
  return d;
}
function resample(pts,step){
  if(pts.length<2) return pts.slice();
  var out=[pts[0]], acc=0, prev=pts[0];
  for(var i=1;i<pts.length;i++){
    var p=pts[i], seg=dist2(prev,p);
    while(acc+seg>=step){
      var t=(step-acc)/seg;
      prev={x:prev.x+(p.x-prev.x)*t, y:prev.y+(p.y-prev.y)*t};
      out.push(prev); seg=dist2(prev,p); acc=0;
    }
    acc+=seg; prev=p;
  }
  return out;
}
function inkLength(){
  var L=0;
  S.strokes.forEach(function(s){ for(var i=1;i<s.length;i++) L+=dist2(s[i-1],s[i]); });
  return L;
}

/* ================= SCORING: NUMBERS & SHAPES ================= */
function scoreTrace(){
  var d=gridDims(), gw=d.w, gh=d.h;
  var gm=maskFrom(S.target.drawMask,gw,gh);
  var area=0, i;
  for(i=0;i<gm.length;i++) area+=gm[i];
  if(area<20) return null;
  var dIn=dist(gm,0,gw,gh), dOut=dist(gm,1,gw,gh);
  var samp=[]; for(i=0;i<gm.length;i+=5) if(gm[i]) samp.push(dIn[i]);
  samp.sort(function(a,b){return a-b;});
  var h=Math.max(2,samp[Math.floor(samp.length*0.92)]||2);

  var im=maskFrom(function(x){
    x.fillStyle='#000'; x.strokeStyle='#000'; x.lineWidth=6; x.lineCap='round'; x.lineJoin='round';
    S.strokes.forEach(function(s){
      if(s.length<2){ x.beginPath(); x.arc(s[0].x,s[0].y,3,0,7); x.fill(); return; }
      polyPath(x,s,false); x.stroke();
    });
  },gw,gh);
  var dInk=dist(im,1,gw,gh);

  var mult=STRICT[S.strict]||1, tol=mult*h+2, tolOut=0.5*tol+1;
  var core=0, covered=0, inkN=0, inkGood=0;
  var fb=document.createElement('canvas'); fb.width=gw; fb.height=gh;
  var fx=fb.getContext('2d'), img=fx.createImageData(gw,gh);
  for(i=0;i<gm.length;i++){
    if(gm[i] && dIn[i]>=0.5*h){
      core++;
      if(dInk[i]<=tol) covered++;
      else{ var q=i*4; img.data[q]=255; img.data[q+1]=140; img.data[q+2]=0; img.data[q+3]=190; }
    }
    if(im[i]){ inkN++; if(dOut[i]<=tolOut) inkGood++; }
  }
  fx.putImageData(img,0,0);
  var C=core?covered/core:0, P=inkN?inkGood/inkN:0;
  var accFrac=Math.max(0,Math.min(1,(C*P)/0.9));
  var acc=Math.round(50*accFrac);

  var bad=[];
  S.strokes.forEach(function(s){
    resample(s,4).forEach(function(p){
      var gx=Math.max(0,Math.min(gw-1,Math.floor(p.x/G))), gy=Math.max(0,Math.min(gh-1,Math.floor(p.y/G)));
      if(dOut[gy*gw+gx]>tolOut) bad.push(p);
    });
  });

  var elapsed=(performance.now()-S.t0)/1000;
  var lenPx=area/(2*h)*G, minDim=Math.min(W,H);
  var par=1.5+lenPx/(PACE*minDim);
  var sp= elapsed<=par ? 1 : Math.max(0,1-(elapsed-par)/(2.5*par));
  var spd= S.speed ? Math.round(50*sp*accFrac*accFrac) : 0;
  return {acc:acc,spd:spd,total:acc+spd,max:S.speed?100:50,elapsed:elapsed,par:par,C:C,P:P,accFrac:accFrac,sp:sp,fb:fb,bad:bad,gw:gw,gh:gh};
}
function traceComment(r){
  var msg;
  if(r.acc>=45 && S.speed && r.spd>=40) msg='Brilliant – neat and speedy!';
  else if(r.acc>=45) msg= S.speed ? 'Lovely neat tracing. Now try going a little faster.' : 'Lovely neat tracing!';
  else if(r.acc>=35) msg='Good work – just a few wobbles. Stay inside the grey.';
  else if(r.acc>=20) msg='Getting there – slow down and follow the dashed line.';
  else msg='Have another go – follow the dashed line carefully, all the way.';
  var extra=[];
  if(r.C<0.75) extra.push('Orange shows parts you missed.');
  if(r.P<0.85) extra.push('Red shows where you strayed off the track.');
  return msg+(extra.length?' '+extra.join(' '):'');
}

/* ================= SCORING: CIRCLE ================= */
function fitCircle(p){
  var n=p.length, mx=0, my=0, i;
  p.forEach(function(q){mx+=q.x;my+=q.y;}); mx/=n; my/=n;
  var Suu=0,Svv=0,Suv=0,Suuu=0,Svvv=0,Suvv=0,Svuu=0;
  p.forEach(function(q){
    var u=q.x-mx, v=q.y-my;
    Suu+=u*u; Svv+=v*v; Suv+=u*v; Suuu+=u*u*u; Svvv+=v*v*v; Suvv+=u*v*v; Svuu+=v*u*u;
  });
  var det=Suu*Svv-Suv*Suv; if(Math.abs(det)<1e-9) return null;
  var r1=0.5*(Suuu+Suvv), r2=0.5*(Svvv+Svuu);
  var uc=(r1*Svv-r2*Suv)/det, vc=(Suu*r2-Suv*r1)/det;
  var R=Math.sqrt(uc*uc+vc*vc+(Suu+Svv)/n);
  return {cx:uc+mx, cy:vc+my, R:R};
}
function scoreCircle(){
  var raw=S.strokes[0], pts=resample(raw,3);
  if(pts.length<25) return {tooShort:true};
  var f=fitCircle(pts); if(!f) return {tooShort:true};
  var minDim=Math.min(W,H);
  if(f.R<minDim*0.06) return {tooSmall:true};
  var n=pts.length, ss=0, angs=[], i;
  pts.forEach(function(q){ var dd=Math.hypot(q.x-f.cx,q.y-f.cy); ss+=(dd-f.R)*(dd-f.R); angs.push(Math.atan2(q.y-f.cy,q.x-f.cx)); });
  var e=Math.sqrt(ss/n)/f.R;
  var sorted=angs.slice().sort(function(a,b){return a-b;}), maxGap=sorted[0]+2*Math.PI-sorted[n-1];
  for(i=1;i<n;i++) maxGap=Math.max(maxGap,sorted[i]-sorted[i-1]);
  var coverage=1-maxGap/(2*Math.PI);
  var turn=0;
  for(i=1;i<n;i++){ var dth=angs[i]-angs[i-1]; while(dth>Math.PI) dth-=2*Math.PI; while(dth<-Math.PI) dth+=2*Math.PI; turn+=dth; }
  var turns=Math.abs(turn)/(2*Math.PI);
  var gap=dist2(pts[0],pts[n-1])/f.R;
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  pts.forEach(function(q){minx=Math.min(minx,q.x);maxx=Math.max(maxx,q.x);miny=Math.min(miny,q.y);maxy=Math.max(maxy,q.y);});
  var ratio=(maxx-minx)/(maxy-miny);
  var base=100*Math.exp(-Math.pow(e/CIRCLE_SHARPNESS,1.2));
  var fClose= gap<=0.2?1:Math.max(0.5,1-(gap-0.2)*0.75);
  var fCov= coverage>=0.93?1:Math.pow(coverage/0.93,3);
  var fLoop= turns>1.3?Math.max(0.7,1-(turns-1.3)*0.6):1;
  var score=Math.max(0,Math.min(100,Math.round(base*fClose*fCov*fLoop)));
  var msg;
  if(coverage<0.85) msg='Go all the way round to finish the circle.';
  else if(gap>0.45) msg='Nearly there – try to finish where you started.';
  else if(score<70 && ratio>1.15) msg='A bit wide – more of an oval. Make it as tall as it is wide.';
  else if(score<70 && ratio<0.87) msg='A bit tall – more of an oval. Make it as wide as it is tall.';
  else if(score>=95) msg='Wow – practically drawn with a compass!';
  else if(score>=85) msg='Brilliant circle!';
  else if(score>=70) msg='Very good – nicely round.';
  else if(score>=50) msg='Not bad – keep the same distance from the middle all the way round.';
  else msg='Keep trying – one big smooth swing, moving your whole arm.';
  return {score:score,cx:f.cx,cy:f.cy,R:f.R,msg:msg,e:e,gap:gap,coverage:coverage};
}

/* ================= DRAWING ================= */
var dirty=false;
function redraw(){ if(dirty) return; dirty=true; requestAnimationFrame(function(){ dirty=false; draw(); }); }
function inkPath(x,s){
  if(s.length<2){ x.beginPath(); x.arc(s[0].x,s[0].y,3.5,0,7); x.fill(); return; }
  x.beginPath(); x.moveTo(s[0].x,s[0].y);
  for(var i=1;i<s.length-1;i++){
    var mx=(s[i].x+s[i+1].x)/2, my=(s[i].y+s[i+1].y)/2;
    x.quadraticCurveTo(s[i].x,s[i].y,mx,my);
  }
  x.lineTo(s[s.length-1].x,s[s.length-1].y); x.stroke();
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(S.target) S.target.drawGuide(ctx);
  var r=S.result;
  if(r && r.fb){
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(r.fb,0,0,r.gw*G,r.gh*G);
    ctx.imageSmoothingEnabled=true;
  }
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=6; ctx.strokeStyle='#1f4fa8'; ctx.fillStyle='#1f4fa8';
  S.strokes.forEach(function(s){ if(s.length) inkPath(ctx,s); });
  if(r && S.tab==='circle' && r.score!==undefined && S.showFit){
    ctx.save(); ctx.strokeStyle='#2e9d4f'; ctx.lineWidth=3; ctx.setLineDash([10,8]);
    ctx.beginPath(); ctx.arc(r.cx,r.cy,r.R,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(r.cx,r.cy,4,0,Math.PI*2); ctx.fillStyle='#2e9d4f'; ctx.fill(); ctx.restore();
  }
  if(r && r.bad){
    ctx.fillStyle='rgba(214,50,46,.9)';
    r.bad.forEach(function(p){ ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); });
  }
}

/* ================= ATTEMPTS / STATE ================= */
function newAttempt(same){
  S.strokes=[]; S.cur=null; S.state='idle'; S.result=null; S.t0=0;
  if(S.tab==='num'){
    if(!same || !S.numStr || S.numStr.length!==S.digits) S.numStr=randNum(S.digits);
    S.target=numberTarget(S.numStr);
  }else if(S.tab==='shape'){
    if(!same || !S.curShape || (S.shape!=='random' && S.curShape.id!==S.shape)) S.curShape=pickShape();
    S.target=shapeTarget(S.curShape);
  }else{
    S.target=null;
  }
  refreshUI(); redraw();
}
function refreshUI(){
  var tab=S.tab;
  hintEl.style.display = (S.state==='idle') ? '' : 'none';
  hintEl.textContent = tab==='num' ? 'Trace the number with your finger'
    : tab==='shape' ? 'Trace all the way round the shape'
    : 'Draw a circle in one go';
  bDone.hidden = (tab==='circle');
  bDone.disabled = !(S.state==='tracing' && inkLength()>=30);
  bClear.textContent = S.state==='done' ? 'Try again' : (tab==='circle'?'Clear':'Start again');
  bClear.disabled = (S.state==='idle') && tab!=='circle';
  bNext.hidden = (tab==='circle');
  bNext.textContent = tab==='num' ? 'New number →' : 'New shape →';
  renderResult();
}
function statsLine(){
  var h=S.hist[S.tab]; if(!h.length) return '';
  var best=0,sum=0,last=h.slice(-5);
  h.forEach(function(v){ best=Math.max(best,v); });
  last.forEach(function(v){ sum+=v; });
  var mx= (S.tab==='circle'||S.speed)?100:50;
  return h.length+' attempt'+(h.length>1?'s':'')+' · Best '+best+'/'+mx+' · Average of last '+last.length+': '+Math.round(sum/last.length);
}
function renderResult(){
  var r=S.result, html='';
  if(S.state!=='done'){
    var tip = S.tab==='num' ? 'Follow the dashed line. '+(S.speed?'You’ll score up to 50 for accuracy and 50 for speed.':'You’ll score up to 50 for accuracy.')
      : S.tab==='shape' ? 'Follow the dashed line round the shape. '+(S.speed?'Up to 50 for accuracy and 50 for speed.':'Up to 50 for accuracy.')
      : 'Roundness is marked out of 100 as soon as you lift your finger.';
    html='<div class="note">'+tip+'</div>';
  }else if(S.tab==='circle'){
    if(r.tooShort||r.tooSmall){
      html='<div class="note">'+(r.tooSmall?'That one’s tiny – draw a bigger circle.':'Draw a longer line to make a circle.')+'</div>';
    }else{
      html='<div class="row"><span>Roundness <b class="big">'+r.score+'</b>/100</span></div><div class="note">'+r.msg+'</div>';
    }
  }else{
    var done = S.speed
      ? '<span>Accuracy <b>'+r.acc+'</b>/50</span><span>Speed <b>'+r.spd+'</b>/50</span><span>Score <b class="big">'+r.total+'</b>/100</span><span class="meta">'+r.elapsed.toFixed(1)+' s (par '+r.par.toFixed(1)+' s)</span>'
      : '<span>Accuracy score <b class="big">'+r.acc+'</b>/50</span>';
    html='<div class="row">'+done+'</div><div class="note">'+traceComment(r)+'</div>';
  }
  var sl=statsLine(); if(sl) html+='<div class="meta">'+sl+'</div>';
  resEl.innerHTML=html;
}

function finishTrace(){
  if(S.state!=='tracing' || inkLength()<30) return;
  var r=scoreTrace();
  if(!r){ newAttempt(true); return; }
  S.result=r; S.state='done';
  S.hist[S.tab].push(S.speed?r.total:r.acc);
  refreshUI(); redraw();
}
function finishCircle(){
  var s=S.strokes[0];
  if(!s || s.length<2 || inkLength()<80){ S.strokes=[]; S.state='idle'; refreshUI(); redraw(); return; }
  var r=scoreCircle();
  S.result=r; S.state='done';
  if(r.score!==undefined) S.hist.circle.push(r.score);
  refreshUI(); redraw();
}

/* ================= POINTER INPUT ================= */
function pt(e){ var b=cv.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
cv.addEventListener('pointerdown',function(e){
  if(S.state==='done' || S.cur) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  var p=pt(e); S.cur={id:e.pointerId,pts:[p]}; S.strokes.push(S.cur.pts);
  if(S.state==='idle'){ S.state='tracing'; S.t0=performance.now(); refreshUI(); }
  redraw();
});
cv.addEventListener('pointermove',function(e){
  if(!S.cur || e.pointerId!==S.cur.id) return;
  e.preventDefault();
  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if(!evs.length) evs=[e];
  var arr=S.cur.pts;
  evs.forEach(function(ev){
    var p=pt(ev), q=arr[arr.length-1];
    if(!q || dist2(p,q)>1.5) arr.push(p);
  });
  if(S.tab!=='circle' && bDone.disabled && inkLength()>=30) bDone.disabled=false;
  redraw();
});
function endStroke(e){
  if(!S.cur || e.pointerId!==S.cur.id) return;
  S.cur=null;
  if(S.tab==='circle') finishCircle(); else refreshUI();
  redraw();
}
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

bClear.addEventListener('click',function(){ newAttempt(true); });
bNext.addEventListener('click',function(){ newAttempt(false); });
bDone.addEventListener('click',finishTrace);

/* ================= OPTIONS BAR ================= */
function segHTML(name,items,cur){
  return '<div class="seg" data-seg="'+name+'">'+items.map(function(it){
    return '<button data-v="'+it[0]+'" class="'+(String(it[0])===String(cur)?'on':'')+'">'+it[1]+'</button>';
  }).join('')+'</div>';
}
function buildOpts(){
  var h='';
  if(S.tab==='num'){
    h+='<div class="grp"><label class="t">Digits</label>'+segHTML('digits',[[1,'1'],[2,'2'],[3,'3'],[4,'4']],S.digits)+'</div>';
    h+='<div class="grp"><label class="t" for="selFont">Font</label><select id="selFont">'+FONTS.map(function(f){
      return '<option value="'+f.id+'"'+(f.id===S.font?' selected':'')+'>'+f.label+'</option>';
    }).join('')+'</select></div>';
  }
  if(S.tab==='shape'){
    h+='<div class="grp"><label class="t" for="selShape">Shape</label><select id="selShape"><option value="random"'+(S.shape==='random'?' selected':'')+'>Random</option>'+
      SHAPES.map(function(s){ return '<option value="'+s.id+'"'+(S.shape===s.id?' selected':'')+'>'+s.name+'</option>'; }).join('')+'</select></div>';
  }
  if(S.tab!=='circle'){
    h+='<div class="grp"><label class="t">Marking</label>'+segHTML('strict',[['gentle','Gentle'],['standard','Standard'],['tricky','Tricky']],S.strict)+'</div>';
    h+='<label class="chk"><input type="checkbox" id="chkSpeed"'+(S.speed?' checked':'')+'> Speed counts</label>';
  }else{
    h+='<label class="chk"><input type="checkbox" id="chkFit"'+(S.showFit?' checked':'')+'> Show best-fit circle</label>';
  }
  optsEl.innerHTML=h;
}
optsEl.addEventListener('click',function(e){
  var b=e.target.closest('.seg button'); if(!b) return;
  var name=b.parentNode.getAttribute('data-seg'), v=b.getAttribute('data-v');
  if(name==='digits'){ S.digits=+v; saveSettings(); buildOpts(); newAttempt(false); }
  else if(name==='strict'){ S.strict=v; saveSettings(); buildOpts(); newAttempt(true); }
});
optsEl.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='selFont'){ S.font=t.value; saveSettings(); newAttempt(true); }
  else if(t.id==='selShape'){ S.shape=t.value; saveSettings(); newAttempt(false); }
  else if(t.id==='chkSpeed'){ S.speed=t.checked; saveSettings(); S.hist.num=[]; S.hist.shape=[]; newAttempt(true); }
  else if(t.id==='chkFit'){ S.showFit=t.checked; saveSettings(); redraw(); }
});
$('#tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  S.tab=b.getAttribute('data-tab');
  Array.prototype.forEach.call($('#tabs').children,function(x){ x.classList.toggle('on',x===b); });
  buildOpts(); resize();
});

/* ================= SIZING ================= */
var rto=null;
function resize(){
  var r=stageEl.getBoundingClientRect();
  W=Math.max(200,Math.floor(r.width-6)); H=Math.max(140,Math.floor(r.height-6));
  dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  newAttempt(true);
}
if(window.ResizeObserver){
  var lastW=0,lastH=0;
  new ResizeObserver(function(){
    var r=stageEl.getBoundingClientRect();
    if(Math.abs(r.width-lastW)<2 && Math.abs(r.height-lastH)<2) return;
    lastW=r.width; lastH=r.height;
    clearTimeout(rto); rto=setTimeout(resize,120);
  }).observe(stageEl);
}else{ window.addEventListener('resize',function(){ clearTimeout(rto); rto=setTimeout(resize,120); }); }

buildOpts(); resize();
/*HOOK*/
})();
</script>
</body>
